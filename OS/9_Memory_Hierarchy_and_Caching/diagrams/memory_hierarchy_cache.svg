<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="32" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Memory Hierarchy Pyramid &amp; Cache Architecture
  </text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Trade-off: Speed vs Capacity vs Cost per Bit | L1, L2, L3 Cache Levels
  </text>

  <!-- Left: Pyramid -->
  <!-- Level 1: Registers -->
  <polygon points="210,80 150,130 270,130" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="210" y="115" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CPU Registers</text>

  <!-- Level 2: Cache Memory -->
  <polygon points="150,135 105,195 315,195 270,135" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5"/>
  <text x="210" y="160" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Cache Memory</text>
  <text x="210" y="180" fill="#fef3c7" font-size="10" text-anchor="middle">(L1, L2, L3 SRAM)</text>

  <!-- Level 3: Main Memory -->
  <polygon points="105,200 65,270 355,270 315,200" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="210" y="230" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Main Memory (RAM)</text>
  <text x="210" y="250" fill="#e0f2fe" font-size="10" text-anchor="middle">DRAM / Primary Memory</text>

  <!-- Level 4: Secondary Storage -->
  <polygon points="65,275 30,355 390,355 355,275" fill="#4f46e5" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="210" y="310" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Secondary Storage</text>
  <text x="210" y="330" fill="#c7d2fe" font-size="10" text-anchor="middle">SSD / NVMe / HDD</text>

  <!-- Level 5: Tertiary / Offline -->
  <polygon points="30,360 5,445 415,445 390,360" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="210" y="400" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Magnetic Disks / Drums / Tapes</text>
  <text x="210" y="420" fill="#cbd5e1" font-size="10" text-anchor="middle">Backup &amp; Cold Storage</text>

  <!-- Trend Arrows Left -->
  <line x1="20" y1="440" x2="20" y2="85" stroke="#4ade80" stroke-width="3"/>
  <polygon points="20,80 15,95 25,95" fill="#4ade80"/>
  <text x="25" y="250" fill="#4ade80" font-size="11" font-weight="bold" transform="rotate(-90 25,250)" text-anchor="middle">▲ Speed &amp; Cost/Bit Increases</text>

  <!-- Trend Arrows Right of Pyramid -->
  <line x1="425" y1="85" x2="425" y2="440" stroke="#f43f5e" stroke-width="3"/>
  <polygon points="425,445 420,430 430,430" fill="#f43f5e"/>
  <text x="420" y="260" fill="#f43f5e" font-size="11" font-weight="bold" transform="rotate(90 420,260)" text-anchor="middle">▼ Capacity / Size Increases</text>

  <!-- Right: Cache Levels & Architecture Details -->
  <rect x="460" y="80" width="365" height="365" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="642" y="108" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle">MULTI-LEVEL CACHE IN CPU</text>

  <!-- L1 Cache -->
  <rect x="480" y="125" width="325" height="65" rx="6" fill="#312e81" stroke="#818cf8"/>
  <text x="495" y="148" fill="#a5b4fc" font-size="12" font-weight="bold">L1 Cache (Per-Core, Split):</text>
  <text x="495" y="165" fill="#f1f5f9" font-size="10">• Split into L1i (Instructions) &amp; L1d (Data)</text>
  <text x="495" y="180" fill="#cbd5e1" font-size="9">• Ultra fast (~0.5 - 1 ns latency), ~32-64 KB per core</text>

  <!-- L2 Cache -->
  <rect x="480" y="200" width="325" height="65" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="495" y="223" fill="#93c5fd" font-size="12" font-weight="bold">L2 Cache (Dedicated/Shared):</text>
  <text x="495" y="240" fill="#f1f5f9" font-size="10">• Sits between L1 and L3 / Main Memory</text>
  <text x="495" y="255" fill="#cbd5e1" font-size="9">• Larger (~256 KB - 1 MB), ~3 - 7 ns latency</text>

  <!-- L3 Cache -->
  <rect x="480" y="275" width="325" height="65" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="495" y="298" fill="#6ee7b7" font-size="12" font-weight="bold">L3 Cache (Shared Across All Cores):</text>
  <text x="495" y="315" fill="#f1f5f9" font-size="10">• Shared pool for multi-core processors</text>
  <text x="495" y="330" fill="#cbd5e1" font-size="9">• Largest on-die cache (~8 - 64 MB), ~10 - 20 ns latency</text>

  <!-- Cache Policies Box -->
  <rect x="480" y="350" width="325" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="495" y="372" fill="#38bdf8" font-size="11" font-weight="bold">Cache Replacement &amp; Write Policies:</text>
  <text x="495" y="390" fill="#cbd5e1" font-size="9">• <b>Replacement:</b> LRU (Least Recently Used), FIFO, OPT</text>
  <text x="495" y="405" fill="#cbd5e1" font-size="9">• <b>Write-Through:</b> Cache + RAM dono mein instantly write</text>
  <text x="495" y="420" fill="#cbd5e1" font-size="9">• <b>Write-Back:</b> Sirf cache mein write, RAM mein dirty bit evict par</text>

  <!-- Bottom Coherency Note -->
  <rect x="50" y="460" width="775" height="42" rx="6" fill="#111827" stroke="#334155"/>
  <text x="425" y="485" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle">
    Cache Coherency: Multi-core systems mein har core ki cache ka data synchronized rakhna hardware aur OS ki zimmedari hoti hai!
  </text>
</svg>