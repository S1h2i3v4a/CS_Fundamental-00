<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="32" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Fig 8.1: Main Memory Array Architecture &amp; OS Management Activities
  </text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Reference: Image 8 [Primary Memory Array of Bytes, Multiprogramming &amp; Allocation]
  </text>

  <!-- Left Side: Memory Array Layout -->
  <rect x="50" y="80" width="280" height="370" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="105" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">PRIMARY MEMORY (RAM)</text>
  <text x="190" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">Array of Bytes / Words with Unique Addresses</text>

  <!-- OS Reserved Area -->
  <rect x="65" y="135" width="250" height="50" rx="4" fill="#881337" stroke="#f43f5e"/>
  <text x="190" y="157" fill="#ffe4e6" font-size="11" font-weight="bold" text-anchor="middle">OPERATING SYSTEM / KERNEL</text>
  <text x="190" y="172" fill="#fecdd3" font-size="9" text-anchor="middle">Addresses: 0x00000000 - 0x000FFFFF</text>

  <!-- Process 1 -->
  <rect x="65" y="195" width="250" height="55" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="190" y="218" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">PROCESS 1 (e.g. Browser)</text>
  <text x="190" y="233" fill="#93c5fd" font-size="9" text-anchor="middle">Allocated Bytes: Base 0x00100000</text>

  <!-- Free Memory Hole -->
  <rect x="65" y="260" width="250" height="40" rx="4" fill="#0f172a" stroke="#22c55e" stroke-dasharray="4,2"/>
  <text x="190" y="280" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle">FREE MEMORY (Unallocated Hole)</text>
  <text x="190" y="293" fill="#86efac" font-size="8" text-anchor="middle">Tracked by OS Free-List</text>

  <!-- Process 2 -->
  <rect x="65" y="310" width="250" height="55" rx="4" fill="#312e81" stroke="#818cf8"/>
  <text x="190" y="333" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">PROCESS 2 (e.g. Code Editor)</text>
  <text x="190" y="348" fill="#c7d2fe" font-size="9" text-anchor="middle">Allocated Bytes: Base 0x00200000</text>

  <!-- Process 3 / Free -->
  <rect x="65" y="375" width="250" height="55" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="190" y="398" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">PROCESS 3 (e.g. Compiler / DB)</text>
  <text x="190" y="413" fill="#a7f3d0" font-size="9" text-anchor="middle">Allocated Bytes: Base 0x00350000</text>

  <!-- Right Side: 4 Core OS Activities -->
  <rect x="360" y="80" width="450" height="370" rx="8" fill="#111827" stroke="#475569" stroke-width="1.5"/>
  <text x="585" y="110" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle">4 CORE OS MEMORY MANAGEMENT ACTIVITIES</text>

  <!-- Activity 1 -->
  <rect x="380" y="130" width="410" height="65" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="395" y="152" fill="#38bdf8" font-size="11" font-weight="bold">1. Memory Tracking &amp; Accounting:</text>
  <text x="395" y="170" fill="#cbd5e1" font-size="10">• Keeps track of which bytes are currently used by which process.</text>
  <text x="395" y="184" fill="#94a3b8" font-size="9">• Maintains lists of allocated vs unallocated (free) memory addresses.</text>

  <!-- Activity 2 -->
  <rect x="380" y="205" width="410" height="65" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="395" y="227" fill="#34d399" font-size="11" font-weight="bold">2. Multiprogramming Decision &amp; Order:</text>
  <text x="395" y="245" fill="#cbd5e1" font-size="10">• Decides the order in which competing processes get memory access.</text>
  <text x="395" y="259" fill="#94a3b8" font-size="9">• Controls how long each process can retain physical RAM space.</text>

  <!-- Activity 3 -->
  <rect x="380" y="280" width="410" height="65" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="395" y="302" fill="#fbbf24" font-size="11" font-weight="bold">3. Memory Allocation (On-Demand):</text>
  <text x="395" y="320" fill="#cbd5e1" font-size="10">• Program start ya <code>malloc()</code> call par RAM bytes allot karta hai.</text>
  <text x="395" y="334" fill="#94a3b8" font-size="9">• Sets Base and Limit registers in MMU for safety.</text>

  <!-- Activity 4 -->
  <rect x="380" y="355" width="410" height="75" rx="6" fill="#1e293b" stroke="#ec4899"/>
  <text x="395" y="377" fill="#f472b6" font-size="11" font-weight="bold">4. Memory Deallocation &amp; Reclamation:</text>
  <text x="395" y="395" fill="#cbd5e1" font-size="10">• Process exit hone par ya I/O wait ke dauran memory free karta hai.</text>
  <text x="395" y="410" fill="#94a3b8" font-size="9">• Reclaims blocks into free-list to prevent Memory Leaks.</text>
</svg>