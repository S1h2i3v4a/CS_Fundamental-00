<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="32" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Device Management &amp; File System Architecture
  </text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    I/O Subsystem, Device Drivers, Controllers &amp; Hierarchical Directory Tree
  </text>

  <!-- Left: Device Management Subsystem -->
  <rect x="40" y="75" width="370" height="395" rx="10" fill="#131d31" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="225" y="105" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">DEVICE MANAGEMENT (I/O SUBSYSTEM)</text>

  <!-- Layer 1: User / App Call -->
  <rect x="60" y="125" width="330" height="40" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="225" y="150" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Application I/O Request (read, write)</text>

  <line x1="225" y1="165" x2="225" y2="185" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 2: Uniform Device Driver Interface -->
  <rect x="60" y="185" width="330" height="45" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="225" y="205" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">OS I/O Manager &amp; Uniform Interface</text>
  <text x="225" y="220" fill="#93c5fd" font-size="9" text-anchor="middle">Hides hardware differences from programmer</text>

  <line x1="225" y1="230" x2="225" y2="250" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 3: Specific Device Drivers -->
  <rect x="60" y="250" width="330" height="50" rx="6" fill="#312e81" stroke="#818cf8"/>
  <text x="225" y="270" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Specific Device Drivers</text>
  <text x="225" y="287" fill="#c7d2fe" font-size="9" text-anchor="middle">[Printer Driver] | [Disk Driver] | [USB Driver]</text>

  <line x1="225" y1="300" x2="225" y2="320" stroke="#38bdf8" stroke-width="2"/>

  <!-- Layer 4: Hardware I/O Controllers -->
  <rect x="60" y="320" width="330" height="45" rx="6" fill="#065f46" stroke="#10b981"/>
  <text x="225" y="340" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Hardware I/O Controllers (Chipset)</text>
  <text x="225" y="355" fill="#a7f3d0" font-size="9" text-anchor="middle">Contains status, control, &amp; data registers</text>

  <line x1="225" y1="365" x2="225" y2="385" stroke="#10b981" stroke-width="2"/>

  <!-- Layer 5: Physical Peripherals -->
  <rect x="60" y="385" width="330" height="65" rx="6" fill="#1f2937" stroke="#4ade80"/>
  <text x="225" y="408" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">Physical Devices</text>
  <text x="225" y="425" fill="#e5e7eb" font-size="10" text-anchor="middle">Printers | Keyboards | SSD / HDD | Monitors</text>

  <!-- Right: File System Management -->
  <rect x="440" y="75" width="370" height="395" rx="10" fill="#131d31" stroke="#ec4899" stroke-width="1.5"/>
  <text x="625" y="105" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">FILE SYSTEM MANAGEMENT</text>

  <!-- Directory Tree Diagram -->
  <rect x="460" y="125" width="330" height="150" rx="8" fill="#1e1e38" stroke="#818cf8"/>
  <text x="625" y="148" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Hierarchical Tree Structure</text>

  <!-- Root -->
  <rect x="600" y="160" width="50" height="25" rx="4" fill="#0284c7"/>
  <text x="625" y="177" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">/</text>

  <line x1="625" y1="185" x2="535" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="625" y1="185" x2="625" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="625" y1="185" x2="715" y2="210" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Subdirectories -->
  <rect x="500" y="210" width="70" height="22" rx="4" fill="#334155"/>
  <text x="535" y="225" fill="#ffffff" font-size="10" text-anchor="middle">/bin</text>

  <rect x="590" y="210" width="70" height="22" rx="4" fill="#334155"/>
  <text x="625" y="225" fill="#ffffff" font-size="10" text-anchor="middle">/home</text>

  <rect x="680" y="210" width="70" height="22" rx="4" fill="#334155"/>
  <text x="715" y="225" fill="#ffffff" font-size="10" text-anchor="middle">/etc</text>

  <line x1="625" y1="232" x2="625" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="580" y="250" width="90" height="20" rx="4" fill="#4338ca"/>
  <text x="625" y="264" fill="#a5b4fc" font-size="9" text-anchor="middle">user_notes.txt</text>

  <!-- Core File Activities Box -->
  <rect x="460" y="290" width="330" height="160" rx="8" fill="#1e293b" stroke="#f43f5e"/>
  <text x="475" y="315" fill="#fca5a5" font-size="11" font-weight="bold">Core File Management Responsibilities:</text>
  <text x="475" y="338" fill="#cbd5e1" font-size="10">• <b>CRUD Operations:</b> File creation, read, write, delete</text>
  <text x="475" y="358" fill="#cbd5e1" font-size="10">• <b>Directory Navigation:</b> Path resolution (/a/b/c)</text>
  <text x="475" y="378" fill="#cbd5e1" font-size="10">• <b>Access Control:</b> Read/Write/Execute permissions</text>
  <text x="475" y="398" fill="#cbd5e1" font-size="10">• <b>Metadata Tracking:</b> Inodes, file size, timestamps</text>
  <text x="475" y="425" fill="#4ade80" font-size="9" font-weight="bold">Maps logical files to physical disk blocks!</text>
</svg>