<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="32" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Fig 5.1: Computer System Organization &amp; CPU Architecture
  </text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Reference: Image 5 [Modern System Bus &amp; Internal CPU Operations]
  </text>

  <!-- Section 1: Modern Computer System Bus Architecture -->
  <rect x="30" y="70" width="790" height="200" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="95" fill="#facc15" font-size="13" font-weight="bold">Part A: Common Bus &amp; Device Controllers (Shared Memory)</text>

  <!-- CPU Box -->
  <rect x="50" y="115" width="115" height="50" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="107" y="140" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CPU</text>
  <text x="107" y="155" fill="#93c5fd" font-size="10" text-anchor="middle">(Multicore)</text>

  <!-- Disk Controller -->
  <rect x="185" y="115" width="125" height="50" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="247" y="137" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Disk</text>
  <text x="247" y="153" fill="#93c5fd" font-size="11" text-anchor="middle">Controller</text>

  <!-- USB Controller -->
  <rect x="330" y="115" width="125" height="50" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="392" y="137" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">USB</text>
  <text x="392" y="153" fill="#93c5fd" font-size="11" text-anchor="middle">Controller</text>

  <!-- Graphics Adaptor -->
  <rect x="475" y="115" width="130" height="50" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
  <text x="540" y="137" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Graphics</text>
  <text x="540" y="153" fill="#93c5fd" font-size="11" text-anchor="middle">Adaptor</text>

  <!-- Memory Box -->
  <rect x="625" y="115" width="175" height="50" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <text x="712" y="137" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SHARED MEMORY</text>
  <text x="712" y="153" fill="#a7f3d0" font-size="10" text-anchor="middle">(RAM via Memory Controller)</text>

  <!-- Common Bus Line -->
  <line x1="107" y1="165" x2="107" y2="195" stroke="#f59e0b" stroke-width="3"/>
  <line x1="247" y1="165" x2="247" y2="195" stroke="#f59e0b" stroke-width="3"/>
  <line x1="392" y1="165" x2="392" y2="195" stroke="#f59e0b" stroke-width="3"/>
  <line x1="540" y1="165" x2="540" y2="195" stroke="#f59e0b" stroke-width="3"/>
  <line x1="712" y1="165" x2="712" y2="195" stroke="#f59e0b" stroke-width="3"/>
  <line x1="50" y1="195" x2="800" y2="195" stroke="#f59e0b" stroke-width="5"/>
  <rect x="330" y="210" width="190" height="24" rx="4" fill="#78350f" />
  <text x="425" y="226" fill="#fef3c7" font-size="11" font-weight="bold" text-anchor="middle">COMMON SYSTEM BUS (Shared Line)</text>

  <!-- Section 2: Internal CPU Architecture (Handwritten slide lower half) -->
  <rect x="30" y="285" width="790" height="215" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="50" y="310" fill="#facc15" font-size="13" font-weight="bold">Part B: CPU Internal Architecture &amp; Data Path</text>

  <!-- Input -->
  <rect x="50" y="340" width="85" height="135" rx="6" fill="#1f2937" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="92" y="415" fill="#93c5fd" font-size="14" font-weight="bold" text-anchor="middle">INPUT</text>

  <!-- I/O Module Interface -->
  <rect x="155" y="330" width="55" height="155" rx="4" fill="#374151" stroke="#9ca3af"/>
  <text x="182" y="360" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">M</text>
  <text x="182" y="380" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">O</text>
  <text x="182" y="400" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">D</text>
  <text x="182" y="420" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">U</text>
  <text x="182" y="440" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">L</text>
  <text x="182" y="460" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">E</text>
  <text x="182" y="475" fill="#facc15" font-size="8" text-anchor="middle">I/O Intf</text>

  <!-- CPU Box -->
  <rect x="235" y="325" width="220" height="165" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
  <text x="345" y="345" fill="#c7d2fe" font-size="14" font-weight="bold" text-anchor="middle">CPU (Processing Core)</text>

  <!-- ALU inside CPU -->
  <rect x="250" y="355" width="190" height="35" rx="4" fill="#312e81" stroke="#6366f1"/>
  <text x="345" y="377" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ALU (Arithmetic Logic Unit)</text>

  <!-- Registers -->
  <rect x="250" y="395" width="85" height="30" rx="4" fill="#3730a3"/>
  <text x="292" y="415" fill="#e0e7ff" font-size="10" font-weight="bold" text-anchor="middle">CPU Registers</text>

  <!-- CU inside CPU -->
  <rect x="345" y="395" width="95" height="30" rx="4" fill="#312e81" stroke="#6366f1"/>
  <text x="392" y="415" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">CU (Control Unit)</text>

  <!-- Read/Write Arrows to MU -->
  <text x="305" y="445" fill="#4ade80" font-size="12" font-weight="bold">W ⬇</text>
  <text x="375" y="445" fill="#38bdf8" font-size="12" font-weight="bold">⬆ R</text>

  <!-- Memory Unit (MU / Primary RAM) -->
  <rect x="250" y="455" width="190" height="30" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="345" y="475" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">MU: Primary Memory (RAM)</text>

  <!-- I/O Output Module Interface -->
  <rect x="475" y="330" width="55" height="155" rx="4" fill="#374151" stroke="#9ca3af"/>
  <text x="502" y="360" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">M</text>
  <text x="502" y="380" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">O</text>
  <text x="502" y="400" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">D</text>
  <text x="502" y="420" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">U</text>
  <text x="502" y="440" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">L</text>
  <text x="502" y="460" fill="#e5e7eb" font-size="11" font-weight="bold" text-anchor="middle">E</text>

  <!-- Output -->
  <rect x="550" y="340" width="85" height="135" rx="6" fill="#1f2937" stroke="#34d399" stroke-width="1.5"/>
  <text x="592" y="415" fill="#6ee7b7" font-size="14" font-weight="bold" text-anchor="middle">OUTPUT</text>

  <!-- Right Side Key Notes -->
  <rect x="650" y="325" width="155" height="165" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="727" y="348" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">KEY CONCEPTS</text>
  <text x="660" y="375" fill="#cbd5e1" font-size="10">• ALU: Computes logic</text>
  <text x="660" y="395" fill="#cbd5e1" font-size="10">• CU: Directs signals</text>
  <text x="660" y="415" fill="#cbd5e1" font-size="10">• Regs: High-speed storage</text>
  <text x="660" y="435" fill="#cbd5e1" font-size="10">• RAM: R/W cycles</text>
  <text x="660" y="455" fill="#cbd5e1" font-size="10">• I/O: External device sync</text>
</svg>