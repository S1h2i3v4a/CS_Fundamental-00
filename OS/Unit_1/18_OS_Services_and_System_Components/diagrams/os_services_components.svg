<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="sh18" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1000" height="750" fill="url(#bg18)" rx="16" />
  <text x="500" y="38" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">
    Module 18: Operating System Services &amp; Core System Components
  </text>
  <text x="500" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Layered Architecture of OS Services (Slide 130) | 8 Core Architectural Components (Slide 135)
  </text>

  <!-- Part 1: View of OS Services (Slide 130 Layout) -->
  <g transform="translate(40, 85)" filter="url(#sh18)">
    <rect width="920" height="320" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="26" font-size="14" font-weight="bold" fill="#f8fafc">
      1. Layered View of Operating System Services
    </text>

    <!-- Layer 1: User & System Programs -->
    <rect x="25" y="40" width="870" height="35" rx="5" fill="#0f172a" stroke="#6366f1" />
    <text x="460" y="62" font-size="12" font-weight="bold" fill="#a5b4fc" text-anchor="middle">
      USER &amp; OTHER SYSTEM PROGRAMS (Compilers, DBs, Video Players, Browser)
    </text>

    <!-- Layer 2: User Interfaces -->
    <g transform="translate(25, 85)">
      <rect width="870" height="40" rx="5" fill="#1e1b4b" stroke="#818cf8" />
      <text x="15" y="24" font-size="11" font-weight="bold" fill="#e0e7ff">USER INTERFACES:</text>
      <rect x="180" y="7" width="180" height="26" rx="4" fill="#312e81" /><text x="270" y="24" font-size="10" fill="#fff" text-anchor="middle">GUI (Graphical UI)</text>
      <rect x="400" y="7" width="180" height="26" rx="4" fill="#312e81" /><text x="490" y="24" font-size="10" fill="#fff" text-anchor="middle">Batch Interface</text>
      <rect x="620" y="7" width="220" height="26" rx="4" fill="#312e81" /><text x="730" y="24" font-size="10" fill="#fff" text-anchor="middle">CLI (Command Line / Shell)</text>
    </g>

    <!-- Layer 3: System Calls Interface -->
    <rect x="25" y="135" width="870" height="30" rx="4" fill="#312e81" stroke="#a855f7" />
    <text x="460" y="155" font-size="12" font-weight="bold" fill="#f0abfc" text-anchor="middle">
      --- SYSTEM CALLS INTERFACE (POSIX / Win32 API) ---
    </text>

    <!-- Layer 4: 8 OS Services Grid -->
    <g transform="translate(25, 175)">
      <rect width="870" height="90" rx="5" fill="#0f172a" stroke="#38bdf8" />
      <text x="460" y="20" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">OPERATING SYSTEM SERVICES</text>
      
      <!-- 8 boxes -->
      <!-- Row 1: User-oriented -->
      <rect x="15" y="30" width="195" height="24" rx="3" fill="#0369a1" /><text x="112" y="46" font-size="9" fill="#fff" text-anchor="middle">Program Execution</text>
      <rect x="225" y="30" width="195" height="24" rx="3" fill="#0369a1" /><text x="322" y="46" font-size="9" fill="#fff" text-anchor="middle">I/O Operations</text>
      <rect x="435" y="30" width="195" height="24" rx="3" fill="#0369a1" /><text x="532" y="46" font-size="9" fill="#fff" text-anchor="middle">File System Manipulation</text>
      <rect x="645" y="30" width="210" height="24" rx="3" fill="#0369a1" /><text x="750" y="46" font-size="9" fill="#fff" text-anchor="middle">Communications (IPC/Net)</text>

      <!-- Row 2: System-oriented -->
      <rect x="15" y="58" width="195" height="24" rx="3" fill="#065f46" /><text x="112" y="74" font-size="9" fill="#fff" text-anchor="middle">Resource Allocation</text>
      <rect x="225" y="58" width="195" height="24" rx="3" fill="#065f46" /><text x="322" y="74" font-size="9" fill="#fff" text-anchor="middle">Accounting &amp; Auditing</text>
      <rect x="435" y="58" width="195" height="24" rx="3" fill="#065f46" /><text x="532" y="74" font-size="9" fill="#fff" text-anchor="middle">Error Detection &amp; Debug</text>
      <rect x="645" y="58" width="210" height="24" rx="3" fill="#065f46" /><text x="750" y="74" font-size="9" fill="#fff" text-anchor="middle">Protection &amp; Security</text>
    </g>

    <!-- Layer 5: Kernel & Hardware -->
    <rect x="25" y="275" width="870" height="35" rx="5" fill="#0f172a" stroke="#475569" />
    <text x="460" y="297" font-size="11" font-weight="bold" fill="#94a3b8" text-anchor="middle">
      OPERATING SYSTEM KERNEL &amp; COMPUTER HARDWARE (CPU, RAM, Disks, Network NIC)
    </text>
  </g>

  <!-- Part 2: 8 Major OS Components (Slide 135 Mind Map) -->
  <g transform="translate(40, 420)" filter="url(#sh18)">
    <rect width="920" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="26" font-size="14" font-weight="bold" fill="#f8fafc">
      2. The 8 Core Operating System Components
    </text>

    <!-- 8 Cards Grid (4 columns x 2 rows) -->
    <!-- Col 1, Row 1 -->
    <g transform="translate(25, 42)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#6366f1" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#a5b4fc">1. Process Mgmt</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Process creation/exit</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• CPU scheduling</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• IPC &amp; synchronization</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Deadlock handling</text>
    </g>

    <!-- Col 2, Row 1 -->
    <g transform="translate(245, 42)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#38bdf8" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#38bdf8">2. Main Memory Mgmt</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Track allocated bytes</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Virtual memory &amp; Paging</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Dynamic heap alloc</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Base/Limit protection</text>
    </g>

    <!-- Col 3, Row 1 -->
    <g transform="translate(465, 42)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#10b981" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#34d399">3. File Management</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• File CRUD operations</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Hierarchical directory tree</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• File-to-disk mapping</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Backup &amp; recovery</text>
    </g>

    <!-- Col 4, Row 1 -->
    <g transform="translate(685, 42)">
      <rect width="210" height="115" rx="6" fill="#0f172a" stroke="#f59e0b" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#fbbf24">4. I/O System Mgmt</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Buffer caching</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Spooling print queues</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Generic driver interface</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Hardware interrupt handlers</text>
    </g>

    <!-- Row 2 -->
    <!-- Col 1, Row 2 -->
    <g transform="translate(25, 172)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#ec4899" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#f472b6">5. Secondary Storage</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Free space management</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Storage allocation (ext4)</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Disk arm scheduling</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Bad sector mapping</text>
    </g>

    <!-- Col 2, Row 2 -->
    <g transform="translate(245, 172)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#a855f7" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#c084fc">6. Networking Stack</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Distributed node routing</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• TCP/IP protocol suite</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Network socket abstraction</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Packet filtering</text>
    </g>

    <!-- Col 3, Row 2 -->
    <g transform="translate(465, 172)">
      <rect width="200" height="115" rx="6" fill="#0f172a" stroke="#ef4444" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#f87171">7. Protection System</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Dual-mode enforcement</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Access Control Lists (ACL)</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Memory isolation</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• Cryptographic security</text>
    </g>

    <!-- Col 4, Row 2 -->
    <g transform="translate(685, 172)">
      <rect width="210" height="115" rx="6" fill="#0f172a" stroke="#14b8a6" />
      <text x="15" y="22" font-size="11" font-weight="bold" fill="#2dd4bf">8. Command Interpreter</text>
      <text x="15" y="42" font-size="9" fill="#cbd5e1">• Shell (Bash, Zsh, CMD)</text>
      <text x="15" y="58" font-size="9" fill="#cbd5e1">• Command parsing</text>
      <text x="15" y="74" font-size="9" fill="#cbd5e1">• Invokes system calls</text>
      <text x="15" y="90" font-size="9" fill="#cbd5e1">• User-to-kernel bridge</text>
    </g>
  </g>
</svg>