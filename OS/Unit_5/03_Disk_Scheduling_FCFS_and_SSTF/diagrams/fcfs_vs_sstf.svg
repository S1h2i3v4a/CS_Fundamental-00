<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Disk Scheduling: FCFS vs SSTF Head Movement Comparison</text>
  
  <text x="500" y="65" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Queue: 98, 183, 37, 122, 14, 124, 65, 67 | Initial Head Position = 53</text>

  <!-- Left Side: FCFS Trace -->
  <g transform="translate(60, 90)">
    <rect width="420" height="390" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. FCFS (First-Come, First-Served)</text>
    
    <text x="25" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">Sequence: 53 → 98 → 183 → 37 → 122 → 14 → 124 → 65 → 67</text>
    
    <text x="25" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Calculations:</text>
    <text x="25" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |98 - 53| = 45</text>
    <text x="25" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |183 - 98| = 85</text>
    <text x="25" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |37 - 183| = 146 (Wild swing across disk!)</text>
    <text x="25" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |122 - 37| = 85</text>
    <text x="25" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |14 - 122| = 108</text>
    <text x="25" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |124 - 14| = 110</text>
    <text x="25" y="218" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |65 - 124| = 59</text>
    <text x="25" y="236" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |67 - 65| = 2</text>
    
    <rect x="25" y="260" width="370" height="40" rx="6" fill="#0c4a6e"/>
    <text x="210" y="285" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Total Head Movement = 640 Cylinders</text>
    
    <text x="25" y="330" fill="#f87171" font-family="sans-serif" font-size="10.5" font-weight="bold">• Drawback: Zero optimization; wild head swings.</text>
    <text x="25" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Advantage: Simple, fair, no starvation.</text>
  </g>

  <!-- Right Side: SSTF Trace -->
  <g transform="translate(520, 90)">
    <rect width="420" height="390" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="210" y="28" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. SSTF (Shortest Seek Time First)</text>
    
    <text x="25" y="60" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Sequence: 53 → 65 → 67 → 37 → 14 → 98 → 122 → 124 → 183</text>
    
    <text x="25" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Calculations (Always pick nearest cylinder):</text>
    <text x="25" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |65 - 53| = 12</text>
    <text x="25" y="128" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |67 - 65| = 2</text>
    <text x="25" y="146" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |37 - 67| = 30</text>
    <text x="25" y="164" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |14 - 37| = 23</text>
    <text x="25" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |98 - 14| = 84</text>
    <text x="25" y="200" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |122 - 98| = 24</text>
    <text x="25" y="218" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |124 - 122| = 2</text>
    <text x="25" y="236" fill="#cbd5e1" font-family="sans-serif" font-size="10">• |183 - 124| = 59</text>
    
    <rect x="25" y="260" width="370" height="40" rx="6" fill="#065f46"/>
    <text x="210" y="285" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Total Head Movement = 236 Cylinders (63% Less!)</text>
    
    <text x="25" y="330" fill="#f87171" font-family="sans-serif" font-size="10.5" font-weight="bold">• Serious Flaw: Starvation of far requests!</text>
    <text x="25" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Greedy algorithm; not globally optimal.</text>
  </g>
</svg>