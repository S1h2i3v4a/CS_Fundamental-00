<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Disk Scheduling: LOOK vs C-LOOK (Optimized Boundary Traversal)</text>
  
  <text x="500" y="65" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Queue: 98, 183, 37, 122, 14, 124, 65, 67 | Head = 53 | Direction: Towards Lower Cylinders</text>

  <!-- Left Side: LOOK Algorithm -->
  <g transform="translate(60, 90)">
    <rect width="420" height="390" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">LOOK Algorithm</text>
    
    <text x="25" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Optimization: Arm disk ke extreme end (0) tak NAHI jata!</text>
    <text x="25" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="11">  Sirf aakhiri pending request (14) tak jata hai, fir reverse hota hai.</text>
    
    <text x="25" y="105" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Path: 53 → 37 → 14 → 65 → 67 → 98 → 122 → 124 → 183</text>
    
    <text x="25" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Calculations:</text>
    <text x="25" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Downward to lowest request (14): (53 - 14) = 39 tracks</text>
    <text x="25" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Reverse from 14 up to 183: (183 - 14) = 169 tracks</text>
    <text x="25" y="205" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">Total Movement = 39 + 169 = 208 Cylinders</text>
    
    <rect x="25" y="235" width="370" height="38" rx="6" fill="#0369a1"/>
    <text x="210" y="259" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Total Head Movement = 208 Cylinders</text>
    
    <text x="25" y="300" fill="#38bdf8" font-family="sans-serif" font-size="10.5" font-weight="bold">• SCAN (236) se 28 cylinders kam travel kiya!</text>
    <text x="25" y="320" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Unnecessary boundary track travel (0 to 14) eliminated.</text>
  </g>

  <!-- Right Side: C-LOOK Algorithm -->
  <g transform="translate(520, 90)">
    <rect width="420" height="390" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="210" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">C-LOOK (Circular LOOK)</text>
    
    <text x="25" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Optimization: 199 tak jane ke bajaye 183 par stop hota hai,</text>
    <text x="25" y="78" fill="#cbd5e1" font-family="sans-serif" font-size="11">  aur 0 par jane ke bajaye directly 14 par jump karta hai!</text>
    
    <text x="25" y="105" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Path (Moving Up): 53 → ... → 183 → 14 → 37</text>
    
    <text x="25" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Calculations (Upwards direction):</text>
    <text x="25" y="155" fill="#cbd5e1" font-family="sans-serif" font-size="10">• 53 to max request (183): (183 - 53) = 130 tracks</text>
    <text x="25" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Jump from 183 to min request (14): (183 - 14) = 169 tracks</text>
    <text x="25" y="195" fill="#cbd5e1" font-family="sans-serif" font-size="10">• 14 to 37: (37 - 14) = 23 tracks</text>
    
    <rect x="25" y="235" width="370" height="38" rx="6" fill="#581c87"/>
    <text x="210" y="259" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Total Movement = 130 + 169 + 23 = 322 Cylinders</text>
    
    <text x="25" y="300" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="bold">• C-SCAN (382) se 60 cylinders kam travel kiya!</text>
    <text x="25" y="320" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Industry preferred practical circular disk scheduler.</text>
  </g>
</svg>