<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">File System Layers &amp; Virtual File System (VFS) Architecture</text>
  
  <!-- Left Side: Layered File System Stack -->
  <g transform="translate(60, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Layered File System Architecture</text>
    
    <!-- Layer 1 -->
    <rect x="25" y="45" width="370" height="45" rx="6" fill="#0284c7"/>
    <text x="210" y="68" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Application Programs (open, read, write)</text>
    <text x="210" y="82" fill="#e0f2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">Standard POSIX C Library Calls</text>
    
    <!-- Layer 2 -->
    <rect x="25" y="100" width="370" height="45" rx="6" fill="#0369a1"/>
    <text x="210" y="123" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Logical File System (Metadata &amp; Inodes)</text>
    <text x="210" y="137" fill="#e0f2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">Directory structures, file protection, FCB/Inode</text>
    
    <!-- Layer 3 -->
    <rect x="25" y="155" width="370" height="45" rx="6" fill="#1e40af"/>
    <text x="210" y="178" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">File-Organization Module</text>
    <text x="210" y="192" fill="#e0f2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">Translates logical block addresses to physical sectors</text>
    
    <!-- Layer 4 -->
    <rect x="25" y="210" width="370" height="45" rx="6" fill="#1d4ed8"/>
    <text x="210" y="233" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Basic File System (Issue Block Commands)</text>
    <text x="210" y="247" fill="#e0f2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">Manages memory buffers &amp; cache blocks</text>
    
    <!-- Layer 5 -->
    <rect x="25" y="265" width="370" height="45" rx="6" fill="#312e81"/>
    <text x="210" y="288" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">I/O Control (Device Drivers &amp; Interrupts)</text>
    <text x="210" y="302" fill="#e0f2fe" font-family="sans-serif" font-size="9.5" text-anchor="middle">Low-level controller register commands</text>
    
    <!-- Layer 6 -->
    <rect x="25" y="320" width="370" height="45" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="210" y="348" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Physical Devices (Disks, SSDs, Flash)</text>
  </g>

  <!-- Right Side: VFS Abstraction Layer -->
  <g transform="translate(520, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Virtual File System (VFS) Layer</text>
    
    <!-- POSIX Syscall box -->
    <rect x="20" y="50" width="380" height="45" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="210" y="77" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Universal User Syscalls (read, write, open)</text>
    
    <line x1="210" y1="95" x2="210" y2="125" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- VFS Core -->
    <rect x="20" y="125" width="380" height="70" rx="6" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <text x="210" y="152" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VFS Interface (Uniform Kernel Abstraction)</text>
    <text x="210" y="172" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">VFS Objects: inode, file, dentry, superblock</text>
    
    <!-- Dispatch arrows -->
    <line x1="90" y1="195" x2="90" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="210" y1="195" x2="210" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="195" x2="330" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- File system types -->
    <rect x="25" y="235" width="110" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="80" y="260" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ext4 File Sys</text>
    <text x="80" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Linux Native</text>
    
    <rect x="155" y="235" width="110" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="210" y="260" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NTFS / FAT</text>
    <text x="210" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Windows Disks</text>
    
    <rect x="285" y="235" width="110" height="60" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="340" y="260" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NFS (Network)</text>
    <text x="340" y="280" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Remote Cloud</text>
    
    <text x="210" y="340" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• VFS hides different filesystem internals from user</text>
    <text x="210" y="360" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" text-anchor="middle">• Uniform function pointers table (file_operations)</text>
  </g>
</svg>