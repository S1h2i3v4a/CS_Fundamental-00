<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">I/O Communication Methods &amp; DMA Controller Architecture</text>
  
  <!-- Left Side: 3 I/O Transfer Schemes -->
  <g transform="translate(50, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3 Fundamental I/O Schemes</text>
    
    <!-- Scheme 1: Polling -->
    <rect x="20" y="45" width="380" height="95" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="68" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">1. Programmed I/O (Polling / Busy-Waiting)</text>
    <text x="35" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">CPU loop me device ke status register ko continuously check karta hai.</text>
    <text x="35" y="105" fill="#fca5a5" font-family="sans-serif" font-size="10">CPU 100% busy rehta hai; zero multitasking efficiency!</text>
    <text x="35" y="122" fill="#94a3b8" font-family="sans-serif" font-size="10">Use case: Hardware testing, simple embedded systems.</text>
    
    <!-- Scheme 2: Interrupt-Driven -->
    <rect x="20" y="155" width="380" height="105" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="35" y="178" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">2. Interrupt-Driven I/O</text>
    <text x="35" y="198" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">CPU I/O request bhej kar doosra task execute karta hai.</text>
    <text x="35" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Device ready hone par interrupt signal bhejta hai → CPU context switch.</text>
    <text x="35" y="232" fill="#fde68a" font-family="sans-serif" font-size="10">Drawback: Har byte/word transfer par CPU interrupt overhead!</text>
    <text x="35" y="249" fill="#94a3b8" font-family="sans-serif" font-size="10">Use case: Keyboard, Mouse, Network packet arrivals.</text>
    
    <!-- Scheme 3: DMA -->
    <rect x="20" y="275" width="380" height="115" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="298" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">3. Direct Memory Access (DMA)</text>
    <text x="35" y="318" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">High-speed block data directly Disk aur RAM ke beech transfer hota hai.</text>
    <text x="35" y="335" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="bold">CPU ko sirf 1 interrupt milta hai: Jab POORA BLOCK transfer ho jaye!</text>
    <text x="35" y="352" fill="#86efac" font-family="sans-serif" font-size="10">Cycle Stealing: DMA bus cycle use karta hai jab CPU busy ho.</text>
    <text x="35" y="370" fill="#cbd5e1" font-family="sans-serif" font-size="10">Use case: Hard disk drives, SSDs, Gigabit Ethernet.</text>
  </g>

  <!-- Right Side: DMA Architecture Diagram -->
  <g transform="translate(510, 70)">
    <rect width="440" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="220" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DMA Hardware Datapath &amp; System Bus</text>
    
    <!-- CPU Block -->
    <rect x="30" y="50" width="100" height="70" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="85" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CPU</text>
    <text x="80" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Initiates DMA</text>
    
    <!-- DMA Controller Block -->
    <rect x="170" y="50" width="120" height="70" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="230" y="80" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DMA Controller</text>
    <text x="230" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">• Addr Register</text>
    <text x="230" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">• Word Count Reg</text>
    
    <!-- RAM Block -->
    <rect x="325" y="50" width="95" height="70" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="372" y="85" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">RAM</text>
    <text x="372" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Data Target</text>
    
    <!-- Shared System Bus Line -->
    <rect x="30" y="160" width="390" height="24" rx="4" fill="#334155" stroke="#64748b"/>
    <text x="225" y="177" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">System Data &amp; Address Bus</text>
    
    <!-- Bus connecting lines -->
    <line x1="80" y1="120" x2="80" y2="160" stroke="#38bdf8" stroke-width="2"/>
    <line x1="230" y1="120" x2="230" y2="160" stroke="#4ade80" stroke-width="2"/>
    <line x1="372" y1="120" x2="372" y2="160" stroke="#a855f7" stroke-width="2"/>
    
    <!-- Device Controller and I/O Device -->
    <rect x="130" y="225" width="200" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="230" y="250" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Disk Device Controller</text>
    <text x="230" y="270" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Data Buffer &amp; Registers</text>
    
    <line x1="230" y1="184" x2="230" y2="225" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Kernel Subsystems Box -->
    <rect x="20" y="305" width="400" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="220" y="325" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Kernel I/O Subsystem Services</text>
    <text x="30" y="348" fill="#cbd5e1" font-family="sans-serif" font-size="10">• <strong>Buffering:</strong> Speed mismatch handle karna (Single, Double, Circular)</text>
    <text x="30" y="365" fill="#cbd5e1" font-family="sans-serif" font-size="10">• <strong>Caching:</strong> Fast memory me frequent blocks rakhna</text>
    <text x="30" y="382" fill="#cbd5e1" font-family="sans-serif" font-size="10">• <strong>Spooling:</strong> Multi-user simultaneous print queue handle karna</text>
  </g>
</svg>