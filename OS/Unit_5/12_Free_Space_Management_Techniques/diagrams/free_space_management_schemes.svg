<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg12)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Disk Free Space Management Schemes</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Tracking Unallocated Blocks: Bitmap, Linked Free List, Grouping, and Counting</text>

  <!-- 1. BIT VECTOR / BITMAP -->
  <rect x="30" y="85" width="450" height="195" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <rect x="30" y="85" width="450" height="30" rx="10" fill="#1e3a8a"/>
  <text x="45" y="105" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">1. Bit Vector / Bitmap (1 bit per block)</text>
  
  <text x="45" y="135" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">Disk Block IDs:</text>
  <g transform="translate(45, 145)">
    <!-- Block index labels -->
    <text x="18" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B0</text>
    <text x="53" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B1</text>
    <text x="88" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B2</text>
    <text x="123" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B3</text>
    <text x="158" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B4</text>
    <text x="193" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B5</text>
    <text x="228" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B6</text>
    <text x="263" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B7</text>
    <text x="298" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B8</text>
    <text x="333" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">B9</text>
    <text x="375" y="-5" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">...</text>
    
    <!-- Bit cells -->
    <rect x="3" y="2" width="30" height="26" fill="#ef4444" rx="3"/>
    <text x="18" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
    
    <rect x="38" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="53" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    
    <rect x="73" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="88" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    
    <rect x="108" y="2" width="30" height="26" fill="#ef4444" rx="3"/>
    <text x="123" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
    
    <rect x="143" y="2" width="30" height="26" fill="#ef4444" rx="3"/>
    <text x="158" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
    
    <rect x="178" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="193" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    
    <rect x="213" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="228" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    
    <rect x="248" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="263" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    
    <rect x="283" y="2" width="30" height="26" fill="#ef4444" rx="3"/>
    <text x="298" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
    
    <rect x="318" y="2" width="30" height="26" fill="#10b981" rx="3"/>
    <text x="333" y="20" font-family="monospace" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  </g>
  <text x="45" y="200" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">0 = Allocated (Occupied) | 1 = Free (Available)</text>
  <text x="45" y="222" font-family="monospace" font-size="10" fill="#38bdf8">Formula: Block# = (0-words count * 32) + 1st bit offset</text>
  <text x="45" y="242" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">CPU bit-scan instructions (ffs / bsf) allow O(1) allocation.</text>
  <text x="45" y="262" font-family="-apple-system, sans-serif" font-size="10" fill="#f59e0b">Trade-off: High RAM overhead for massive TB drives.</text>

  <!-- 2. LINKED FREE LIST -->
  <rect x="520" y="85" width="450" height="195" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="520" y="85" width="450" height="30" rx="10" fill="#064e3b"/>
  <text x="535" y="105" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399">2. Linked Free Space List (Pointers in Free Blocks)</text>
  
  <rect x="535" y="130" width="80" height="36" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="575" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Free Head</text>
  <text x="575" y="160" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Block 2</text>
  
  <line x1="615" y1="148" x2="655" y2="148" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>
  
  <rect x="660" y="130" width="80" height="36" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="700" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Free B2</text>
  <text x="700" y="160" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Ptr -> B5</text>
  
  <line x1="740" y1="148" x2="780" y2="148" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>
  
  <rect x="785" y="130" width="80" height="36" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="825" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Free B5</text>
  <text x="825" y="160" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">Ptr -> B8</text>
  
  <line x1="865" y1="148" x2="895" y2="148" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>
  
  <rect x="900" y="130" width="55" height="36" rx="4" fill="#0f172a" stroke="#64748b"/>
  <text x="927" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Free B8</text>
  <text x="927" y="160" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">NULL</text>

  <text x="535" y="200" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Advantage: Zero wasted space! Unallocated blocks store pointers.</text>
  <text x="535" y="222" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">No extra memory overhead required in RAM.</text>
  <text x="535" y="242" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">Fatal Flaw: Extreme I/O seek overhead to find N blocks.</text>
  <text x="535" y="262" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Cannot guarantee contiguous allocations.</text>

  <!-- 3. GROUPING -->
  <rect x="30" y="300" width="450" height="195" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="30" y="300" width="450" height="30" rx="10" fill="#78350f"/>
  <text x="45" y="320" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">3. Grouping (Superblock holds N Free Block Pointers)</text>
  
  <rect x="45" y="345" width="160" height="80" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="125" y="362" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">Block #2 (Group 1)</text>
  <text x="55" y="380" font-family="monospace" font-size="9.5" fill="#e2e8f0">- Free Block #3</text>
  <text x="55" y="396" font-family="monospace" font-size="9.5" fill="#e2e8f0">- Free Block #7</text>
  <text x="55" y="412" font-family="monospace" font-size="9.5" fill="#38bdf8">- Next Group: Ptr -> B12</text>
  
  <line x1="205" y1="405" x2="255" y2="405" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>
  
  <rect x="260" y="345" width="160" height="80" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="340" y="362" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">Block #12 (Group 2)</text>
  <text x="270" y="380" font-family="monospace" font-size="9.5" fill="#e2e8f0">- Free Block #15</text>
  <text x="270" y="396" font-family="monospace" font-size="9.5" fill="#e2e8f0">- Free Block #19</text>
  <text x="270" y="412" font-family="monospace" font-size="9.5" fill="#ef4444">- Next Group: NULL</text>

  <text x="45" y="445" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Stores N-1 free block addresses + 1 pointer to next group block.</text>
  <text x="45" y="465" font-family="-apple-system, sans-serif" font-size="10" fill="#38bdf8">1 Disk Read loads addresses of hundreds of free blocks instantly!</text>
  <text x="45" y="482" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Massive throughput improvement over standard Linked List.</text>

  <!-- 4. COUNTING -->
  <rect x="520" y="300" width="450" height="195" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="520" y="300" width="450" height="30" rx="10" fill="#4c1d95"/>
  <text x="535" y="320" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#c084fc">4. Counting (Contiguous Extent Tracking)</text>
  
  <g transform="translate(540, 345)">
    <rect x="0" y="0" width="410" height="25" fill="#0f172a" stroke="#64748b"/>
    <text x="100" y="17" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Start Block Address</text>
    <text x="310" y="17" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">Contiguous Free Count</text>
    
    <rect x="0" y="25" width="410" height="22" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="40" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Block # 14</text>
    <text x="310" y="40" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">6 blocks (14 - 19)</text>
    
    <rect x="0" y="47" width="410" height="22" fill="#0f172a" stroke="#334155"/>
    <text x="100" y="62" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Block # 45</text>
    <text x="310" y="62" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">12 blocks (45 - 56)</text>
    
    <rect x="0" y="69" width="410" height="22" fill="#1e293b" stroke="#334155"/>
    <text x="100" y="84" font-family="monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Block # 120</text>
    <text x="310" y="84" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">30 blocks (120 - 149)</text>
  </g>

  <text x="535" y="465" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Capitalizes on contiguous allocation/deallocation patterns.</text>
  <text x="535" y="482" font-family="-apple-system, sans-serif" font-size="10" fill="#c084fc">Compact entry table size; stored easily in a balanced B-Tree.</text>
</svg>
