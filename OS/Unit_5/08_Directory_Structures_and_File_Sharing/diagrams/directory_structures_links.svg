<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Directory Organizational Structures &amp; File Sharing</text>
  
  <!-- Left Side: Directory Hierarchy Models -->
  <g transform="translate(50, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Directory Structural Models</text>
    
    <!-- Model 1: Single Level -->
    <rect x="20" y="45" width="380" height="70" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="68" fill="#f87171" font-family="sans-serif" font-size="11.5" font-weight="bold">1. Single-Level Directory</text>
    <text x="35" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="10">All files in ONE directory. Name collisions unavoidable!</text>
    <text x="35" y="103" fill="#fca5a5" font-family="sans-serif" font-size="9.5">No grouping, poor scalability.</text>
    
    <!-- Model 2: Two Level -->
    <rect x="20" y="125" width="380" height="80" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="35" y="148" fill="#fbbf24" font-family="sans-serif" font-size="11.5" font-weight="bold">2. Two-Level Directory</text>
    <text x="35" y="168" fill="#cbd5e1" font-family="sans-serif" font-size="10">Master File Directory (MFD) → User File Directory (UFD).</text>
    <text x="35" y="185" fill="#fde68a" font-family="sans-serif" font-size="9.5">Solves collision between users; but no internal subdirectories.</text>
    
    <!-- Model 3: Tree Structured -->
    <rect x="20" y="215" width="380" height="85" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="238" fill="#34d399" font-family="sans-serif" font-size="11.5" font-weight="bold">3. Tree-Structured Directory (Modern Standard)</text>
    <text x="35" y="258" fill="#cbd5e1" font-family="sans-serif" font-size="10">Arbitrary depth subdirectories. Root (/) → Pathnames.</text>
    <text x="35" y="275" fill="#86efac" font-family="sans-serif" font-size="9.5">Absolute path (/home/user/doc) vs Relative (./doc).</text>
    
    <!-- Model 4: Acyclic Graph -->
    <rect x="20" y="310" width="380" height="85" rx="6" fill="#0f172a" stroke="#a855f7"/>
    <text x="35" y="333" fill="#c084fc" font-family="sans-serif" font-size="11.5" font-weight="bold">4. Acyclic-Graph Directory (Sharing)</text>
    <text x="35" y="353" fill="#cbd5e1" font-family="sans-serif" font-size="10">Allows directories/files to have multiple parent paths!</text>
    <text x="35" y="370" fill="#e9d5ff" font-family="sans-serif" font-size="9.5">Hard links (Reference counting) &amp; Soft links (Path shortcut).</text>
  </g>

  <!-- Right Side: Links & Dangling Pointers -->
  <g transform="translate(510, 70)">
    <rect width="440" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="220" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Hard Link vs Symbolic Link &amp; Dangling Pointer</text>
    
    <!-- Hard Link Box -->
    <rect x="20" y="45" width="400" height="150" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="68" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">Hard Link (ln target linkname):</text>
    <text x="35" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Directory entry sidha target file ke **SAME INODE** ko point karta hai.</text>
    <text x="35" y="110" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Inode ka <code>link_count</code> increment ho jata hai (e.g., count = 2).</text>
    <text x="35" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Original file delete karne par bhi file disk se delete nahi hoti!</text>
    <text x="35" y="150" fill="#86efac" font-family="sans-serif" font-size="10.5" font-weight="bold">• File tabhi delete hoti hai jab link_count == 0 ho jaye!</text>
    <text x="35" y="170" fill="#fca5a5" font-family="sans-serif" font-size="10">• Limitation: Cannot cross filesystem boundaries; no directory hard links.</text>
    
    <!-- Soft Link Box -->
    <rect x="20" y="210" width="400" height="180" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="35" y="233" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">Soft / Symbolic Link (ln -s target linkname):</text>
    <text x="35" y="255" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Ek nayi file banti hai jiska apna ALAG INODE hota hai.</text>
    <text x="35" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Is file ke andar target file ka pathname store hota hai.</text>
    <text x="35" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Filesystems cross kar sakta hai aur directories par link ban sakta hai.</text>
    <text x="35" y="325" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">• The Dangling Pointer Problem:</text>
    <text x="35" y="345" fill="#fca5a5" font-family="sans-serif" font-size="10.5">Agar original file delete ho jaye, to soft link ek non-existent</text>
    <text x="35" y="365" fill="#fca5a5" font-family="sans-serif" font-size="10.5">path ko point karta rehta hai ("Broken / Dangling Link")!</text>
  </g>
</svg>