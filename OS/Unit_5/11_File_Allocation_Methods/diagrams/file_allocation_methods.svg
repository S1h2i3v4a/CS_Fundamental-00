<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">File Allocation Methods: Contiguous, Linked &amp; Indexed</text>
  
  <!-- Method 1: Contiguous -->
  <g transform="translate(40, 70)">
    <rect width="280" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#0284c7"/>
    <text x="140" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1. Contiguous Allocation</text>
    
    <text x="15" y="65" fill="#38bdf8" font-size="11" font-weight="bold">Directory Entry: &lt;Start, Length&gt;</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="10">e.g. File "count" → Start: 0, Length: 4</text>
    
    <!-- Contiguous Disk Blocks -->
    <rect x="25" y="105" width="50" height="40" rx="4" fill="#065f46" stroke="#4ade80"/>
    <text x="50" y="130" fill="#ffffff" font-size="11" text-anchor="middle">Blk 0</text>
    <rect x="85" y="105" width="50" height="40" rx="4" fill="#065f46" stroke="#4ade80"/>
    <text x="110" y="130" fill="#ffffff" font-size="11" text-anchor="middle">Blk 1</text>
    <rect x="145" y="105" width="50" height="40" rx="4" fill="#065f46" stroke="#4ade80"/>
    <text x="170" y="130" fill="#ffffff" font-size="11" text-anchor="middle">Blk 2</text>
    <rect x="205" y="105" width="50" height="40" rx="4" fill="#065f46" stroke="#4ade80"/>
    <text x="230" y="130" fill="#ffffff" font-size="11" text-anchor="middle">Blk 3</text>
    
    <text x="15" y="180" fill="#4ade80" font-size="11" font-weight="bold">Advantages:</text>
    <text x="15" y="200" fill="#cbd5e1" font-size="10">• Fastest sequential &amp; direct access</text>
    <text x="15" y="215" fill="#cbd5e1" font-size="10">• Single seek to start of file</text>
    
    <text x="15" y="250" fill="#ef4444" font-size="11" font-weight="bold">Disadvantages:</text>
    <text x="15" y="270" fill="#fca5a5" font-size="10">• External Fragmentation</text>
    <text x="15" y="285" fill="#fca5a5" font-size="10">• File growth problem (Cannot expand)</text>
    <text x="15" y="300" fill="#fca5a5" font-size="10">• Requires compaction</text>
  </g>

  <!-- Method 2: Linked Allocation -->
  <g transform="translate(360, 70)">
    <rect width="280" height="410" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#059669"/>
    <text x="140" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Linked Allocation</text>
    
    <text x="15" y="65" fill="#34d399" font-size="11" font-weight="bold">Directory Entry: &lt;Start, End&gt;</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="10">Blocks are scattered; contain next ptr</text>
    
    <!-- Linked Blocks with arrows -->
    <rect x="25" y="105" width="60" height="40" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="55" y="130" fill="#4ade80" font-size="10" text-anchor="middle">Blk 9 →</text>
    
    <rect x="110" y="105" width="60" height="40" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="140" y="130" fill="#4ade80" font-size="10" text-anchor="middle">Blk 16 →</text>
    
    <rect x="195" y="105" width="60" height="40" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="225" y="130" fill="#4ade80" font-size="10" text-anchor="middle">Blk 1 [-1]</text>
    
    <text x="15" y="180" fill="#4ade80" font-size="11" font-weight="bold">Advantages:</text>
    <text x="15" y="200" fill="#cbd5e1" font-size="10">• ZERO External Fragmentation</text>
    <text x="15" y="215" fill="#cbd5e1" font-size="10">• Files can grow indefinitely</text>
    
    <text x="15" y="250" fill="#ef4444" font-size="11" font-weight="bold">Disadvantages:</text>
    <text x="15" y="270" fill="#fca5a5" font-size="10">• Direct access extremely slow (O(n))</text>
    <text x="15" y="285" fill="#fca5a5" font-size="10">• Pointer storage overhead (4B / block)</text>
    <text x="15" y="300" fill="#fca5a5" font-size="10">• Single corrupted pointer breaks file!</text>
    <text x="15" y="325" fill="#fbbf24" font-size="10">• FAT variant caches table in RAM</text>
  </g>

  <!-- Method 3: Indexed Allocation -->
  <g transform="translate(680, 70)">
    <rect width="280" height="410" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="38" rx="10" fill="#d97706"/>
    <text x="140" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Indexed Allocation</text>
    
    <text x="15" y="65" fill="#fbbf24" font-size="11" font-weight="bold">Directory Entry: &lt;Index Block #&gt;</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="10">Dedicated block stores array of pointers</text>
    
    <!-- Index Block Box -->
    <rect x="25" y="105" width="230" height="50" rx="4" fill="#0f172a" stroke="#f59e0b"/>
    <text x="140" y="125" fill="#fde68a" font-size="10.5" font-weight="bold" text-anchor="middle">Index Block 19: [9, 16, 1, 10, 25]</text>
    <text x="140" y="142" fill="#cbd5e1" font-size="9.5" text-anchor="middle">Direct pointers to scattered blocks</text>
    
    <text x="15" y="180" fill="#4ade80" font-size="11" font-weight="bold">Advantages:</text>
    <text x="15" y="200" fill="#cbd5e1" font-size="10">• Fast Direct Access without fragmentation</text>
    <text x="15" y="215" fill="#cbd5e1" font-size="10">• No external fragmentation</text>
    
    <text x="15" y="250" fill="#ef4444" font-size="11" font-weight="bold">Disadvantages:</text>
    <text x="15" y="270" fill="#fca5a5" font-size="10">• Index block overhead for tiny files</text>
    <text x="15" y="285" fill="#cbd5e1" font-size="10">• Solved by Multi-level / Combined Inode</text>
  </g>
</svg>