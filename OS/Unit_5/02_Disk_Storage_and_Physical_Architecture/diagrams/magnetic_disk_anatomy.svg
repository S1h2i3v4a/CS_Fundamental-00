<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Magnetic Hard Disk Physical Anatomy &amp; Access Latency</text>
  
  <!-- Left Side: Physical Disk Anatomy Diagram -->
  <g transform="translate(60, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Magnetic Disk Physical Structure</text>
    
    <!-- Central Spindle -->
    <rect x="70" y="60" width="14" height="260" rx="7" fill="#64748b"/>
    <text x="77" y="340" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Spindle (Motor)</text>
    
    <!-- Platter 1 (Top) -->
    <ellipse cx="220" cy="100" rx="130" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="220" cy="100" rx="90" ry="28" fill="none" stroke="#64748b" stroke-dasharray="3"/>
    <ellipse cx="220" cy="100" rx="50" ry="16" fill="none" stroke="#64748b" stroke-dasharray="3"/>
    <circle cx="220" cy="100" r="8" fill="#38bdf8"/>
    
    <!-- Platter 2 (Middle) -->
    <ellipse cx="220" cy="180" rx="130" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <ellipse cx="220" cy="180" rx="90" ry="28" fill="none" stroke="#64748b" stroke-dasharray="3"/>
    <circle cx="220" cy="180" r="8" fill="#38bdf8"/>
    
    <!-- Platter 3 (Bottom) -->
    <ellipse cx="220" cy="260" rx="130" ry="40" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="220" cy="260" r="8" fill="#38bdf8"/>
    
    <!-- Read/Write Head & Arm -->
    <polygon points="360,95 240,100 360,105" fill="#f59e0b"/>
    <polygon points="360,175 240,180 360,185" fill="#f59e0b"/>
    <polygon points="360,255 240,260 360,265" fill="#f59e0b"/>
    <rect x="360" y="80" width="20" height="200" rx="6" fill="#d97706"/>
    <text x="370" y="300" fill="#fbbf24" font-family="sans-serif" font-size="11" text-anchor="middle">Actuator Arm</text>
    
    <!-- Labels -->
    <text x="210" y="375" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">• Platter • Tracks (Concentric Rings) • Sectors</text>
    <text x="210" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" text-anchor="middle">• Cylinder = Same track across all platters</text>
  </g>

  <!-- Right Side: Latency Breakdown & Formulas -->
  <g transform="translate(520, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Disk Access Time Formulation</text>
    
    <!-- Component 1: Seek Time -->
    <rect x="20" y="45" width="380" height="75" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="68" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold">1. Seek Time (T_seek) — LARGEST DELAY!</text>
    <text x="35" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Read/Write head ko target track (cylinder) tak pahuchne ka samay.</text>
    <text x="35" y="105" fill="#fca5a5" font-family="sans-serif" font-size="10">Mechanical arm movement: 3 - 10 ms (Dominant factor!).</text>
    
    <!-- Component 2: Rotational Latency -->
    <rect x="20" y="130" width="380" height="85" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="35" y="153" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold">2. Rotational Latency (T_rot)</text>
    <text x="35" y="173" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Desired sector ko ghoomkar head ke neeche aane ka samay.</text>
    <text x="35" y="195" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold">Average Rotational Latency = 1 / (2 × RPM) × 60 seconds</text>
    
    <!-- Component 3: Transfer Time -->
    <rect x="20" y="225" width="380" height="70" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="248" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">3. Transfer Time (T_trans)</text>
    <text x="35" y="268" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Data ko disk surface se controller memory me transmit karne ka time.</text>
    <text x="35" y="285" fill="#86efac" font-family="sans-serif" font-size="10">T_trans = (Data Size) / (Transfer Rate)</text>
    
    <!-- Master Total Access Time Box -->
    <rect x="20" y="305" width="380" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="328" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Total Disk Access Latency Formula</text>
    <text x="210" y="352" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">T_access = T_seek + T_rot + T_trans + T_controller</text>
    <text x="210" y="375" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">⇒ Goal of Disk Scheduling: Seek Time (T_seek) minimize karna!</text>
  </g>
</svg>