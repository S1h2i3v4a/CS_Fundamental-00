<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">RAID Storage Architecture: Levels 0, 1, 5 &amp; Nested 10</text>
  
  <!-- RAID 0: Striping -->
  <g transform="translate(40, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="10" fill="#0284c7"/>
    <text x="105" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RAID 0 (Striping)</text>
    
    <text x="15" y="65" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Technique: Data Striping</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="10">Blocks are striped alternately across disks (A1, A2, A3...)</text>
    
    <!-- Disks -->
    <rect x="25" y="110" width="70" height="110" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="60" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Disk 0</text>
    <text x="60" y="150" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">A1, A3, A5</text>
    
    <rect x="115" y="110" width="70" height="110" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="150" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Disk 1</text>
    <text x="150" y="150" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">A2, A4, A6</text>
    
    <text x="15" y="245" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Storage Efficiency: 100%</text>
    <text x="15" y="265" fill="#4ade80" font-family="sans-serif" font-size="10.5">Read/Write: Fast parallel</text>
    <text x="15" y="290" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">Fault Tolerance: ZERO!</text>
    <text x="15" y="310" fill="#fca5a5" font-family="sans-serif" font-size="10">Ek disk fail → Total data loss!</text>
  </g>

  <!-- RAID 1: Mirroring -->
  <g transform="translate(280, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="10" fill="#059669"/>
    <text x="105" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RAID 1 (Mirroring)</text>
    
    <text x="15" y="65" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Technique: 100% Duplicate</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="10">Every block is copied identically on mirror disk.</text>
    
    <!-- Disks -->
    <rect x="25" y="110" width="70" height="110" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="60" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Data Disk</text>
    <text x="60" y="150" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">A1, A2, A3</text>
    
    <rect x="115" y="110" width="70" height="110" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="150" y="130" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Mirror</text>
    <text x="150" y="150" fill="#4ade80" font-family="sans-serif" font-size="11" text-anchor="middle">A1, A2, A3</text>
    
    <text x="15" y="245" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Storage Efficiency: 50%</text>
    <text x="15" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">High storage cost penalty</text>
    <text x="15" y="290" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Fault Tolerance: 1 Disk</text>
    <text x="15" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="10">Instant failover recovery.</text>
  </g>

  <!-- RAID 5: Distributed Parity -->
  <g transform="translate(520, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="38" rx="10" fill="#d97706"/>
    <text x="105" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RAID 5 (Dist. Parity)</text>
    
    <text x="15" y="65" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Industry Enterprise Standard</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="10">Block striping + Parity distributed across all disks.</text>
    
    <!-- Disks -->
    <rect x="15" y="110" width="55" height="110" rx="3" fill="#0f172a" stroke="#f59e0b"/>
    <text x="42" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">D0</text>
    <text x="42" y="150" fill="#fde68a" font-size="10" text-anchor="middle">A1, B1, P_c</text>
    
    <rect x="77" y="110" width="55" height="110" rx="3" fill="#0f172a" stroke="#f59e0b"/>
    <text x="104" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">D1</text>
    <text x="104" y="150" fill="#fde68a" font-size="10" text-anchor="middle">A2, P_b, C1</text>
    
    <rect x="139" y="110" width="55" height="110" rx="3" fill="#0f172a" stroke="#f59e0b"/>
    <text x="166" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">D2</text>
    <text x="166" y="150" fill="#fde68a" font-size="10" text-anchor="middle">P_a, B2, C2</text>
    
    <text x="15" y="245" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Capacity: (N - 1) / N</text>
    <text x="15" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">e.g. 4 disks = 75% capacity</text>
    <text x="15" y="290" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Fault Tolerance: 1 Disk</text>
    <text x="15" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="10">XOR Parity reconstruction.</text>
  </g>

  <!-- RAID 10: Nested 1+0 -->
  <g transform="translate(760, 70)">
    <rect width="200" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="38" rx="10" fill="#7e22ce"/>
    <text x="100" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">RAID 10 (1 + 0)</text>
    
    <text x="15" y="65" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Stripe of Mirrors</text>
    <text x="15" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="10">Combines speed of RAID 0 with security of RAID 1.</text>
    
    <rect x="15" y="110" width="80" height="90" rx="4" fill="#0f172a" stroke="#a855f7"/>
    <text x="55" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">Mirror Pair 1</text>
    <text x="55" y="150" fill="#c084fc" font-size="10" text-anchor="middle">D0 &amp; D1</text>
    
    <rect x="105" y="110" width="80" height="90" rx="4" fill="#0f172a" stroke="#a855f7"/>
    <text x="145" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">Mirror Pair 2</text>
    <text x="145" y="150" fill="#c084fc" font-size="10" text-anchor="middle">D2 &amp; D3</text>
    
    <text x="15" y="245" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold">Capacity: 50%</text>
    <text x="15" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">High cost, zero parity delay</text>
    <text x="15" y="290" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Tolerance: Up to 2 Disks</text>
    <text x="15" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="10">Best for DBs (Fastest writes!)</text>
  </g>
</svg>