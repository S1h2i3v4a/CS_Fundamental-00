<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Paging Hardware Architecture &amp; Address Translation</text>
  
  <!-- CPU and Logical Address -->
  <g transform="translate(40, 100)">
    <rect width="90" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="45" y="42" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">CPU</text>
    
    <!-- Logical Address Registers -->
    <rect x="140" y="10" width="120" height="50" rx="4" fill="#0284c7" stroke="#38bdf8"/>
    <text x="200" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">p (Page #)</text>
    <rect x="260" y="10" width="100" height="50" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="310" y="40" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">d (Offset)</text>
    <text x="250" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Logical Address (p, d)</text>
    
    <line x1="90" y1="35" x2="140" y2="35" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Page Table (RAM) -->
  <g transform="translate(430, 90)">
    <rect width="170" height="240" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="85" y="25" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Page Table</text>
    <line x1="10" y1="35" x2="160" y2="35" stroke="#475569"/>
    
    <text x="35" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">Page</text>
    <text x="125" y="55" fill="#94a3b8" font-family="sans-serif" font-size="10">Frame (f)</text>
    
    <!-- Table Rows -->
    <rect x="15" y="65" width="140" height="30" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="85" fill="#cbd5e1" font-family="sans-serif" font-size="11">0</text>
    <text x="125" y="85" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">3</text>
    
    <rect x="15" y="100" width="140" height="30" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">1</text>
    <text x="125" y="120" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">7</text>
    
    <rect x="15" y="135" width="140" height="30" fill="#3b82f6" opacity="0.3"/>
    <text x="35" y="155" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">p</text>
    <text x="125" y="155" fill="#4ade80" font-family="sans-serif" font-size="12" font-weight="bold">f</text>
    
    <rect x="15" y="170" width="140" height="30" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">3</text>
    <text x="125" y="190" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">2</text>
    
    <!-- Connecting Arrow from p to table row -->
    <path d="M -190 45 C -100 45, -100 150, 15 150" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Physical Memory (RAM Frames) -->
  <g transform="translate(720, 70)">
    <rect width="220" height="420" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="110" y="28" fill="#4ade80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Physical RAM (Frames)</text>
    
    <!-- Frame 0 -->
    <rect x="20" y="45" width="180" height="40" fill="#0f172a" stroke="#334155"/>
    <text x="110" y="70" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Frame 0 (OS Space)</text>
    
    <!-- Frame 1 -->
    <rect x="20" y="90" width="180" height="40" fill="#0f172a" stroke="#334155"/>
    <text x="110" y="115" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Frame 1 (Other Proc)</text>
    
    <!-- Frame f -->
    <rect x="20" y="140" width="180" height="60" fill="#166534" stroke="#4ade80" stroke-width="1.5"/>
    <text x="110" y="165" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Frame f (Target Page)</text>
    <text x="110" y="185" fill="#86efac" font-family="sans-serif" font-size="10" text-anchor="middle">Physical Address = (f × FrameSize) + d</text>
    
    <!-- Frame 3 -->
    <rect x="20" y="210" width="180" height="40" fill="#0f172a" stroke="#334155"/>
    <text x="110" y="235" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Frame 3</text>
  </g>

  <!-- Physical Address Register Box -->
  <g transform="translate(300, 390)">
    <rect width="130" height="50" rx="4" fill="#16a34a" stroke="#4ade80"/>
    <text x="65" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">f (Frame #)</text>
    <rect x="430" y="0" width="100" height="50" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="480" y="32" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">d (Offset)</text>
    <text x="330" y="70" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Physical Address = (f, d)</text>
    
    <!-- Arrow from Table output to f -->
    <path d="M 285 -145 C 240 -145, 240 25, 130 25" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow direct from d to d -->
    <path d="M 50 -240 C 120 -240, 120 25, 430 25" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- Arrow to RAM -->
    <line x1="530" y1="25" x2="680" y2="25" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>