<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Contiguous Memory Allocation &amp; Fragmentation</text>
  
  <!-- Left Box: Fixed Partition (Internal Frag) -->
  <g transform="translate(60, 70)">
    <rect width="400" height="410" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="30" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Fixed Partitions (MFT) &amp; Internal Frag</text>
    
    <!-- Partition 1: OS -->
    <rect x="30" y="50" width="340" height="50" fill="#334155" stroke="#64748b"/>
    <text x="200" y="80" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OS Kernel Space (100 MB)</text>
    
    <!-- Partition 2: 200 MB slot with 130 MB process -->
    <rect x="30" y="110" width="340" height="120" fill="#1e293b" stroke="#cbd5e1" stroke-dasharray="4"/>
    <rect x="30" y="110" width="340" height="75" fill="#3b82f6" opacity="0.8"/>
    <text x="200" y="152" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Process P1 (130 MB Allocated)</text>
    <rect x="30" y="185" width="340" height="45" fill="#ef4444" opacity="0.85"/>
    <text x="200" y="212" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Internal Fragmentation = 70 MB (Wasted!)</text>
    
    <!-- Partition 3: 150 MB slot with 80 MB process -->
    <rect x="30" y="240" width="340" height="110" fill="#1e293b" stroke="#cbd5e1" stroke-dasharray="4"/>
    <rect x="30" y="240" width="340" height="60" fill="#10b981" opacity="0.8"/>
    <text x="200" y="275" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Process P2 (80 MB Allocated)</text>
    <rect x="30" y="300" width="340" height="50" fill="#ef4444" opacity="0.85"/>
    <text x="200" y="330" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Internal Fragmentation = 70 MB (Wasted!)</text>
    
    <text x="200" y="380" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">• Fixed slots • Degree of Multiprogramming limited by partition count</text>
  </g>

  <!-- Right Box: Variable Partition (External Frag) -->
  <g transform="translate(540, 70)">
    <rect width="400" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="30" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Variable Partitions (MVT) &amp; External Frag</text>
    
    <!-- OS -->
    <rect x="30" y="50" width="340" height="45" fill="#334155" stroke="#64748b"/>
    <text x="200" y="77" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OS Space (100 MB)</text>
    
    <!-- Process A -->
    <rect x="30" y="100" width="340" height="55" fill="#3b82f6"/>
    <text x="200" y="132" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Process P1 (120 MB)</text>
    
    <!-- Hole 1 -->
    <rect x="30" y="160" width="340" height="45" fill="#dc2626" opacity="0.8"/>
    <text x="200" y="187" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hole A = 60 MB Free</text>
    
    <!-- Process B -->
    <rect x="30" y="210" width="340" height="55" fill="#8b5cf6"/>
    <text x="200" y="242" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Process P3 (100 MB)</text>
    
    <!-- Hole 2 -->
    <rect x="30" y="270" width="340" height="45" fill="#dc2626" opacity="0.8"/>
    <text x="200" y="297" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hole B = 50 MB Free</text>
    
    <!-- Incoming Request -->
    <rect x="30" y="325" width="340" height="45" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <text x="200" y="345" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Incoming P_new needs 90 MB</text>
    <text x="200" y="360" fill="#fca5a5" font-family="sans-serif" font-size="9.5" text-anchor="middle">Total Free = 60 + 50 = 110 MB &gt; 90 MB, BUT Cannot Allocate!</text>
    
    <text x="200" y="395" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">⇒ Solution: Non-contiguous Memory (Paging) ya Compaction</text>
  </g>
</svg>