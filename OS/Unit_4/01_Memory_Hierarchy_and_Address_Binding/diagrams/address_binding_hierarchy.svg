<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Address Binding Phases &amp; Dynamic Relocation</text>
  
  <!-- Left: Hierarchy Triangle / Stack -->
  <g transform="translate(60, 70)">
    <text x="160" y="24" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Memory Hierarchy Pyramid</text>
    <!-- Levels -->
    <polygon points="160,40 100,90 220,90" fill="#ef4444" opacity="0.85"/>
    <text x="160" y="75" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Registers (&lt;1ns)</text>
    
    <polygon points="100,95 220,95 260,155 60,155" fill="#f97316" opacity="0.85"/>
    <text x="160" y="132" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cache L1/L2/L3 (1-10ns)</text>
    
    <polygon points="60,160 260,160 300,230 20,230" fill="#3b82f6" opacity="0.85"/>
    <text x="160" y="202" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Main Memory - RAM (50-100ns)</text>
    
    <polygon points="20,235 300,235 340,320 -20,320" fill="#10b981" opacity="0.85"/>
    <text x="160" y="285" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Solid State Drive / NVMe (&mu;s)</text>
    
    <polygon points="-20,325 340,325 370,400 -50,400" fill="#64748b" opacity="0.85"/>
    <text x="160" y="370" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Magnetic HDD / Tape Backup (ms)</text>
  </g>

  <!-- Right: Address Binding Pipeline -->
  <g transform="translate(480, 70)">
    <text x="230" y="24" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3-Stage Address Binding Flow</text>
    
    <!-- Stage 1: Compile Time -->
    <rect x="20" y="50" width="420" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="35" y="75" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">1. Compile Time Binding</text>
    <text x="35" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Generates Absolute Code. Agar starting location badle to recompile karna padta hai.</text>
    <text x="35" y="110" fill="#4ade80" font-family="sans-serif" font-size="10">Example: MS-DOS .COM programs, embedded microcontrollers.</text>
    
    <!-- Arrow -->
    <line x1="230" y1="120" x2="230" y2="150" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Stage 2: Load Time -->
    <rect x="20" y="155" width="420" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="35" y="180" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold">2. Load Time Binding</text>
    <text x="35" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Generates Relocatable Code. Compiler symbolic offset generate karta hai;</text>
    <text x="35" y="218" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Loader memory me load karte waqt final base address bind karta hai.</text>
    
    <!-- Arrow -->
    <line x1="230" y1="230" x2="230" y2="260" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Stage 3: Execution Time -->
    <rect x="20" y="265" width="420" height="110" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
    <text x="35" y="290" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">3. Execution (Run) Time Binding (Modern OS)</text>
    <text x="35" y="310" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Logical addresses runtime par Physical addresses me translate hote hain.</text>
    <text x="35" y="330" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Hardware Support: MMU (Memory Management Unit)</text>
    <text x="35" y="350" fill="#38bdf8" font-family="sans-serif" font-size="10.5">Formula: Physical Address = Logical Address + Relocation Register</text>
    <text x="35" y="367" fill="#cbd5e1" font-family="sans-serif" font-size="10">Allows process to move dynamically in RAM during execution!</text>
  </g>
</svg>