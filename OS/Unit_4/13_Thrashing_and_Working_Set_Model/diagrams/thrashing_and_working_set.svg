<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Thrashing Phenomenon &amp; Working Set Dynamics</text>
  
  <!-- Left Side: CPU Utilization vs Degree of Multiprogramming Curve -->
  <g transform="translate(60, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Thrashing Curve (CPU Utilization)</text>
    
    <!-- Coordinate axes -->
    <line x1="50" y1="330" x2="380" y2="330" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="50" y1="330" x2="50" y2="70" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <text x="380" y="350" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="end">Degree of Multiprogramming →</text>
    <text x="45" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">CPU %</text>
    
    <!-- Thrashing Curve Path -->
    <path d="M 50 330 Q 150 110, 220 100 T 360 325" fill="none" stroke="#22c55e" stroke-width="3"/>
    <!-- Red Thrashing Drop Section -->
    <path d="M 220 100 Q 260 110, 360 325" fill="none" stroke="#ef4444" stroke-width="3.5"/>
    
    <!-- Peak annotation -->
    <circle cx="220" cy="100" r="5" fill="#eab308"/>
    <text x="220" y="85" fill="#fde68a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Optimal Operating Point</text>
    
    <!-- Thrashing Region -->
    <line x1="220" y1="100" x2="220" y2="330" stroke="#f43f5e" stroke-dasharray="4"/>
    <rect x="230" y="150" width="130" height="50" rx="4" fill="#7f1d1d" opacity="0.8"/>
    <text x="295" y="172" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">THRASHING</text>
    <text x="295" y="190" fill="#fecaca" font-family="sans-serif" font-size="9.5" text-anchor="middle">CPU Utilization Crashes!</text>
    
    <text x="210" y="380" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" text-anchor="middle">System spends 99% time swapping pages</text>
  </g>

  <!-- Right Side: Working Set & PFF Model -->
  <g transform="translate(520, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Working Set Model &amp; PFF Prevention</text>
    
    <rect x="20" y="55" width="380" height="150" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="200" y="80" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Working-Set Window (Δ) Equation</text>
    <text x="30" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• WSS_i = Set of pages accessed in last Δ references.</text>
    <text x="30" y="125" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">• Total Demand: D = ∑ WSS_i</text>
    <text x="30" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Total Memory Frames available in RAM = M</text>
    <text x="30" y="170" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">• If D &gt; M ⇒ System enters Thrashing!</text>
    <text x="30" y="190" fill="#fbbf24" font-family="sans-serif" font-size="10.5">• Action: OS must suspend (swap-out) one process.</text>
    
    <!-- PFF Box -->
    <rect x="20" y="225" width="380" height="160" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="200" y="250" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Page-Fault Frequency (PFF) Strategy</text>
    <text x="30" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">Maintain target page fault frequency within bounds:</text>
    <text x="30" y="300" fill="#ef4444" font-family="sans-serif" font-size="11">• If Fault Rate &gt; Upper Threshold ⇒ Allocate more frames!</text>
    <text x="30" y="325" fill="#38bdf8" font-family="sans-serif" font-size="11">• If Fault Rate &lt; Lower Threshold ⇒ Remove excess frames!</text>
    <text x="30" y="355" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="bold">• Direct, dynamic self-regulating control without Δ tracking.</text>
  </g>
</svg>