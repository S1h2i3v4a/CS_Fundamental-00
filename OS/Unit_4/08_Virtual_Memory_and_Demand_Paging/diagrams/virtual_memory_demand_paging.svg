<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Virtual Memory Architecture &amp; Demand Paging</text>
  
  <!-- Virtual Memory Space (Process) -->
  <g transform="translate(50, 70)">
    <rect width="200" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="28" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Virtual Memory Space</text>
    <text x="100" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">(e.g., 4 GB Virtual Size)</text>
    
    <rect x="20" y="60" width="160" height="45" fill="#0284c7"/>
    <text x="100" y="87" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Page 0 (In RAM)</text>
    
    <rect x="20" y="115" width="160" height="45" fill="#334155"/>
    <text x="100" y="142" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Page 1 (On Disk)</text>
    
    <rect x="20" y="170" width="160" height="45" fill="#0284c7"/>
    <text x="100" y="197" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Page 2 (In RAM)</text>
    
    <rect x="20" y="225" width="160" height="45" fill="#334155"/>
    <text x="100" y="252" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Page 3 (On Disk)</text>
    
    <rect x="20" y="280" width="160" height="45" fill="#334155"/>
    <text x="100" y="307" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Page 4 (On Disk)</text>
    
    <text x="100" y="380" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Allows Process &gt; Physical RAM!</text>
  </g>

  <!-- Page Table with Valid-Invalid Bits -->
  <g transform="translate(320, 70)">
    <rect width="260" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="130" y="28" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Page Table with (V/I) Bit</text>
    
    <text x="35" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Page</text>
    <text x="110" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Frame</text>
    <text x="210" y="60" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Valid (v/i)</text>
    <line x1="15" y1="68" x2="245" y2="68" stroke="#475569"/>
    
    <!-- Row 0 -->
    <rect x="20" y="78" width="220" height="35" fill="#0f172a"/>
    <text x="40" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="11">0</text>
    <text x="120" y="100" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">4</text>
    <rect x="195" y="85" width="35" height="20" rx="3" fill="#166534"/>
    <text x="212" y="99" fill="#86efac" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v</text>
    
    <!-- Row 1 -->
    <rect x="20" y="123" width="220" height="35" fill="#0f172a"/>
    <text x="40" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="11">1</text>
    <text x="120" y="145" fill="#64748b" font-family="sans-serif" font-size="11">&mdash;</text>
    <rect x="195" y="130" width="35" height="20" rx="3" fill="#991b1b"/>
    <text x="212" y="144" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">i</text>
    
    <!-- Row 2 -->
    <rect x="20" y="168" width="220" height="35" fill="#0f172a"/>
    <text x="40" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">2</text>
    <text x="120" y="190" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">7</text>
    <rect x="195" y="175" width="35" height="20" rx="3" fill="#166534"/>
    <text x="212" y="189" fill="#86efac" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">v</text>
    
    <!-- Row 3 -->
    <rect x="20" y="213" width="220" height="35" fill="#0f172a"/>
    <text x="40" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="11">3</text>
    <text x="120" y="235" fill="#64748b" font-family="sans-serif" font-size="11">&mdash;</text>
    <rect x="195" y="220" width="35" height="20" rx="3" fill="#991b1b"/>
    <text x="212" y="234" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">i</text>
    
    <text x="130" y="300" fill="#fca5a5" font-family="sans-serif" font-size="11" text-anchor="middle">Bit = 'i' (Invalid) &rArr;</text>
    <text x="130" y="320" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">PAGE FAULT TRAP!</text>
  </g>

  <!-- Physical Memory RAM -->
  <g transform="translate(650, 70)">
    <rect width="140" height="410" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="70" y="28" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Physical RAM</text>
    <text x="70" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10.5" text-anchor="middle">(e.g., 1 GB RAM)</text>
    
    <rect x="15" y="65" width="110" height="45" fill="#166534"/>
    <text x="70" y="92" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Frame 4 (Page 0)</text>
    
    <rect x="15" y="125" width="110" height="45" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="152" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Frame 5 (Free)</text>
    
    <rect x="15" y="185" width="110" height="45" fill="#166534"/>
    <text x="70" y="212" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Frame 7 (Page 2)</text>
  </g>

  <!-- Backing Store (Hard Disk / Swap Space) -->
  <g transform="translate(840, 70)">
    <rect width="130" height="410" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="65" y="28" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Swap Space</text>
    <text x="65" y="46" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">(Secondary Disk)</text>
    
    <rect x="15" y="80" width="100" height="30" fill="#0f172a" stroke="#f59e0b"/>
    <text x="65" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Page 1 data</text>
    
    <rect x="15" y="125" width="100" height="30" fill="#0f172a" stroke="#f59e0b"/>
    <text x="65" y="145" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Page 3 data</text>
    
    <rect x="15" y="170" width="100" height="30" fill="#0f172a" stroke="#f59e0b"/>
    <text x="65" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="9.5" text-anchor="middle">Page 4 data</text>
    
    <path d="M -70 230 L 15 145" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-40" y="210" fill="#f87171" font-family="sans-serif" font-size="10" font-weight="bold">Swap-in on fault</text>
  </g>
</svg>