<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Belady's Anomaly: FIFO 3 Frames vs 4 Frames Proof</text>
  
  <text x="500" y="65" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Reference String: 1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5</text>

  <!-- Left: 3 Frames Trace -->
  <g transform="translate(60, 90)">
    <rect width="400" height="390" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FIFO with 3 Frames (9 Page Faults)</text>
    
    <text x="30" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11">Initial: [Empty]</text>
    <text x="30" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="11">Refs 1, 2, 3: Frames = [1, 2, 3] &rarr; 3 Faults</text>
    <text x="30" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 4: Replace 1 &rarr; [4, 2, 3] &rarr; Fault 4</text>
    <text x="30" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 1: Replace 2 &rarr; [4, 1, 3] &rarr; Fault 5</text>
    <text x="30" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 2: Replace 3 &rarr; [4, 1, 2] &rarr; Fault 6</text>
    <text x="30" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 5: Replace 4 &rarr; [5, 1, 2] &rarr; Fault 7</text>
    <text x="30" y="215" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Ref 1: HIT! Frames = [5, 1, 2]</text>
    <text x="30" y="240" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Ref 2: HIT! Frames = [5, 1, 2]</text>
    <text x="30" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 3: Replace 1 &rarr; [5, 3, 2] &rarr; Fault 8</text>
    <text x="30" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 4: Replace 2 &rarr; [5, 3, 4] &rarr; Fault 9</text>
    <text x="30" y="315" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Ref 5: HIT! Frames = [5, 3, 4]</text>
    
    <rect x="30" y="340" width="340" height="32" rx="6" fill="#065f46"/>
    <text x="200" y="361" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Total Page Faults = 9</text>
  </g>

  <!-- Right: 4 Frames Trace (Anomaly!) -->
  <g transform="translate(540, 90)">
    <rect width="400" height="390" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="200" y="28" fill="#f87171" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">FIFO with 4 Frames (10 Page Faults!)</text>
    
    <text x="30" y="65" fill="#cbd5e1" font-family="sans-serif" font-size="11">Refs 1, 2, 3, 4: Frames = [1, 2, 3, 4] &rarr; 4 Faults</text>
    <text x="30" y="90" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Ref 1: HIT! Frames = [1, 2, 3, 4]</text>
    <text x="30" y="115" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Ref 2: HIT! Frames = [1, 2, 3, 4]</text>
    <text x="30" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 5: Replace 1 &rarr; [5, 2, 3, 4] &rarr; Fault 5</text>
    <text x="30" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 1: Replace 2 &rarr; [5, 1, 3, 4] &rarr; Fault 6</text>
    <text x="30" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 2: Replace 3 &rarr; [5, 1, 2, 4] &rarr; Fault 7</text>
    <text x="30" y="215" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 3: Replace 4 &rarr; [5, 1, 2, 3] &rarr; Fault 8</text>
    <text x="30" y="240" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 4: Replace 5 &rarr; [4, 1, 2, 3] &rarr; Fault 9</text>
    <text x="30" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="11">Ref 5: Replace 1 &rarr; [4, 5, 2, 3] &rarr; Fault 10</text>
    
    <rect x="30" y="300" width="340" height="30" rx="4" fill="#991b1b"/>
    <text x="200" y="320" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Total Page Faults = 10 (Faults BADH GAYE!)</text>
    
    <text x="200" y="355" fill="#fca5a5" font-family="sans-serif" font-size="10.5" text-anchor="middle">Frames 3 &rarr; 4 badhane par Faults 9 &rarr; 10 ho gaye!</text>
    <text x="200" y="372" fill="#cbd5e1" font-family="sans-serif" font-size="10.5" text-anchor="middle">&bull; FIFO is NOT a Stack Algorithm.</text>
  </g>
</svg>