<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">TLB Hardware Lookup &amp; Address Translation Pipeline</text>
  
  <!-- CPU and Logical Address -->
  <g transform="translate(30, 80)">
    <rect width="80" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="40" y="36" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CPU</text>
    
    <rect x="120" y="10" width="90" height="40" rx="4" fill="#0284c7"/>
    <text x="165" y="35" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">p (Page #)</text>
    <rect x="210" y="10" width="80" height="40" rx="4" fill="#0369a1"/>
    <text x="250" y="35" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">d (Offset)</text>
    <line x1="80" y1="30" x2="120" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- TLB Hardware Box -->
  <g transform="translate(360, 60)">
    <rect width="260" height="180" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#065f46"/>
    <text x="130" y="22" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">TLB (Hardware Associative Cache)</text>
    
    <text x="45" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Page Tag (p)</text>
    <text x="175" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10.5">Frame (f)</text>
    <line x1="10" y1="58" x2="250" y2="58" stroke="#334155"/>
    
    <rect x="15" y="65" width="230" height="25" fill="#0f172a"/>
    <text x="50" y="82" fill="#cbd5e1" font-family="sans-serif" font-size="11">Page 2</text>
    <text x="180" y="82" fill="#4ade80" font-family="sans-serif" font-size="11">Frame 9</text>
    
    <rect x="15" y="95" width="230" height="25" fill="#0f172a"/>
    <text x="50" y="112" fill="#cbd5e1" font-family="sans-serif" font-size="11">Page 7</text>
    <text x="180" y="112" fill="#4ade80" font-family="sans-serif" font-size="11">Frame 1</text>
    
    <rect x="15" y="125" width="230" height="25" fill="#0f172a"/>
    <text x="50" y="142" fill="#cbd5e1" font-family="sans-serif" font-size="11">Page 14</text>
    <text x="180" y="142" fill="#4ade80" font-family="sans-serif" font-size="11">Frame 4</text>
    
    <text x="130" y="170" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Search Time: t_TLB (1 - 10 ns)</text>
  </g>

  <!-- TLB Hit Path -->
  <path d="M 620 130 L 730 130" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="670" y="120" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">TLB HIT (h)</text>

  <!-- TLB Miss Path to Page Table -->
  <path d="M 490 240 L 490 320" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="500" y="280" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">TLB MISS (1 - h)</text>

  <!-- Page Table in RAM -->
  <g transform="translate(380, 325)">
    <rect width="220" height="150" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="#78350f"/>
    <text x="110" y="19" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Page Table in Main RAM</text>
    
    <text x="110" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Access Time: t_RAM (50-100ns)</text>
    <text x="110" y="90" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">1. Retrieve Frame f from RAM</text>
    <text x="110" y="110" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">2. Update TLB with new &lt;p, f&gt;</text>
  </g>

  <!-- Miss path to Physical Address -->
  <path d="M 600 400 L 780 400 L 780 200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Physical Memory Access Box -->
  <g transform="translate(740, 90)">
    <rect width="220" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="25" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Physical Address &amp; RAM</text>
    <rect x="20" y="38" width="80" height="30" fill="#166534" stroke="#4ade80"/>
    <text x="60" y="58" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Frame f</text>
    <rect x="100" y="38" width="80" height="30" fill="#0369a1" stroke="#38bdf8"/>
    <text x="140" y="58" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Offset d</text>
    <text x="110" y="88" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Final Data/Instruction Read</text>
  </g>

  <!-- Formula Callout at bottom -->
  <g transform="translate(40, 360)">
    <rect width="300" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="150" y="25" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EMAT Formula</text>
    <text x="15" y="50" fill="#4ade80" font-family="sans-serif" font-size="10.5">Hit Time = t_TLB + t_RAM</text>
    <text x="15" y="72" fill="#f87171" font-family="sans-serif" font-size="10.5">Miss Time = t_TLB + 2 × t_RAM</text>
    <text x="15" y="96" fill="#fde68a" font-family="sans-serif" font-size="10.5">EMAT = h × (t_TLB + t_RAM) + (1-h)×(t_TLB + 2×t_RAM)</text>
  </g>
</svg>