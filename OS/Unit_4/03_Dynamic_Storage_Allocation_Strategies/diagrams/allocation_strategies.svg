<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Dynamic Storage Allocation Strategies: Comparison</text>
  
  <!-- Strategy 1: First Fit -->
  <g transform="translate(40, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="40" rx="10" fill="#0284c7"/>
    <text x="105" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. First Fit</text>
    <text x="15" y="65" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Working Principle:</text>
    <text x="15" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">Pehle hole se search shuru karo; jo PEHLA hole process size se bada mila, allocate kar do.</text>
    <text x="15" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Fastest execution speed</text>
    <text x="15" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Poori list search nahi karni padti</text>
    <text x="15" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Shuruati memory blocks me tiny unusable holes jama ho jate hain.</text>
    <text x="15" y="300" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Time Complexity:</text>
    <text x="15" y="320" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold">O(n) worst / O(1) best</text>
  </g>

  <!-- Strategy 2: Best Fit -->
  <g transform="translate(280, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="40" rx="10" fill="#059669"/>
    <text x="105" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Best Fit</text>
    <text x="15" y="65" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Working Principle:</text>
    <text x="15" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">Poori list search karo aur wo hole chuno jo process se bada ho aur SMALLEST ho.</text>
    <text x="15" y="140" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Advantages:</text>
    <text x="15" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Badi holes preserve rehti hain future ke bade processes ke liye.</text>
    <text x="15" y="215" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Disadvantages:</text>
    <text x="15" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Generates smallest leftover holes jo kisi kaam ke nahi hote (Worst fragmentation).</text>
    <text x="15" y="300" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Time Complexity:</text>
    <text x="15" y="320" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold">Strictly O(n)</text>
  </g>

  <!-- Strategy 3: Worst Fit -->
  <g transform="translate(520, 70)">
    <rect width="210" height="410" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="210" height="40" rx="10" fill="#dc2626"/>
    <text x="105" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Worst Fit</text>
    <text x="15" y="65" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Working Principle:</text>
    <text x="15" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">Poori list me se LARGEST available hole ko choose karo aur allocate karo.</text>
    <text x="15" y="140" fill="#4ade80" font-family="sans-serif" font-size="11" font-weight="bold">Advantages:</text>
    <text x="15" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10">• Leftover hole ka size bada hota hai, jisme naya process fit ho sakta hai.</text>
    <text x="15" y="215" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">Disadvantages:</text>
    <text x="15" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="10">• System ke largest holes jaldi khatam ho jate hain; bade jobs starve karte hain.</text>
    <text x="15" y="300" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Time Complexity:</text>
    <text x="15" y="320" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold">Strictly O(n)</text>
  </g>

  <!-- Strategy 4: Next Fit & Compaction -->
  <g transform="translate(760, 70)">
    <rect width="200" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="40" rx="10" fill="#7e22ce"/>
    <text x="100" y="26" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Next Fit &amp; Compact</text>
    <text x="12" y="65" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Next Fit Strategy:</text>
    <text x="12" y="85" fill="#94a3b8" font-family="sans-serif" font-size="10">First Fit ki tarah, lekin search start se nahi balki LAST ALLOCATION pointer se hoti hai.</text>
    <text x="12" y="150" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold">Compaction (Defra):</text>
    <text x="12" y="170" fill="#cbd5e1" font-family="sans-serif" font-size="10">External fragmentation khatam karne ke liye saare processes ko memory ke ek side shift karna taaki ek bada contiguous free block ban jaye.</text>
    <text x="12" y="265" fill="#ef4444" font-family="sans-serif" font-size="10.5" font-weight="bold">Compaction Condition:</text>
    <text x="12" y="285" fill="#fca5a5" font-family="sans-serif" font-size="10">Possible ONLY if Dynamic Relocation is supported at runtime!</text>
  </g>
</svg>