<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Multilevel Paging vs Inverted Page Table</text>
  
  <!-- Left Side: Two-Level Hierarchical Paging -->
  <g transform="translate(40, 70)">
    <rect width="440" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="220" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Two-Level Paging Scheme</text>
    
    <!-- Logical Address: p1, p2, d -->
    <rect x="30" y="45" width="110" height="35" rx="4" fill="#0284c7"/>
    <text x="85" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">p1 (10 bits)</text>
    
    <rect x="145" y="45" width="110" height="35" rx="4" fill="#2563eb"/>
    <text x="200" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">p2 (10 bits)</text>
    
    <rect x="260" y="45" width="150" height="35" rx="4" fill="#0369a1"/>
    <text x="335" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">d (12 bits offset)</text>
    
    <!-- Outer Page Table -->
    <rect x="40" y="120" width="120" height="150" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="100" y="140" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Outer Table</text>
    <rect x="50" y="160" width="100" height="25" fill="#1e293b" stroke="#38bdf8"/>
    <text x="100" y="177" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Pointer to Inner</text>
    
    <!-- Inner Page Table -->
    <rect x="220" y="120" width="130" height="150" rx="6" fill="#0f172a" stroke="#a855f7"/>
    <text x="285" y="140" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Page of Table</text>
    <rect x="230" y="180" width="110" height="25" fill="#1e293b" stroke="#a855f7"/>
    <text x="285" y="197" fill="#4ade80" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Frame f</text>
    
    <!-- Connecting arrows -->
    <path d="M 85 80 L 85 160" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 150 172 L 220 172" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 200 80 C 200 130, 240 130, 240 180" stroke="#a855f7" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    
    <text x="220" y="320" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">EMAT on Miss: t_TLB + (2 + 1) &times; t_RAM = 3 RAM accesses</text>
    <text x="220" y="345" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">&bull; Breaks huge 4MB table into single 4KB pages!</text>
    <text x="220" y="365" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">&bull; Unused inner tables don't need to be in RAM.</text>
  </g>

  <!-- Right Side: Inverted Page Table -->
  <g transform="translate(520, 70)">
    <rect width="440" height="410" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="220" y="28" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Inverted Page Table (One for Whole System)</text>
    
    <!-- Logical Address: PID, p, d -->
    <rect x="30" y="45" width="100" height="35" rx="4" fill="#059669"/>
    <text x="80" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PID</text>
    
    <rect x="135" y="45" width="130" height="35" rx="4" fill="#10b981"/>
    <text x="200" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">p (Page #)</text>
    
    <rect x="270" y="45" width="140" height="35" rx="4" fill="#0369a1"/>
    <text x="340" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">d (Offset)</text>
    
    <!-- Table indexed by Frame # -->
    <rect x="60" y="115" width="320" height="170" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="220" y="135" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Inverted Table (Indexed by Frame i)</text>
    
    <rect x="80" y="150" width="280" height="25" fill="#1e293b"/>
    <text x="120" y="167" fill="#94a3b8" font-family="sans-serif" font-size="10">Frame 0:</text>
    <text x="230" y="167" fill="#cbd5e1" font-family="sans-serif" font-size="10">&lt;PID 101, Page 3&gt;</text>
    
    <rect x="80" y="180" width="280" height="25" fill="#166534"/>
    <text x="120" y="197" fill="#86efac" font-family="sans-serif" font-size="10.5" font-weight="bold">Frame i:</text>
    <text x="230" y="197" fill="#ffffff" font-family="sans-serif" font-size="10.5" font-weight="bold">&lt;PID, p&gt; MATCH!</text>
    
    <rect x="80" y="210" width="280" height="25" fill="#1e293b"/>
    <text x="120" y="227" fill="#94a3b8" font-family="sans-serif" font-size="10">Frame 2:</text>
    <text x="230" y="227" fill="#cbd5e1" font-family="sans-serif" font-size="10">&lt;PID 104, Page 0&gt;</text>
    
    <text x="220" y="320" fill="#fde68a" font-family="sans-serif" font-size="11" text-anchor="middle">Hardware Output = Frame Index i</text>
    <text x="220" y="345" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">&bull; Advantage: Memory footprint proportional to RAM size (Tiny!)</text>
    <text x="220" y="365" fill="#f87171" font-family="sans-serif" font-size="10" text-anchor="middle">&bull; Drawback: Slow search; requires Hash Table acceleration.</text>
  </g>
</svg>