<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="500" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Locality of Reference &amp; Cache Memory Organization</text>
  
  <!-- Left Side: Locality Types -->
  <g transform="translate(60, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="28" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Principle of Locality</text>
    
    <rect x="25" y="55" width="370" height="150" rx="6" fill="#0f172a" stroke="#2563eb"/>
    <text x="35" y="80" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">1. Temporal Locality (Locality in Time)</text>
    <text x="35" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Concept: Jo memory location abhi access hui hai,</text>
    <text x="35" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">  woh near future me DOBARA access hone ki</text>
    <text x="35" y="139" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="bold">  high probability rakhti hai.</text>
    <text x="35" y="165" fill="#fde68a" font-family="sans-serif" font-size="10">• Examples: Loops (for, while), loop index counters,</text>
    <text x="35" y="182" fill="#fde68a" font-family="sans-serif" font-size="10">  subroutine/function code, top of stack.</text>
    
    <rect x="25" y="225" width="370" height="150" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="250" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">2. Spatial Locality (Locality in Space)</text>
    <text x="35" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">• Concept: Jo location abhi access hui hai, uske</text>
    <text x="35" y="292" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">  AAS-PAAS (neighboring) ke memory locations</text>
    <text x="35" y="309" fill="#4ade80" font-family="sans-serif" font-size="10.5" font-weight="bold">  soon access hone ki high probability rakhte hain.</text>
    <text x="35" y="335" fill="#fde68a" font-family="sans-serif" font-size="10">• Examples: Array sequential traversal, continuous code</text>
    <text x="35" y="352" fill="#fde68a" font-family="sans-serif" font-size="10">  instruction stream, consecutive struct fields.</text>
  </g>

  <!-- Right Side: Cache Mapping Strategies -->
  <g transform="translate(520, 70)">
    <rect width="420" height="410" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="28" fill="#c084fc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Cache Mapping Architectures</text>
    
    <!-- Direct Mapping -->
    <rect x="20" y="55" width="380" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="78" fill="#38bdf8" font-family="sans-serif" font-size="11.5" font-weight="bold">1. Direct Mapping</text>
    <text x="30" y="98" fill="#cbd5e1" font-family="sans-serif" font-size="10">Block i maps to Cache Line = (i mod N). Fast &amp; simple hardware.</text>
    <text x="30" y="118" fill="#f87171" font-family="sans-serif" font-size="10">Conflict Misses: High when multiple blocks map to same line.</text>
    
    <!-- Fully Associative -->
    <rect x="20" y="160" width="380" height="95" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="183" fill="#4ade80" font-family="sans-serif" font-size="11.5" font-weight="bold">2. Fully Associative Mapping</text>
    <text x="30" y="203" fill="#cbd5e1" font-family="sans-serif" font-size="10">Any block can go into ANY cache line. Zero conflict misses!</text>
    <text x="30" y="223" fill="#f87171" font-family="sans-serif" font-size="10">Costly: Requires parallel hardware comparators for every line.</text>
    
    <!-- Set-Associative -->
    <rect x="20" y="265" width="380" height="120" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="30" y="288" fill="#fbbf24" font-family="sans-serif" font-size="11.5" font-weight="bold">3. k-Way Set-Associative (Industry Standard)</text>
    <text x="30" y="308" fill="#cbd5e1" font-family="sans-serif" font-size="10">Cache is divided into Sets; each Set contains k lines.</text>
    <text x="30" y="328" fill="#4ade80" font-family="sans-serif" font-size="10">Block maps to Set = (Block mod NumberOfSets); inside set any line.</text>
    <text x="30" y="348" fill="#e2e8f0" font-family="sans-serif" font-size="10.5" font-weight="bold">AMAT = Hit_Time + (Miss_Rate × Miss_Penalty)</text>
  </g>
</svg>