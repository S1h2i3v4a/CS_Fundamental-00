<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="ar9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ar9Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="ar9Green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg9)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Multilevel Queue (MLQ) vs Multilevel Feedback Queue (MLFQ)</text>

  <!-- Left: MLQ Static Hierarchy -->
  <g transform="translate(40, 75)">
    <rect width="480" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="30" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">Multilevel Queue (MLQ - Static)</text>

    <!-- Queue 1: System -->
    <rect x="25" y="55" width="430" height="60" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="40" y="80" fill="#f87171" font-size="13" font-weight="bold">Q0: System Processes (Highest Priority)</text>
    <text x="40" y="100" fill="#cbd5e1" font-size="10.5">Algorithm: Strict Priority / Round Robin (Small q = 4ms)</text>

    <!-- Queue 2: Interactive -->
    <rect x="25" y="130" width="430" height="60" rx="6" fill="#0f172a" stroke="#fbbf24"/>
    <text x="40" y="155" fill="#fbbf24" font-size="13" font-weight="bold">Q1: Interactive Editing Processes</text>
    <text x="40" y="175" fill="#cbd5e1" font-size="10.5">Algorithm: Round Robin (q = 8ms)</text>

    <!-- Queue 3: Batch -->
    <rect x="25" y="205" width="430" height="60" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="40" y="230" fill="#38bdf8" font-size="13" font-weight="bold">Q2: Interactive Batch Processes</text>
    <text x="40" y="250" fill="#cbd5e1" font-size="10.5">Algorithm: Round Robin (q = 16ms)</text>

    <!-- Queue 4: Student/Background -->
    <rect x="25" y="280" width="430" height="60" rx="6" fill="#0f172a" stroke="#94a3b8"/>
    <text x="40" y="305" fill="#94a3b8" font-size="13" font-weight="bold">Q3: Student / Batch Jobs (Lowest Priority)</text>
    <text x="40" y="325" fill="#cbd5e1" font-size="10.5">Algorithm: FCFS (First-Come First-Served)</text>

    <text x="25" y="365" fill="#f87171" font-size="11" font-weight="bold">Critical Flaw: Processes are PERMANENTLY assigned.</text>
    <text x="25" y="385" fill="#cbd5e1" font-size="10.5">No movement between queues &rarr; High Starvation risk for Q3!</text>
  </g>

  <!-- Right: MLFQ Dynamic Feedback -->
  <g transform="translate(560, 75)">
    <rect width="500" height="410" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="250" y="30" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">Multilevel Feedback Queue (MLFQ - Dynamic)</text>

    <!-- Q0 -->
    <g transform="translate(25, 55)">
      <rect width="450" height="60" rx="6" fill="#0f172a" stroke="#4ade80"/>
      <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="bold">Q0: Round Robin (Quantum q = 8 ms)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10">All new jobs enter here. If completes in 8ms &rarr; EXIT.</text>
    </g>

    <!-- Demotion arrow 1 -->
    <path d="M 400 115 L 400 145" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar9Red)"/>
    <text x="410" y="135" fill="#f87171" font-size="9">Exceeds 8ms (Demote)</text>

    <!-- Q1 -->
    <g transform="translate(25, 145)">
      <rect width="450" height="60" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Q1: Round Robin (Quantum q = 16 ms)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10">Executes only when Q0 is empty. If completes &rarr; EXIT.</text>
    </g>

    <!-- Demotion arrow 2 -->
    <path d="M 400 205 L 400 235" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar9Red)"/>
    <text x="410" y="225" fill="#f87171" font-size="9">Exceeds 16ms (Demote)</text>

    <!-- Q2 -->
    <g transform="translate(25, 235)">
      <rect width="450" height="60" rx="6" fill="#0f172a" stroke="#fbbf24"/>
      <text x="15" y="25" fill="#fbbf24" font-size="12" font-weight="bold">Q2: FCFS (CPU-Bound Long Jobs)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10">Runs only when Q0 and Q1 are empty.</text>
    </g>

    <!-- Aging arrow up -->
    <path d="M 70 235 L 70 115" fill="none" stroke="#4ade80" stroke-dasharray="4" stroke-width="2" marker-end="url(#ar9Green)"/>
    <text x="80" y="175" fill="#4ade80" font-size="9" font-weight="bold">AGING: Promote if waiting too long</text>

    <rect x="25" y="315" width="450" height="75" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="338" fill="#4ade80" font-size="11" font-weight="bold">Why MLFQ is Most Versatile General-Purpose Scheduler:</text>
    <text x="35" y="358" fill="#cbd5e1" font-size="10">• Automatically favors short interactive I/O jobs without prior burst knowledge!</text>
    <text x="35" y="375" fill="#38bdf8" font-size="10">• Aging completely prevents starvation of CPU-bound batch jobs.</text>
  </g>
</svg>