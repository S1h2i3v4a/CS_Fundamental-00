<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg8)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Round Robin (RR) Scheduling &amp; Quantum Trade-off</text>

  <!-- Left: Circular Queue & Quantum Execution -->
  <g transform="translate(40, 75)">
    <rect width="520" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="260" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Round Robin Trace (Time Quantum q = 2 ms)</text>

    <!-- Gantt Chart -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="60" height="45" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="30" y="28" fill="#fff" font-size="10" text-anchor="middle">P1 (2)</text>

      <rect x="60" y="0" width="60" height="45" fill="#047857" stroke="#10b981"/>
      <text x="90" y="28" fill="#fff" font-size="10" text-anchor="middle">P2 (2)</text>

      <rect x="120" y="0" width="60" height="45" fill="#d97706" stroke="#fbbf24"/>
      <text x="150" y="28" fill="#fff" font-size="10" text-anchor="middle">P3 (2)</text>

      <rect x="180" y="0" width="60" height="45" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="210" y="28" fill="#fff" font-size="10" text-anchor="middle">P1 (2)</text>

      <rect x="240" y="0" width="30" height="45" fill="#047857" stroke="#10b981"/>
      <text x="255" y="28" fill="#fff" font-size="9" text-anchor="middle">P2(1)</text>

      <rect x="270" y="0" width="60" height="45" fill="#d97706" stroke="#fbbf24"/>
      <text x="300" y="28" fill="#fff" font-size="10" text-anchor="middle">P3 (2)</text>

      <rect x="330" y="0" width="30" height="45" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="345" y="28" fill="#fff" font-size="9" text-anchor="middle">P1(1)</text>

      <rect x="360" y="0" width="60" height="45" fill="#d97706" stroke="#fbbf24"/>
      <text x="390" y="28" fill="#fff" font-size="10" text-anchor="middle">P3 (2)</text>

      <!-- Timestamps -->
      <text x="0" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">0</text>
      <text x="60" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">2</text>
      <text x="120" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">4</text>
      <text x="180" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">6</text>
      <text x="240" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">8</text>
      <text x="270" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">9</text>
      <text x="330" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">11</text>
      <text x="360" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">12</text>
      <text x="420" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">14</text>
    </g>

    <text x="20" y="155" fill="#f8fafc" font-size="12" font-weight="bold">Ready Queue State Transitions:</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="10.5">• Ready Queue operated as Circular FIFO Queue.</text>
    <text x="20" y="200" fill="#cbd5e1" font-size="10.5">• Process gets at most 1 Time Quantum 'q' per turn.</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="10.5">• Timer interrupt occurs when quantum expires → Preempt to tail.</text>
    <text x="20" y="240" fill="#4ade80" font-size="10.5">• Outstanding Response Time (Ideal for Time-Sharing OS).</text>

    <rect x="20" y="265" width="480" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="295" fill="#4ade80" font-size="11" font-family="monospace">P1 (BT=5): CT=12, TAT=12, WT=7</text>
    <text x="30" y="320" fill="#38bdf8" font-size="11" font-family="monospace">P2 (BT=3): CT=9, TAT=9, WT=6</text>
    <text x="30" y="345" fill="#fbbf24" font-size="11" font-family="monospace">P3 (BT=6): CT=14, TAT=14, WT=8</text>
    <text x="30" y="370" fill="#a7f3d0" font-size="11" font-family="monospace">Average WT = 7.0 ms | Average TAT = 11.67 ms</text>
  </g>

  <!-- Right: Quantum Sizing Trade-off Curve -->
  <g transform="translate(580, 75)">
    <rect width="480" height="410" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="240" y="30" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">Time Quantum (q) Trade-off Dynamics</text>

    <!-- Extremely Large q -->
    <rect x="25" y="55" width="430" height="95" rx="6" fill="#0f172a" stroke="#fbbf24"/>
    <text x="40" y="80" fill="#fbbf24" font-size="13" font-weight="bold">Case 1: Quantum q → ∞ (Very Large)</text>
    <text x="40" y="105" fill="#cbd5e1" font-size="10.5">• Har process single slice me finish ho jayega.</text>
    <text x="40" y="123" fill="#cbd5e1" font-size="10.5">• Round Robin degenerates into FCFS (Convoy effect returns!).</text>
    <text x="40" y="141" fill="#f87171" font-size="10.5">• Poor interactive response time.</text>

    <!-- Extremely Small q -->
    <rect x="25" y="165" width="430" height="95" rx="6" fill="#0f172a" stroke="#f87171"/>
    <text x="40" y="190" fill="#f87171" font-size="13" font-weight="bold">Case 2: Quantum q → 0 (Very Small)</text>
    <text x="40" y="215" fill="#cbd5e1" font-size="10.5">• Processor Sharing: N processes run on 1/N virtual speed.</text>
    <text x="40" y="233" fill="#cbd5e1" font-size="10.5">• Massive Context Switch Overhead! Most CPU time wasted in switching.</text>
    <text x="40" y="251" fill="#f87171" font-size="10.5">• System throughput drops drastically (Thrashing).</text>

    <!-- Golden Rule -->
    <rect x="25" y="275" width="430" height="110" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="40" y="300" fill="#10b981" font-size="13" font-weight="bold">Rule of Thumb for Optimal Quantum</text>
    <text x="40" y="325" fill="#4ade80" font-size="11" font-weight="bold">80% of CPU bursts should be shorter than time quantum 'q'.</text>
    <text x="40" y="345" fill="#cbd5e1" font-size="10.5">• Typical modern OS quantum: 10 ms to 100 ms.</text>
    <text x="40" y="365" fill="#cbd5e1" font-size="10.5">• Context switch latency: &lt; 10 microseconds (negligible &lt; 0.1%).</text>
  </g>
</svg>