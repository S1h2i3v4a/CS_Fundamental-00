<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="ar12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ar12Red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg12)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Resource Allocation Graph (RAG) &amp; Cycle Deadlock Rules</text>

  <!-- Left: RAG with Deadlock (Single Instance Cycle) -->
  <g transform="translate(40, 75)">
    <rect width="490" height="410" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="245" y="30" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle">Case 1: Single Instance with Cycle → DEADLOCK</text>

    <!-- P1 circle -->
    <circle cx="120" cy="120" r="30" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="125" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P1</text>

    <!-- R1 rect with 1 dot -->
    <rect x="290" y="90" width="60" height="60" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="320" cy="120" r="5" fill="#4ade80"/>
    <text x="320" y="80" fill="#94a3b8" font-size="12" text-anchor="middle">R1</text>

    <!-- P2 circle -->
    <circle cx="320" cy="280" r="30" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="320" y="285" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P2</text>

    <!-- R2 rect with 1 dot -->
    <rect x="90" y="250" width="60" height="60" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="120" cy="280" r="5" fill="#4ade80"/>
    <text x="120" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">R2</text>

    <!-- Assignment R1 -> P1 -->
    <path d="M 315 120 L 155 120" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ar12)"/>
    <!-- Request P1 -> R2 -->
    <path d="M 120 150 L 120 250" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar12Red)"/>
    <!-- Assignment R2 -> P2 -->
    <path d="M 150 280 L 290 280" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#ar12)"/>
    <!-- Request P2 -> R1 -->
    <path d="M 320 250 L 320 150" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar12Red)"/>

    <rect x="20" y="335" width="450" height="55" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="358" fill="#f87171" font-size="11" font-weight="bold">Cycle: P1 → R2 → P2 → R1 → P1</text>
    <text x="35" y="378" fill="#cbd5e1" font-size="10.5">Single instance per resource + Cycle ⇒ GUARANTEED DEADLOCK!</text>
  </g>

  <!-- Right: RAG with Cycle but NO DEADLOCK (Multi-instance) -->
  <g transform="translate(560, 75)">
    <rect width="500" height="410" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="250" y="30" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">Case 2: Multi-Instance Cycle with NO DEADLOCK</text>

    <!-- R1 (2 dots) -->
    <rect x="80" y="100" width="70" height="70" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="100" cy="135" r="5" fill="#4ade80"/>
    <circle cx="130" cy="135" r="5" fill="#4ade80"/>
    <text x="115" y="90" fill="#94a3b8" font-size="12" text-anchor="middle">R1 (2 Inst)</text>

    <!-- P1 -->
    <circle cx="250" cy="80" r="25" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="85" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">P1</text>

    <!-- P3 (External helper!) -->
    <circle cx="250" cy="180" r="25" fill="#065f46" stroke="#4ade80" stroke-width="2"/>
    <text x="250" y="185" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">P3</text>

    <!-- R2 (2 dots) -->
    <rect x="360" y="100" width="70" height="70" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="380" cy="135" r="5" fill="#4ade80"/>
    <circle cx="410" cy="135" r="5" fill="#4ade80"/>
    <text x="395" y="90" fill="#94a3b8" font-size="12" text-anchor="middle">R2 (2 Inst)</text>

    <!-- P2 -->
    <circle cx="250" cy="270" r="25" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="250" y="275" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">P2</text>

    <!-- P4 (External helper!) -->
    <circle cx="450" cy="270" r="25" fill="#065f46" stroke="#4ade80" stroke-width="2"/>
    <text x="450" y="275" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">P4</text>

    <!-- Edges -->
    <path d="M 250 105 L 360 125" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar12Red)"/>
    <path d="M 380 135 L 250 160" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ar12)"/>
    <path d="M 100 135 L 230 85" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ar12)"/>
    <path d="M 130 135 L 230 180" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ar12)"/>
    <path d="M 250 245 L 140 165" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#ar12Red)"/>
    <path d="M 410 135 L 450 245" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ar12)"/>

    <rect x="25" y="325" width="450" height="65" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="35" y="348" fill="#4ade80" font-size="11" font-weight="bold">Cycle exists: P1 → R2 → P3 → R1 → P1</text>
    <text x="35" y="365" fill="#cbd5e1" font-size="10">BUT P4 and P3 do not wait for anyone! They will finish and</text>
    <text x="35" y="380" fill="#a7f3d0" font-size="10">release resources → Cycle breaks naturally → NO DEADLOCK!</text>
  </g>
</svg>