<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg4)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">CPU-I/O Burst Cycle &amp; Scheduling Performance Criteria</text>

  <!-- Left: CPU - I/O Burst Cycle -->
  <g transform="translate(50, 80)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="225" y="30" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">CPU-I/O Burst Cycle</text>
    
    <rect x="50" y="55" width="350" height="50" rx="6" fill="#047857" stroke="#10b981"/>
    <text x="225" y="85" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">CPU Burst (Compute, ALU, Loops)</text>

    <path d="M 225 105 L 225 130" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="220,130 230,130 225,140" fill="#38bdf8"/>

    <rect x="50" y="145" width="350" height="50" rx="6" fill="#1e3a8a" stroke="#38bdf8"/>
    <text x="225" y="175" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">I/O Burst (Wait for Disk, Network, Input)</text>

    <path d="M 225 195 L 225 220" fill="none" stroke="#4ade80" stroke-width="2"/>
    <polygon points="220,220 230,220 225,230" fill="#4ade80"/>

    <rect x="50" y="235" width="350" height="50" rx="6" fill="#047857" stroke="#10b981"/>
    <text x="225" y="265" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">CPU Burst (Next Computation)</text>

    <path d="M 225 285 L 225 310" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <polygon points="220,310 230,310 225,320" fill="#fbbf24"/>

    <rect x="50" y="325" width="350" height="50" rx="6" fill="#7f1d1d" stroke="#f87171"/>
    <text x="225" y="355" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">Exit / Terminate (Final Syscall)</text>
  </g>

  <!-- Right: Scheduling Performance Criteria -->
  <g transform="translate(540, 80)">
    <rect width="510" height="400" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="255" y="30" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">5 Key Scheduling Metrics &amp; Formulas</text>

    <g transform="translate(25, 55)">
      <rect width="460" height="55" rx="6" fill="#0f172a" stroke="#4ade80"/>
      <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="bold">1. CPU Utilization (Maximize: 40% - 90%)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">Percentage of time CPU is actively executing user tasks.</text>
    </g>

    <g transform="translate(25, 120)">
      <rect width="460" height="55" rx="6" fill="#0f172a" stroke="#4ade80"/>
      <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="bold">2. Throughput (Maximize)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">Number of processes completed per unit time (N / delta_t).</text>
    </g>

    <g transform="translate(25, 185)">
      <rect width="460" height="60" rx="6" fill="#0f172a" stroke="#f87171"/>
      <text x="15" y="25" fill="#f87171" font-size="12" font-weight="bold">3. Turnaround Time (TAT) (Minimize)</text>
      <text x="15" y="48" fill="#fbbf24" font-size="11" font-family="monospace">TAT = Completion Time (CT) - Arrival Time (AT)</text>
    </g>

    <g transform="translate(25, 255)">
      <rect width="460" height="60" rx="6" fill="#0f172a" stroke="#f87171"/>
      <text x="15" y="25" fill="#f87171" font-size="12" font-weight="bold">4. Waiting Time (WT) (Minimize)</text>
      <text x="15" y="48" fill="#fbbf24" font-size="11" font-family="monospace">WT = Turnaround Time (TAT) - CPU Burst Time (BT)</text>
    </g>

    <g transform="translate(25, 325)">
      <rect width="460" height="60" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">5. Response Time (RT) (Minimize)</text>
      <text x="15" y="48" fill="#fbbf24" font-size="11" font-family="monospace">RT = Time at First CPU Allocation - Arrival Time (AT)</text>
    </g>
  </g>
</svg>