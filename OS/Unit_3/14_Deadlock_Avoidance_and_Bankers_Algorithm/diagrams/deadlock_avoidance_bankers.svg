<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg14)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Deadlock Avoidance, Safe State &amp; Banker's Algorithm Trace</text>

  <!-- Left: Safe State Venn Diagram -->
  <g transform="translate(40, 75)">
    <rect width="450" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="225" y="30" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">State Spaces Relationship</text>

    <!-- Outer ellipse: All states -->
    <ellipse cx="225" cy="220" rx="190" ry="140" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
    <text x="225" y="110" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">All Operating System States</text>

    <!-- Middle ellipse: Unsafe states -->
    <ellipse cx="225" cy="235" rx="140" ry="105" fill="#3b0764" stroke="#c084fc" stroke-width="2"/>
    <text x="225" y="160" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">UNSAFE STATE (Deadlock Possible)</text>

    <!-- Inner circle: Deadlock -->
    <ellipse cx="225" cy="265" rx="75" ry="50" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="225" y="270" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle">DEADLOCK</text>

    <!-- Green Safe State -->
    <path d="M 60 180 Q 225 140 390 180 Q 225 350 60 180" fill="#065f46" opacity="0.6"/>
    <text x="225" y="340" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle">SAFE STATE (Guaranteed Safe Sequence Exists)</text>

    <text x="225" y="380" fill="#cbd5e1" font-size="10.5" text-anchor="middle">Deadlock Avoidance keeps system strictly in SAFE STATE!</text>
  </g>

  <!-- Right: Banker's Algorithm Execution Trace -->
  <g transform="translate(520, 75)">
    <rect width="540" height="410" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="270" y="30" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle">Banker's Algorithm Step-by-Step Resolution Trace</text>

    <rect x="20" y="50" width="500" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="73" fill="#38bdf8" font-size="11" font-family="monospace">Available Vector: [3, 3, 2] | Need = Max - Allocation</text>
    <text x="30" y="95" fill="#cbd5e1" font-size="10.5">Test Condition for Process Pi: Need_i ≤ Work (Available)</text>

    <!-- Step traces -->
    <g transform="translate(20, 120)">
      <rect width="500" height="40" rx="4" fill="#065f46"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="10.5" font-family="monospace">Step 1: Check P2: Need[1,2,2] ≤ Avail[3,3,2] ⇒ SATISFIED!</text>
      <text x="360" y="25" fill="#fff" font-size="10" font-weight="bold">New Avail = [5, 3, 2]</text>
    </g>

    <g transform="translate(20, 168)">
      <rect width="500" height="40" rx="4" fill="#065f46"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="10.5" font-family="monospace">Step 2: Check P4: Need[0,1,1] ≤ Avail[5,3,2] ⇒ SATISFIED!</text>
      <text x="360" y="25" fill="#fff" font-size="10" font-weight="bold">New Avail = [7, 4, 3]</text>
    </g>

    <g transform="translate(20, 216)">
      <rect width="500" height="40" rx="4" fill="#065f46"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="10.5" font-family="monospace">Step 3: Check P5: Need[4,3,1] ≤ Avail[7,4,3] ⇒ SATISFIED!</text>
      <text x="360" y="25" fill="#fff" font-size="10" font-weight="bold">New Avail = [7, 4, 5]</text>
    </g>

    <g transform="translate(20, 264)">
      <rect width="500" height="40" rx="4" fill="#065f46"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="10.5" font-family="monospace">Step 4: Check P1: Need[7,4,3] ≤ Avail[7,4,5] ⇒ SATISFIED!</text>
      <text x="360" y="25" fill="#fff" font-size="10" font-weight="bold">New Avail = [7, 5, 5]</text>
    </g>

    <g transform="translate(20, 312)">
      <rect width="500" height="40" rx="4" fill="#065f46"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="10.5" font-family="monospace">Step 5: Check P3: Need[6,0,0] ≤ Avail[7,5,5] ⇒ SATISFIED!</text>
      <text x="360" y="25" fill="#fff" font-size="10" font-weight="bold">New Avail = [10, 5, 7]</text>
    </g>

    <rect x="20" y="360" width="500" height="35" rx="6" fill="#1e3a8a" stroke="#38bdf8"/>
    <text x="270" y="383" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">SAFE SEQUENCE: &lt; P2, P4, P5, P1, P3 &gt;  (System is SAFE!)</text>
  </g>
</svg>