<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg3)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Thread Architecture &amp; Multithreading Models</text>

  <!-- Left: Single vs Multithreaded Process -->
  <g transform="translate(40, 75)">
    <rect width="480" height="410" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="240" y="30" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Single vs Multithreaded Process</text>

    <!-- Single Threaded -->
    <rect x="25" y="55" width="200" height="330" rx="8" fill="#0f172a" stroke="#38bdf8"/>
    <text x="125" y="80" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">Single-Threaded</text>
    <rect x="40" y="95" width="170" height="40" rx="4" fill="#1e3a8a"/>
    <text x="125" y="120" fill="#fff" font-size="11" text-anchor="middle">Shared: Code &amp; Data</text>
    <rect x="40" y="145" width="170" height="35" rx="4" fill="#1e3a8a"/>
    <text x="125" y="167" fill="#fff" font-size="11" text-anchor="middle">Shared: Open Files</text>
    <rect x="40" y="190" width="170" height="40" rx="4" fill="#047857"/>
    <text x="125" y="215" fill="#fff" font-size="11" text-anchor="middle">Registers</text>
    <rect x="40" y="240" width="170" height="40" rx="4" fill="#047857"/>
    <text x="125" y="265" fill="#fff" font-size="11" text-anchor="middle">Stack</text>
    <rect x="40" y="295" width="170" height="70" rx="4" fill="#334155"/>
    <path d="M 125 310 Q 140 330 125 345 T 125 360" fill="none" stroke="#4ade80" stroke-width="3"/>
    <text x="125" y="358" fill="#4ade80" font-size="9" text-anchor="middle">Single Execution Flow</text>

    <!-- Multithreaded -->
    <rect x="255" y="55" width="200" height="330" rx="8" fill="#0f172a" stroke="#4ade80"/>
    <text x="355" y="80" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">Multi-Threaded</text>
    <rect x="270" y="95" width="170" height="40" rx="4" fill="#1e3a8a"/>
    <text x="355" y="120" fill="#fff" font-size="11" text-anchor="middle">Shared: Code &amp; Data</text>
    <rect x="270" y="145" width="170" height="35" rx="4" fill="#1e3a8a"/>
    <text x="355" y="167" fill="#fff" font-size="11" text-anchor="middle">Shared: Open Files</text>
    
    <!-- 3 threads registers/stacks -->
    <g transform="translate(268, 190)">
      <rect width="52" height="75" rx="3" fill="#065f46"/>
      <text x="26" y="20" fill="#a7f3d0" font-size="8" text-anchor="middle">Regs</text>
      <text x="26" y="40" fill="#a7f3d0" font-size="8" text-anchor="middle">Stack</text>
      <path d="M 26 48 Q 32 58 26 68" fill="none" stroke="#4ade80" stroke-width="2"/>
    </g>
    <g transform="translate(328, 190)">
      <rect width="52" height="75" rx="3" fill="#065f46"/>
      <text x="26" y="20" fill="#a7f3d0" font-size="8" text-anchor="middle">Regs</text>
      <text x="26" y="40" fill="#a7f3d0" font-size="8" text-anchor="middle">Stack</text>
      <path d="M 26 48 Q 32 58 26 68" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <g transform="translate(388, 190)">
      <rect width="52" height="75" rx="3" fill="#065f46"/>
      <text x="26" y="20" fill="#a7f3d0" font-size="8" text-anchor="middle">Regs</text>
      <text x="26" y="40" fill="#a7f3d0" font-size="8" text-anchor="middle">Stack</text>
      <path d="M 26 48 Q 32 58 26 68" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </g>
    <text x="355" y="320" fill="#f8fafc" font-size="10.5" text-anchor="middle">Each Thread has its own:</text>
    <text x="355" y="340" fill="#4ade80" font-size="10" text-anchor="middle">Thread ID, PC, Regs, Stack</text>
  </g>

  <!-- Right: Multithreading Models -->
  <g transform="translate(560, 75)">
    <rect width="500" height="410" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="250" y="30" fill="#f8fafc" font-size="15" font-weight="bold" text-anchor="middle">Multithreading Models (ULT vs KLT)</text>

    <!-- Many-to-One -->
    <rect x="25" y="55" width="450" height="100" rx="6" fill="#0f172a" stroke="#f87171"/>
    <text x="40" y="80" fill="#f87171" font-size="13" font-weight="bold">1. Many-to-One Model (M : 1)</text>
    <text x="40" y="105" fill="#cbd5e1" font-size="10.5">• Multiple User Threads mapped to 1 Kernel Thread.</text>
    <text x="40" y="123" fill="#cbd5e1" font-size="10.5">• Managed in User Space (Green Threads) &rarr; Fast context switch.</text>
    <text x="40" y="141" fill="#f87171" font-size="10.5">• Drawback: Ek thread block hua to poora process block! No multicore speedup.</text>

    <!-- One-to-One -->
    <rect x="25" y="165" width="450" height="110" rx="6" fill="#0f172a" stroke="#4ade80"/>
    <text x="40" y="190" fill="#4ade80" font-size="13" font-weight="bold">2. One-to-One Model (1 : 1) [Modern Standard: Linux, Windows]</text>
    <text x="40" y="215" fill="#cbd5e1" font-size="10.5">• Har User Thread ke corresponding 1 Kernel Thread hota hai.</text>
    <text x="40" y="233" fill="#cbd5e1" font-size="10.5">• True Concurrency &amp; Multicore Parallelism: Ek block ho to doosra chalta hai.</text>
    <text x="40" y="251" fill="#fbbf24" font-size="10.5">• Drawback: Kernel thread creation overhead (OS limits max threads).</text>

    <!-- Many-to-Many -->
    <rect x="25" y="285" width="450" height="110" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="40" y="310" fill="#38bdf8" font-size="13" font-weight="bold">3. Many-to-Many Model (M : N)</text>
    <text x="40" y="335" fill="#cbd5e1" font-size="10.5">• M User Threads multiplexed over N Kernel Threads (M &ge; N).</text>
    <text x="40" y="353" fill="#cbd5e1" font-size="10.5">• Best of both worlds: Flexible user threads without kernel thread explosion.</text>
    <text x="40" y="371" fill="#4ade80" font-size="10.5">• Used in Solaris (Two-Level Model) and Go Goroutines runtime scheduler.</text>
  </g>
</svg>