<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg5)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">FCFS Scheduling &amp; The Convoy Effect Demonstration</text>

  <!-- Case 1: Long job first (Convoy Effect) -->
  <g transform="translate(50, 75)">
    <rect width="1000" height="190" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="30" y="30" fill="#f87171" font-size="15" font-weight="bold">Case 1: Huge CPU-Bound Job Arrives First (P1 BT=24, P2 BT=3, P3 BT=3)</text>
    
    <!-- Gantt Chart 1 -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="600" height="50" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="300" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P1 (Burst = 24)</text>
      
      <rect x="600" y="0" width="150" height="50" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="675" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P2 (BT=3)</text>

      <rect x="750" y="0" width="150" height="50" fill="#047857" stroke="#10b981"/>
      <text x="825" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P3 (BT=3)</text>

      <!-- Timestamps -->
      <text x="0" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">0</text>
      <text x="600" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">24</text>
      <text x="750" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">27</text>
      <text x="900" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">30</text>
    </g>

    <!-- Metrics Case 1 -->
    <text x="30" y="145" fill="#fecaca" font-size="12.5" font-family="monospace">Waiting Times: P1 = 0 ms | P2 = 24 ms | P3 = 27 ms</text>
    <text x="30" y="170" fill="#f87171" font-size="13" font-weight="bold">Average Waiting Time = (0 + 24 + 27) / 3 = 17.0 ms  [HIGH CONVOY OVERHEAD]</text>
  </g>

  <!-- Case 2: Short jobs first (Optimal Order) -->
  <g transform="translate(50, 290)">
    <rect width="1000" height="195" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="30" y="30" fill="#4ade80" font-size="15" font-weight="bold">Case 2: Short Jobs Executed First (P2 BT=3, P3 BT=3, P1 BT=24)</text>
    
    <!-- Gantt Chart 2 -->
    <g transform="translate(30, 50)">
      <rect x="0" y="0" width="150" height="50" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="75" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P2 (BT=3)</text>

      <rect x="150" y="0" width="150" height="50" fill="#047857" stroke="#10b981"/>
      <text x="225" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P3 (BT=3)</text>

      <rect x="300" y="0" width="600" height="50" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="600" y="30" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P1 (Burst = 24)</text>

      <!-- Timestamps -->
      <text x="0" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">0</text>
      <text x="150" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">3</text>
      <text x="300" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">6</text>
      <text x="900" y="70" fill="#cbd5e1" font-size="12" font-family="monospace">30</text>
    </g>

    <!-- Metrics Case 2 -->
    <text x="30" y="145" fill="#a7f3d0" font-size="12.5" font-family="monospace">Waiting Times: P2 = 0 ms | P3 = 3 ms | P1 = 6 ms</text>
    <text x="30" y="170" fill="#4ade80" font-size="13" font-weight="bold">Average Waiting Time = (0 + 3 + 6) / 3 = 3.0 ms  [82.3% FASTER RESPONSE!]</text>
  </g>
</svg>