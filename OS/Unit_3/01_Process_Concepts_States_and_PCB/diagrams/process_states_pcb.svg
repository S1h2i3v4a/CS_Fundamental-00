<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="1100" height="560" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Process State Transition &amp; PCB Architecture</text>
  
  <!-- States -->
  <g transform="translate(50, 160)">
    <rect width="130" height="70" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="65" y="38" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">NEW</text>
    <text x="65" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Secondary Mem</text>
  </g>
  <g transform="translate(280, 160)">
    <rect width="140" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="38" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">READY</text>
    <text x="70" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Ready Queue (RAM)</text>
  </g>
  <g transform="translate(520, 160)">
    <rect width="140" height="70" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
    <text x="70" y="38" fill="#4ade80" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">RUNNING</text>
    <text x="70" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">CPU Assigned</text>
  </g>
  <g transform="translate(760, 160)">
    <rect width="140" height="70" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="70" y="38" fill="#f87171" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">TERMINATED</text>
    <text x="70" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Exit &amp; Deallocate</text>
  </g>
  <g transform="translate(400, 310)">
    <rect width="140" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="70" y="38" fill="#fbbf24" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">WAITING</text>
    <text x="70" y="56" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">I/O or Event Wait</text>
  </g>

  <!-- Connectors -->
  <path d="M 180 195 L 280 195" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle">Admitted (LTS)</text>

  <path d="M 420 185 L 520 185" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="470" y="175" fill="#4ade80" font-size="11" text-anchor="middle">Dispatch (STS)</text>

  <path d="M 520 205 L 420 205" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="225" fill="#f87171" font-size="11" text-anchor="middle">Interrupt / Quantum</text>

  <path d="M 660 195 L 760 195" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="710" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle">Exit (Syscall)</text>

  <path d="M 590 230 L 590 280 L 540 330" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="290" fill="#fbbf24" font-size="11">I/O Request</text>

  <path d="M 400 345 L 350 345 L 350 230" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="300" fill="#38bdf8" font-size="11" text-anchor="middle">I/O Complete</text>

  <!-- PCB Panel on Right -->
  <g transform="translate(930, 80)">
    <rect width="140" height="440" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="140" height="35" rx="8" fill="#0284c7"/>
    <text x="70" y="23" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PCB STRUCTURE</text>
    <text x="15" y="65" fill="#f8fafc" font-family="monospace" font-size="10.5">• Process ID (PID)</text>
    <text x="15" y="95" fill="#f8fafc" font-family="monospace" font-size="10.5">• Process State</text>
    <text x="15" y="125" fill="#f8fafc" font-family="monospace" font-size="10.5">• Program Counter</text>
    <text x="15" y="155" fill="#f8fafc" font-family="monospace" font-size="10.5">• CPU Registers</text>
    <text x="15" y="185" fill="#f8fafc" font-family="monospace" font-size="10.5">• Priority / Sched</text>
    <text x="15" y="215" fill="#f8fafc" font-family="monospace" font-size="10.5">• Memory Limits</text>
    <text x="15" y="245" fill="#f8fafc" font-family="monospace" font-size="10.5">• Open File Tables</text>
    <text x="15" y="275" fill="#f8fafc" font-family="monospace" font-size="10.5">• I/O Device Info</text>
    <text x="15" y="305" fill="#f8fafc" font-family="monospace" font-size="10.5">• Accounting Info</text>
    <line x1="10" y1="330" x2="130" y2="330" stroke="#475569" stroke-width="1"/>
    <text x="70" y="360" fill="#38bdf8" font-family="sans-serif" font-size="10" text-anchor="middle">Kernel Structure</text>
    <text x="70" y="385" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Kernel Space</text>
    <text x="70" y="410" fill="#4ade80" font-family="sans-serif" font-size="10" text-anchor="middle">task_struct (Linux)</text>
  </g>

  <!-- Suspended States at Bottom -->
  <g transform="translate(180, 440)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#818cf8" stroke-dasharray="4" stroke-width="1.5"/>
    <text x="85" y="26" fill="#818cf8" font-size="12" font-weight="bold" text-anchor="middle">SUSPEND-READY</text>
    <text x="85" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Swapped to Disk (MTS)</text>
  </g>
  <g transform="translate(480, 440)">
    <rect width="170" height="50" rx="8" fill="#1e293b" stroke="#e879f9" stroke-dasharray="4" stroke-width="1.5"/>
    <text x="85" y="26" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="middle">SUSPEND-BLOCKED</text>
    <text x="85" y="42" fill="#94a3b8" font-size="10" text-anchor="middle">Waiting + Swapped Out</text>
  </g>
  <path d="M 350 230 L 265 440" fill="none" stroke="#818cf8" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 470 380 L 530 440" fill="none" stroke="#e879f9" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 480 465 L 350 465" fill="none" stroke="#38bdf8" stroke-dasharray="4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="460" fill="#38bdf8" font-size="9" text-anchor="middle">Event Complete</text>
</svg>