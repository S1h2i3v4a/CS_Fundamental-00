<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg16)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Unit 3 Comprehensive Mindmap: CPU Scheduling &amp; Deadlocks</text>

  <!-- Left: CPU Scheduling Hub -->
  <g transform="translate(40, 75)">
    <rect width="490" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="245" y="30" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">CPU Scheduling Domain</text>

    <g transform="translate(20, 50)">
      <rect width="450" height="60" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Core Metrics &amp; Formulas</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">TAT = CT - AT | WT = TAT - BT | RT = First - AT | η = Useful/Total</text>
    </g>

    <g transform="translate(20, 120)">
      <rect width="450" height="75" rx="6" fill="#0f172a" stroke="#4ade80"/>
      <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="bold">Non-Preemptive Algorithms</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• FCFS: FIFO queue, Convoy effect on long CPU bursts.</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="10.5">• SJF: Optimal Avg WT, Starvation of long jobs, Exponential smoothing.</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="450" height="85" rx="6" fill="#0f172a" stroke="#fbbf24"/>
      <text x="15" y="25" fill="#fbbf24" font-size="12" font-weight="bold">Preemptive Algorithms</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• SRTF: Preempts on shorter remaining time arrival.</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="10.5">• Priority: Smaller integer = higher priority; Aging prevents starvation.</text>
      <text x="15" y="78" fill="#cbd5e1" font-size="10.5">• Round Robin: Time quantum 'q' (80% rule); Circular FIFO queue.</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="450" height="85" rx="6" fill="#0f172a" stroke="#a855f7"/>
      <text x="15" y="25" fill="#a855f7" font-size="12" font-weight="bold">Advanced Schedulers</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• MLQ: Static hierarchy of queues, fixed priority/time sliced.</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="10.5">• MLFQ: Dynamic priority feedback, Aging promotion.</text>
      <text x="15" y="78" fill="#cbd5e1" font-size="10.5">• Multiprocessor: SMP, Affinity (warm cache), Push/Pull migration.</text>
    </g>
  </g>

  <!-- Right: Deadlock Hub -->
  <g transform="translate(560, 75)">
    <rect width="500" height="410" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="250" y="30" fill="#f87171" font-size="16" font-weight="bold" text-anchor="middle">Deadlock Domain</text>

    <g transform="translate(25, 50)">
      <rect width="450" height="65" rx="6" fill="#0f172a" stroke="#ef4444"/>
      <text x="15" y="25" fill="#ef4444" font-size="12" font-weight="bold">4 Coffman Conditions (Simultaneous)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">1. Mutual Exclusion | 2. Hold &amp; Wait | 3. No Preemption | 4. Circular Wait</text>
    </g>

    <g transform="translate(25, 125)">
      <rect width="450" height="75" rx="6" fill="#0f172a" stroke="#fbbf24"/>
      <text x="15" y="25" fill="#fbbf24" font-size="12" font-weight="bold">Handling Strategy 1: Prevention</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• Invalidate at least one Coffman condition.</text>
      <text x="15" y="62" fill="#4ade80" font-size="10.5">• Havender's Resource Ordering Protocol F(Ri) &lt; F(Rj) eliminates cycle.</text>
    </g>

    <g transform="translate(25, 210)">
      <rect width="450" height="85" rx="6" fill="#0f172a" stroke="#4ade80"/>
      <text x="15" y="25" fill="#4ade80" font-size="12" font-weight="bold">Handling Strategy 2: Avoidance (Banker's)</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• State: Safe (Sequence exists) vs Unsafe (Deadlock possible).</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="10.5">• Banker's Matrices: Available, Max, Allocation, Need.</text>
      <text x="15" y="78" fill="#cbd5e1" font-size="10.5">• Need_i ≤ Work ⇒ Work = Work + Allocation_i.</text>
    </g>

    <g transform="translate(25, 305)">
      <rect width="450" height="80" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="25" fill="#38bdf8" font-size="12" font-weight="bold">Detection &amp; Recovery</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="10.5">• Wait-for Graph (WFG) cycle detection O(V^2).</text>
      <text x="15" y="62" fill="#cbd5e1" font-size="10.5">• Recovery: Abort processes / Resource preemption + Rollback.</text>
    </g>
  </g>
</svg>