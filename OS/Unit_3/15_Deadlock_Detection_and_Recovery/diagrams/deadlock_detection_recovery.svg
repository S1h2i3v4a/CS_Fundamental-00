<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="ar15" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg15)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Deadlock Detection (Wait-For Graph) &amp; Recovery Protocols</text>

  <!-- Left: Wait-for Graph -->
  <g transform="translate(40, 75)">
    <rect width="480" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="240" y="30" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">Wait-For Graph (WFG - Single Instance)</text>

    <!-- P1 -->
    <circle cx="120" cy="110" r="28" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="115" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P1</text>

    <!-- P2 -->
    <circle cx="360" cy="110" r="28" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="360" y="115" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P2</text>

    <!-- P3 -->
    <circle cx="360" cy="270" r="28" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="360" y="275" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P3</text>

    <!-- P4 -->
    <circle cx="120" cy="270" r="28" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="275" fill="#fff" font-size="14" font-weight="bold" text-anchor="middle">P4</text>

    <!-- Directed edges -->
    <path d="M 148 110 L 332 110" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar15)"/>
    <path d="M 360 138 L 360 242" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar15)"/>
    <path d="M 332 270 L 148 270" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar15)"/>
    <path d="M 120 242 L 120 138" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#ar15)"/>

    <rect x="25" y="325" width="430" height="65" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="348" fill="#f87171" font-size="11" font-weight="bold">Resource Nodes Collapsed!</text>
    <text x="35" y="365" fill="#cbd5e1" font-size="10.5">Pi → Pj edge indicates Pi is waiting for resource held by Pj.</text>
    <text x="35" y="380" fill="#a7f3d0" font-size="10.5">Cycle detection in WFG runs in O(V^2) via DFS/Tarjan.</text>
  </g>

  <!-- Right: Recovery Techniques -->
  <g transform="translate(560, 75)">
    <rect width="500" height="410" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="250" y="30" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">Deadlock Recovery Strategies</text>

    <!-- Process Termination -->
    <rect x="25" y="55" width="450" height="145" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="40" y="80" fill="#ef4444" font-size="13" font-weight="bold">1. Process Termination</text>
    <text x="40" y="105" fill="#cbd5e1" font-size="10.5">• Abort All Deadlocked Processes: Expensive, but guarantees recovery.</text>
    <text x="40" y="125" fill="#cbd5e1" font-size="10.5">• Abort One-by-One: Abort 1 process, rerun detection. Repeat until free.</text>
    <text x="40" y="145" fill="#fbbf24" font-size="10.5">• Victim Selection: Lowest CPU time spent, lowest resources held,</text>
    <text x="40" y="165" fill="#fbbf24" font-size="10.5">  lowest priority, batch vs interactive.</text>

    <!-- Resource Preemption -->
    <rect x="25" y="215" width="450" height="175" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="40" y="240" fill="#10b981" font-size="13" font-weight="bold">2. Resource Preemption (Gateway Slide 260 Trace)</text>
    <text x="40" y="265" fill="#cbd5e1" font-size="10.5">• Selecting a Victim: Minimize cost of preempted resources.</text>
    <text x="40" y="285" fill="#cbd5e1" font-size="10.5">• Rollback: Roll back victim process to previous safe checkpoint.</text>
    <text x="40" y="305" fill="#a7f3d0" font-size="10.5">  (Total rollback = abort and restart; Partial = checkpoint restart).</text>
    <text x="40" y="330" fill="#f87171" font-size="10.5" font-weight="bold">• Starvation Issue: Same process must NOT be picked as victim repeatedly!</text>
    <text x="40" y="350" fill="#4ade80" font-size="10.5">• Solution: Include number of rollbacks in victim selection cost function.</text>
  </g>
</svg>