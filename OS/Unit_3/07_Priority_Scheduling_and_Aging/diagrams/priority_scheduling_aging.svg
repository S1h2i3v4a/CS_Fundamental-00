<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="520" rx="14" fill="url(#bg7)" stroke="#334155" stroke-width="2"/>
  <text x="550" y="38" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Priority Scheduling &amp; Aging Mechanism (GATE-2017 Trace)</text>

  <!-- Left: GATE 2017 Preemptive Priority Gantt Chart -->
  <g transform="translate(40, 75)">
    <rect width="520" height="410" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="260" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">GATE-2017 Preemptive Priority (0 = Highest Priority)</text>

    <!-- Gantt Chart -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="25" height="45" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="12" y="28" fill="#fff" font-size="9" text-anchor="middle">P1</text>

      <rect x="25" y="0" width="35" height="45" fill="#047857" stroke="#10b981"/>
      <text x="42" y="28" fill="#fff" font-size="9" text-anchor="middle">P4</text>

      <rect x="60" y="0" width="200" height="45" fill="#7f1d1d" stroke="#ef4444"/>
      <text x="160" y="28" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">P2 (Pri=0, Burst=28)</text>

      <rect x="260" y="0" width="60" height="45" fill="#047857" stroke="#10b981"/>
      <text x="290" y="28" fill="#fff" font-size="9" text-anchor="middle">P4 (rem 7)</text>

      <rect x="320" y="0" width="70" height="45" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="355" y="28" fill="#fff" font-size="9" text-anchor="middle">P1 (rem 9)</text>

      <rect x="390" y="0" width="20" height="45" fill="#fbbf24" stroke="#d97706"/>
      <text x="400" y="28" fill="#000" font-size="9" text-anchor="middle">P3</text>

      <rect x="410" y="0" width="70" height="45" fill="#a855f7" stroke="#9333ea"/>
      <text x="445" y="28" fill="#fff" font-size="9" text-anchor="middle">P5</text>

      <!-- Timestamps -->
      <text x="0" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">0</text>
      <text x="25" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">2</text>
      <text x="60" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">5</text>
      <text x="260" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">33</text>
      <text x="320" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">40</text>
      <text x="390" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">49</text>
      <text x="410" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">51</text>
      <text x="480" y="65" fill="#cbd5e1" font-size="9" font-family="monospace">67</text>
    </g>

    <text x="20" y="155" fill="#f8fafc" font-size="12" font-weight="bold">Preemption Timeline Analysis:</text>
    <text x="20" y="180" fill="#cbd5e1" font-size="10.5">• At t=0: P1 (Pri=2) starts execution.</text>
    <text x="20" y="200" fill="#cbd5e1" font-size="10.5">• At t=2: P4 (Pri=1) arrives. 1 &lt; 2 &rarr; P1 PREEMPTED!</text>
    <text x="20" y="220" fill="#cbd5e1" font-size="10.5">• At t=5: P2 (Pri=0) arrives. 0 &lt; 1 &rarr; P4 PREEMPTED!</text>
    <text x="20" y="240" fill="#cbd5e1" font-size="10.5">• P2 has highest priority (0), executes continuously to 33.</text>
    
    <rect x="20" y="265" width="480" height="120" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="290" fill="#4ade80" font-size="11" font-family="monospace">Turnaround Times: P1=49, P2=28, P3=39, P4=38, P5=58</text>
    <text x="30" y="315" fill="#4ade80" font-size="11" font-family="monospace">Average Turnaround Time = 212 / 5 = 42.4 ms</text>
    <text x="30" y="340" fill="#38bdf8" font-size="11" font-family="monospace">Average Waiting Time = 145 / 5 = 29.0 ms</text>
    <text x="30" y="365" fill="#fbbf24" font-size="11" font-family="monospace">Response Times: P1=0, P4=0, P2=0, P3=37, P5=42 (Avg = 15.8)</text>
  </g>

  <!-- Right: Starvation & Aging Architecture -->
  <g transform="translate(580, 75)">
    <rect width="480" height="410" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
    <text x="240" y="30" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle">Indefinite Blocking (Starvation) &amp; Aging</text>

    <!-- Starvation Scenario -->
    <rect x="25" y="55" width="430" height="110" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="40" y="80" fill="#ef4444" font-size="13" font-weight="bold">Starvation (Indefinite Blocking)</text>
    <text x="40" y="105" fill="#cbd5e1" font-size="10.5">• Continuous stream of high priority processes keeps entering.</text>
    <text x="40" y="125" fill="#cbd5e1" font-size="10.5">• Low priority process stays in ready queue forever without CPU.</text>
    <text x="40" y="145" fill="#fca5a5" font-size="10.5">• Real Case: MIT IBM 7094 shutdown in 1973 found job waiting since 1967!</text>

    <!-- Aging Solution -->
    <rect x="25" y="180" width="430" height="195" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="40" y="205" fill="#10b981" font-size="13" font-weight="bold">Solution: Aging Technique</text>
    <text x="40" y="230" fill="#cbd5e1" font-size="10.5">• Gradually increases priority of waiting processes over time.</text>
    <text x="40" y="250" fill="#4ade80" font-size="10.5">• Example Rule: Increase priority by 1 every 15 minutes of wait.</text>
    
    <g transform="translate(40, 270)">
      <rect x="0" y="0" width="100" height="40" rx="4" fill="#334155"/>
      <text x="50" y="20" fill="#fff" font-size="10" text-anchor="middle">Time t=0</text>
      <text x="50" y="34" fill="#f87171" font-size="9" text-anchor="middle">Priority = 127</text>

      <text x="115" y="25" fill="#38bdf8" font-size="14">&rarr;</text>

      <rect x="135" y="0" width="100" height="40" rx="4" fill="#334155"/>
      <text x="185" y="20" fill="#fff" font-size="10" text-anchor="middle">Wait 1 hr</text>
      <text x="185" y="34" fill="#fbbf24" font-size="9" text-anchor="middle">Priority = 60</text>

      <text x="250" y="25" fill="#38bdf8" font-size="14">&rarr;</text>

      <rect x="270" y="0" width="110" height="40" rx="4" fill="#047857"/>
      <text x="325" y="20" fill="#fff" font-size="10" text-anchor="middle">Wait 2 hrs</text>
      <text x="325" y="34" fill="#4ade80" font-size="9" font-weight="bold" text-anchor="middle">Priority = 0 (TOP)</text>
    </g>

    <text x="40" y="345" fill="#38bdf8" font-size="10.5">Guarantees low priority process will eventually become highest priority!</text>
  </g>
</svg>