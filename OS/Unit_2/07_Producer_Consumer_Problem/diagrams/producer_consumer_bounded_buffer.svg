<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Producer-Consumer (Bounded Buffer) Problem</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Circular Ring Buffer &amp; Semaphore Coordination: empty, full, mutex</text>

  <!-- Left: Circular Buffer Illustration -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Shared Circular Buffer (Size N = 8)</text>

  <!-- Slots -->
  <rect x="60" y="130" width="38" height="45" rx="4" fill="#0369a1" stroke="#38bdf8"/>
  <text x="79" y="157" fill="#ffffff" font-weight="bold" text-anchor="middle">X0</text>
  <text x="79" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[0]</text>

  <rect x="105" y="130" width="38" height="45" rx="4" fill="#0369a1" stroke="#38bdf8"/>
  <text x="124" y="157" fill="#ffffff" font-weight="bold" text-anchor="middle">X1</text>
  <text x="124" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[1]</text>

  <rect x="150" y="130" width="38" height="45" rx="4" fill="#0369a1" stroke="#38bdf8"/>
  <text x="169" y="157" fill="#ffffff" font-weight="bold" text-anchor="middle">X2</text>
  <text x="169" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[2]</text>

  <rect x="195" y="130" width="38" height="45" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="214" y="157" fill="#94a3b8" text-anchor="middle">_</text>
  <text x="214" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[3]</text>

  <rect x="240" y="130" width="38" height="45" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="259" y="157" fill="#94a3b8" text-anchor="middle">_</text>
  <text x="259" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[4]</text>

  <rect x="285" y="130" width="38" height="45" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="304" y="157" fill="#94a3b8" text-anchor="middle">_</text>
  <text x="304" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[5]</text>

  <rect x="330" y="130" width="38" height="45" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="349" y="157" fill="#94a3b8" text-anchor="middle">_</text>
  <text x="349" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[6]</text>

  <rect x="365" y="130" width="35" height="45" rx="4" fill="#334155" stroke="#64748b"/>
  <text x="382" y="157" fill="#94a3b8" text-anchor="middle">_</text>
  <text x="382" y="190" fill="#94a3b8" font-size="10" text-anchor="middle">[7]</text>

  <text x="60" y="225" fill="#f59e0b" font-size="11" font-weight="bold">Pointers:</text>
  <text x="115" y="225" fill="#cbd5e1" font-size="11">in = 3 (Next free slot) | out = 0 (Next item to consume)</text>
  <text x="60" y="248" fill="#38bdf8" font-size="11" font-weight="bold">Variables:</text>
  <text x="125" y="248" fill="#cbd5e1" font-size="11">count = 3 (Total items currently resident)</text>
  <text x="60" y="270" fill="#ef4444" font-size="11" font-weight="bold">Hazard:</text>
  <text x="110" y="270" fill="#fca5a5" font-size="10.5">Simultaneous count++ &amp; count-- causes Race Condition!</text>
  <text x="60" y="292" fill="#4ade80" font-size="11" font-weight="bold">Semaphores:</text>
  <text x="145" y="292" fill="#d1fae5" font-size="10.5">empty = 5, full = 3, mutex = 1</text>

  <!-- Right: Producer & Consumer Code Box -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#047857"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Correct Semaphore Solutions</text>

  <text x="455" y="130" fill="#38bdf8" font-size="12" font-weight="bold">PRODUCER PROCESS:</text>
  <text x="455" y="148" fill="#e2e8f0" font-family="monospace" font-size="10.5">wait(empty); // Decrement empty slots</text>
  <text x="455" y="164" fill="#fcd34d" font-family="monospace" font-size="10.5">wait(mutex); // Acquire buffer lock</text>
  <text x="455" y="180" fill="#cbd5e1" font-family="monospace" font-size="10.5">buffer[in] = item; in = (in + 1) % N;</text>
  <text x="455" y="196" fill="#fcd34d" font-family="monospace" font-size="10.5">signal(mutex); // Release buffer lock</text>
  <text x="455" y="212" fill="#4ade80" font-family="monospace" font-size="10.5">signal(full);  // Increment full items</text>

  <text x="455" y="235" fill="#f59e0b" font-size="12" font-weight="bold">CONSUMER PROCESS:</text>
  <text x="455" y="253" fill="#e2e8f0" font-family="monospace" font-size="10.5">wait(full);  // Decrement full items</text>
  <text x="455" y="269" fill="#fcd34d" font-family="monospace" font-size="10.5">wait(mutex); // Acquire buffer lock</text>
  <text x="455" y="285" fill="#cbd5e1" font-family="monospace" font-size="10.5">item = buffer[out]; out = (out + 1) % N;</text>
  <text x="455" y="301" fill="#fcd34d" font-family="monospace" font-size="10.5">signal(mutex); // Release buffer lock</text>
  <text x="455" y="315" fill="#38bdf8" font-family="monospace" font-size="10.5">signal(empty); // Increment empty slots</text>

  <!-- Bottom: The Famous Deadlock Trap -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="425" y="354" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">⚠️ THE FAMOUS DEADLOCK TRAP (Exam &amp; Interview Favorite)</text>

  <rect x="60" y="365" width="345" height="95" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="75" y="385" fill="#fca5a5" font-size="11" font-weight="bold">Wrong Order: wait(mutex) before wait(empty)</text>
  <text x="75" y="403" fill="#cbd5e1" font-size="10.5">Agar buffer full hai (empty = 0):</text>
  <text x="75" y="419" fill="#cbd5e1" font-size="10.5">1. Producer wait(mutex) karke lock le leta hai (mutex=0).</text>
  <text x="75" y="435" fill="#cbd5e1" font-size="10.5">2. Producer wait(empty) par BLOCK ho jata hai!</text>
  <text x="75" y="450" fill="#fca5a5" font-size="10.5">3. Consumer wait(mutex) par block hota hai $ightarrow$ DEADLOCK!</text>

  <rect x="425" y="365" width="365" height="95" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="440" y="385" fill="#4ade80" font-size="11" font-weight="bold">Golden Rule: Signaling vs Locking Order</text>
  <text x="440" y="403" fill="#cbd5e1" font-size="10.5">Resource availability check (empty/full) HAMESHA</text>
  <text x="440" y="419" fill="#cbd5e1" font-size="10.5">mutual exclusion lock (mutex) se PEHLE aana chahiye!</text>
  <text x="440" y="440" fill="#38bdf8" font-size="11" font-weight="bold">CORRECT: wait(empty) $ightarrow$ wait(mutex)</text>
</svg>
