<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Semaphores &amp; Mutexes Architecture</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Counting vs Binary Semaphores &amp; Block-Wakeup Queue Implementation</text>

  <!-- Left: Semaphore Types Box -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Semaphore Types &amp; Definitions</text>

  <rect x="55" y="125" width="340" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="65" y="145" fill="#38bdf8" font-size="12" font-weight="bold">1. Binary Semaphore (Value: 0 or 1)</text>
  <text x="65" y="165" fill="#cbd5e1" font-size="11">• Used for Mutual Exclusion (Locking).</text>
  <text x="65" y="183" fill="#cbd5e1" font-size="11">• Similar to Mutex, but lacks thread ownership.</text>
  <text x="65" y="200" fill="#4ade80" font-size="10.5">Initial value = 1 (Unlocked)</text>

  <rect x="55" y="220" width="340" height="85" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="65" y="240" fill="#f59e0b" font-size="12" font-weight="bold">2. Counting Semaphore (Value: 0 to N)</text>
  <text x="65" y="260" fill="#cbd5e1" font-size="11">• Used for resource management (Pool of N units).</text>
  <text x="65" y="278" fill="#cbd5e1" font-size="11">• E.g., Database connection pool, 5 printers.</text>
  <text x="65" y="295" fill="#4ade80" font-size="10.5">Initial value = N (Available resource count)</text>

  <!-- Right: Block & Wakeup Implementation (Avoiding Busy Waiting) -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#047857"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Block &amp; Wakeup (No Busy Waiting)</text>

  <text x="455" y="130" fill="#e2e8f0" font-family="monospace" font-size="10.5">typedef struct {</text>
  <text x="470" y="146" fill="#e2e8f0" font-family="monospace" font-size="10.5">int value;</text>
  <text x="470" y="162" fill="#e2e8f0" font-family="monospace" font-size="10.5">struct process *list; // Waiting PCB queue</text>
  <text x="455" y="178" fill="#e2e8f0" font-family="monospace" font-size="10.5">} semaphore;</text>

  <rect x="455" y="190" width="340" height="115" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="465" y="208" fill="#38bdf8" font-family="monospace" font-size="10.5">wait(S) { S.value--;</text>
  <text x="480" y="224" fill="#fca5a5" font-family="monospace" font-size="10.5">if (S.value &lt; 0) { add to S.list; block(); } }</text>
  <text x="465" y="248" fill="#4ade80" font-family="monospace" font-size="10.5">signal(S) { S.value++;</text>
  <text x="480" y="264" fill="#4ade80" font-family="monospace" font-size="10.5">if (S.value &lt;= 0) { wakeup(P from list); } }</text>
  <text x="465" y="290" fill="#fcd34d" font-size="10" font-weight="bold">|S.value| when negative = Count of waiting processes!</text>

  <!-- Bottom: Mutex vs Semaphore Comparison Table -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="425" y="354" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle">Mutex vs Binary Semaphore: Crucial Technical Differences</text>

  <!-- Headers -->
  <rect x="60" y="365" width="220" height="24" fill="#334155"/>
  <rect x="280" y="365" width="250" height="24" fill="#334155"/>
  <rect x="530" y="365" width="260" height="24" fill="#334155"/>
  <text x="170" y="381" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Feature</text>
  <text x="405" y="381" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Mutex (Mutual Exclusion Lock)</text>
  <text x="660" y="381" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">Binary Semaphore</text>

  <!-- Row 1 -->
  <text x="70" y="405" fill="#e2e8f0" font-size="11" font-weight="bold">Ownership</text>
  <text x="290" y="405" fill="#cbd5e1" font-size="10.5">Has ownership: Jo lock karega, wahi unlock karega.</text>
  <text x="540" y="405" fill="#cbd5e1" font-size="10.5">No ownership: Koi bhi process signal() kar sakta hai.</text>

  <!-- Row 2 -->
  <text x="70" y="428" fill="#e2e8f0" font-size="11" font-weight="bold">Purpose</text>
  <text x="290" y="428" fill="#cbd5e1" font-size="10.5">Strictly Locking mechanism (Critical Section).</text>
  <text x="540" y="428" fill="#cbd5e1" font-size="10.5">Signaling mechanism (Coordination &amp; Order).</text>

  <!-- Row 3 -->
  <text x="70" y="452" fill="#e2e8f0" font-size="11" font-weight="bold">Priority Inversion</text>
  <text x="290" y="452" fill="#4ade80" font-size="10.5">Supports Priority Inheritance Protocol.</text>
  <text x="540" y="452" fill="#fca5a5" font-size="10.5">Does not support Priority Inheritance.</text>
</svg>
