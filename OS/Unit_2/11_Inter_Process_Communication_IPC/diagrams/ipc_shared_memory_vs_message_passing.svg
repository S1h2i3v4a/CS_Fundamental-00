<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Inter-Process Communication (IPC) Models &amp; Schemes</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Shared Memory vs Message Passing &amp; Synchronization Primitives</text>

  <!-- Left: Shared Memory Model -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. Shared Memory Model (Fastest)</text>

  <rect x="55" y="125" width="95" height="45" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="102" y="152" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Process P1</text>

  <rect x="295" y="125" width="95" height="45" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="342" y="152" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Process P2</text>

  <!-- Shared Memory in Middle -->
  <rect x="135" y="185" width="180" height="45" rx="6" fill="#0369a1" stroke="#fcd34d" stroke-width="2"/>
  <text x="225" y="212" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Shared Memory Region</text>

  <line x1="102" y1="170" x2="160" y2="185" stroke="#fcd34d" stroke-width="2"/>
  <line x1="342" y1="170" x2="290" y2="185" stroke="#fcd34d" stroke-width="2"/>

  <text x="55" y="255" fill="#4ade80" font-size="11" font-weight="bold">Advantages:</text>
  <text x="135" y="255" fill="#cbd5e1" font-size="10.5">Maximum speed (Zero OS kernel copies!).</text>
  <text x="55" y="275" fill="#ef4444" font-size="11" font-weight="bold">Disadvantage:</text>
  <text x="145" y="275" fill="#cbd5e1" font-size="10.5">Programmer must handle synchronization.</text>
  <text x="55" y="295" fill="#94a3b8" font-size="10">Best for: Same machine high-throughput data exchange.</text>

  <!-- Right: Message Passing Model -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#d97706"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. Message Passing Model (Distributed)</text>

  <rect x="455" y="125" width="95" height="45" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="502" y="152" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Process P1</text>

  <rect x="695" y="125" width="95" height="45" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="742" y="152" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Process P2</text>

  <!-- Kernel Queue in Middle -->
  <rect x="525" y="185" width="200" height="45" rx="6" fill="#b45309" stroke="#fed7aa" stroke-width="2"/>
  <text x="625" y="205" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">OS Kernel Message Queue</text>
  <text x="625" y="222" fill="#fef3c7" font-size="9.5" text-anchor="middle">send(P2, msg) | receive(P1, msg)</text>

  <line x1="502" y1="170" x2="550" y2="185" stroke="#fed7aa" stroke-width="2"/>
  <line x1="742" y1="170" x2="700" y2="185" stroke="#fed7aa" stroke-width="2"/>

  <text x="455" y="255" fill="#4ade80" font-size="11" font-weight="bold">Advantages:</text>
  <text x="535" y="255" fill="#cbd5e1" font-size="10.5">Works across networks &amp; distributed nodes.</text>
  <text x="455" y="275" fill="#ef4444" font-size="11" font-weight="bold">Disadvantage:</text>
  <text x="545" y="275" fill="#cbd5e1" font-size="10.5">Kernel context switch &amp; copy overhead.</text>
  <text x="455" y="295" fill="#94a3b8" font-size="10">Best for: Client-Server &amp; Distributed systems.</text>

  <!-- Bottom: IPC Schemes & Primitives -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="425" y="354" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">IPC Schemes: Direct vs Indirect &amp; Synchronization Blocking</text>

  <rect x="60" y="365" width="230" height="95" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="70" y="385" fill="#38bdf8" font-size="11" font-weight="bold">Direct vs Indirect</text>
  <text x="70" y="403" fill="#cbd5e1" font-size="10">• Direct: send(P, msg)</text>
  <text x="70" y="418" fill="#cbd5e1" font-size="10">Explicit process naming.</text>
  <text x="70" y="433" fill="#cbd5e1" font-size="10">• Indirect: send(Mailbox_A)</text>
  <text x="70" y="448" fill="#cbd5e1" font-size="10">Shared port/mailbox decoupling.</text>

  <rect x="310" y="365" width="230" height="95" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="320" y="385" fill="#f59e0b" font-size="11" font-weight="bold">Sync: Blocking vs Non-Blocking</text>
  <text x="320" y="403" fill="#cbd5e1" font-size="10">• Blocking Send: Sender waits</text>
  <text x="320" y="418" fill="#cbd5e1" font-size="10">until message is received.</text>
  <text x="320" y="433" fill="#cbd5e1" font-size="10">• Non-blocking Send: Sender</text>
  <text x="320" y="448" fill="#cbd5e1" font-size="10">sends &amp; resumes immediately.</text>

  <rect x="560" y="365" width="230" height="95" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="570" y="385" fill="#10b981" font-size="11" font-weight="bold">Buffering Capacities</text>
  <text x="570" y="403" fill="#cbd5e1" font-size="10">• Zero Capacity: Queue length 0</text>
  <text x="570" y="418" fill="#cbd5e1" font-size="10">(Sender blocks - Rendezvous!).</text>
  <text x="570" y="433" fill="#cbd5e1" font-size="10">• Bounded: Queue size N.</text>
  <text x="570" y="448" fill="#cbd5e1" font-size="10">• Unbounded: Infinite queue.</text>
</svg>
