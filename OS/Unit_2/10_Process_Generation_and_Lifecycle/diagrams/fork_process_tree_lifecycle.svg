<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Process Generation: fork(), exec() &amp; Lifecycle</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">PID Return Values, Process Trees &amp; Zombie vs Orphan States</text>

  <!-- Left: fork() Bifurcation Box -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">The fork() System Call Bifurcation</text>

  <rect x="135" y="125" width="180" height="40" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="225" y="149" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Parent Process (PID: 100)</text>

  <!-- Split arrows -->
  <line x1="180" y1="165" x2="110" y2="195" stroke="#38bdf8" stroke-width="2"/>
  <line x1="270" y1="165" x2="340" y2="195" stroke="#10b981" stroke-width="2"/>

  <!-- Parent return -->
  <rect x="55" y="195" width="150" height="70" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="130" y="215" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">In Parent Process:</text>
  <text x="130" y="235" fill="#fcd34d" font-family="monospace" font-size="11" text-anchor="middle">fork() &gt; 0</text>
  <text x="130" y="253" fill="#cbd5e1" font-size="10" text-anchor="middle">Returns Child PID (101)</text>

  <!-- Child return -->
  <rect x="245" y="195" width="150" height="70" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="320" y="215" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">In Child Process:</text>
  <text x="320" y="235" fill="#4ade80" font-family="monospace" font-size="11" text-anchor="middle">fork() == 0</text>
  <text x="320" y="253" fill="#cbd5e1" font-size="10" text-anchor="middle">Cloned exact address space</text>

  <text x="55" y="295" fill="#f43f5e" font-size="10.5" font-weight="bold">If fork() == -1:</text>
  <text x="145" y="295" fill="#cbd5e1" font-size="10.5">Process creation failed (No RAM / PID limit).</text>

  <!-- Right: Process Formula Tree Box -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#d97706"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">The fork() Mathematical Tree (2^n)</text>

  <rect x="455" y="125" width="340" height="50" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="625" y="145" fill="#fcd34d" font-size="12" font-weight="bold" text-anchor="middle">Total Processes = 2^n</text>
  <text x="625" y="163" fill="#cbd5e1" font-size="11" text-anchor="middle">Child Processes Created = 2^n - 1</text>

  <!-- Tree visualization -->
  <text x="465" y="195" fill="#cbd5e1" font-size="11">Example: 3 consecutive fork() calls in C:</text>
  <text x="465" y="215" fill="#38bdf8" font-family="monospace" font-size="10.5">fork(); fork(); fork();</text>
  <text x="465" y="235" fill="#cbd5e1" font-size="11">• n = 3 invocations</text>
  <text x="465" y="255" fill="#4ade80" font-size="11" font-weight="bold">• Total processes running = 2^3 = 8</text>
  <text x="465" y="275" fill="#fbbf24" font-size="11" font-weight="bold">• New child processes created = 8 - 1 = 7</text>
  <text x="465" y="295" fill="#94a3b8" font-size="10">If followed by printf("Hello"); $ightarrow$ Prints 8 times!</text>

  <!-- Bottom: Zombie vs Orphan Box -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="425" y="354" fill="#10b981" font-size="13" font-weight="bold" text-anchor="middle">Zombie Process vs Orphan Process (AKTU &amp; Interview Favorite)</text>

  <rect x="60" y="365" width="345" height="95" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="75" y="385" fill="#fca5a5" font-size="11.5" font-weight="bold">ZOMBIE PROCESS (&lt;defunct&gt;):</text>
  <text x="75" y="403" fill="#cbd5e1" font-size="10.5">• Child has finished execution (called exit()).</text>
  <text x="75" y="419" fill="#cbd5e1" font-size="10.5">• Parent has NOT yet called wait() to collect exit status.</text>
  <text x="75" y="435" fill="#fca5a5" font-size="10.5">• Child remains in Process Table, wasting a PID!</text>
  <text x="75" y="450" fill="#94a3b8" font-size="10">Kill parent or call wait() to reap zombie.</text>

  <rect x="425" y="365" width="365" height="95" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="440" y="385" fill="#38bdf8" font-size="11.5" font-weight="bold">ORPHAN PROCESS:</text>
  <text x="440" y="403" fill="#cbd5e1" font-size="10.5">• Parent terminates BEFORE child terminates.</text>
  <text x="440" y="419" fill="#cbd5e1" font-size="10.5">• Child keeps running without a parent.</text>
  <text x="440" y="435" fill="#4ade80" font-size="10.5">• Adopted immediately by init / systemd (PID 1)!</text>
  <text x="440" y="450" fill="#cbd5e1" font-size="10">PID 1 periodically reaps all orphans upon exit.</text>
</svg>
