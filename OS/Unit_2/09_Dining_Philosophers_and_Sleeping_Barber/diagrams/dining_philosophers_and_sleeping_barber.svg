<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Dining Philosophers &amp; Sleeping Barber Problems</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Deadlock Elimination, Resource Hierarchy &amp; Barber Shop Synchronization</text>

  <!-- Left: Dining Philosophers Box -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. Dining Philosophers Problem</text>

  <!-- Table representation -->
  <circle cx="225" cy="190" r="60" fill="#334155" stroke="#f59e0b" stroke-width="2"/>
  <text x="225" y="195" fill="#fcd34d" font-size="12" font-weight="bold" text-anchor="middle">Shared Rice</text>

  <!-- 5 Philosophers nodes around circle -->
  <circle cx="225" cy="115" r="14" fill="#0284c7"/><text x="225" y="119" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">P0</text>
  <circle cx="295" cy="160" r="14" fill="#0284c7"/><text x="295" y="164" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">P1</text>
  <circle cx="270" cy="240" r="14" fill="#0284c7"/><text x="270" y="244" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">P2</text>
  <circle cx="180" cy="240" r="14" fill="#0284c7"/><text x="180" y="244" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">P3</text>
  <circle cx="155" cy="160" r="14" fill="#0284c7"/><text x="155" y="164" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">P4</text>

  <text x="225" y="280" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">Deadlock: All pick Left Chopstick simultaneously!</text>
  <text x="225" y="300" fill="#4ade80" font-size="10.5" text-anchor="middle">Solution: Asymmetric order / Resource hierarchy</text>

  <!-- Right: Sleeping Barber Box -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#d97706"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. Sleeping Barber Problem</text>

  <rect x="455" y="125" width="160" height="75" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="535" y="145" fill="#fcd34d" font-size="11" font-weight="bold" text-anchor="middle">Barber Chair (1)</text>
  <text x="535" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle">If empty: Barber sleeps</text>
  <text x="535" y="182" fill="#4ade80" font-size="10" text-anchor="middle">Customer wakes barber</text>

  <rect x="630" y="125" width="165" height="75" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="712" y="145" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Waiting Chairs (N)</text>
  <text x="712" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle">If chairs free: Sit &amp; wait</text>
  <text x="712" y="182" fill="#ef4444" font-size="10" text-anchor="middle">If chairs full: Drop out!</text>

  <text x="455" y="225" fill="#ffffff" font-size="11" font-weight="bold">Barber Semaphores:</text>
  <text x="455" y="245" fill="#e2e8f0" font-family="monospace" font-size="10.5">• customers = 0; // Signals barber to cut hair</text>
  <text x="455" y="265" fill="#e2e8f0" font-family="monospace" font-size="10.5">• barbers = 0;   // Signals customer barber is ready</text>
  <text x="455" y="285" fill="#e2e8f0" font-family="monospace" font-size="10.5">• mutex = 1;     // Protects waiting count variable</text>
  <text x="455" y="303" fill="#cbd5e1" font-size="10">int waiting = 0;  // Count of customers in waiting room</text>

  <!-- Bottom: Deadlock Prevention Takeaways -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="425" y="354" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle">Synchronization Insights &amp; Deadlock Solutions</text>

  <rect x="60" y="368" width="345" height="92" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="75" y="388" fill="#38bdf8" font-size="11.5" font-weight="bold">Dining Philosophers Deadlock Solutions:</text>
  <text x="75" y="406" fill="#cbd5e1" font-size="10.5">1. Limit table capacity to at most 4 philosophers.</text>
  <text x="75" y="422" fill="#cbd5e1" font-size="10.5">2. Asymmetric pick: Odd philosophers pick left first;</text>
  <text x="75" y="438" fill="#cbd5e1" font-size="10.5">   even philosophers pick right first (Breaks circular wait!).</text>
  <text x="75" y="452" fill="#4ade80" font-size="10">3. Pick both chopsticks simultaneously in critical section.</text>

  <rect x="425" y="368" width="365" height="92" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="440" y="388" fill="#fbbf24" font-size="11.5" font-weight="bold">Sleeping Barber Synchronization Logic:</text>
  <text x="440" y="406" fill="#cbd5e1" font-size="10.5">1. Prevents race condition between customer entering</text>
  <text x="440" y="422" fill="#cbd5e1" font-size="10.5">   and barber going to sleep.</text>
  <text x="440" y="438" fill="#cbd5e1" font-size="10.5">2. Customer increments waiting count only if chairs &lt; N.</text>
  <text x="440" y="452" fill="#4ade80" font-size="10">3. Barber sleeps via wait(customers) until customer signals.</text>
</svg>
