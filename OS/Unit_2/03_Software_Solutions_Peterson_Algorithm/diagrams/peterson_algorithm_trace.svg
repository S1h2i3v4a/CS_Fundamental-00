<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Peterson's Algorithm: 2-Process Synchronization</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">State Trace: flag[0], flag[1] &amp; turn Variable Mechanics</text>

  <!-- Process P0 Code Box -->
  <rect x="40" y="80" width="365" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="365" height="30" rx="10" fill="#0284c7"/>
  <text x="222" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Process P0 (i = 0, other = 1)</text>

  <text x="55" y="132" fill="#e2e8f0" font-family="monospace" font-size="11">1. flag[0] = true;      // Main interested hoon</text>
  <text x="55" y="152" fill="#e2e8f0" font-family="monospace" font-size="11">2. turn = 1;            // Pehle aap bhai (P1)</text>
  <text x="55" y="172" fill="#fca5a5" font-family="monospace" font-size="11">3. while (flag[1] &amp;&amp; turn == 1); // Busy Wait</text>
  <text x="55" y="196" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="12">4. /* CRITICAL SECTION */</text>
  <text x="55" y="218" fill="#e2e8f0" font-family="monospace" font-size="11">5. flag[0] = false;     // Done, main bahar hoon</text>
  <text x="55" y="238" fill="#94a3b8" font-family="monospace" font-size="11">6. /* Remainder Section */</text>

  <rect x="55" y="255" width="335" height="48" rx="6" fill="#0f172a" stroke="#0284c7"/>
  <text x="65" y="273" fill="#38bdf8" font-size="10.5" font-weight="bold">Key Logic:</text>
  <text x="65" y="291" fill="#cbd5e1" font-size="10">P0 expresses interest, gives priority to P1. P0 enters</text>
  <text x="65" y="303" fill="#cbd5e1" font-size="10">if P1 is not interested OR turn gets updated to 0!</text>

  <!-- Process P1 Code Box -->
  <rect x="445" y="80" width="365" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="445" y="80" width="365" height="30" rx="10" fill="#d97706"/>
  <text x="627" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Process P1 (j = 1, other = 0)</text>

  <text x="460" y="132" fill="#e2e8f0" font-family="monospace" font-size="11">1. flag[1] = true;      // Main interested hoon</text>
  <text x="460" y="152" fill="#e2e8f0" font-family="monospace" font-size="11">2. turn = 0;            // Pehle aap bhai (P0)</text>
  <text x="460" y="172" fill="#fca5a5" font-family="monospace" font-size="11">3. while (flag[0] &amp;&amp; turn == 0); // Busy Wait</text>
  <text x="460" y="196" fill="#4ade80" font-family="monospace" font-weight="bold" font-size="12">4. /* CRITICAL SECTION */</text>
  <text x="460" y="218" fill="#e2e8f0" font-family="monospace" font-size="11">5. flag[1] = false;     // Done, main bahar hoon</text>
  <text x="460" y="238" fill="#94a3b8" font-family="monospace" font-size="11">6. /* Remainder Section */</text>

  <rect x="460" y="255" width="335" height="48" rx="6" fill="#0f172a" stroke="#d97706"/>
  <text x="470" y="273" fill="#fbbf24" font-size="10.5" font-weight="bold">Key Logic:</text>
  <text x="470" y="291" fill="#cbd5e1" font-size="10">P1 expresses interest, gives priority to P0. P1 enters</text>
  <text x="470" y="303" fill="#cbd5e1" font-size="10">if P0 is not interested OR turn gets updated to 1!</text>

  <!-- Bottom: Evaluation Box -->
  <rect x="40" y="330" width="770" height="140" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="425" y="355" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">Verification of Peterson's Solution against the 3 Criteria</text>

  <rect x="60" y="370" width="230" height="85" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="75" y="390" fill="#38bdf8" font-size="12" font-weight="bold">1. Mutual Exclusion: ✓ YES</text>
  <text x="75" y="410" fill="#cbd5e1" font-size="10.5">Dono ek saath enter nahi ho</text>
  <text x="75" y="425" fill="#cbd5e1" font-size="10.5">sakte kyunki turn ek hi integer</text>
  <text x="75" y="440" fill="#cbd5e1" font-size="10.5">hai (either 0 or 1, not both!).</text>

  <rect x="310" y="370" width="230" height="85" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="325" y="390" fill="#f59e0b" font-size="12" font-weight="bold">2. Progress: ✓ YES</text>
  <text x="325" y="410" fill="#cbd5e1" font-size="10.5">Agar P1 Remainder me hai toh</text>
  <text x="325" y="425" fill="#cbd5e1" font-size="10.5">flag[1]=false hoga, P0 bina</text>
  <text x="325" y="440" fill="#cbd5e1" font-size="10.5">kisi delay ke enter kar jayega.</text>

  <rect x="560" y="370" width="230" height="85" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="575" y="390" fill="#10b981" font-size="12" font-weight="bold">3. Bounded Waiting: ✓ YES</text>
  <text x="575" y="410" fill="#cbd5e1" font-size="10.5">Waiting bound k = 1. Ek process</text>
  <text x="575" y="425" fill="#cbd5e1" font-size="10.5">CS se nikalte hi doosre process</text>
  <text x="575" y="440" fill="#cbd5e1" font-size="10.5">ko mauka milta hai (No Starvation).</text>
</svg>
