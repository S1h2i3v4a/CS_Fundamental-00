<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Unit 2 Complete Concurrency Mindmap</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Syllabus Synthesis: Process Concurrency $	o$ Synchronization $	o$ IPC</text>

  <!-- Central Hub: Concurrency -->
  <circle cx="425" cy="245" r="55" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
  <text x="425" y="240" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CONCURRENT</text>
  <text x="425" y="258" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PROCESSES</text>

  <!-- Node 1: Critical Section & Criteria (Top Left) -->
  <rect x="50" y="90" width="230" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="165" y="112" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">1. Critical Section Problem</text>
  <text x="165" y="130" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• 4 Sections: Entry, CS, Exit, Remainder</text>
  <text x="165" y="148" fill="#4ade80" font-size="10" text-anchor="middle">• Criteria: Mutual Exclusion, Progress, Bounded Wait</text>

  <!-- Node 2: Software Solutions (Top Right) -->
  <rect x="570" y="90" width="230" height="75" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="685" y="112" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">2. Software Solutions</text>
  <text x="685" y="130" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Peterson's: flag[2], turn (1981)</text>
  <text x="685" y="148" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Dekker's: Back-off on turn (1965)</text>

  <!-- Node 3: Hardware Solutions & Semaphores (Middle Left) -->
  <rect x="50" y="210" width="230" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="165" y="232" fill="#10b981" font-size="12" font-weight="bold" text-anchor="middle">3. Hardware &amp; Semaphores</text>
  <text x="165" y="250" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Test-and-Set (TSL) &amp; Swap</text>
  <text x="165" y="266" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Counting vs Binary Semaphores</text>
  <text x="165" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle">• Block-Wakeup queue (No busy wait)</text>

  <!-- Node 4: Classical Problems (Middle Right) -->
  <rect x="570" y="210" width="230" height="80" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <text x="685" y="232" fill="#ec4899" font-size="12" font-weight="bold" text-anchor="middle">4. Classical Problems</text>
  <text x="685" y="250" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Producer-Consumer (empty, full, mutex)</text>
  <text x="685" y="266" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Readers-Writers (Reader priority, rc)</text>
  <text x="685" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle">• Dining Philosophers &amp; Sleeping Barber</text>

  <!-- Node 5: Process Lifecycle & Trees (Bottom Left) -->
  <rect x="50" y="340" width="230" height="75" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <text x="165" y="362" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle">5. Process Generation</text>
  <text x="165" y="380" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• fork(): 0 child, &gt;0 parent, -1 error</text>
  <text x="165" y="396" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• 2^n total processes formula</text>
  <text x="165" y="410" fill="#fca5a5" font-size="10" text-anchor="middle">• Zombie vs Orphan processes</text>

  <!-- Node 6: IPC Models (Bottom Right) -->
  <rect x="570" y="340" width="230" height="75" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="685" y="362" fill="#22d3ee" font-size="12" font-weight="bold" text-anchor="middle">6. IPC Models &amp; Schemes</text>
  <text x="685" y="380" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Shared Memory (Fastest, Local)</text>
  <text x="685" y="396" fill="#cbd5e1" font-size="10.5" text-anchor="middle">• Message Passing (Distributed, Syscall)</text>
  <text x="685" y="410" fill="#cbd5e1" font-size="10" text-anchor="middle">• Direct vs Indirect | Blocking vs Async</text>

