<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Readers-Writers Problem Architecture</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Concurrent Readers, Exclusive Writer &amp; Writer Starvation Mechanics</text>

  <!-- Left: Concurrency Permission Matrix -->
  <rect x="40" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="80" width="370" height="30" rx="10" fill="#0284c7"/>
  <text x="225" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Conflict &amp; Permission Matrix</text>

  <rect x="55" y="125" width="340" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="70" y="150" fill="#4ade80" font-size="12" font-weight="bold">Reader &amp; Reader: ✓ ALLOWED (Concurrent)</text>

  <rect x="55" y="175" width="340" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="70" y="200" fill="#fca5a5" font-size="12" font-weight="bold">Reader &amp; Writer: ✗ FORBIDDEN (Conflict)</text>

  <rect x="55" y="225" width="340" height="40" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="70" y="250" fill="#fca5a5" font-size="12" font-weight="bold">Writer &amp; Writer: ✗ FORBIDDEN (Conflict)</text>

  <text x="55" y="295" fill="#fcd34d" font-size="11" font-weight="bold">Key Insight:</text>
  <text x="125" y="295" fill="#cbd5e1" font-size="11">Only Writers require strict mutual exclusion!</text>

  <!-- Right: Reader & Writer Protocols Box -->
  <rect x="440" y="80" width="370" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="440" y="80" width="370" height="30" rx="10" fill="#d97706"/>
  <text x="625" y="101" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">The Semaphore Protocols</text>

  <text x="455" y="128" fill="#38bdf8" font-size="11.5" font-weight="bold">READER PROTOCOL (rc = reader count):</text>
  <text x="455" y="145" fill="#e2e8f0" font-family="monospace" font-size="10">wait(mutex); rc++;</text>
  <text x="455" y="160" fill="#fcd34d" font-family="monospace" font-size="10">if (rc == 1) wait(db); // 1st reader locks DB for all readers</text>
  <text x="455" y="175" fill="#e2e8f0" font-family="monospace" font-size="10">signal(mutex);</text>
  <text x="455" y="190" fill="#4ade80" font-family="monospace" font-size="10">/* READ DATABASE CONCURRENTLY */</text>
  <text x="455" y="205" fill="#e2e8f0" font-family="monospace" font-size="10">wait(mutex); rc--;</text>
  <text x="455" y="220" fill="#fcd34d" font-family="monospace" font-size="10">if (rc == 0) signal(db); // Last reader unlocks DB</text>
  <text x="455" y="235" fill="#e2e8f0" font-family="monospace" font-size="10">signal(mutex);</text>

  <text x="455" y="258" fill="#f43f5e" font-size="11.5" font-weight="bold">WRITER PROTOCOL:</text>
  <text x="455" y="275" fill="#fca5a5" font-family="monospace" font-size="10">wait(db); // Exclusively locks DB</text>
  <text x="455" y="290" fill="#fca5a5" font-family="monospace" font-size="10">/* WRITE DATABASE */</text>
  <text x="455" y="305" fill="#fca5a5" font-family="monospace" font-size="10">signal(db); // Releases DB</text>

  <!-- Bottom: Writer Starvation Box -->
  <rect x="40" y="330" width="770" height="145" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="425" y="354" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">⚠️ THE PROBLEM OF WRITER STARVATION (First Readers-Writers Problem)</text>

  <rect x="60" y="365" width="730" height="95" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="75" y="388" fill="#cbd5e1" font-size="11">Agar Readers continuously aate rahein (R1 enters, then R2 enters before R1 finishes, then R3 enters...),</text>
  <text x="75" y="406" fill="#fca5a5" font-size="11" font-weight="bold">toh reader count 'rc' KABHI BHI 0 NAHI HOGA!</text>
  <text x="75" y="424" fill="#cbd5e1" font-size="11">Nateeja: Database lock 'db' kabhi release nahi hoga, aur waiting Writer process hamesha ke liye starvation</text>
  <text x="75" y="442" fill="#38bdf8" font-size="11">mein phas jayega. Isse solve karne ke liye Fair / Writer-Priority Solution use kiya jata hai.</text>
</svg>
