<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0f172a" rx="14"/>
  <text x="425" y="34" fill="#38bdf8" font-size="20" font-family="'Segoe UI', sans-serif" font-weight="bold" text-anchor="middle">Critical Section Architecture &amp; The 4 Criteria</text>
  <text x="425" y="56" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif" text-anchor="middle">Mutual Exclusion, Progress, Bounded Waiting &amp; Architectural Neutrality</text>

  <!-- Left: The 4 Code Sections Structure -->
  <rect x="40" y="80" width="340" height="375" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="210" y="108" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle">4 Sections of Process Code</text>

  <!-- Entry Section -->
  <rect x="60" y="125" width="300" height="60" rx="8" fill="#0369a1" stroke="#38bdf8"/>
  <text x="210" y="150" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. ENTRY SECTION</text>
  <text x="210" y="170" fill="#e0f2fe" font-size="11" text-anchor="middle">Requests permission to enter CS (Sets lock/flags)</text>

  <!-- Down Arrow -->
  <line x1="210" y1="185" x2="210" y2="205" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Critical Section -->
  <rect x="60" y="205" width="300" height="70" rx="8" fill="#b91c1c" stroke="#ef4444" stroke-width="2"/>
  <text x="210" y="233" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">2. CRITICAL SECTION (CS)</text>
  <text x="210" y="253" fill="#fecaca" font-size="11" text-anchor="middle">Accesses shared variables, tables &amp; files</text>
  <text x="210" y="268" fill="#fca5a5" font-size="10" font-weight="bold" text-anchor="middle">⚠️ ONLY ONE PROCESS ALLOWED AT A TIME!</text>

  <!-- Down Arrow -->
  <line x1="210" y1="275" x2="210" y2="295" stroke="#f59e0b" stroke-width="3"/>

  <!-- Exit Section -->
  <rect x="60" y="295" width="300" height="60" rx="8" fill="#047857" stroke="#10b981"/>
  <text x="210" y="320" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. EXIT SECTION</text>
  <text x="210" y="340" fill="#d1fae5" font-size="11" text-anchor="middle">Releases lock, resets flags, wakes up waiters</text>

  <!-- Down Arrow -->
  <line x1="210" y1="355" x2="210" y2="375" stroke="#f59e0b" stroke-width="3"/>

  <!-- Remainder Section -->
  <rect x="60" y="375" width="300" height="60" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="210" y="400" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4. REMAINDER SECTION</text>
  <text x="210" y="420" fill="#cbd5e1" font-size="11" text-anchor="middle">Independent non-critical code execution</text>

  <!-- Right: The 4 Criteria Box -->
  <rect x="410" y="80" width="400" height="375" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="610" y="108" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">The 4 Mandatory Criteria</text>

  <!-- Criteria 1 -->
  <rect x="425" y="125" width="370" height="70" rx="6" fill="#0f172a" stroke="#ef4444"/>
  <text x="440" y="148" fill="#ef4444" font-size="13" font-weight="bold">1. Mutual Exclusion (Primary - Mandatory)</text>
  <text x="440" y="168" fill="#cbd5e1" font-size="11">Agar Process Pi apne CS mein hai, toh koi doosra</text>
  <text x="440" y="184" fill="#cbd5e1" font-size="11">process CS mein enter NAHI kar sakta. (Zero overlap)</text>

  <!-- Criteria 2 -->
  <rect x="425" y="205" width="370" height="70" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="440" y="228" fill="#f59e0b" font-size="13" font-weight="bold">2. Progress (Primary - Mandatory)</text>
  <text x="440" y="248" fill="#cbd5e1" font-size="11">CS khali ho, toh jo process Remainder mein hain woh</text>
  <text x="440" y="264" fill="#cbd5e1" font-size="11">entry block nahi karenge. Decision turant hona chahiye (No Deadlock).</text>

  <!-- Criteria 3 -->
  <rect x="425" y="285" width="370" height="70" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="440" y="308" fill="#38bdf8" font-size="13" font-weight="bold">3. Bounded Waiting (Secondary - Desirable)</text>
  <text x="440" y="328" fill="#cbd5e1" font-size="11">Ek process ke entry request karne ke baad doosre processes</text>
  <text x="440" y="344" fill="#cbd5e1" font-size="11">ke CS mein jaane ki limit honi chahiye (No Starvation).</text>

  <!-- Criteria 4 -->
  <rect x="425" y="365" width="370" height="70" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="440" y="388" fill="#10b981" font-size="13" font-weight="bold">4. Architectural Neutrality (Speed Independence)</text>
  <text x="440" y="408" fill="#cbd5e1" font-size="11">Hardware CPU speed, clock cycle ya number of CPUs par</text>
  <text x="440" y="424" fill="#cbd5e1" font-size="11">solution depend nahi karna chahiye. Universal solution ho.</text>
</svg>
