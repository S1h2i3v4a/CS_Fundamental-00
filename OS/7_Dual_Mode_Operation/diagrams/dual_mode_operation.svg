<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="35" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Fig 7.1: Dual-Mode Operation &amp; System Call Transition
  </text>
  <text x="425" y="55" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Reference: Image 7 (Bottom) &amp; Image 8 (Top) [User Mode ➔ Kernel Mode via printf]
  </text>

  <!-- User Mode Section -->
  <rect x="40" y="80" width="770" height="150" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="55" y="95" width="220" height="30" rx="6" fill="#0284c7" />
  <text x="165" y="115" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">USER MODE (Mode Bit = 1)</text>
  <text x="735" y="115" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="end">Restricted Privilege</text>

  <rect x="55" y="140" width="310" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="70" y="162" fill="#94a3b8" font-size="11">User Process executing application:</text>
  <text x="70" y="185" fill="#4ade80" font-size="14" font-family="monospace" font-weight="bold">printf("Hello");</text>
  <text x="70" y="202" fill="#cbd5e1" font-size="10">User cannot touch Display Hardware directly!</text>

  <rect x="420" y="140" width="370" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="435" y="162" fill="#facc15" font-size="11" font-weight="bold">User Mode Rules &amp; Restrictions:</text>
  <text x="435" y="180" fill="#cbd5e1" font-size="10">• Restricted access to Memory and I/O devices</text>
  <text x="435" y="196" fill="#cbd5e1" font-size="10">• Privileged CPU instructions are forbidden</text>

  <!-- Mid Transition Arrows -->
  <line x1="210" y1="230" x2="210" y2="295" stroke="#ef4444" stroke-width="3"/>
  <polygon points="210,295 204,283 216,283" fill="#ef4444"/>
  <rect x="130" y="247" width="160" height="26" rx="4" fill="#991b1b"/>
  <text x="210" y="264" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Trap / Syscall (Set Bit = 0)</text>

  <line x1="600" y1="295" x2="600" y2="230" stroke="#10b981" stroke-width="3"/>
  <polygon points="600,230 594,242 606,242" fill="#10b981"/>
  <rect x="520" y="247" width="160" height="26" rx="4" fill="#065f46"/>
  <text x="600" y="264" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Return from Syscall (Set Bit = 1)</text>

  <!-- Kernel Mode Section -->
  <rect x="40" y="295" width="770" height="155" rx="10" fill="#1e1e38" stroke="#ef4444" stroke-width="2"/>
  <rect x="55" y="310" width="235" height="30" rx="6" fill="#b91c1c" />
  <text x="172" y="330" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">KERNEL MODE (Mode Bit = 0)</text>
  <text x="735" y="330" fill="#f87171" font-size="12" font-weight="bold" text-anchor="end">Supervisor / Full Privilege</text>

  <rect x="55" y="355" width="310" height="80" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="70" y="377" fill="#f87171" font-size="11" font-weight="bold">Executing System Call in Kernel:</text>
  <text x="70" y="397" fill="#fca5a5" font-size="11">1. Invokes <code>sys_write()</code></text>
  <text x="70" y="413" fill="#fca5a5" font-size="11">2. Sends data to Video Buffer / Display</text>
  <text x="70" y="427" fill="#fca5a5" font-size="11">3. Writes "Hello" to Terminal Screen</text>

  <rect x="420" y="355" width="370" height="80" rx="6" fill="#0f172a" stroke="#475569"/>
  <text x="435" y="377" fill="#fbbf24" font-size="11" font-weight="bold">Kernel Mode Privileges:</text>
  <text x="435" y="395" fill="#cbd5e1" font-size="10">• Full control over hardware resources &amp; memory</text>
  <text x="435" y="411" fill="#cbd5e1" font-size="10">• Direct execution of privileged machine instructions</text>
  <text x="435" y="427" fill="#cbd5e1" font-size="10">• Manages hardware interrupts, I/O ports &amp; MMU</text>
</svg>