<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="auto">
  <rect width="100%" height="100%" fill="#0a0f1d" rx="16" />
  <text x="425" y="32" fill="#38bdf8" font-size="20" font-family="'Segoe UI', Roboto, sans-serif" font-weight="bold" text-anchor="middle">
    Processor Management &amp; CPU Scheduling Architecture
  </text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" font-family="'Segoe UI', Roboto, sans-serif" text-anchor="middle">
    Process Tracking, CPU Dispatching, Multiprogramming &amp; Context Switching
  </text>

  <!-- Process States Row -->
  <rect x="40" y="75" width="770" height="150" rx="10" fill="#131d31" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="100" fill="#facc15" font-size="13" font-weight="bold">Process Lifecycle &amp; Scheduling States:</text>

  <!-- State 1: New -->
  <rect x="60" y="125" width="105" height="60" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="112" y="153" fill="#cbd5e1" font-size="12" font-weight="bold" text-anchor="middle">NEW</text>
  <text x="112" y="170" fill="#94a3b8" font-size="9" text-anchor="middle">Program Created</text>

  <line x1="165" y1="155" x2="215" y2="155" stroke="#38bdf8" stroke-width="2"/>

  <!-- State 2: Ready -->
  <rect x="215" y="125" width="125" height="60" rx="8" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="277" y="153" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle">READY</text>
  <text x="277" y="170" fill="#bfdbfe" font-size="9" text-anchor="middle">Waiting in RAM Queue</text>

  <!-- Scheduler Arrow -->
  <line x1="340" y1="155" x2="400" y2="155" stroke="#4ade80" stroke-width="3"/>
  <text x="370" y="145" fill="#4ade80" font-size="9" font-weight="bold" text-anchor="middle">Dispatch</text>

  <!-- State 3: Running -->
  <rect x="400" y="125" width="135" height="60" rx="8" fill="#065f46" stroke="#10b981"/>
  <text x="467" y="153" fill="#6ee7b7" font-size="13" font-weight="bold" text-anchor="middle">RUNNING</text>
  <text x="467" y="170" fill="#a7f3d0" font-size="9" text-anchor="middle">Executing on CPU Core</text>

  <!-- Preemption Arrow back -->
  <path d="M 467 125 C 467 95, 277 95, 277 125" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="372" y="102" fill="#f59e0b" font-size="9" font-weight="bold" text-anchor="middle">Time Quantum Expired (Preemption)</text>

  <!-- Exit Arrow -->
  <line x1="535" y1="155" x2="595" y2="155" stroke="#ec4899" stroke-width="2"/>

  <!-- State 4: Terminated -->
  <rect x="595" y="125" width="125" height="60" rx="8" fill="#881337" stroke="#f43f5e"/>
  <text x="657" y="153" fill="#fecdd3" font-size="12" font-weight="bold" text-anchor="middle">TERMINATED</text>
  <text x="657" y="170" fill="#fda4af" font-size="9" text-anchor="middle">Memory Deallocated</text>

  <!-- Bottom: 3 Core Activities of Processor Management -->
  <rect x="40" y="240" width="770" height="215" rx="10" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="268" fill="#facc15" font-size="13" font-weight="bold">3 Core Activities of OS in Processor Management:</text>

  <!-- Activity 1 -->
  <rect x="60" y="285" width="230" height="150" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="175" y="312" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">1. Process Tracking</text>
  <text x="75" y="338" fill="#cbd5e1" font-size="10">• Maintains PCB (Process Control Block)</text>
  <text x="75" y="358" fill="#cbd5e1" font-size="10">• Tracks PID, PC, Registers, State</text>
  <text x="75" y="378" fill="#cbd5e1" font-size="10">• Monitors CPU &amp; I/O burst times</text>
  <text x="75" y="405" fill="#93c5fd" font-size="9">Traffic Controller: Tracks every process!</text>

  <!-- Activity 2 -->
  <rect x="310" y="285" width="230" height="150" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="425" y="312" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle">2. CPU Allocation</text>
  <text x="325" y="338" fill="#cbd5e1" font-size="10">• CPU Scheduler chooses next process</text>
  <text x="325" y="358" fill="#cbd5e1" font-size="10">• Dispatcher sets program counter</text>
  <text x="325" y="378" fill="#cbd5e1" font-size="10">• Performs Context Switching</text>
  <text x="325" y="405" fill="#a7f3d0" font-size="9">CPU Dispatcher: Handover CPU core!</text>

  <!-- Activity 3 -->
  <rect x="560" y="285" width="230" height="150" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="675" y="312" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle">3. CPU Deallocation</text>
  <text x="575" y="338" fill="#cbd5e1" font-size="10">• Reclaims CPU on I/O wait or finish</text>
  <text x="575" y="358" fill="#cbd5e1" font-size="10">• Saves current process registers</text>
  <text x="575" y="378" fill="#cbd5e1" font-size="10">• Prevents CPU starvation</text>
  <text x="575" y="405" fill="#fca5a5" font-size="9">Resource Clean: Preempts smoothly!</text>
</svg>