<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">MULTIVERSION CONCURRENCY CONTROL (MVCC) &amp; MVTO</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multiple Data Versions, Non-Blocking Readers &amp; MVTO Timestamp Protocol (AKTU BCS501)</text>

  <!-- Left: MVCC Core Philosophy -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="430" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="430" height="32" rx="10" fill="#0284c7"/>
    <text x="265" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. MVCC Architecture &amp; Version Chain</text>

    <text x="70" y="165" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">The MVCC Golden Mantra:</text>
    <text x="70" y="185" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ READERS NEVER BLOCK WRITERS!</text>
    <text x="70" y="203" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ WRITERS NEVER BLOCK READERS!</text>

    <!-- Version boxes -->
    <rect x="70" y="225" width="105" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="122" y="245" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Version X0</text>
    <text x="122" y="262" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">WTS=0, RTS=5</text>

    <path d="M 175 252 L 205 252" fill="none" stroke="#64748b" stroke-width="2"/>

    <rect x="210" y="225" width="105" height="55" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="262" y="245" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Version X1</text>
    <text x="262" y="262" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">WTS=10, RTS=15</text>

    <path d="M 315 252 L 345 252" fill="none" stroke="#64748b" stroke-width="2"/>

    <rect x="350" y="225" width="110" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="405" y="245" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Version X2 (New)</text>
    <text x="405" y="262" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" text-anchor="middle">WTS=20, RTS=20</text>

    <text x="70" y="305" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Writes do NOT overwrite in place; they append a new version.</text>
    <text x="70" y="324" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Old versions retained until no active transaction needs them.</text>
  </g>

  <!-- Right: MVTO Protocol Rules -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="440" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="510" y="110" width="440" height="32" rx="10" fill="#059669"/>
    <text x="730" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Multiversion Timestamp Ordering (MVTO)</text>

    <!-- Read Rule -->
    <text x="530" y="165" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Rule 1: read_item(X) by Transaction T</text>
    <text x="530" y="185" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Find version Xi with largest write_TS(Xi) ≤ TS(T).</text>
    <text x="530" y="202" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">✓ READ IS ALWAYS GRANTED! (A reader NEVER aborts!)</text>
    <text x="530" y="220" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Set read_TS(Xi) = max{ read_TS(Xi), TS(T) }.</text>

    <line x1="530" y1="230" x2="930" y2="230" stroke="#475569" stroke-width="1"/>

    <!-- Write Rule -->
    <text x="530" y="250" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Rule 2: write_item(X) by Transaction T</text>
    <text x="530" y="270" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Find version Xi with largest write_TS(Xi) ≤ TS(T).</text>
    <text x="530" y="288" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• If read_TS(Xi) &gt; TS(T): ABORT &amp; ROLLBACK T!</text>
    <text x="545" y="303" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic">(A newer transaction already read Xi expecting no updates).</text>
    <text x="530" y="322" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• If read_TS(Xi) ≤ TS(T): CREATE NEW VERSION X(k+1) with TS(T)!</text>
  </g>

  <!-- Bottom: Industrial Impact -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#be185d"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Real-World RDBMS Implementation &amp; Garbage Collection</text>

    <text x="70" y="420" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Production DBMS MVCC Adoption:</text>
    <text x="70" y="440" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• <strong>PostgreSQL:</strong> Stores multiple tuple versions directly in table heap with xmin/xmax transaction IDs.</text>
    <text x="70" y="458" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• <strong>MySQL (InnoDB) &amp; Oracle:</strong> Stores current version in table, older versions in <strong>Undo Segments / Rollback logs</strong>.</text>

    <text x="70" y="488" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Garbage Collection (Vacuuming):</text>
    <text x="70" y="508" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Old versions consume disk storage. When no active transaction has TS ≤ write_TS(Xi), version Xi is dead.</text>
    <text x="70" y="526" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">Vacuuming background worker cleans dead versions to reclaim space and maintain high query performance.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>