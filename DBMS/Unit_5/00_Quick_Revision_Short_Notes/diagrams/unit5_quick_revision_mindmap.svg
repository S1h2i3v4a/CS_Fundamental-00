<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#bgGrad)"/>
  <rect x="25" y="20" width="1050" height="640" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="550" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">DBMS UNIT 5: CONCURRENCY CONTROL ARCHITECTURE</text>
  <text x="550" y="78" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gateway Classes AKTU BCS501 | Master Conceptual Mindmap</text>

  <!-- Central Hub -->
  <g filter="url(#shadow)">
    <rect x="410" y="270" width="280" height="115" rx="14" fill="url(#coreGrad)"/>
    <text x="550" y="305" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="900" text-anchor="middle">CONCURRENCY CONTROL</text>
    <text x="550" y="328" fill="#d1fae5" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Locking, Timestamps &amp; MGL</text>
    <rect x="430" y="342" width="240" height="25" rx="6" fill="#0f172a" opacity="0.3"/>
    <text x="550" y="359" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AKTU BCS501 Syllabus Core</text>
  </g>

  <!-- Connectors -->
  <path d="M 410 300 C 310 280, 240 210, 190 190" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 410 340 C 310 370, 230 430, 190 480" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 550 270 C 550 200, 550 160, 550 145" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 690 300 C 790 280, 870 210, 910 190" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 690 340 C 800 370, 880 430, 910 480" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Top-Left: Pillar 1 - Locking & 2PL -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="115" width="280" height="30" rx="10" fill="#0284c7"/>
    <text x="190" y="136" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. Locking &amp; 2PL Protocols</text>
    <text x="65" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Binary vs Shared/Exclusive (S / X)</text>
    <text x="65" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• 2PL: Growing → Lock Point → Shrinking</text>
    <text x="65" y="205" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Strict 2PL: X-locks held till commit</text>
    <text x="65" y="225" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Rigorous 2PL: All locks held till commit</text>
    <text x="65" y="245" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Conservative 2PL: 100% Deadlock-Free</text>
  </g>

  <!-- Top Center: Pillar 2 - Timestamps & Thomas Rule -->
  <g filter="url(#shadow)">
    <rect x="410" y="95" width="280" height="135" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="2"/>
    <rect x="410" y="95" width="280" height="30" rx="10" fill="#7c3aed"/>
    <text x="550" y="116" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Timestamp Ordering (TO)</text>
    <text x="425" y="145" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Basic TO: Read &amp; Write validation rules</text>
    <text x="425" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Deadlock-Free: No transaction waiting</text>
    <text x="425" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Thomas' Write Rule: Ignore outdated writes</text>
    <text x="425" y="205" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">View Serializability (VSR) without CSR</text>
  </g>

  <!-- Top-Right: Pillar 3 - MVCC & MV2PL -->
  <g filter="url(#shadow)">
    <rect x="770" y="115" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#ef4444" stroke-width="2"/>
    <rect x="770" y="115" width="280" height="30" rx="10" fill="#b91c1c"/>
    <text x="910" y="136" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Multi-Version (MVCC)</text>
    <text x="785" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Version Chains: Readers never block writers</text>
    <text x="785" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• MVTO: Reads always succeed (no abort)</text>
    <text x="785" y="205" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• MV2PL: Read (RL), Write (WL), Certify (CL)</text>
    <text x="785" y="225" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Certify Lock upgrades at commit phase</text>
    <text x="785" y="245" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Zero cascading aborts under multi-versioning</text>
  </g>

  <!-- Bottom-Left: Pillar 4 - Validation & Phantoms -->
  <g filter="url(#shadow)">
    <rect x="50" y="420" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="2"/>
    <rect x="50" y="420" width="280" height="30" rx="10" fill="#d97706"/>
    <text x="190" y="441" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4. Validation Protocol (OCC)</text>
    <text x="65" y="470" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Read Phase: Buffer writes locally</text>
    <text x="65" y="490" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Validation Phase: Check 3 conditions</text>
    <text x="65" y="510" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Write Phase: Flush committed data to disk</text>
    <text x="65" y="530" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Phantom Phenomenon: Dynamic inserts</text>
    <text x="65" y="550" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Index-Range Locking prevents phantoms</text>
  </g>

  <!-- Bottom-Right: Pillar 5 - Multiple Granularity & Oracle -->
  <g filter="url(#shadow)">
    <rect x="770" y="420" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#ec4899" stroke-width="2"/>
    <rect x="770" y="420" width="280" height="30" rx="10" fill="#db2777"/>
    <text x="910" y="441" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5. MGL &amp; Oracle Case Study</text>
    <text x="785" y="470" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Tree: db → files → pages → records</text>
    <text x="785" y="490" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Intention Locks: IS, IX, SIX modes</text>
    <text x="785" y="510" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• 5×5 Lock Compatibility Matrix (Slide 69)</text>
    <text x="785" y="530" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Oracle MVCC: SCN, Undo Segments</text>
    <text x="785" y="550" fill="#fbcfe8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">ORA-01555 Snapshot Too Old &amp; 2PC Protocol</text>
  </g>

  <!-- Bottom Center: Exam Rules -->
  <rect x="360" y="480" width="380" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="550" y="505" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AKTU BCS501 UNIT 5 EXAM FORMULAE</text>
  <text x="375" y="525" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• MGL Locking: Top-down | Unlocking: Bottom-up</text>
  <text x="375" y="542" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Thomas' Rule: Outdated write → IGNORE &amp; CONTINUE</text>
  <text x="375" y="559" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Conservative 2PL: Deadlock-free | Strict 2PL: Cascadeless</text>

  <!-- Footer -->
  <text x="550" y="650" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DBMS Unit 5 Complete Architecture | Computer Science &amp; Engineering | AKTU Semester V</text>
</svg>