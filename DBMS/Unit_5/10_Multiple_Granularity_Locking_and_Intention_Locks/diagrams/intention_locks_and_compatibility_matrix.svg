<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">MULTIPLE GRANULARITY &amp; INTENTION LOCKS</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">IS, IX, SIX Modes &amp; Master 5x5 Lock Compatibility Matrix (AKTU BCS501 Slide 69)</text>

  <!-- Left: The Intention Lock Modes -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="410" height="430" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="410" height="34" rx="10" fill="#0284c7"/>
    <text x="255" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">1. Intention Lock Modes Defined</text>

    <!-- IS -->
    <rect x="70" y="160" width="370" height="65" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="182" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">IS: Intention-Shared Lock</text>
    <text x="85" y="201" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Indicates intention to acquire Shared (S) locks on descendants.</text>
    <text x="85" y="215" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic">Placed on ancestors (db, file) before locking record in S mode.</text>

    <!-- IX -->
    <rect x="70" y="235" width="370" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="85" y="257" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">IX: Intention-Exclusive Lock</text>
    <text x="85" y="276" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Indicates intention to acquire Exclusive (X) locks on descendants.</text>
    <text x="85" y="290" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic">Placed on ancestors (db, file) before locking record in X mode.</text>

    <!-- SIX -->
    <rect x="70" y="310" width="370" height="85" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="85" y="332" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">SIX: Shared-Intention-Exclusive Lock</text>
    <text x="85" y="351" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Locks current subtree explicitly in Shared (S) mode,</text>
    <text x="95" y="367" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">while intending to acquire Exclusive (X) locks on specific child nodes.</text>
    <text x="85" y="383" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-style="italic">Used when a txn reads an entire table but updates a few rows.</text>

    <!-- Ordinary S & X -->
    <rect x="70" y="405" width="370" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="85" y="425" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Ordinary Locks: S and X Modes</text>
    <text x="85" y="443" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.8" font-weight="600">• S locks current subtree shared; X locks current subtree exclusive.</text>
    <text x="85" y="457" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.2" font-style="italic">No intention tag needed because entire subtree is locked uniformly.</text>
  </g>

  <!-- Right: Master 5x5 Compatibility Matrix (Exact Slide 69 Reproduction) -->
  <g filter="url(#shadow)">
    <rect x="490" y="110" width="460" height="430" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="490" y="110" width="460" height="34" rx="10" fill="#059669"/>
    <text x="720" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">2. Master 5×5 Compatibility Matrix (Slide 69)</text>

    <!-- Table Graphic -->
    <rect x="515" y="160" width="410" height="260" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    
    <!-- Horizontal lines -->
    <line x1="515" y1="205" x2="925" y2="205" stroke="#475569" stroke-width="1.5"/>
    <line x1="515" y1="250" x2="925" y2="250" stroke="#475569" stroke-width="1"/>
    <line x1="515" y1="295" x2="925" y2="295" stroke="#475569" stroke-width="1"/>
    <line x1="515" y1="340" x2="925" y2="340" stroke="#475569" stroke-width="1"/>
    <line x1="515" y1="380" x2="925" y2="380" stroke="#475569" stroke-width="1"/>

    <!-- Vertical lines -->
    <line x1="585" y1="160" x2="585" y2="420" stroke="#475569" stroke-width="1.5"/>
    <line x1="655" y1="160" x2="655" y2="420" stroke="#475569" stroke-width="1"/>
    <line x1="725" y1="160" x2="725" y2="420" stroke="#475569" stroke-width="1"/>
    <line x1="795" y1="160" x2="795" y2="420" stroke="#475569" stroke-width="1"/>
    <line x1="865" y1="160" x2="865" y2="420" stroke="#475569" stroke-width="1"/>

    <!-- Header row -->
    <text x="550" y="188" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Held\Req</text>
    <text x="620" y="188" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">IS</text>
    <text x="690" y="188" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">IX</text>
    <text x="760" y="188" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">S</text>
    <text x="830" y="188" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">SIX</text>
    <text x="895" y="188" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">X</text>

    <!-- Row 1: IS -->
    <text x="550" y="233" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">IS</text>
    <text x="620" y="233" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="690" y="233" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="760" y="233" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="830" y="233" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="895" y="233" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>

    <!-- Row 2: IX -->
    <text x="550" y="278" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">IX</text>
    <text x="620" y="278" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="690" y="278" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="760" y="278" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="830" y="278" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="895" y="278" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>

    <!-- Row 3: S -->
    <text x="550" y="323" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">S</text>
    <text x="620" y="323" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="690" y="323" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="760" y="323" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="830" y="323" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="895" y="323" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>

    <!-- Row 4: SIX -->
    <text x="550" y="365" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">SIX</text>
    <text x="620" y="365" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Yes</text>
    <text x="690" y="365" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="760" y="365" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="830" y="365" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="895" y="365" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>

    <!-- Row 5: X -->
    <text x="550" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">X</text>
    <text x="620" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="690" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="760" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="830" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>
    <text x="895" y="405" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">No</text>

    <!-- Key Insights -->
    <text x="520" y="450" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Exam Memory Rule:</text>
    <text x="520" y="470" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• IS is compatible with everything EXCEPT X!</text>
    <text x="520" y="490" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• IX is compatible only with IS and IX!</text>
    <text x="520" y="510" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• X is strictly incompatible with EVERY lock mode (all NO)!</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>