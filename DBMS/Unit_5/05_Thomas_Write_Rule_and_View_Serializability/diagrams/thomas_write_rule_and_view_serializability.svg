<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">THOMAS' WRITE RULE &amp; VIEW SERIALIZABILITY</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Obsolete Write Handling, Blind Writes &amp; Concurrency Relaxation (AKTU BCS501)</text>

  <!-- Left: Core Concept & Motivation -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="430" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="430" height="32" rx="10" fill="#0284c7"/>
    <text x="265" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. Motivation: Why Modify Basic TO?</text>

    <text x="70" y="165" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Problem in Basic TO:</text>
    <text x="70" y="183" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">If TS(T) &lt; write_TS(X), Basic TO immediately aborts T.</text>
    <text x="70" y="201" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Even though T's write is already outdated and overwritten!</text>

    <line x1="70" y1="215" x2="450" y2="215" stroke="#475569" stroke-width="1"/>

    <text x="70" y="235" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Thomas' Brilliant Insight:</text>
    <text x="70" y="253" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• If a younger transaction has already written X, T's write value</text>
    <text x="80" y="271" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">would never be seen by any future read operation anyway!</text>
    <text x="70" y="291" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">• Instead of ABORTING T, simply IGNORE (discard) T's write!</text>
    <text x="70" y="310" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">T continues processing smoothly without costly rollback.</text>
  </g>

  <!-- Right: 3 Rules of Thomas' Write Rule -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="440" height="235" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="510" y="110" width="440" height="32" rx="10" fill="#d97706"/>
    <text x="730" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. The 3 Operational Rules for write(X)</text>

    <rect x="530" y="155" width="400" height="48" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
    <text x="545" y="174" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Rule 1: If TS(T) &lt; read_TS(X)</text>
    <text x="545" y="191" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">→ ABORT and ROLLBACK T (Younger txn read old data).</text>

    <rect x="530" y="213" width="400" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="545" y="232" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Rule 2 (Thomas' Specialty): If TS(T) &lt; write_TS(X)</text>
    <text x="545" y="250" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">→ DO NOT EXECUTE write(X), CONTINUE PROCESSING!</text>
    <text x="545" y="264" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-style="italic">Ignore outdated write. Avoids abort, increasing system throughput.</text>

    <rect x="530" y="281" width="400" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="545" y="300" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Rule 3: If neither condition 1 nor 2 occurs</text>
    <text x="545" y="317" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">→ EXECUTE write(X) and set write_TS(X) = TS(T).</text>
  </g>

  <!-- Bottom: Serializability Relationship -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#7c3aed"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Theoretical Significance: CSR vs VSR</text>

    <!-- Venn / Set Diagram -->
    <rect x="80" y="415" width="380" height="125" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <ellipse cx="230" cy="480" rx="130" ry="48" fill="#7c3aed" opacity="0.3" stroke="#a855f7" stroke-width="2"/>
    <text x="230" y="450" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">View Serializable (VSR)</text>
    
    <ellipse cx="210" cy="490" rx="85" ry="32" fill="#0284c7" opacity="0.5" stroke="#38bdf8" stroke-width="2"/>
    <text x="210" y="495" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">Conflict Serializable</text>
    
    <circle cx="310" cy="490" r="6" fill="#f59e0b"/>
    <text x="325" y="494" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800">Thomas' Rule</text>

    <!-- Explanation -->
    <text x="490" y="435" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Key Academic &amp; AKTU Exam Findings:</text>
    <text x="490" y="458" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Basic TO produces ONLY Conflict Serializable (CSR) schedules.</text>
    <text x="490" y="478" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Thomas' Write Rule allows schedules that are NOT Conflict Serializable,</text>
    <text x="500" y="496" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">yet they ARE View Serializable (VSR) due to Blind Writes!</text>
    <text x="490" y="516" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">✓ Maximizes Concurrency: Tolerates blind and obsolete writes safely.</text>
    <text x="490" y="534" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">• Uncommitted data still requires commit coordination to ensure recoverability.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>