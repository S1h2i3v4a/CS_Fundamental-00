<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sharedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="exclusiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">CONCURRENCY CONTROL FOUNDATION &amp; LOCKING MECHANISMS</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Data Item Locking, Lock Compatibility &amp; Lock Manager Architecture (AKTU BCS501)</text>

  <!-- Left: Binary Locking Scheme -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="410" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="410" height="34" rx="10" fill="#0284c7"/>
    <text x="255" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1. Binary Locking Scheme (0 / 1)</text>
    
    <rect x="75" y="160" width="160" height="60" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
    <text x="155" y="185" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">State 0: Unlocked</text>
    <text x="155" y="205" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Item X available for access</text>

    <path d="M 235 190 L 275 190" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="280" y="160" width="160" height="60" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="360" y="185" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">State 1: Locked</text>
    <text x="360" y="205" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Held exclusively by 1 Txn</text>

    <text x="75" y="245" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Rule 1: lock_item(X) before read_item(X) or write_item(X)</text>
    <text x="75" y="268" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Rule 2: unlock_item(X) after all operations completed</text>
    <text x="75" y="291" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Limitation: Too restrictive! Only 1 reader allowed at a time</text>
    <text x="75" y="314" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic">• Prevents concurrent read access, crippling database throughput</text>
  </g>

  <!-- Right: Shared / Exclusive (Read/Write) Locks -->
  <g filter="url(#shadow)">
    <rect x="520" y="110" width="430" height="230" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="520" y="110" width="430" height="34" rx="10" fill="#059669"/>
    <text x="735" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2. Shared / Exclusive (Read/Write) Locks</text>

    <!-- Shared Box -->
    <rect x="540" y="155" width="185" height="75" rx="8" fill="url(#sharedGrad)"/>
    <text x="632" y="180" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Shared Lock S(X)</text>
    <text x="632" y="198" fill="#d1fae5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Read-Only Permission</text>
    <text x="632" y="215" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Multiple Readers Allowed</text>

    <!-- Exclusive Box -->
    <rect x="745" y="155" width="185" height="75" rx="8" fill="url(#exclusiveGrad)"/>
    <text x="837" y="180" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Exclusive Lock X(X)</text>
    <text x="837" y="198" fill="#fee2e2" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Read &amp; Write Permission</text>
    <text x="837" y="215" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Strictly 1 Transaction</text>

    <text x="540" y="255" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• High Concurrency: Readers do not block other readers</text>
    <text x="540" y="278" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">• Mutual Exclusion: Writer blocks all readers and other writers</text>
    <text x="540" y="301" fill="#6ee7b7" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Lock Table: Maintains no_of_reads(X) and waiting queues</text>
    <text x="540" y="324" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic">• Unlocking sets state to unlocked only when no_of_reads(X) reaches 0</text>
  </g>

  <!-- Bottom: Lock Compatibility Matrix & Lock Table Operations -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#4f46e5"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Lock Compatibility Matrix &amp; Operational Algorithms</text>

    <!-- Table -->
    <rect x="80" y="415" width="280" height="125" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <line x1="80" y1="450" x2="360" y2="450" stroke="#475569" stroke-width="1"/>
    <line x1="80" y1="485" x2="360" y2="485" stroke="#475569" stroke-width="1"/>
    <line x1="200" y1="415" x2="200" y2="540" stroke="#475569" stroke-width="1"/>
    <line x1="280" y1="415" x2="280" y2="540" stroke="#475569" stroke-width="1"/>

    <text x="140" y="438" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Lock Mode</text>
    <text x="240" y="438" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Shared (S)</text>
    <text x="320" y="438" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Exclusive (X)</text>

    <text x="140" y="472" fill="#10b981" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Shared (S)</text>
    <rect x="220" y="458" width="40" height="20" rx="3" fill="#065f46"/>
    <text x="240" y="472" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">TRUE</text>
    <rect x="300" y="458" width="40" height="20" rx="3" fill="#7f1d1d"/>
    <text x="320" y="472" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">FALSE</text>

    <text x="140" y="515" fill="#ef4444" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Exclusive (X)</text>
    <rect x="220" y="501" width="40" height="20" rx="3" fill="#7f1d1d"/>
    <text x="240" y="515" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">FALSE</text>
    <rect x="300" y="501" width="40" height="20" rx="3" fill="#7f1d1d"/>
    <text x="320" y="515" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">FALSE</text>

    <!-- Algorithms summary -->
    <rect x="390" y="415" width="530" height="125" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="405" y="438" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Lock Manager Operational Workflow:</text>
    <text x="405" y="460" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• read_lock(X): If unlocked or read-locked → grant lock, increment no_of_reads(X)</text>
    <text x="405" y="480" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• write_lock(X): If unlocked → grant exclusive lock; else transaction enters wait queue</text>
    <text x="405" y="500" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• unlock(X): If write-locked → set unlocked &amp; wakeup waiting Txn. If read-locked →</text>
    <text x="415" y="518" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">decrement no_of_reads(X). Only when counter reaches 0 is lock released.</text>
    <text x="405" y="534" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">AKTU Rule: Simple locking does NOT guarantee serializability unless governed by 2PL!</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>