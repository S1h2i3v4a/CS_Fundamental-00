<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="oracleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">CASE STUDY OF ORACLE CONCURRENCY CONTROL</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Multi-Version Read Consistency, SCN, Undo Segments &amp; Row-Level Locks (AKTU BCS501 Syllabus)</text>

  <!-- Left: Oracle MVCC & SCN Architecture -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="430" height="235" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="50" y="110" width="430" height="32" rx="10" fill="url(#oracleGrad)"/>
    <text x="265" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">1. Oracle MVCC &amp; SCN Architecture</text>

    <text x="70" y="165" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">System Change Number (SCN):</text>
    <text x="70" y="185" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Internal logical timestamp incremented with every COMMIT.</text>
    <text x="70" y="201" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Acts as the definitive point-in-time clock for consistency.</text>

    <line x1="70" y1="215" x2="450" y2="215" stroke="#475569" stroke-width="1"/>

    <text x="70" y="235" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Two Levels of Read Consistency:</text>
    <text x="70" y="255" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">1. <strong>Statement-Level:</strong> Query sees data committed as of the exact SCN when statement execution began (Default mode).</text>
    <text x="70" y="280" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">2. <strong>Transaction-Level:</strong> All queries in txn see snapshot as of SCN when transaction started (<code>READ ONLY</code> / <code>SERIALIZABLE</code>).</text>
  </g>

  <!-- Right: Undo Segments & ORA-01555 -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="440" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="510" y="110" width="440" height="32" rx="10" fill="#059669"/>
    <text x="730" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" text-anchor="middle">2. Undo Segments &amp; Snapshot Reconstruction</text>

    <text x="530" y="165" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">How Oracle Reads Old Snapshots:</text>
    <text x="530" y="185" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">When a query finds a data block modified by an SCN &gt; query_SCN:</text>
    <text x="530" y="203" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">→ It accesses the <strong>Undo Segment</strong> to reconstruct the old block</text>
    <text x="540" y="220" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">in buffer cache (Consistent Read - CR buffer)!</text>

    <line x1="530" y1="230" x2="930" y2="230" stroke="#475569" stroke-width="1"/>

    <text x="530" y="250" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">The Infamous ORA-01555: Snapshot Too Old Error:</text>
    <text x="530" y="270" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">If a query runs for hours and needed undo blocks are overwritten</text>
    <text x="530" y="286" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">by newer transactions → Oracle throws <code>ORA-01555</code>!</text>
    <text x="530" y="304" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.8" font-style="italic">Mitigation: Increase UNDO_RETENTION and allocate larger undo tablespace.</text>
  </g>

  <!-- Bottom: Oracle Locking Philosophy -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#0284c7"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Oracle Locking Philosophy &amp; Features</text>

    <text x="70" y="420" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ Row-Level Locking by Default:</text>
    <text x="85" y="440" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Oracle locks individual rows inside data block headers. It does NOT maintain a separate centralized memory lock table for row locks.</text>

    <text x="70" y="468" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ ZERO Lock Escalation:</text>
    <text x="85" y="488" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Unlike Microsoft SQL Server, Oracle NEVER escalates row locks to page or table locks, no matter how many millions of rows are updated!</text>

    <text x="70" y="515" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ Explicit Locking: SELECT ... FOR UPDATE</text>
    <text x="85" y="535" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Allows applications to place explicit exclusive row locks on selected records before updating, preventing lost updates.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>