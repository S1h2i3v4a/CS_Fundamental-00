<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="readGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="writeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">BASIC TIMESTAMP ORDERING (TO) PROTOCOL</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Timestamp Allocation, RTS(X), WTS(X) &amp; Conflict Verification Rules (AKTU BCS501)</text>

  <!-- Left: Timestamps Definition & Metadata -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="420" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="420" height="32" rx="10" fill="#0284c7"/>
    <text x="260" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. Timestamps &amp; Data Item Metadata</text>

    <text x="70" y="165" fill="#facc15" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Transaction Timestamp: TS(Ti)</text>
    <text x="70" y="185" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• Assigned at start time using system clock or logical counter</text>
    <text x="70" y="203" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• If Ti enters before Tj, then TS(Ti) &lt; TS(Tj) (Ti is older)</text>

    <line x1="70" y1="215" x2="450" y2="215" stroke="#475569" stroke-width="1"/>

    <text x="70" y="235" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Data Item Timestamps:</text>
    <text x="70" y="255" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• read_TS(X) [RTS]: Largest TS of any txn that read X</text>
    <text x="85" y="272" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">RTS(X) = max{ TS(T) | T successfully executed read(X) }</text>
    <text x="70" y="295" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• write_TS(X) [WTS]: Largest TS of any txn that wrote X</text>
    <text x="85" y="312" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10">WTS(X) = max{ TS(T) | T successfully executed write(X) }</text>
  </g>

  <!-- Right: read_item(X) and write_item(X) Rules -->
  <g filter="url(#shadow)">
    <rect x="500" y="110" width="450" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="500" y="110" width="450" height="32" rx="10" fill="#059669"/>
    <text x="725" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Basic TO Decision Logic</text>

    <!-- Read Operation -->
    <text x="520" y="165" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">When Transaction T requests read_item(X):</text>
    <text x="520" y="185" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• If TS(T) &lt; write_TS(X):</text>
    <text x="535" y="202" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ABORT &amp; ROLLBACK T (A newer transaction already overwrote X!)</text>
    <text x="520" y="222" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• If TS(T) ≥ write_TS(X):</text>
    <text x="535" y="239" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">EXECUTE read_item(X) and set read_TS(X) = max{ read_TS(X), TS(T) }</text>

    <line x1="520" y1="250" x2="930" y2="250" stroke="#475569" stroke-width="1"/>

    <!-- Write Operation -->
    <text x="520" y="270" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">When Transaction T requests write_item(X):</text>
    <text x="520" y="290" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• If TS(T) &lt; read_TS(X) OR TS(T) &lt; write_TS(X):</text>
    <text x="535" y="307" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ABORT &amp; ROLLBACK T (A newer txn read or wrote X before T!)</text>
    <text x="520" y="325" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">• Else: EXECUTE write_item(X) and set write_TS(X) = TS(T)</text>
  </g>

  <!-- Bottom: Advantages & Disadvantages -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#b45309"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Characteristics, Comparison with 2PL &amp; Starvation Hazard</text>

    <text x="70" y="420" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ 100% DEADLOCK FREE (No Waiting Cycles):</text>
    <text x="85" y="440" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Timestamp Ordering me koi lock nahi hota, isiliye transactions waiting state me block nahi hote. Deadlocks impossible hain!</text>

    <text x="70" y="468" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ Predetermined Serial Order:</text>
    <text x="85" y="488" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">2PL me schedule order runtime locking par depend karta hai. TO me order pehle se unke timestamps ke exact order me fix hota hai.</text>

    <text x="70" y="515" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✗ High Rollback Rate &amp; Starvation Hazard:</text>
    <text x="85" y="535" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">High contention workloads me baar-baar conflicting young operations ke aane se older transactions repeatedly abort hokar starve ho sakte hain.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>