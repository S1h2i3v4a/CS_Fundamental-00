<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">VALIDATION-BASED PROTOCOL (OCC) &amp; PHANTOM PHENOMENA</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Optimistic Concurrency Control (OCC) Phases, Validation Conditions &amp; Phantom Prevention (AKTU BCS501)</text>

  <!-- Left: The 3 OCC Execution Phases -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="430" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="430" height="32" rx="10" fill="#0284c7"/>
    <text x="265" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. The 3 Phases of Optimistic CC (OCC)</text>

    <rect x="70" y="155" width="390" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="85" y="174" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Phase 1: Read Phase</text>
    <text x="85" y="193" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Reads DB values. All updates written strictly to local workspace copies.</text>

    <rect x="70" y="215" width="390" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="85" y="234" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Phase 2: Validation Phase (Timestamp assigned: TS(Ti))</text>
    <text x="85" y="253" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Checks for conflict with other transactions. If fails → ABORT &amp; restart.</text>

    <rect x="70" y="275" width="390" height="55" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="85" y="294" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Phase 3: Write Phase (If validation succeeds)</text>
    <text x="85" y="313" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Local copies flushed to database on disk. Changes committed.</text>
  </g>

  <!-- Right: Validation Conditions -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="440" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="510" y="110" width="440" height="32" rx="10" fill="#059669"/>
    <text x="730" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Validation Conditions for TS(Ti) &lt; TS(Tj)</text>

    <rect x="530" y="155" width="400" height="52" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="545" y="174" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Condition 1: Fully Disjoint Execution</text>
    <text x="545" y="193" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Ti completes its Write Phase BEFORE Tj starts its Read Phase.</text>

    <rect x="530" y="215" width="400" height="58" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="545" y="234" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Condition 2: Read Set Non-Overlap</text>
    <text x="545" y="252" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.8" font-weight="600">Ti completes Write Phase before Tj starts Write Phase, AND</text>
    <text x="545" y="266" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.8" font-weight="700">ReadSet(Tj) ∩ WriteSet(Ti) = ∅ (No dirty read!)</text>

    <rect x="530" y="281" width="400" height="52" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="545" y="300" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">Condition 3: Complete Write/Read Independence</text>
    <text x="545" y="318" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">ReadSet(Tj) ∩ WriteSet(Ti) = ∅ AND WriteSet(Tj) ∩ WriteSet(Ti) = ∅.</text>
  </g>

  <!-- Bottom: Phantom Phenomena -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#b45309"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. The Phantom Phenomenon &amp; Dynamic Database Synchronization</text>

    <text x="70" y="420" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">What is the Phantom Phenomenon?</text>
    <text x="70" y="440" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">T1 executes a predicate query: <code>SELECT COUNT(*) FROM Emp WHERE Salary &gt; 50000</code>.</text>
    <text x="70" y="458" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Concurrently, T2 inserts a NEW employee with Salary 60000 and commits. When T1 reruns query, count increases!</text>
    <text x="70" y="476" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">Even though existing records were locked, the new record did not exist at lock time → PHANTOM RECORD!</text>

    <text x="70" y="504" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Solutions in DBMS:</text>
    <text x="70" y="524" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• <strong>Index-Range Locking:</strong> Locks leaf nodes of B+ Tree covering the salary &gt; 50000 search key range.</text>
    <text x="70" y="542" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">• <strong>Timestamp Ordering:</strong> Enforces serialization across predicate evaluation and dynamic insertions.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>