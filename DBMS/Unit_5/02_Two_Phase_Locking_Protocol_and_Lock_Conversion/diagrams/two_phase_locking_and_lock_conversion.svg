<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="growGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shrinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">TWO-PHASE LOCKING (2PL) &amp; LOCK CONVERSION</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Growing Phase, Lock Point, Shrinking Phase &amp; Upgrade/Downgrade Rules (AKTU BCS501)</text>

  <!-- 2PL Curve Visualization -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="530" height="260" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="530" height="34" rx="10" fill="#0284c7"/>
    <text x="315" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1. Two-Phase Locking (2PL) Execution Lifecycle</text>

    <!-- Axes -->
    <line x1="85" y1="320" x2="540" y2="320" stroke="#64748b" stroke-width="2"/>
    <line x1="85" y1="320" x2="85" y2="160" stroke="#64748b" stroke-width="2"/>
    <text x="535" y="340" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Time →</text>
    <text x="80" y="152" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Locks Held</text>

    <!-- Curve Up (Growing) -->
    <path d="M 90 320 Q 210 180, 290 180" fill="none" stroke="#10b981" stroke-width="4"/>
    <!-- Curve Down (Shrinking) -->
    <path d="M 290 180 Q 370 180, 490 320" fill="none" stroke="#f59e0b" stroke-width="4"/>

    <!-- Lock Point Marker -->
    <circle cx="290" cy="180" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <line x1="290" y1="180" x2="290" y2="320" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="235" y="195" width="110" height="22" rx="4" fill="#ef4444"/>
    <text x="290" y="210" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LOCK POINT</text>

    <!-- Labels on Graph -->
    <rect x="110" y="230" width="130" height="42" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="175" y="248" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Phase 1: Growing</text>
    <text x="175" y="263" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Acquire Locks ONLY</text>

    <rect x="350" y="230" width="130" height="42" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="415" y="248" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Phase 2: Shrinking</text>
    <text x="415" y="263" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Release Locks ONLY</text>

    <text x="90" y="355" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Golden Rule: Once a transaction releases any lock, it can NEVER acquire a new lock!</text>
  </g>

  <!-- Right: Lock Conversion (Upgrading & Downgrading) -->
  <g filter="url(#shadow)">
    <rect x="600" y="110" width="350" height="260" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="600" y="110" width="350" height="34" rx="10" fill="#7c3aed"/>
    <text x="775" y="133" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2. Lock Conversion Mechanism</text>

    <!-- Upgrading -->
    <rect x="620" y="160" width="310" height="85" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="775" y="182" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Lock Upgrading (S → X)</text>
    <text x="635" y="202" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Converts Shared Lock to Exclusive Lock</text>
    <text x="635" y="218" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Condition: T must be the ONLY txn holding S(X)</text>
    <text x="635" y="234" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">• Allowed ONLY during Growing Phase!</text>

    <!-- Downgrading -->
    <rect x="620" y="260" width="310" height="85" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="775" y="282" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Lock Downgrading (X → S)</text>
    <text x="635" y="302" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Converts Exclusive Lock to Shared Lock</text>
    <text x="635" y="318" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Can be safely permitted during Shrinking Phase</text>
    <text x="635" y="334" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">• Increases concurrency for subsequent readers</text>
  </g>

  <!-- Bottom: 2PL Guarantees & Trade-offs -->
  <g filter="url(#shadow)">
    <rect x="50" y="390" width="900" height="170" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="50" y="390" width="900" height="30" rx="10" fill="#334155"/>
    <text x="500" y="411" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. 2PL Guarantees, Serializability Proof &amp; Deadlock Hazard</text>

    <text x="70" y="445" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ Guarantee 1: Conflict Serializability (CSR)</text>
    <text x="85" y="465" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Every schedule produced by 2PL is guaranteed to be conflict serializable. Precedence graph is acyclic.</text>
    <text x="85" y="482" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">The serial order corresponds exactly to the order of transactions reaching their respective Lock Points.</text>

    <text x="70" y="510" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✗ Hazard 1: Deadlocks ARE Possible!</text>
    <text x="85" y="528" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Basic 2PL does NOT prevent deadlocks (e.g., T1 holds X, waits for Y; T2 holds Y, waits for X).</text>

    <text x="520" y="510" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✗ Hazard 2: Cascading Aborts Possible!</text>
    <text x="535" y="528" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">If T1 releases X before commit and aborts, T2 reading dirty X must cascade-abort.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>