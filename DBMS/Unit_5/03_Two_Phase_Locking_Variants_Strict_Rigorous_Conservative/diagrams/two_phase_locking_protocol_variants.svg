<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">TWO-PHASE LOCKING (2PL) PROTOCOL VARIANTS</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Basic 2PL, Conservative 2PL, Strict 2PL &amp; Rigorous 2PL Architecture (AKTU BCS501)</text>

  <!-- Card 1: Basic 2PL -->
  <g filter="url(#shadow)">
    <rect x="40" y="110" width="430" height="210" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="110" width="430" height="32" rx="10" fill="#0284c7"/>
    <text x="255" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. Basic 2PL Protocol</text>
    <text x="60" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Mechanism: Growing phase → Lock point → Shrinking phase</text>
    <text x="60" y="188" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Lock Release: Locks can be released anytime in shrinking phase</text>
    <text x="60" y="211" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✓ Advantage: Guarantees Conflict Serializability</text>
    <text x="60" y="234" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Drawback 1: Deadlocks are possible</text>
    <text x="60" y="257" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Drawback 2: Cascading rollbacks are possible</text>
    <text x="60" y="280" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">• Uncommitted data unlocked early causes cascading aborts</text>
  </g>

  <!-- Card 2: Conservative 2PL (Static) -->
  <g filter="url(#shadow)">
    <rect x="520" y="110" width="440" height="210" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="520" y="110" width="440" height="32" rx="10" fill="#059669"/>
    <text x="740" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Conservative 2PL (Static Locking)</text>
    <text x="540" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Mechanism: Pre-declares and locks ALL required items at start</text>
    <text x="540" y="188" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• If even 1 item unavailable: Txn waits, acquires NO locks</text>
    <text x="540" y="211" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ Advantage: 100% DEADLOCK-FREE!</text>
    <text x="540" y="234" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Drawback 1: Low Concurrency (Locks held for entire run)</text>
    <text x="540" y="257" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Drawback 2: Must know all read/write sets in advance</text>
    <text x="540" y="280" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">• Rarely practical for dynamic interactive database workloads</text>
  </g>

  <!-- Card 3: Strict 2PL -->
  <g filter="url(#shadow)">
    <rect x="40" y="340" width="430" height="210" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="40" y="340" width="430" height="32" rx="10" fill="#d97706"/>
    <text x="255" y="362" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Strict 2PL (Industry Standard)</text>
    <text x="60" y="395" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Mechanism: All EXCLUSIVE (X) locks held until Commit/Abort</text>
    <text x="60" y="418" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Shared (S) locks can still be released during shrinking phase</text>
    <text x="60" y="441" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ Guarantee 1: Strict Schedule &amp; Cascadeless (No cascading aborts!)</text>
    <text x="60" y="464" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ Guarantee 2: Simple recovery via Before-Image restoration</text>
    <text x="60" y="487" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Limitation: Deadlocks are STILL possible</text>
    <text x="60" y="510" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">• Most widely used in production RDBMS (PostgreSQL, MySQL, SQL Server)</text>
  </g>

  <!-- Card 4: Rigorous 2PL -->
  <g filter="url(#shadow)">
    <rect x="520" y="340" width="440" height="210" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <rect x="520" y="340" width="440" height="32" rx="10" fill="#db2777"/>
    <text x="740" y="362" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4. Rigorous 2PL (Strict 2PL + Shared Locks)</text>
    <text x="540" y="395" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Mechanism: ALL locks (Both S and X) held until Commit/Abort</text>
    <text x="540" y="418" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Transaction has NO shrinking phase until end of transaction</text>
    <text x="540" y="441" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ Guarantee 1: Commit Order Serializability (Order = Commit Time)</text>
    <text x="540" y="464" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">✓ Guarantee 2: Strict &amp; Cascadeless Recovery</text>
    <text x="540" y="487" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">✗ Limitation: Concurrency reduced; Deadlocks still possible</text>
    <text x="540" y="510" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-style="italic">• Simplest protocol to implement and reason about mathematically</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>