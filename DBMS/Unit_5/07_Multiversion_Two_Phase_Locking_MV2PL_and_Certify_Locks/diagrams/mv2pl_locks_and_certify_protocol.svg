<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="500" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">MULTIVERSION TWO-PHASE LOCKING (MV2PL)</text>
  <text x="500" y="80" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Read Lock (RL), Write Lock (WL), Certify Lock (CL) &amp; Commit Serialization (AKTU BCS501)</text>

  <!-- Left: The 3 Lock Modes -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="430" height="235" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="110" width="430" height="32" rx="10" fill="#0284c7"/>
    <text x="265" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. The Three Lock Types in MV2PL</text>

    <rect x="70" y="155" width="390" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="85" y="174" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">1. Read Lock (RL):</text>
    <text x="85" y="193" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Acquired when reading a committed version. Readers never block writers!</text>

    <rect x="70" y="215" width="390" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="85" y="234" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">2. Write Lock (WL):</text>
    <text x="85" y="253" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Acquired when writing. Creates a new private draft version of item X.</text>

    <rect x="70" y="275" width="390" height="55" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="85" y="294" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">3. Certify Lock (CL) [Exclusive to Commit Phase]:</text>
    <text x="85" y="313" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Acquired before commit. Upgrades WL to CL to finalize new version.</text>
  </g>

  <!-- Right: MV2PL Lock Compatibility Table -->
  <g filter="url(#shadow)">
    <rect x="510" y="110" width="440" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="510" y="110" width="440" height="32" rx="10" fill="#059669"/>
    <text x="730" y="132" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. MV2PL Compatibility Matrix</text>

    <!-- Table -->
    <rect x="535" y="155" width="390" height="175" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <line x1="535" y1="195" x2="925" y2="195" stroke="#475569" stroke-width="1"/>
    <line x1="535" y1="240" x2="925" y2="240" stroke="#475569" stroke-width="1"/>
    <line x1="535" y1="285" x2="925" y2="285" stroke="#475569" stroke-width="1"/>
    <line x1="645" y1="155" x2="645" y2="330" stroke="#475569" stroke-width="1"/>
    <line x1="740" y1="155" x2="740" y2="330" stroke="#475569" stroke-width="1"/>
    <line x1="835" y1="155" x2="835" y2="330" stroke="#475569" stroke-width="1"/>

    <text x="590" y="180" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Held \ Req</text>
    <text x="692" y="180" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Read (RL)</text>
    <text x="787" y="180" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Write (WL)</text>
    <text x="880" y="180" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Certify (CL)</text>

    <text x="590" y="222" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Read (RL)</text>
    <text x="692" y="222" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">YES</text>
    <text x="787" y="222" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">YES</text>
    <text x="880" y="222" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>

    <text x="590" y="267" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Write (WL)</text>
    <text x="692" y="267" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">YES</text>
    <text x="787" y="267" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>
    <text x="880" y="267" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>

    <text x="590" y="312" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Certify (CL)</text>
    <text x="692" y="312" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>
    <text x="787" y="312" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>
    <text x="880" y="312" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">NO</text>
  </g>

  <!-- Bottom: Execution Lifecycle Steps -->
  <g filter="url(#shadow)">
    <rect x="50" y="365" width="900" height="195" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect x="50" y="365" width="900" height="30" rx="10" fill="#4f46e5"/>
    <text x="500" y="386" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. Lifecycle of a Transaction under MV2PL</text>

    <text x="70" y="420" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Step 1: Write Phase (Draft Version Creation)</text>
    <text x="85" y="438" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">When T writes X, it acquires WL(X) and creates a private version. Other transactions continue reading the committed old version.</text>

    <text x="70" y="465" fill="#f59e0b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Step 2: Commit Phase (Certify Lock Acquisition)</text>
    <text x="85" y="483" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Before committing, T upgrades all its Write Locks to Certify Locks (CL). CL waits until all active readers of old version finish.</text>

    <text x="70" y="510" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">Step 3: Version Replacement &amp; Release</text>
    <text x="85" y="528" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">The draft version becomes the official committed version. The old version is marked dead. T releases all certify locks.</text>
  </g>

  <!-- Footer -->
  <text x="500" y="582" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">DBMS Unit 5: Concurrency Control Techniques | AKTU BCS501 Semester V</text>
</svg>