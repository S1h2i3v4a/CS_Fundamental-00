<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr07" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg07)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Concurrency Control Protocols &amp; Two-Phase Locking (2PL)</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Shared/Exclusive Locks, Growing &amp; Shrinking Phases, Strict 2PL &amp; Rigorous 2PL</text>

  <!-- LEFT: 2PL PHASES & LOCK POINT -->
  <g transform="translate(35, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. Two-Phase Locking (2PL) Mechanics</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Mathematical Guarantee: 2PL Ensures Conflict Serializability!</text>

    <!-- Growing Phase -->
    <rect x="20" y="65" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">Phase 1: Growing Phase (Expanding)</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Transaction can ACQUIRE locks (Shared or Exclusive).</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• Transaction CANNOT release any lock during this phase!</text>
    <text x="35" y="139" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Lock conversion: Upgrades (S → X) allowed.</text>

    <!-- Lock Point Banner -->
    <rect x="20" y="160" width="410" height="45" rx="6" fill="#064e3b" stroke="#059669"/>
    <text x="225" y="187" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">★ LOCK POINT: Instant when final lock is acquired</text>

    <!-- Shrinking Phase -->
    <rect x="20" y="215" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="237" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#fed7aa">Phase 2: Shrinking Phase (Contracting)</text>
    <text x="35" y="255" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Transaction can RELEASE locks.</text>
    <text x="35" y="272" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• Transaction CANNOT acquire ANY new lock once shrinking starts!</text>
    <text x="35" y="289" font-family="-apple-system, sans-serif" font-size="9" fill="#fbbf24">Lock conversion: Downgrades (X → S) allowed.</text>

    <!-- 2PL Drawbacks -->
    <rect x="20" y="310" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="330" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f87171">Critical 2PL Limitations:</text>
    <text x="35" y="348" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• May suffer from DEADLOCKS (circular lock wait).</text>
    <text x="35" y="365" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Basic 2PL may cause CASCADING ROLLBACKS (requires Strict 2PL).</text>
  </g>

  <!-- RIGHT: 2PL VARIANTS & COMPATIBILITY -->
  <g transform="translate(515, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. Lock Compatibility &amp; 2PL Variants</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Shared vs Exclusive Locks &amp; Industrial Enhancements</text>

    <!-- Lock Matrix -->
    <rect x="20" y="65" width="410" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Lock Compatibility Matrix:</text>
    <text x="35" y="108" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Shared Lock S(A): Compatible with another S(A). [Read-Read OK]</text>
    <text x="35" y="126" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• Exclusive Lock X(A): Incompatible with BOTH S(A) and X(A)!</text>
    <text x="35" y="145" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">If T1 holds X(A), any request for S(A) or X(A) by T2 MUST WAIT.</text>

    <!-- Strict 2PL -->
    <rect x="20" y="175" width="410" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="195" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Strict 2PL (Prevents Cascading Aborts)</text>
    <text x="35" y="213" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">All Exclusive Locks X(A) are held until COMMIT / ABORT!</text>
    <text x="35" y="228" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Guarantees Strict Recoverability. Eliminates dirty reads!</text>

    <!-- Rigorous 2PL -->
    <rect x="20" y="250" width="410" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="270" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">Rigorous 2PL (Serial Order = Commit Order)</text>
    <text x="35" y="288" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">ALL locks (both Shared and Exclusive) are held until COMMIT!</text>
    <text x="35" y="303" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Transactions serialize in exact commit order. Zero dirty reads.</text>

    <!-- Conservative 2PL -->
    <rect x="20" y="325" width="410" height="60" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="345" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Conservative 2PL (Static 2PL)</text>
    <text x="35" y="363" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Transaction locks ALL required items before starting execution.</text>
    <text x="35" y="377" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">✓ 100% Deadlock-Free! ✕ Hard to predict needed items in advance.</text>
  </g>
</svg>