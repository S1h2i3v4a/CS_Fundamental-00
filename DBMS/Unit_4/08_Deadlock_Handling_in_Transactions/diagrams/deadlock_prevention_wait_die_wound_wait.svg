<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg08)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Deadlock Handling in Database Transactions</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Timestamp Schemes (Wait-Die vs Wound-Wait), Wait-For Graph Detection, and Victim Selection</text>

  <!-- TWO COLUMN: DEADLOCK PREVENTION SCHEMES -->
  <!-- Col 1: Wait-Die Scheme -->
  <g transform="translate(35, 85)">
    <rect width="450" height="235" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="225" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">1. Wait-Die Scheme (Non-Preemptive)</text>
    <text x="225" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">&quot;Older transaction WAITS, Younger transaction DIES&quot;</text>

    <rect x="20" y="58" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="78" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Case A: Ti is OLDER than Tj (TS(Ti) &lt; TS(Tj))</text>
    <text x="35" y="96" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Ti requests resource locked by younger Tj.</text>
    <text x="35" y="115" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Action: Ti is ALLOWED TO WAIT.</text>

    <rect x="20" y="142" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="162" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f87171">Case B: Ti is YOUNGER than Tj (TS(Ti) &gt; TS(Tj))</text>
    <text x="35" y="180" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Ti requests resource locked by older Tj.</text>
    <text x="35" y="199" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f87171">Action: Ti DIES (Rolled back and restarted with same TS)!</text>
  </g>

  <!-- Col 2: Wound-Wait Scheme -->
  <g transform="translate(515, 85)">
    <rect width="450" height="235" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399">2. Wound-Wait Scheme (Preemptive)</text>
    <text x="225" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">&quot;Older transaction WOUNDS, Younger transaction WAITS&quot;</text>

    <rect x="20" y="58" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="78" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#38bdf8">Case A: Ti is OLDER than Tj (TS(Ti) &lt; TS(Tj))</text>
    <text x="35" y="96" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Ti requests resource locked by younger Tj.</text>
    <text x="35" y="115" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f87171">Action: Ti WOUNDS Tj! (Tj is preempted &amp; aborted!)</text>

    <rect x="20" y="142" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="162" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#34d399">Case B: Ti is YOUNGER than Tj (TS(Ti) &gt; TS(Tj))</text>
    <text x="35" y="180" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Ti requests resource locked by older Tj.</text>
    <text x="35" y="199" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Action: Ti is ALLOWED TO WAIT.</text>
  </g>

  <!-- BOTTOM: DETECTION VIA WAIT-FOR GRAPH & RECOVERY -->
  <g transform="translate(35, 330)">
    <rect width="930" height="155" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="465" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">3. Deadlock Detection (Wait-For Graph) &amp; Recovery Strategy</text>

    <rect x="20" y="42" width="430" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="63" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fed7aa">Wait-For Graph (WFG) Detection:</text>
    <text x="35" y="80" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Directed edge Ti → Tj: Ti is waiting for Tj to release lock.</text>
    <text x="35" y="96" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• System state has Deadlock ⇔ Wait-For Graph contains a CYCLE!</text>
    <text x="35" y="113" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Background process runs cycle detection periodically.</text>

    <rect x="470" y="42" width="440" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="485" y="63" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">3-Step Deadlock Recovery Strategy:</text>
    <text x="485" y="80" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Selection of Victim: Abort transaction with lowest rollback cost.</text>
    <text x="485" y="96" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Rollback Extent: Partial rollback to savepoint vs Total rollback.</text>
    <text x="485" y="113" font-family="-apple-system, sans-serif" font-size="9.5" fill="#fbbf24">3. Starvation Prevention: Add timestamp aging so same victim</text>
    <text x="485" y="128" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">   is not repeatedly selected and starved!</text>
  </g>
</svg>