<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg12)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Distributed Databases: Storage, Directory &amp; 2PC Protocol</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Data Fragmentation (Horizontal, Vertical, Hybrid), Replication, Directory Access (LDAP) &amp; Two-Phase Commit</text>

  <!-- LEFT: DATA FRAGMENTATION -->
  <g transform="translate(35, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. Distributed Data Fragmentation</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Dividing Relations Across Geographically Dispersed Sites</text>

    <!-- Horizontal -->
    <rect x="20" y="65" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Horizontal Fragmentation (Rows / Tuples)</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">R1 = σ_p(R). Splits table by selection predicate on rows.</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Reconstruction via UNION: R = R1 ∪ R2 ∪ ... ∪ Rk.</text>

    <!-- Vertical -->
    <rect x="20" y="150" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="172" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Vertical Fragmentation (Columns / Attributes)</text>
    <text x="35" y="190" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">R1 = π_A(R). Splits table by columns. MUST include Primary Key!</text>
    <text x="35" y="208" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Reconstruction via NATURAL JOIN: R = R1 ⋈ R2 ⋈ ... ⋈ Rk.</text>
    <text x="35" y="224" font-family="-apple-system, sans-serif" font-size="8.5" fill="#fbbf24">Hybrid/Mixed: Combination of horizontal and vertical splits.</text>

    <!-- 3 Rules -->
    <rect x="20" y="245" width="410" height="135" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="267" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fed7aa">The 3 Sacred Rules of Fragmentation:</text>
    <text x="35" y="287" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Completeness: Every data item in R must belong to some fragment.</text>
    <text x="35" y="307" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Reconstruction: Relation R can be reconstructed via ∪ or ⋈.</text>
    <text x="35" y="327" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">3. Disjointness: Fragments must be non-overlapping (except PK in vertical).</text>
    <text x="35" y="352" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Replication: Full (all sites), Partial (some sites), None (partitioned).</text>
  </g>

  <!-- RIGHT: DIRECTORY SYSTEMS & 2PC PROTOCOL -->
  <g transform="translate(515, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. Directory Systems &amp; 2PC Protocol</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">LDAP Hierarchy &amp; Atomic Distributed Commit</text>

    <!-- Directory System -->
    <rect x="20" y="65" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#93c5fd">Directory System (LDAP / X.500):</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Hierarchical tree database optimized for ultra-fast READS.</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Directory Information Tree (DIT) with Distinguished Names (DN).</text>
    <text x="35" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">DAP (Heavy OSI protocol) vs LDAP (Lightweight TCP/IP standard).</text>

    <!-- Two-Phase Commit -->
    <rect x="20" y="170" width="410" height="210" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="192" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fde68a">Two-Phase Commit (2PC) Protocol:</text>

    <text x="35" y="214" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0">Phase 1: Prepare / Voting Phase</text>
    <text x="35" y="230" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Coordinator sends &lt;prepare&gt; to all participating sites.</text>
    <text x="35" y="246" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Sites write redo/undo logs, acquire locks, and vote &quot;YES&quot; or &quot;NO&quot;.</text>

    <text x="35" y="270" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#a7f3d0">Phase 2: Commit / Decision Phase</text>
    <text x="35" y="286" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• If ALL sites vote &quot;YES&quot; ⇒ Coordinator sends &lt;Global-Commit&gt;!</text>
    <text x="35" y="302" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">• If ANY site votes &quot;NO&quot; (or timeout) ⇒ Coordinator sends &lt;Global-Abort&gt;!</text>
    <text x="35" y="322" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Participants execute final decision and reply with acknowledgment.</text>
    <text x="35" y="342" font-family="-apple-system, sans-serif" font-size="8.5" fill="#34d399">Guarantees distributed Atomicity across multiple database servers!</text>
  </g>
</svg>