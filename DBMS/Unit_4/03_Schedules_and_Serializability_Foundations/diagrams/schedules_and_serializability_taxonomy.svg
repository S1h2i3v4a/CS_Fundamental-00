<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg03" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg03)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Schedules &amp; Serializability Foundations</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Serial Schedules, Non-Serial Interleaving, and the Definition of Equivalence</text>

  <!-- LEFT: SCHEDULE TYPES -->
  <g transform="translate(35, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. Schedule Taxonomy &amp; Classification</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Execution Sequences of Interleaved Operations</text>

    <!-- Serial Schedule -->
    <rect x="20" y="65" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Serial Schedule (Zero Interleaving)</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Transactions execute strictly one after another.</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Next transaction starts ONLY after current commits.</text>
    <text x="35" y="142" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">✓ 100% Consistent by definition! ✕ Poor throughput.</text>

    <!-- Non-Serial Schedule -->
    <rect x="20" y="170" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="192" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">Non-Serial Schedule (Concurrent Interleaving)</text>
    <text x="35" y="210" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Operations of multiple transactions are interleaved.</text>
    <text x="35" y="227" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Maximizes CPU/Disk overlap and system responsiveness.</text>
    <text x="35" y="247" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">⚠ May lead to severe inconsistency if not serializable!</text>

    <!-- Total Serial Schedules formula -->
    <rect x="20" y="275" width="410" height="110" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="297" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Permutations &amp; Combinatorics Formula:</text>
    <text x="35" y="318" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">For n transactions: Total Serial Schedules = n!</text>
    <text x="35" y="338" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">For transactions with n1, n2, ... nk operations:</text>
    <text x="35" y="358" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">Total Non-Serial Schedules = (n1 + n2 + ... + nk)! / (n1! · n2! · ... nk!)</text>
  </g>

  <!-- RIGHT: SERIALIZABILITY PHILOSOPHY -->
  <g transform="translate(515, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. Concept of Serializability</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">The Benchmark for Concurrent Schedule Correctness</text>

    <!-- Definition box -->
    <rect x="20" y="65" width="410" height="115" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">Formal Serializability Definition:</text>
    <text x="35" y="107" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">A non-serial schedule S is defined as Serializable if</text>
    <text x="35" y="125" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">its final database state is EQUIVALENT to the outcome</text>
    <text x="35" y="143" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">of some serial schedule S_serial of the same transactions.</text>
    <text x="35" y="163" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Offers speed of interleaving with correctness of serial order!</text>

    <!-- Two Types of Serializability -->
    <rect x="20" y="190" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="210" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fed7aa">Two Formal Types of Serializability:</text>
    <text x="35" y="230" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Conflict Serializability: Swapping non-conflicting ops.</text>
    <text x="35" y="247" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">   Fast polynomial test O(V + E) via Precedence Graph!</text>
    <text x="35" y="265" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. View Serializability: Matching initial, updated &amp; final reads.</text>
    <text x="35" y="280" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">   NP-Complete problem! Handled via blind writes.</text>

    <!-- Inclusion hierarchy -->
    <rect x="20" y="295" width="410" height="90" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="315" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">Mathematical Hierarchy:</text>
    <text x="35" y="337" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Conflict Serializable ⊂ View Serializable ⊂ All Schedules</text>
    <text x="35" y="358" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Every Conflict Serializable schedule is ALWAYS View Serializable.</text>
    <text x="35" y="372" font-family="-apple-system, sans-serif" font-size="9" fill="#fbbf24">View Serializable schedule without Blind Writes = Conflict Serializable!</text>
  </g>
</svg>