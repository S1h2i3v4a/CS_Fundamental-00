<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg04" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr04" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg04)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Conflict Serializability &amp; Precedence Graph Pipeline</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Conflict Operations, Graph Construction, Cycle Detection &amp; Topological Sort Order</text>

  <!-- LEFT: CONFLICTING OPERATIONS -->
  <g transform="translate(35, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">1. The 3 Conditions for Conflicting Operations</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Two operations Ii and Ij in schedule S conflict iff:</text>

    <!-- Condition box -->
    <rect x="20" y="65" width="410" height="90" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#cbd5e1">1. They belong to DIFFERENT transactions (Ti ≠ Tj).</text>
    <text x="35" y="107" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#cbd5e1">2. They access the EXACT SAME data item (eg: both on A).</text>
    <text x="35" y="127" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f87171">3. At least ONE of the two operations is a WRITE operation!</text>

    <!-- Table of pairs -->
    <rect x="20" y="165" width="410" height="135" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="185" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Conflicting Pairs Matrix:</text>
    <text x="35" y="205" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399">• Read-Read (Ri(A), Rj(A)): NON-CONFLICTING (Can swap safely!)</text>
    <text x="35" y="225" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">• Read-Write (Ri(A), Wj(A)): CONFLICTING (Cannot swap!)</text>
    <text x="35" y="245" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">• Write-Read (Wi(A), Rj(A)): CONFLICTING (Cannot swap!)</text>
    <text x="35" y="265" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">• Write-Write (Wi(A), Wj(A)): CONFLICTING (Cannot swap!)</text>
    <text x="35" y="285" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Swapping non-conflicting adjacent operations preserves final state.</text>

    <!-- Definition Conflict Equivalent -->
    <rect x="20" y="310" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="330" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Conflict Equivalence &amp; Serializability:</text>
    <text x="35" y="350" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">S is conflict serializable iff it can be transformed into a</text>
    <text x="35" y="367" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">serial schedule by repeatedly swapping non-conflicting operations.</text>
  </g>

  <!-- RIGHT: PRECEDENCE GRAPH ALGORITHM -->
  <g transform="translate(515, 85)">
    <rect width="450" height="400" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">2. Precedence Graph (Serialization Graph)</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">The Definite Theorem: Acyclic Graph ⇔ Conflict Serializable</text>

    <!-- Graph rules -->
    <rect x="20" y="65" width="410" height="110" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Graph Construction Rules:</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Vertices (V): All participating transactions {T1, T2, ... Tn}.</text>
    <text x="35" y="123" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Directed Edge (Ti → Tj): Drawn if Ti executes a conflicting</text>
    <text x="35" y="139" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">  operation BEFORE Tj executes its conflicting operation on same item.</text>
    <text x="35" y="157" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">  (Look for Ri-Wj, Wi-Rj, or Wi-Wj where Ti happens before Tj).</text>

    <!-- THEOREM -->
    <rect x="20" y="185" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="207" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">The Core Mathematical Theorem:</text>
    <text x="35" y="227" font-family="-apple-system, sans-serif" font-size="10.5" fill="#34d399">1. If Graph is ACYCLIC (No cycles) ⇒ CONFLICT SERIALIZABLE!</text>
    <text x="35" y="247" font-family="-apple-system, sans-serif" font-size="10.5" fill="#f87171">2. If Graph has a CYCLE ⇒ NOT Conflict Serializable!</text>
    <text x="35" y="265" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Complexity: O(V + E) using Depth-First Search (DFS).</text>

    <!-- Topological Sort -->
    <rect x="20" y="290" width="410" height="95" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="310" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#c084fc">Finding Equivalent Serial Order:</text>
    <text x="35" y="328" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Apply TOPOLOGICAL SORTING on the DAG (Directed Acyclic Graph):</text>
    <text x="35" y="346" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Find node with In-Degree = 0 (Start transaction).</text>
    <text x="35" y="362" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Remove node, decrement neighbor in-degrees, repeat!</text>
    <text x="35" y="377" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Yields the exact serial order: Eg: T1 → T3 → T2.</text>
  </g>
</svg>