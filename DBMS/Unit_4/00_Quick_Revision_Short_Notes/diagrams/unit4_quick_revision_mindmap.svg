<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#bgGrad)"/>
  <rect x="25" y="20" width="1050" height="640" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,6"/>

  <text x="550" y="55" fill="#f8fafc" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="0.5">DBMS UNIT 4: TRANSACTION &amp; RECOVERY ARCHITECTURE</text>
  <text x="550" y="78" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gateway Classes AKTU BCS501 | Master Syllabus Conceptual Map</text>

  <!-- Central Hub -->
  <g filter="url(#shadow)">
    <rect x="420" y="270" width="260" height="110" rx="14" fill="url(#coreGrad)"/>
    <text x="550" y="305" fill="#0f172a" font-family="'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="900" text-anchor="middle">TRANSACTION &amp; RECOVERY</text>
    <text x="550" y="328" fill="#1e293b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ACID, Concurrency &amp; DDBMS</text>
    <rect x="440" y="342" width="220" height="24" rx="6" fill="#0f172a" opacity="0.2"/>
    <text x="550" y="358" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Core DBMS Engine (BCS501)</text>
  </g>

  <!-- Connectors -->
  <path d="M 420 300 C 320 280, 240 210, 190 190" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 420 340 C 310 370, 230 430, 190 480" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 550 270 C 550 200, 550 160, 550 145" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 680 300 C 780 280, 860 210, 910 190" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 680 340 C 790 370, 870 430, 910 480" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Top-Left: Pillar 1 - ACID & Anomalies -->
  <g filter="url(#shadow)">
    <rect x="50" y="115" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="50" y="115" width="280" height="30" rx="10" fill="#0284c7"/>
    <text x="190" y="136" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. ACID &amp; Anomalies</text>
    <text x="65" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Atomicity: All or none (Recovery Mgr)</text>
    <text x="65" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Consistency: Integrity invariants preserved</text>
    <text x="65" y="205" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Isolation: Concurrency control</text>
    <text x="65" y="225" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Durability: Committed data survives crash</text>
    <text x="65" y="245" fill="#fca5a5" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Anomalies: Dirty Read, Lost Update, Phantom</text>
  </g>

  <!-- Top Center: Pillar 2 - Serializability -->
  <g filter="url(#shadow)">
    <rect x="410" y="95" width="280" height="135" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="2"/>
    <rect x="410" y="95" width="280" height="30" rx="10" fill="#059669"/>
    <text x="550" y="116" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Serializability</text>
    <text x="425" y="145" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Conflict Serializability (CSR): Acyclic graph</text>
    <text x="425" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Precedence Graph: Topological sort = Serial order</text>
    <text x="425" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• View Serializability (VSR): 3 Equivalence rules</text>
    <text x="425" y="205" fill="#6ee7b7" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Blind Write: W(X) without prior R(X) (NP-Complete)</text>
  </g>

  <!-- Top-Right: Pillar 3 - Concurrency Control & 2PL -->
  <g filter="url(#shadow)">
    <rect x="770" y="115" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#a855f7" stroke-width="2"/>
    <rect x="770" y="115" width="280" height="30" rx="10" fill="#7c3aed"/>
    <text x="910" y="136" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">3. 2PL &amp; Concurrency Control</text>
    <text x="785" y="165" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Basic 2PL: Growing &amp; Shrinking Phase</text>
    <text x="785" y="185" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Strict 2PL: Hold X-locks till Commit (No cascade)</text>
    <text x="785" y="205" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Rigorous 2PL: Hold S &amp; X locks till Commit</text>
    <text x="785" y="225" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Deadlock: Wait-Die vs Wound-Wait schemes</text>
    <text x="785" y="245" fill="#d8b4fe" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">WFG Detection: Cycle = Deadlock victim selection</text>
  </g>

  <!-- Bottom-Left: Pillar 4 - Recovery Architecture -->
  <g filter="url(#shadow)">
    <rect x="50" y="420" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#f43f5e" stroke-width="2"/>
    <rect x="50" y="420" width="280" height="30" rx="10" fill="#e11d48"/>
    <text x="190" y="441" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">4. Log Recovery &amp; WAL</text>
    <text x="65" y="470" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• WAL Rule: Log flushed before disk write</text>
    <text x="65" y="490" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Deferred DB Mod: Redo only (No Undo)</text>
    <text x="65" y="510" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Immediate DB Mod: Both Undo &amp; Redo</text>
    <text x="65" y="530" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Checkpoints: Limits backward log scan</text>
    <text x="65" y="550" fill="#fda4af" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Shadow Paging: Atomic pointer swap, no log</text>
  </g>

  <!-- Bottom-Right: Pillar 5 - Distributed Databases -->
  <g filter="url(#shadow)">
    <rect x="770" y="420" width="280" height="150" rx="10" fill="url(#cardGrad1)" stroke="#fbbf24" stroke-width="2"/>
    <rect x="770" y="420" width="280" height="30" rx="10" fill="#d97706"/>
    <text x="910" y="441" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">5. Distributed DB &amp; Directory</text>
    <text x="785" y="470" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Fragmentation: Horizontal (σ), Vertical (π)</text>
    <text x="785" y="490" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Correctness: Completeness, Reconstruct, Disjoint</text>
    <text x="785" y="510" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Directory Systems: LDAP, X.500, DIT hierarchy</text>
    <text x="785" y="530" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">• Two-Phase Commit (2PC): Prepare &amp; Commit</text>
    <text x="785" y="550" fill="#fde68a" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Atomic Commitment: Global Commit / Global Abort</text>
  </g>

  <!-- Bottom Center: Exam Cheat Key -->
  <rect x="360" y="480" width="380" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="550" y="505" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">AKTU BCS501 EXAM CHEAT RULES</text>
  <text x="375" y="525" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Cycle in Graph ⇒ NOT Conflict Serializable</text>
  <text x="375" y="542" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• No Blind Writes + Not CSR ⇒ NEVER View Serializable</text>
  <text x="375" y="559" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">• Strict 2PL: All Exclusive locks held till End of Transaction</text>

  <!-- Footer -->
  <text x="550" y="650" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DBMS Unit 4 Complete Architecture | Computer Science &amp; Engineering | AKTU Semester V</text>
</svg>