<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg13)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">AKTU Unit 4 Master Examination Solving Flowchart</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">The 4-Step Decision Pipeline for Scoring Full 10 Marks in Schedule &amp; Recovery Numericals</text>

  <!-- STEP 1 -->
  <g transform="translate(40, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Step 1: Conflict Graph</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Extract RAW, WAR, WAW pairs.</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Draw directed edge Ti → Tj.</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">Acyclic? ⇒ Conflict Serializable!</text>
  </g>

  <!-- ARROW 1 -->
  <line x1="250" y1="135" x2="275" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr13)"/>

  <!-- STEP 2 -->
  <g transform="translate(280, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Step 2: View &amp; Blind Writes</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• If acyclic ⇒ Already View Ser.</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• If cycle + NO blind write ⇒ NOT!</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#fbbf24">Blind write present? Test 3 rules.</text>
  </g>

  <!-- ARROW 2 -->
  <line x1="490" y1="135" x2="515" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr13)"/>

  <!-- STEP 3 -->
  <g transform="translate(520, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Step 3: Recoverability Audit</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Look for W1(A) → R2(A) dirty read.</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Commit(T1) &lt; Commit(T2)?</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">Yes ⇒ Recoverable. Check ACA/Strict.</text>
  </g>

  <!-- ARROW 3 -->
  <line x1="730" y1="135" x2="755" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr13)"/>

  <!-- STEP 4 -->
  <g transform="translate(760, 90)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.6"/>
    <text x="100" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Step 4: Log Checkpoint Trace</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Find last &lt;checkpoint L&gt;.</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Committed after CP ⇒ REDO.</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Uncommitted at crash ⇒ UNDO.</text>
  </g>

  <!-- BOTTOM CHECKLIST PANEL -->
  <g transform="translate(40, 210)">
    <rect width="920" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="460" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">Standard Examination Question Patterns &amp; Formulas</text>

    <!-- Pattern 1 -->
    <rect x="20" y="50" width="430" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="72" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Deadlock Prevention Timestamp Checks</text>
    <text x="35" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Wait-Die: TS(Ti) &lt; TS(Tj) ⇒ Ti waits; TS(Ti) &gt; TS(Tj) ⇒ Ti dies.</text>
    <text x="35" y="108" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Wound-Wait: TS(Ti) &lt; TS(Tj) ⇒ Ti wounds Tj; TS(Ti) &gt; TS(Tj) ⇒ Ti waits.</text>
    <text x="35" y="128" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">Younger transaction has HIGHER timestamp number!</text>

    <!-- Pattern 2 -->
    <rect x="470" y="50" width="430" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="485" y="72" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#c084fc">Distributed Fragmentation Formulas</text>
    <text x="485" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Horizontal Reconstruction: R = R1 ∪ R2 ∪ ... ∪ Rk</text>
    <text x="485" y="108" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Vertical Reconstruction: R = R1 ⋈ R2 ⋈ ... ⋈ Rk</text>
    <text x="485" y="128" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">Vertical fragments must share Primary Key for lossless natural join!</text>

    <!-- Pattern 3 -->
    <rect x="20" y="165" width="880" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="188" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">AKTU Full Marks Scoring Strategy</text>
    <text x="35" y="208" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Explicitly list all conflicting operations with timestamp order: &quot;W1(A) before R2(A)&quot;.</text>
    <text x="35" y="224" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Draw the Precedence Graph clearly with arrows and state: &quot;Since graph contains NO cycle, schedule is Conflict Serializable&quot;.</text>
    <text x="35" y="240" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">3. Show topological sort step-by-step with in-degrees to state equivalent serial schedule.</text>
    <text x="35" y="256" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">4. For log recovery, present distinct &quot;Undo List&quot; and &quot;Redo List&quot; tables with justification.</text>
  </g>
</svg>