<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg10)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Log-Based Recovery &amp; Write-Ahead Logging (WAL)</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Log Record Anatomy, WAL Invariant, Deferred vs Immediate Modification &amp; Undo/Redo Logic</text>

  <!-- TOP BANNER: WAL PROTOCOL -->
  <g transform="translate(35, 80)">
    <rect width="930" height="100" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="30" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">The Write-Ahead Logging (WAL) Sacred Protocol:</text>
    <text x="30" y="52" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">1. Before database page on disk is updated with new value V_new, the log record MUST be written to stable storage!</text>
    <text x="30" y="70" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">2. Before &lt;Ti commit&gt; log record is confirmed to user, ALL preceding log records for Ti MUST be flushed to disk.</text>
    <text x="30" y="88" font-family="-apple-system, sans-serif" font-size="10.5" fill="#34d399">Guarantee: If crash occurs mid-flight, recovery manager always has log history to Undo or Redo!</text>
  </g>

  <!-- TWO COLUMN: DEFERRED VS IMMEDIATE -->
  <g transform="translate(35, 195)">
    <rect width="450" height="295" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#34d399">1. Deferred Database Modification</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">&quot;No-Undo / Redo-Only&quot; Recovery Policy</text>

    <rect x="20" y="65" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Mechanism:</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Physical disk updates are POSTPONED until AFTER commit!</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• While active, writes are recorded ONLY in log file and memory.</text>
    <text x="35" y="139" font-family="-apple-system, sans-serif" font-size="9" fill="#fbbf24">Log records only need NEW value: &lt;Ti, X, V_new&gt;</text>

    <rect x="20" y="160" width="410" height="115" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="182" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Crash Recovery Action:</text>
    <text x="35" y="202" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• If log has &lt;Ti start&gt; and &lt;Ti commit&gt; ⇒ REDO(Ti).</text>
    <text x="35" y="222" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• If log has &lt;Ti start&gt; but NO commit ⇒ NO ACTION NEEDED!</text>
    <text x="35" y="242" font-family="-apple-system, sans-serif" font-size="9.5" fill="#a7f3d0">  (Since uncommitted data was never written to disk!).</text>
    <text x="35" y="260" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">✓ Zero Undo overhead! ✕ Requires large memory buffers.</text>
  </g>

  <g transform="translate(515, 195)">
    <rect width="450" height="295" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#fbbf24">2. Immediate Database Modification</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">&quot;Undo / Redo&quot; Standard Enterprise Policy</text>

    <rect x="20" y="65" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fed7aa">Mechanism:</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Database disk can be updated while transaction is ACTIVE.</text>
    <text x="35" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Disk may contain uncommitted &quot;dirty&quot; updates at any time.</text>
    <text x="35" y="139" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Log records MUST have BOTH values: &lt;Ti, X, V_old, V_new&gt;</text>

    <rect x="20" y="160" width="410" height="115" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="182" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Crash Recovery Action:</text>
    <text x="35" y="202" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• If log has &lt;Ti start&gt; and &lt;Ti commit&gt; ⇒ REDO(Ti).</text>
    <text x="35" y="222" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• If log has &lt;Ti start&gt; but NO commit ⇒ UNDO(Ti)!</text>
    <text x="35" y="242" font-family="-apple-system, sans-serif" font-size="9.5" fill="#fca5a5">  (Restores X = V_old to eliminate dirty uncommitted changes).</text>
    <text x="35" y="260" font-family="-apple-system, sans-serif" font-size="9" fill="#38bdf8">Idempotency Guarantee: Redo(Redo) = Redo, Undo(Undo) = Undo.</text>
  </g>
</svg>