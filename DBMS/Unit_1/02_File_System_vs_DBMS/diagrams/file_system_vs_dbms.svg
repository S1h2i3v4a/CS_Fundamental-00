<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg02" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrGreen02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg02)" rx="16"/>
  <text x="500" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">File Processing System vs Database Management System</text>
  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Architectural Breakdown of Siloed Files vs Centralized ACID Engine</text>

  <!-- LEFT: FILE PROCESSING SYSTEM (PROBLEMS) -->
  <g transform="translate(40, 85)">
    <rect width="430" height="405" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="430" height="34" rx="10" fill="#7f1d1d"/>
    <text x="215" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#fca5a5">TRADITIONAL FILE PROCESSING SYSTEM</text>

    <!-- App 1 -->
    <rect x="25" y="50" width="165" height="40" rx="5" fill="#0f172a" stroke="#ef4444"/>
    <text x="107" y="74" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Admissions App</text>
    
    <line x1="190" y1="70" x2="235" y2="70" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>
    
    <rect x="240" y="50" width="165" height="40" rx="5" fill="#450a0a" stroke="#ef4444"/>
    <text x="322" y="74" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5">student_adm.dat</text>

    <!-- App 2 -->
    <rect x="25" y="110" width="165" height="40" rx="5" fill="#0f172a" stroke="#ef4444"/>
    <text x="107" y="134" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Accounts App</text>
    
    <line x1="190" y1="130" x2="235" y2="130" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>
    
    <rect x="240" y="110" width="165" height="40" rx="5" fill="#450a0a" stroke="#ef4444"/>
    <text x="322" y="134" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5">student_fee.csv</text>

    <!-- App 3 -->
    <rect x="25" y="170" width="165" height="40" rx="5" fill="#0f172a" stroke="#ef4444"/>
    <text x="107" y="194" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">Library App</text>
    
    <line x1="190" y1="190" x2="235" y2="190" stroke="#ef4444" stroke-width="2" marker-end="url(#arrRed)"/>
    
    <rect x="240" y="170" width="165" height="40" rx="5" fill="#450a0a" stroke="#ef4444"/>
    <text x="322" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5">lib_borrow.txt</text>

    <!-- Problem callout -->
    <rect x="20" y="230" width="390" height="155" rx="6" fill="#0f172a" stroke="#b91c1c"/>
    <text x="30" y="250" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f87171">Critical Vulnerabilities &amp; Flaws:</text>
    <text x="30" y="272" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Data Redundancy: Student info duplicated in 3 files!</text>
    <text x="30" y="292" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Data Inconsistency: Updating phone in App 1 leaves</text>
    <text x="40" y="308" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">stale outdated data in App 2 &amp; 3.</text>
    <text x="30" y="328" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Integrity: Balance ≥ 0 hard-coded in C/Java apps.</text>
    <text x="30" y="348" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Concurrency: Race conditions corrupt overlapping writes.</text>
    <text x="30" y="368" font-family="-apple-system, sans-serif" font-size="9.5" fill="#fca5a5">• Atomicity: Crash midway leaves corrupted partial files.</text>
  </g>

  <!-- RIGHT: MODERN DBMS (SOLUTIONS) -->
  <g transform="translate(530, 85)">
    <rect width="430" height="405" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="430" height="34" rx="10" fill="#064e3b"/>
    <text x="215" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#6ee7b7">DATABASE MANAGEMENT SYSTEM (DBMS)</text>

    <!-- Apps -->
    <rect x="20" y="50" width="115" height="36" rx="5" fill="#0f172a" stroke="#10b981"/>
    <text x="77" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">Admissions</text>

    <rect x="155" y="50" width="115" height="36" rx="5" fill="#0f172a" stroke="#10b981"/>
    <text x="212" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">Accounts</text>

    <rect x="290" y="50" width="115" height="36" rx="5" fill="#0f172a" stroke="#10b981"/>
    <text x="347" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">Library</text>

    <!-- Connectors to DBMS -->
    <line x1="77" y1="86" x2="215" y2="115" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen02)"/>
    <line x1="212" y1="86" x2="215" y2="115" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen02)"/>
    <line x1="347" y1="86" x2="215" y2="115" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrGreen02)"/>

    <!-- Central DBMS Engine -->
    <rect x="40" y="120" width="350" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="215" y="142" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">CENTRAL DBMS ENGINE</text>
    <text x="215" y="160" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Query Optimizer | Transaction Manager (ACID) | Lock Table</text>
    <text x="215" y="176" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Unified Catalog | Security &amp; Authorization Enforcer</text>
    <text x="215" y="192" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Integrity Constraints Enforced at Database Boundary</text>

    <!-- DB Storage -->
    <line x1="215" y1="205" x2="215" y2="235" stroke="#10b981" stroke-width="2" marker-end="url(#arrGreen02)"/>
    <rect x="70" y="240" width="290" height="42" rx="6" fill="#022c22" stroke="#10b981"/>
    <text x="215" y="258" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">Centralized Database Repository</text>
    <text x="215" y="272" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#cbd5e1">Single Source of Truth (Zero Redundancy)</text>

    <!-- Advantages -->
    <rect x="20" y="300" width="390" height="90" rx="6" fill="#0f172a" stroke="#047857"/>
    <text x="30" y="318" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Key DBMS Advantages:</text>
    <text x="30" y="336" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Minimum Redundancy &amp; Guaranteed Consistency</text>
    <text x="30" y="352" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Declarative SQL: No need to write C code for queries</text>
    <text x="30" y="368" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Automatic Crash Recovery &amp; Serializability Locking</text>
  </g>
</svg>
