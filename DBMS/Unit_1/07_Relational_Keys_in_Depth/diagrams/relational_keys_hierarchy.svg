<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg07" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrFK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg07)" rx="16"/>
  <text x="500" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Relational Keys Mathematical Hierarchy</text>
  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Super Key ⊃ Candidate Key ⊃ Primary Key | Foreign Key Referencing Integrity</text>

  <!-- LEFT: MATHEMATICAL VENN DIAGRAM -->
  <g transform="translate(40, 85)">
    <rect width="440" height="405" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="440" height="34" rx="10" fill="#1e3a8a"/>
    <text x="220" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">KEYS SUBSET HIERARCHY (VENN DIAGRAM)</text>

    <!-- Super Key Circle (Largest) -->
    <ellipse cx="220" cy="230" rx="190" ry="150" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <text x="220" y="115" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#60a5fa">SUPER KEYS (SK)</text>
    <text x="220" y="132" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Any attribute set uniquely identifying rows (e.g. {RollNo, Name})</text>

    <!-- Candidate Key Circle -->
    <ellipse cx="220" cy="255" rx="145" ry="110" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="220" y="180" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#34d399">CANDIDATE KEYS (CK)</text>
    <text x="220" y="195" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">Minimal Super Keys (No redundant attributes)</text>

    <!-- Primary Key & Alternate Key Splits -->
    <g transform="translate(100, 220)">
      <!-- PK -->
      <rect width="115" height="110" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
      <text x="57" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">PRIMARY KEY</text>
      <text x="57" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5f3fc">(PK)</text>
      <text x="57" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#cbd5e1">Chosen by DBA</text>
      <text x="57" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#fde68a">NOT NULL</text>
      <text x="57" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#fde68a">UNIQUE</text>

      <!-- Alternate Key -->
      <rect x="125" width="115" height="110" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
      <text x="182" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#f8fafc">ALTERNATE KEY</text>
      <text x="182" y="44" text-anchor="middle" font-family="monospace" font-size="10" fill="#fde68a">(AK)</text>
      <text x="182" y="70" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8.5" fill="#cbd5e1">CKs not chosen</text>
      <text x="182" y="85" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#cbd5e1">as Primary Key</text>
      <text x="182" y="98" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="8" fill="#94a3b8">(e.g. Email)</text>
    </g>
  </g>

  <!-- RIGHT: FOREIGN KEY & REFERENTIAL INTEGRITY -->
  <g transform="translate(520, 85)">
    <rect width="440" height="405" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="440" height="34" rx="10" fill="#064e3b"/>
    <text x="220" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399">FOREIGN KEY REFERENTIAL INTEGRITY</text>

    <!-- Referenced Table (Department) -->
    <g transform="translate(20, 50)">
      <rect width="400" height="95" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="200" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">DEPARTMENT (Referenced Relation / Parent)</text>
      
      <!-- Table rows -->
      <rect x="15" y="32" width="180" height="24" fill="#1e3a8a"/>
      <text x="105" y="48" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">Dept_ID (Primary Key)</text>

      <rect x="195" y="32" width="190" height="24" fill="#334155"/>
      <text x="290" y="48" text-anchor="middle" font-family="monospace" font-size="10" fill="#f8fafc">Dept_Name</text>

      <rect x="15" y="58" width="180" height="26" fill="#0f172a"/>
      <text x="105" y="75" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#a5f3fc">10 (CS)</text>

      <rect x="195" y="58" width="190" height="26" fill="#0f172a"/>
      <text x="290" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">Computer Science</text>
    </g>

    <!-- Arrow from Foreign Key to Primary Key -->
    <path d="M 120 235 L 120 180 Q 120 150 105 140" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrFK)"/>

    <!-- Referencing Table (Employee) -->
    <g transform="translate(20, 205)">
      <rect width="400" height="95" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="200" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#93c5fd">EMPLOYEE (Referencing Relation / Child)</text>

      <rect x="15" y="32" width="100" height="24" fill="#334155"/>
      <text x="65" y="48" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#f8fafc">Emp_ID (PK)</text>

      <rect x="115" y="32" width="130" height="24" fill="#065f46"/>
      <text x="180" y="48" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#34d399">Dept_ID (Foreign Key)</text>

      <rect x="245" y="32" width="140" height="24" fill="#334155"/>
      <text x="315" y="48" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#f8fafc">Emp_Name</text>

      <rect x="15" y="58" width="100" height="26" fill="#0f172a"/>
      <text x="65" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">E101</text>

      <rect x="115" y="58" width="130" height="26" fill="#022c22"/>
      <text x="180" y="75" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#6ee7b7">10 (Valid FK)</text>

      <rect x="245" y="58" width="140" height="26" fill="#0f172a"/>
      <text x="315" y="75" text-anchor="middle" font-family="monospace" font-size="10" fill="#cbd5e1">Shivam</text>
    </g>

    <!-- Referential Integrity Rule Summary -->
    <rect x="20" y="320" width="400" height="68" rx="6" fill="#0f172a" stroke="#059669"/>
    <text x="30" y="340" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="bold" fill="#34d399">Referential Integrity Constraint Rule:</text>
    <text x="30" y="358" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Foreign key value MUST either match an existing Primary Key</text>
    <text x="30" y="374" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">value in the referenced table, OR it must be explicitly NULL.</text>
  </g>
</svg>
