<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1000" height="520" fill="url(#bg12)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">AKTU Exam Normalization Decision Tree</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Step-by-Step Numerical Solving Pipeline for 10-Mark AKTU Semester Questions</text>

  <!-- STEP 1 -->
  <g transform="translate(40, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Step 1: Candidate Keys</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Partition LHS/RHS.</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Compute closures X⁺.</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">Identify Prime &amp; Non-Prime</text>
  </g>

  <!-- ARROW 1 -->
  <line x1="250" y1="135" x2="275" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>

  <!-- STEP 2 -->
  <g transform="translate(280, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Step 2: Check 2NF</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• Look for Partial FDs:</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">  Proper subset CK → Non-Prime?</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">If YES → FAILS 2NF. Decompose!</text>
  </g>

  <!-- ARROW 2 -->
  <line x1="490" y1="135" x2="515" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>

  <!-- STEP 3 -->
  <g transform="translate(520, 90)">
    <rect width="210" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="105" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Step 3: Check 3NF</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• For each non-trivial X → Y:</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">  Is X a Super Key?</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">  OR is Y a Prime Attribute?</text>
  </g>

  <!-- ARROW 3 -->
  <line x1="730" y1="135" x2="755" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr12)"/>

  <!-- STEP 4 -->
  <g transform="translate(760, 90)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.6"/>
    <text x="100" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c084fc">Step 4: Check BCNF</text>
    <text x="15" y="50" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">• For every X → Y:</text>
    <text x="15" y="66" font-family="-apple-system, sans-serif" font-size="9" fill="#f43f5e">  Is X strictly a Super Key?</text>
    <text x="15" y="82" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Zero prime exceptions!</text>
  </g>

  <!-- BOTTOM: VERIFICATION & DECOMPOSITION STRATEGY -->
  <g transform="translate(40, 210)">
    <rect width="920" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="460" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#38bdf8">Final Step: Lossless Join &amp; Dependency Preservation Audit</text>

    <!-- Box 1 -->
    <rect x="20" y="50" width="430" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="72" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#34d399">Decomposition into 3NF (Lossless + Preserving)</text>
    <text x="35" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Compute Canonical Cover Fc.</text>
    <text x="35" y="108" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Ri = X ∪ Y for each X → Y ∈ Fc.</text>
    <text x="35" y="124" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">3. Add candidate key relation if not present.</text>
    <text x="35" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#a7f3d0">✓ Guarantees BOTH Lossless Join AND Dependency Preservation!</text>

    <!-- Box 2 -->
    <rect x="470" y="50" width="430" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="485" y="72" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#c084fc">Decomposition into BCNF (Lossless Guaranteed)</text>
    <text x="485" y="92" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Find dependency X → Y violating BCNF (X not Super Key).</text>
    <text x="485" y="108" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Decompose R into R1(X ∪ Y) and R2(R - Y).</text>
    <text x="485" y="124" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">3. Repeat recursively for sub-relations not in BCNF.</text>
    <text x="485" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">⚠ Check if any FD was lost! Document trade-off.</text>

    <!-- Box 3 -->
    <rect x="20" y="165" width="880" height="100" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="188" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#fbbf24">AKTU High-Scoring Examination Presentation Checklist</text>
    <text x="35" y="208" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. Explicitly list Candidate Keys with step-by-step closures.</text>
    <text x="35" y="224" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. List Prime vs Non-Prime attributes in clear bullet points.</text>
    <text x="35" y="240" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">3. Write each FD and state test outcome: &quot;Holds 2NF because... Holds 3NF because...&quot;</text>
    <text x="35" y="256" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">4. Draw final schema diagram with primary keys underlined.</text>
  </g>
</svg>