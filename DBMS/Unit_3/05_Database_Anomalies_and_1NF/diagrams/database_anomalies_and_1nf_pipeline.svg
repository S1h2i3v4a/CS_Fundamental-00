<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg05)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Database Anomalies &amp; First Normal Form (1NF)</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">The Pitfalls of Data Redundancy: Insertion, Deletion, Update Anomalies &amp; Atomic Domain Enforcement</text>

  <!-- TOP SUMMARY: THE 3 ANOMALIES -->
  <g transform="translate(35, 80)">
    <rect width="930" height="200" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.8"/>
    <text x="465" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Root Cause: Data Redundancy &amp; Unnormalized Relation Flaws</text>

    <!-- Anomaly 1: Insertion -->
    <rect x="20" y="48" width="280" height="135" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="70" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">1. Insertion Anomaly</text>
    <text x="35" y="90" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Cannot insert independent entity</text>
    <text x="35" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">without parent or primary key.</text>
    <text x="35" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Pitfall: Cannot add new Department</text>
    <text x="35" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">until at least one student enrolls</text>
    <text x="35" y="155" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">(Primary Key cannot be NULL!).</text>

    <!-- Anomaly 2: Deletion -->
    <rect x="325" y="48" width="280" height="135" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="340" y="70" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">2. Deletion Anomaly</text>
    <text x="340" y="90" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Deleting one record inadvertently</text>
    <text x="340" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">erases critical secondary facts.</text>
    <text x="340" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Pitfall: Deleting the last student in</text>
    <text x="340" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Civil Engineering permanently destroys</text>
    <text x="340" y="155" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">all Department and HOD data!</text>

    <!-- Anomaly 3: Update -->
    <rect x="630" y="48" width="280" height="135" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="70" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#fca5a5">3. Update Anomaly</text>
    <text x="645" y="90" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Redundant data stored across rows</text>
    <text x="645" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">leads to severe inconsistency.</text>
    <text x="645" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Pitfall: If Dept HOD changes,</text>
    <text x="645" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">updating 500 student rows is required;</text>
    <text x="645" y="155" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">missing 1 row creates split data.</text>
  </g>

  <!-- BOTTOM: FIRST NORMAL FORM (1NF) -->
  <g transform="translate(35, 300)">
    <rect width="930" height="190" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <text x="465" y="28" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">First Normal Form (1NF) — Atomic Value Mandate</text>

    <!-- Rule 1: Multi-Valued Attributes -->
    <rect x="20" y="45" width="280" height="130" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="35" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">Eliminate Multivalued Values</text>
    <text x="35" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">A cell must contain only 1 value.</text>
    <text x="35" y="103" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Violation: Phone: [981..., 942...]</text>
    <text x="35" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Fix: Split into separate rows or</text>
    <text x="35" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">a dedicated Student_Phone table.</text>

    <!-- Rule 2: Composite Attributes -->
    <rect x="325" y="45" width="280" height="130" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="340" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">Decompose Composite Values</text>
    <text x="340" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Attributes must be indivisible.</text>
    <text x="340" y="103" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Violation: Name: &quot;Dr. Amit Sharma&quot;</text>
    <text x="340" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Fix: Decompose into First_Name,</text>
    <text x="340" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Middle_Name, Last_Name fields.</text>

    <!-- Rule 3: Repeating Groups -->
    <rect x="630" y="45" width="280" height="130" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="645" y="68" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#a7f3d0">Eliminate Repeating Groups</text>
    <text x="645" y="88" font-family="-apple-system, sans-serif" font-size="9" fill="#cbd5e1">Fixed numbered columns are invalid.</text>
    <text x="645" y="103" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">Violation: Skill_1, Skill_2, Skill_3...</text>
    <text x="645" y="125" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">Fix: Normalized relation with composite</text>
    <text x="645" y="140" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">key: {Emp_ID, Skill}.</text>
  </g>
</svg>