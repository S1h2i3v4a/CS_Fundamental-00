<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg08" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg08)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Boyce-Codd Normal Form (BCNF) Architecture</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Strict Determinant Requirement: Every LHS Must Be a Super Key &amp; 3NF vs BCNF Trade-Offs</text>

  <!-- BCNF CONDITION BANNER -->
  <g transform="translate(35, 80)">
    <rect width="930" height="95" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.8"/>
    <text x="30" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#c084fc">Boyce-Codd Normal Form (BCNF / Strict 3.5NF):</text>
    <text x="30" y="52" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">Relation R is in BCNF iff for every non-trivial functional dependency X → Y:</text>
    <text x="50" y="75" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f43f5e">X MUST BE A SUPER KEY OF R.  (No exceptions! Zero prime relaxers!)</text>
  </g>

  <!-- TWO COLUMN: 3NF vs BCNF COMPARISON -->
  <g transform="translate(35, 190)">
    <rect width="450" height="305" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#60a5fa">3NF vs BCNF Strict Comparison</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Mathematical Inclusions &amp; Trade-Offs</text>

    <rect x="20" y="65" width="410" height="60" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="85" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Inclusion Hierarchy</text>
    <text x="30" y="103" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">BCNF ⊂ 3NF ⊂ 2NF ⊂ 1NF</text>
    <text x="30" y="117" font-family="-apple-system, sans-serif" font-size="8.5" fill="#94a3b8">Every BCNF is 3NF. But not every 3NF is BCNF!</text>

    <rect x="20" y="135" width="410" height="75" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="155" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Lossless Join Property</text>
    <text x="30" y="173" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• 3NF Decomposition: Always Lossless (Non-additive).</text>
    <text x="30" y="190" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• BCNF Decomposition: Always Lossless.</text>

    <rect x="20" y="220" width="410" height="70" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="240" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f87171">Dependency Preservation (The Critical Divergence)</text>
    <text x="30" y="258" font-family="-apple-system, sans-serif" font-size="9.5" fill="#34d399">• 3NF: ALWAYS preserves all functional dependencies.</text>
    <text x="30" y="275" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">• BCNF: MAY LOSE functional dependencies upon split!</text>
  </g>

  <!-- RIGHT: CLASSIC BCNF ANOMALY EXAMPLE -->
  <g transform="translate(515, 190)">
    <rect width="450" height="305" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#fbbf24">Classic Gateway BCNF Problem</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Relation R(Student, Subject, Teacher)</text>

    <rect x="20" y="65" width="410" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="85" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fed7aa">Given Dependencies:</text>
    <text x="30" y="103" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">1. {Student, Subject} → Teacher</text>
    <text x="30" y="120" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">2. Teacher → Subject  (Each teacher teaches 1 subject)</text>
    <text x="30" y="137" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">Candidate Keys: {Student, Subject} and {Student, Teacher}</text>

    <rect x="20" y="160" width="410" height="125" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="180" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fbbf24">Why it is in 3NF but NOT in BCNF:</text>
    <text x="30" y="198" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">In Teacher → Subject:</text>
    <text x="30" y="215" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">• Teacher is NOT a Super Key (Fails BCNF!).</text>
    <text x="30" y="232" font-family="-apple-system, sans-serif" font-size="9.5" fill="#34d399">• Subject IS a Prime Attribute (Passes 3NF!).</text>
    <text x="30" y="252" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">Decomposing into R1(Teacher, Subject) &amp; R2(Student, Teacher)</text>
    <text x="30" y="268" font-family="-apple-system, sans-serif" font-size="9" fill="#f87171">LOSES the dependency {Student, Subject} → Teacher!</text>
  </g>
</svg>