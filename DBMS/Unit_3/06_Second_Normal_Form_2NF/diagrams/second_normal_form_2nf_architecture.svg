<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg06" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="520" fill="url(#bg06)" rx="16"/>
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Second Normal Form (2NF) Architecture</text>
  <text x="500" y="60" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">Eliminating Partial Functional Dependencies: Prime Attribute vs Non-Prime Attribute Separation</text>

  <!-- FORMAL DEFINITION HERO PANEL -->
  <g transform="translate(35, 80)">
    <rect width="930" height="100" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
    <text x="30" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Formal Definition of 2NF:</text>
    <text x="30" y="52" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">1. The relation schema R must be in 1NF (all attributes atomic).</text>
    <text x="30" y="70" font-family="-apple-system, sans-serif" font-size="11.5" fill="#cbd5e1">2. NO Non-Prime attribute is partially dependent on ANY candidate key of R.</text>
    <text x="30" y="88" font-family="-apple-system, sans-serif" font-size="10.5" fill="#fbbf24">Rule: If X → Y and Y is Non-Prime, then X CANNOT be a proper subset of any Candidate Key!</text>
  </g>

  <!-- TWO COLUMN COMPARISON & DECOMPOSITION -->
  <!-- Col 1: Partial Dependency Violation -->
  <g transform="translate(35, 195)">
    <rect width="450" height="295" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#f87171">Violation Case: Partial Dependency</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Relation R(EmpID, ProjID, EmpName, ProjName, Hours)</text>

    <!-- Visual Key Breakdown -->
    <rect x="20" y="65" width="410" height="70" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="87" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#38bdf8">Candidate Key: {EmpID, ProjID}  (Composite)</text>
    <text x="30" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Prime Attributes = {EmpID, ProjID}</text>
    <text x="30" y="122" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Non-Prime Attributes = {EmpName, ProjName, Hours}</text>

    <!-- Deficiencies -->
    <rect x="20" y="145" width="410" height="130" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="167" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#fca5a5">Partial Dependencies Detected:</text>
    <text x="30" y="187" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">• EmpID → EmpName  [EmpID ⊂ Key, EmpName is Non-Prime!]</text>
    <text x="30" y="205" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">• ProjID → ProjName [ProjID ⊂ Key, ProjName is Non-Prime!]</text>
    <text x="30" y="225" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399">• {EmpID, ProjID} → Hours  [Full Dependency, Perfectly OK]</text>
    <text x="30" y="250" font-family="-apple-system, sans-serif" font-size="9.5" fill="#fbbf24">Verdict: 2NF VIOLATED! Causes massive redundancy.</text>
  </g>

  <!-- Col 2: Normalized 2NF Relations -->
  <g transform="translate(515, 195)">
    <rect width="450" height="295" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.6"/>
    <text x="225" y="30" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="bold" fill="#34d399">Decomposition into 2NF Relations</text>
    <text x="225" y="48" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94a3b8">Lossless &amp; Dependency Preserving Splitting</text>

    <!-- Table 1 -->
    <rect x="20" y="65" width="410" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="87" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">R1(EmpID, EmpName)</text>
    <text x="30" y="105" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Key: EmpID. Simple candidate key.</text>
    <text x="30" y="120" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">✓ 2NF satisfied. No partial dependency possible!</text>

    <!-- Table 2 -->
    <rect x="20" y="140" width="410" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="162" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">R2(ProjID, ProjName)</text>
    <text x="30" y="180" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Key: ProjID. Simple candidate key.</text>
    <text x="30" y="195" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">✓ 2NF satisfied. Fully independent entity.</text>

    <!-- Table 3 -->
    <rect x="20" y="215" width="410" height="65" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="30" y="237" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a7f3d0">R3(EmpID, ProjID, Hours)</text>
    <text x="30" y="255" font-family="-apple-system, sans-serif" font-size="9.5" fill="#cbd5e1">Key: {EmpID, ProjID}. Composite key.</text>
    <text x="30" y="270" font-family="-apple-system, sans-serif" font-size="9" fill="#34d399">✓ 2NF satisfied: Hours depends on full composite key!</text>
  </g>
</svg>