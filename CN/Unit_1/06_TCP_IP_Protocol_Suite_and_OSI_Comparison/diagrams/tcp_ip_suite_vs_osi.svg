<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <defs>
    <linearGradient id="osiGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="tcpGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="430" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">OSI Model vs TCP/IP Protocol Suite: Architecture &amp; Layer Mapping</text>

  <!-- Left: OSI 7 Layers -->
  <rect x="35" y="55" width="230" height="360" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="230" height="28" rx="6" fill="url(#osiGrad)"/>
  <text x="150" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">OSI Reference Model (7 Layers)</text>

  <rect x="45" y="90" width="210" height="38" rx="4" fill="#dbeafe"/><text x="150" y="114" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">7. Application</text>
  <rect x="45" y="132" width="210" height="38" rx="4" fill="#dbeafe"/><text x="150" y="156" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">6. Presentation</text>
  <rect x="45" y="174" width="210" height="38" rx="4" fill="#dbeafe"/><text x="150" y="198" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">5. Session</text>
  <rect x="45" y="216" width="210" height="44" rx="4" fill="#bfdbfe"/><text x="150" y="243" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">4. Transport</text>
  <rect x="45" y="264" width="210" height="44" rx="4" fill="#bfdbfe"/><text x="150" y="291" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">3. Network</text>
  <rect x="45" y="312" width="210" height="44" rx="4" fill="#93c5fd"/><text x="150" y="339" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">2. Data Link</text>
  <rect x="45" y="360" width="210" height="44" rx="4" fill="#93c5fd"/><text x="150" y="387" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">1. Physical</text>

  <!-- Middle: Mapping Brackets & Arrows -->
  <!-- Top 3 OSI layers combine into TCP/IP App layer -->
  <path d="M 270 95 L 305 95 L 305 150 L 320 150" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M 270 205 L 305 205 L 305 150" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="295" y="145" fill="#2563eb" font-size="9" font-weight="bold" text-anchor="end">Merged</text>

  <!-- Transport to Transport -->
  <line x1="270" y1="238" x2="320" y2="238" stroke="#10b981" stroke-width="2"/>

  <!-- Network to Internet -->
  <line x1="270" y1="286" x2="320" y2="286" stroke="#10b981" stroke-width="2"/>

  <!-- Bottom 2 OSI to Network Access -->
  <path d="M 270 325 L 305 325 L 305 360 L 320 360" fill="none" stroke="#059669" stroke-width="2"/>
  <path d="M 270 395 L 305 395 L 305 360" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="295" y="375" fill="#059669" font-size="9" font-weight="bold" text-anchor="end">Merged</text>

  <!-- Right Left: TCP/IP Stack (4/5 Layers) -->
  <rect x="330" y="55" width="230" height="360" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="330" y="55" width="230" height="28" rx="6" fill="url(#tcpGrad)"/>
  <text x="445" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">TCP/IP Protocol Suite</text>

  <!-- TCP Application -->
  <rect x="340" y="90" width="210" height="122" rx="4" fill="#d1fae5"/>
  <text x="445" y="112" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle">Application Layer</text>
  <text x="445" y="132" fill="#047857" font-size="9" text-anchor="middle">HTTP, HTTPS, FTP, DNS</text>
  <text x="445" y="148" fill="#047857" font-size="9" text-anchor="middle">SMTP, POP3, IMAP, SSH</text>
  <text x="445" y="164" fill="#047857" font-size="9" text-anchor="middle">SNMP, TELNET, DHCP</text>
  <text x="445" y="195" fill="#64748b" font-size="8" text-anchor="middle">(Handles App + Pres + Sess)</text>

  <!-- TCP Transport -->
  <rect x="340" y="216" width="210" height="44" rx="4" fill="#a7f3d0"/>
  <text x="445" y="235" fill="#065f46" font-size="11" font-weight="bold" text-anchor="middle">Transport (Host-to-Host)</text>
  <text x="445" y="250" fill="#047857" font-size="9" text-anchor="middle">TCP (Reliable) | UDP (Fast)</text>

  <!-- TCP Internet -->
  <rect x="340" y="264" width="210" height="44" rx="4" fill="#6ee7b7"/>
  <text x="445" y="283" fill="#064e3b" font-size="11" font-weight="bold" text-anchor="middle">Internet Layer</text>
  <text x="445" y="298" fill="#064e3b" font-size="9" text-anchor="middle">IP (IPv4/IPv6), ICMP, ARP, RARP</text>

  <!-- TCP Network Access -->
  <rect x="340" y="312" width="210" height="92" rx="4" fill="#34d399"/>
  <text x="445" y="340" fill="#064e3b" font-size="11.5" font-weight="bold" text-anchor="middle">Network Access Layer</text>
  <text x="445" y="358" fill="#064e3b" font-size="9" text-anchor="middle">(Host-to-Network / Link Layer)</text>
  <text x="445" y="375" fill="#064e3b" font-size="8.5" text-anchor="middle">Ethernet (802.3), Wi-Fi (802.11)</text>
  <text x="445" y="390" fill="#064e3b" font-size="8" text-anchor="middle">PPP, Token Ring, Physical Medium</text>

  <!-- Far Right: Key Comparison Summary Box -->
  <rect x="575" y="55" width="245" height="360" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="575" y="55" width="245" height="28" rx="6" fill="#334155"/>
  <text x="697" y="74" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">OSI vs TCP/IP Comparison</text>

  <rect x="585" y="90" width="225" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="592" y="106" fill="#0f172a" font-size="9.5" font-weight="bold">1. Development Order:</text>
  <text x="592" y="122" fill="#475569" font-size="8.5">OSI: Model first, protocols later.</text>
  <text x="592" y="132" fill="#475569" font-size="8.5">TCP/IP: Protocols first, model later.</text>

  <rect x="585" y="142" width="225" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="592" y="158" fill="#0f172a" font-size="9.5" font-weight="bold">2. Layer Count:</text>
  <text x="592" y="174" fill="#475569" font-size="8.5">OSI has 7 strictly defined layers.</text>
  <text x="592" y="184" fill="#475569" font-size="8.5">TCP/IP has 4 layers (or 5 in practice).</text>

  <rect x="585" y="194" width="225" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="592" y="210" fill="#0f172a" font-size="9.5" font-weight="bold">3. Network Layer Service:</text>
  <text x="592" y="226" fill="#475569" font-size="8.5">OSI: Both Connection &amp; Conn-less.</text>
  <text x="592" y="236" fill="#475569" font-size="8.5">TCP/IP: Strictly Connectionless (IP).</text>

  <rect x="585" y="246" width="225" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="592" y="262" fill="#0f172a" font-size="9.5" font-weight="bold">4. Transport Layer Service:</text>
  <text x="592" y="278" fill="#475569" font-size="8.5">OSI: Strictly Connection-oriented.</text>
  <text x="592" y="288" fill="#475569" font-size="8.5">TCP/IP: Both (TCP Conn, UDP Conn-less).</text>

  <rect x="585" y="298" width="225" height="46" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="592" y="314" fill="#0f172a" font-size="9.5" font-weight="bold">5. Protocols vs Interface:</text>
  <text x="592" y="330" fill="#475569" font-size="8.5">OSI: Clear separation (Service/SAP).</text>
  <text x="592" y="340" fill="#475569" font-size="8.5">TCP/IP: Protocols tightly coupled.</text>

  <rect x="585" y="350" width="225" height="58" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="592" y="368" fill="#065f46" font-size="9.5" font-weight="bold">Real-World Deployment:</text>
  <text x="592" y="384" fill="#065f46" font-size="8.5">OSI is a Theoretical Reference Model.</text>
  <text x="592" y="398" fill="#065f46" font-size="8.5">TCP/IP powers the Entire Modern Global Internet!</text>
</svg>