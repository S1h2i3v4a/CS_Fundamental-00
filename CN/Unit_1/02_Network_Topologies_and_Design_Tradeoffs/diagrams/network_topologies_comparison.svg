<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="meshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="850" height="420" fill="#f8fafc" rx="8"/>

  <!-- Top Banner -->
  <rect x="25" y="12" width="800" height="36" rx="6" fill="#0f172a"/>
  <text x="425" y="35" fill="#ffffff" font-size="15" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Physical Network Topologies: Geometric Layouts &amp; Formulas</text>

  <!-- Topology 1: MESH (Top Left) -->
  <rect x="25" y="60" width="185" height="190" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="25" y="60" width="185" height="28" rx="6" fill="url(#meshGrad)"/>
  <text x="117" y="79" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Mesh Topology</text>
  <!-- Nodes & Fully connected lines -->
  <line x1="75" y1="120" x2="160" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="120" x2="160" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="120" x2="75" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="75" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="160" y1="120" x2="160" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="75" y1="185" x2="160" y2="185" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 4 Nodes -->
  <circle cx="75" cy="120" r="10" fill="#2563eb"/><text x="75" y="124" fill="#fff" font-size="9" text-anchor="middle">A</text>
  <circle cx="160" cy="120" r="10" fill="#2563eb"/><text x="160" y="124" fill="#fff" font-size="9" text-anchor="middle">B</text>
  <circle cx="75" cy="185" r="10" fill="#2563eb"/><text x="75" y="189" fill="#fff" font-size="9" text-anchor="middle">C</text>
  <circle cx="160" cy="185" r="10" fill="#2563eb"/><text x="160" y="189" fill="#fff" font-size="9" text-anchor="middle">D</text>
  <text x="117" y="218" fill="#1e3a8a" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Links = n(n-1)/2</text>
  <text x="117" y="235" fill="#475569" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Ports/Node = (n - 1)</text>

  <!-- Topology 2: STAR (Top Right Left) -->
  <rect x="230" y="60" width="185" height="190" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="230" y="60" width="185" height="28" rx="6" fill="url(#starGrad)"/>
  <text x="322" y="79" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Star Topology</text>
  <!-- Central Hub -->
  <rect x="302" y="140" width="40" height="25" rx="4" fill="#047857"/>
  <text x="322" y="156" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">HUB</text>
  <!-- Spokes -->
  <line x1="322" y1="140" x2="322" y2="105" stroke="#10b981" stroke-width="2"/>
  <line x1="302" y1="152" x2="265" y2="152" stroke="#10b981" stroke-width="2"/>
  <line x1="342" y1="152" x2="380" y2="152" stroke="#10b981" stroke-width="2"/>
  <line x1="322" y1="165" x2="322" y2="195" stroke="#10b981" stroke-width="2"/>
  <circle cx="322" cy="100" r="8" fill="#10b981"/><text x="322" y="103" fill="#fff" font-size="8" text-anchor="middle">1</text>
  <circle cx="260" cy="152" r="8" fill="#10b981"/><text x="260" y="155" fill="#fff" font-size="8" text-anchor="middle">2</text>
  <circle cx="385" cy="152" r="8" fill="#10b981"/><text x="385" y="155" fill="#fff" font-size="8" text-anchor="middle">3</text>
  <circle cx="322" cy="200" r="8" fill="#10b981"/><text x="322" y="203" fill="#fff" font-size="8" text-anchor="middle">4</text>
  <text x="322" y="218" fill="#065f46" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Links = n | Ports = 1</text>
  <text x="322" y="235" fill="#475569" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Central Single Point of Failure</text>

  <!-- Topology 3: BUS (Top Right Right) -->
  <rect x="435" y="60" width="185" height="190" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="435" y="60" width="185" height="28" rx="6" fill="url(#busGrad)"/>
  <text x="527" y="79" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Bus Topology</text>
  <!-- Backbone Cable -->
  <line x1="450" y1="150" x2="605" y2="150" stroke="#b45309" stroke-width="4"/>
  <rect x="445" y="142" width="6" height="16" fill="#78350f"/><text x="448" y="170" fill="#78350f" font-size="7" text-anchor="middle">Term</text>
  <rect x="604" y="142" width="6" height="16" fill="#78350f"/><text x="607" y="170" fill="#78350f" font-size="7" text-anchor="middle">Term</text>
  <!-- Drop lines -->
  <line x1="480" y1="150" x2="480" y2="115" stroke="#f59e0b" stroke-width="2"/>
  <line x1="530" y1="150" x2="530" y2="185" stroke="#f59e0b" stroke-width="2"/>
  <line x1="575" y1="150" x2="575" y2="115" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="480" cy="110" r="8" fill="#f59e0b"/><text x="480" y="113" fill="#fff" font-size="8" text-anchor="middle">A</text>
  <circle cx="530" cy="190" r="8" fill="#f59e0b"/><text x="530" y="193" fill="#fff" font-size="8" text-anchor="middle">B</text>
  <circle cx="575" cy="110" r="8" fill="#f59e0b"/><text x="575" y="113" fill="#fff" font-size="8" text-anchor="middle">C</text>
  <text x="527" y="218" fill="#92400e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1 Backbone + n Drop Lines</text>
  <text x="527" y="235" fill="#475569" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Multipoint Shared Medium</text>

  <!-- Topology 4: RING (Top Far Right) -->
  <rect x="640" y="60" width="185" height="190" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="640" y="60" width="185" height="28" rx="6" fill="url(#ringGrad)"/>
  <text x="732" y="79" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Ring Topology</text>
  <!-- Circle Path -->
  <ellipse cx="732" cy="150" rx="45" ry="38" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  <!-- Repeaters / Nodes -->
  <circle cx="732" cy="112" r="8" fill="#7c3aed"/><text x="732" y="115" fill="#fff" font-size="8" text-anchor="middle">1</text>
  <circle cx="777" cy="150" r="8" fill="#7c3aed"/><text x="777" y="153" fill="#fff" font-size="8" text-anchor="middle">2</text>
  <circle cx="732" cy="188" r="8" fill="#7c3aed"/><text x="732" y="191" fill="#fff" font-size="8" text-anchor="middle">3</text>
  <circle cx="687" cy="150" r="8" fill="#7c3aed"/><text x="687" y="153" fill="#fff" font-size="8" text-anchor="middle">4</text>
  <text x="732" y="218" fill="#581c87" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Links = n | Ports = 2</text>
  <text x="732" y="235" fill="#475569" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Token Ring (Unidirectional)</text>

  <!-- Bottom Comparison Table -->
  <rect x="25" y="260" width="800" height="145" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#shadow)"/>
  <rect x="25" y="260" width="800" height="25" rx="6" fill="#f1f5f9"/>
  <text x="40" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Topology</text>
  <text x="135" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Physical Links</text>
  <text x="245" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">I/O Ports/Node</text>
  <text x="360" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Cable Cost</text>
  <text x="460" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Fault Tolerance</text>
  <text x="610" y="277" fill="#0f172a" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Key Bottleneck / Failure Point</text>

  <!-- Row 1: Mesh -->
  <text x="40" y="302" fill="#1e3a8a" font-size="10" font-weight="bold">Mesh</text>
  <text x="135" y="302" fill="#334155" font-size="10">n(n - 1) / 2</text>
  <text x="245" y="302" fill="#334155" font-size="10">n - 1</text>
  <text x="360" y="302" fill="#dc2626" font-size="10" font-weight="bold">Very High</text>
  <text x="460" y="302" fill="#16a34a" font-size="10" font-weight="bold">Maximum (Robust)</text>
  <text x="610" y="302" fill="#475569" font-size="10">Excessive cabling &amp; port requirement</text>

  <!-- Row 2: Star -->
  <text x="40" y="327" fill="#065f46" font-size="10" font-weight="bold">Star</text>
  <text x="135" y="327" fill="#334155" font-size="10">n</text>
  <text x="245" y="327" fill="#334155" font-size="10">1</text>
  <text x="360" y="327" fill="#2563eb" font-size="10">Moderate</text>
  <text x="460" y="327" fill="#2563eb" font-size="10">Good (1 node fail ok)</text>
  <text x="610" y="327" fill="#dc2626" font-size="10" font-weight="bold">Central Hub Failure collapses entire network</text>

  <!-- Row 3: Bus -->
  <text x="40" y="352" fill="#92400e" font-size="10" font-weight="bold">Bus</text>
  <text x="135" y="352" fill="#334155" font-size="10">1 backbone + n drops</text>
  <text x="245" y="352" fill="#334155" font-size="10">1 tap</text>
  <text x="360" y="352" fill="#16a34a" font-size="10" font-weight="bold">Lowest</text>
  <text x="460" y="352" fill="#dc2626" font-size="10">Poor</text>
  <text x="610" y="352" fill="#dc2626" font-size="10">Backbone cable break stops all transmission</text>

  <!-- Row 4: Ring -->
  <text x="40" y="377" fill="#581c87" font-size="10" font-weight="bold">Ring</text>
  <text x="135" y="377" fill="#334155" font-size="10">n (unidirectional)</text>
  <text x="245" y="377" fill="#334155" font-size="10">2</text>
  <text x="360" y="377" fill="#2563eb" font-size="10">Low to Moderate</text>
  <text x="460" y="377" fill="#dc2626" font-size="10">Low (Dual ring helps)</text>
  <text x="610" y="377" fill="#475569" font-size="10">Single break halts ring; token circulation delay</text>

  <!-- Row 5: Tree / Hybrid -->
  <text x="40" y="397" fill="#0f172a" font-size="10" font-weight="bold">Tree/Hybrid</text>
  <text x="135" y="397" fill="#334155" font-size="10">Hierarchical / Varies</text>
  <text x="245" y="397" fill="#334155" font-size="10">Varies</text>
  <text x="360" y="397" fill="#d97706" font-size="10">Moderate to High</text>
  <text x="460" y="397" fill="#2563eb" font-size="10">Isolated to segment</text>
  <text x="610" y="397" fill="#475569" font-size="10">Root switch or trunk link failure isolates branch</text>
</svg>