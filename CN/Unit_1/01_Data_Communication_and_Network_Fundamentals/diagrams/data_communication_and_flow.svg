<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="850" height="420" fill="#f8fafc" rx="8"/>

  <!-- Title Banner -->
  <rect x="25" y="15" width="800" height="40" rx="6" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="425" y="40" fill="#ffffff" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">5 Key Components of Data Communication &amp; Transmission Modes</text>

  <!-- Top Section: 5 Components Architecture -->
  <!-- Protocol Top -->
  <rect x="275" y="75" width="300" height="45" rx="6" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="95" fill="#1e3a8a" font-size="12" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Rule 5: Protocol (Syntax, Semantics, Timing)</text>
  <text x="425" y="110" fill="#475569" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Agreed set of rules governing data transmission</text>

  <!-- Sender Box -->
  <rect x="40" y="140" width="160" height="90" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="120" y="170" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">1. Sender</text>
  <text x="120" y="190" fill="#bfdbfe" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">(Workstation / Phone)</text>
  <text x="120" y="210" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Generates Data Source</text>

  <!-- Medium Box / Transmission Path -->
  <rect x="250" y="155" width="350" height="60" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="425" y="178" fill="#065f46" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">3. Transmission Medium (Guided / Unguided)</text>
  <text x="425" y="198" fill="#047857" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Twisted Pair, Coaxial Cable, Fiber Optic, Radio Waves</text>

  <!-- Message indicator -->
  <rect x="350" y="125" width="150" height="25" rx="4" fill="url(#amberGrad)"/>
  <text x="425" y="142" fill="#ffffff" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">2. Message (Data Payload)</text>

  <!-- Receiver Box -->
  <rect x="650" y="140" width="160" height="90" rx="8" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="730" y="170" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">4. Receiver</text>
  <text x="730" y="190" fill="#bfdbfe" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">(Server / Monitor)</text>
  <text x="730" y="210" fill="#ffffff" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Accepts Delivered Info</text>

  <!-- Connecting Arrows -->
  <line x1="200" y1="185" x2="250" y2="185" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="185" x2="650" y2="185" stroke="#2563eb" stroke-width="3"/>

  <!-- Bottom Section: 3 Transmission Modes -->
  <line x1="25" y1="250" x2="825" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Mode 1: Simplex -->
  <rect x="35" y="270" width="240" height="130" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="295" fill="#1e3a8a" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">A. Simplex Mode</text>
  <text x="155" y="315" fill="#64748b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Unidirectional (1-Way Only)</text>
  <rect x="50" y="330" width="60" height="30" rx="4" fill="#dbeafe"/>
  <text x="80" y="350" fill="#1e40af" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Keybd</text>
  <line x1="115" y1="345" x2="180" y2="345" stroke="#2563eb" stroke-width="3"/>
  <polygon points="180,341 190,345 180,349" fill="#2563eb"/>
  <rect x="195" y="330" width="65" height="30" rx="4" fill="#dbeafe"/>
  <text x="227" y="350" fill="#1e40af" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Monitor</text>
  <text x="155" y="385" fill="#0f172a" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Eg: Keyboard to CPU, TV Broadcast</text>

  <!-- Mode 2: Half-Duplex -->
  <rect x="305" y="270" width="240" height="130" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="295" fill="#92400e" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">B. Half-Duplex Mode</text>
  <text x="425" y="315" fill="#64748b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Bidirectional (1 at a Time)</text>
  <rect x="320" y="330" width="60" height="30" rx="4" fill="#fef3c7"/>
  <text x="350" y="350" fill="#92400e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Node A</text>
  <line x1="385" y1="340" x2="450" y2="340" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="450,337 458,340 450,343" fill="#f59e0b"/>
  <line x1="458" y1="350" x2="393" y2="350" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="393,347 385,350 393,353" fill="#f59e0b"/>
  <rect x="465" y="330" width="60" height="30" rx="4" fill="#fef3c7"/>
  <text x="495" y="350" fill="#92400e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Node B</text>
  <text x="425" y="385" fill="#0f172a" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Eg: Walkie-Talkie ("Over &amp; Out")</text>

  <!-- Mode 3: Full-Duplex -->
  <rect x="575" y="270" width="240" height="130" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="295" fill="#065f46" font-size="13" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">C. Full-Duplex Mode</text>
  <text x="695" y="315" fill="#64748b" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Simultaneous Bidirectional</text>
  <rect x="590" y="330" width="60" height="30" rx="4" fill="#d1fae5"/>
  <text x="620" y="350" fill="#065f46" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Phone A</text>
  <line x1="655" y1="345" x2="725" y2="345" stroke="#10b981" stroke-width="3"/>
  <polygon points="655,341 647,345 655,349" fill="#10b981"/>
  <polygon points="725,341 733,345 725,349" fill="#10b981"/>
  <rect x="735" y="330" width="65" height="30" rx="4" fill="#d1fae5"/>
  <text x="767" y="350" fill="#065f46" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Phone B</text>
  <text x="695" y="385" fill="#0f172a" font-size="9" font-family="system-ui, sans-serif" text-anchor="middle">Eg: Telephone Call, Modern Switched Ethernet</text>
</svg>