<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="l1Dev" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9a3412"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="l2Dev" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="l3Dev" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="l7Dev" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#581c87"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Network Devices by OSI Layer &amp; Collision vs Broadcast Domain Segmentation</text>

  <!-- 4 Layer Columns -->
  <!-- Layer 1: Hub & Repeater -->
  <rect x="35" y="55" width="185" height="215" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="185" height="26" rx="6" fill="url(#l1Dev)"/>
  <text x="127" y="73" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Layer 1: Physical</text>
  <text x="127" y="98" fill="#9a3412" font-size="11.5" font-weight="bold" text-anchor="middle">Hub &amp; Repeater</text>
  <rect x="45" y="108" width="165" height="40" rx="3" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="127" y="124" fill="#9a3412" font-size="8.5" font-weight="bold" text-anchor="middle">Signal Regenerator</text>
  <text x="127" y="138" fill="#475569" font-size="8" text-anchor="middle">Blind electrical bit broadcast</text>
  <text x="45" y="166" fill="#0f172a" font-size="8.5">• No MAC / IP awareness</text>
  <text x="45" y="180" fill="#0f172a" font-size="8.5">• Half-duplex operation</text>
  <rect x="45" y="194" width="165" height="30" rx="3" fill="#fee2e2" stroke="#ef4444"/>
  <text x="127" y="207" fill="#991b1b" font-size="8" font-weight="bold" text-anchor="middle">Collision Domain: 1 (SHARED)</text>
  <text x="127" y="218" fill="#991b1b" font-size="8" font-weight="bold" text-anchor="middle">Broadcast Domain: 1 (SHARED)</text>
  <text x="45" y="240" fill="#dc2626" font-size="7.5" font-weight="bold">Collsion on 1 port affects ALL ports!</text>

  <!-- Layer 2: Switch & Bridge -->
  <rect x="230" y="55" width="185" height="215" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="230" y="55" width="185" height="26" rx="6" fill="url(#l2Dev)"/>
  <text x="322" y="73" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Layer 2: Data Link</text>
  <text x="322" y="98" fill="#065f46" font-size="11.5" font-weight="bold" text-anchor="middle">Switch &amp; Bridge</text>
  <rect x="240" y="108" width="165" height="40" rx="3" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="322" y="124" fill="#065f46" font-size="8.5" font-weight="bold" text-anchor="middle">MAC Table (CAM) Forwarding</text>
  <text x="322" y="138" fill="#475569" font-size="8" text-anchor="middle">Unicast based on 48-bit MAC</text>
  <text x="240" y="166" fill="#0f172a" font-size="8.5">• Full-Duplex dedicated lines</text>
  <text x="240" y="180" fill="#0f172a" font-size="8.5">• Store-and-Forward / Cut-Through</text>
  <rect x="240" y="194" width="165" height="30" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="322" y="207" fill="#92400e" font-size="8" font-weight="bold" text-anchor="middle">Collision Domain: 1 per Port (N)</text>
  <text x="322" y="218" fill="#92400e" font-size="8" font-weight="bold" text-anchor="middle">Broadcast Domain: 1 (SHARED)</text>
  <text x="240" y="240" fill="#047857" font-size="7.5" font-weight="bold">Breaks Collision, passes Broadcast</text>

  <!-- Layer 3: Router & L3 Switch -->
  <rect x="425" y="55" width="185" height="215" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="425" y="55" width="185" height="26" rx="6" fill="url(#l3Dev)"/>
  <text x="517" y="73" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Layer 3: Network</text>
  <text x="517" y="98" fill="#1e3a8a" font-size="11.5" font-weight="bold" text-anchor="middle">Router &amp; L3 Switch</text>
  <rect x="435" y="108" width="165" height="40" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="517" y="124" fill="#1e3a8a" font-size="8.5" font-weight="bold" text-anchor="middle">Routing Table (FIB) Routing</text>
  <text x="517" y="138" fill="#475569" font-size="8" text-anchor="middle">IP Packet forwarding across nets</text>
  <text x="435" y="166" fill="#0f172a" font-size="8.5">• Inter-network connecting</text>
  <text x="435" y="180" fill="#0f172a" font-size="8.5">• NAT, Firewall, DHCP server</text>
  <rect x="435" y="194" width="165" height="30" rx="3" fill="#d1fae5" stroke="#10b981"/>
  <text x="517" y="207" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle">Collision Domain: 1 per Port (N)</text>
  <text x="517" y="218" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle">Broadcast Domain: 1 per Port (N)</text>
  <text x="435" y="240" fill="#2563eb" font-size="7.5" font-weight="bold">BLOCKS Broadcasts from spreading!</text>

  <!-- Layer 7: Gateway & Modem -->
  <rect x="620" y="55" width="185" height="215" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="620" y="55" width="185" height="26" rx="6" fill="url(#l7Dev)"/>
  <text x="712" y="73" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Layer 4 - 7: Gateway</text>
  <text x="712" y="98" fill="#581c87" font-size="11.5" font-weight="bold" text-anchor="middle">Gateway &amp; Modem</text>
  <rect x="630" y="108" width="165" height="40" rx="3" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="712" y="124" fill="#581c87" font-size="8.5" font-weight="bold" text-anchor="middle">Protocol Converter</text>
  <text x="712" y="138" fill="#475569" font-size="8" text-anchor="middle">Translates disparate architectures</text>
  <text x="630" y="166" fill="#0f172a" font-size="8.5">• Operates at all 7 layers</text>
  <text x="630" y="180" fill="#0f172a" font-size="8.5">• Application proxies &amp; APIs</text>
  <rect x="630" y="194" width="165" height="30" rx="3" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="712" y="207" fill="#4c1d95" font-size="8" font-weight="bold" text-anchor="middle">Complete Protocol Translation</text>
  <text x="712" y="218" fill="#4c1d95" font-size="8" font-weight="bold" text-anchor="middle">Brouter: Bridge + Router combo</text>
  <text x="630" y="240" fill="#6b21a8" font-size="7.5" font-weight="bold">Modem: Modulates &amp; Demodulates</text>

  <!-- Bottom: Summary Domain Separation Matrix -->
  <rect x="35" y="280" width="770" height="145" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="280" width="770" height="24" rx="6" fill="#0f172a"/>
  <text x="420" y="296" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Master Domain Separation Formula &amp; AKTU Exam Rule</text>

  <text x="50" y="322" fill="#0f172a" font-size="9.5" font-weight="bold">Collision Domain:</text>
  <text x="165" y="322" fill="#334155" font-size="9">Network segment where simultaneous transmissions from 2 devices cause a collision.</text>

  <text x="50" y="344" fill="#0f172a" font-size="9.5" font-weight="bold">Broadcast Domain:</text>
  <text x="165" y="344" fill="#334155" font-size="9">Network segment where a broadcast frame (MAC FF:FF:FF:FF:FF:FF) will be received by all hosts.</text>

  <rect x="50" y="360" width="740" height="50" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="378" fill="#1e3a8a" font-size="9" font-weight="bold">• Hub / Repeater:</text>
  <text x="175" y="378" fill="#475569" font-size="9">Does NOT break Collision Domain. Does NOT break Broadcast Domain.</text>
  <text x="60" y="394" fill="#065f46" font-size="9" font-weight="bold">• Bridge / Switch:</text>
  <text x="175" y="394" fill="#065f46" font-size="9"><strong>BREAKS Collision Domain</strong> (1 domain per port). Does NOT break Broadcast Domain.</text>
  <text x="60" y="408" fill="#2563eb" font-size="9" font-weight="bold">• Router / Gateway:</text>
  <text x="175" y="408" fill="#2563eb" font-size="9"><strong>BREAKS Collision Domain AND BREAKS Broadcast Domain</strong> (Stops broadcasts cold!).</text>
</svg>