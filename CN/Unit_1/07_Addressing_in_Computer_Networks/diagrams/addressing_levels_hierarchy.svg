<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="macGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="ipGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9a3412"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="urlGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#581c87"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="420" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">4 Levels of Network Addressing &amp; Delivery Scope</text>

  <!-- 4 Address Boxes Layout -->
  <!-- Level 1: Physical / MAC Address -->
  <rect x="35" y="55" width="375" height="165" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="375" height="26" rx="6" fill="url(#macGrad)"/>
  <text x="222" y="73" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">1. Physical Address (MAC / Link Layer)</text>
  <text x="50" y="100" fill="#065f46" font-size="10" font-weight="bold">• Length: 48 bits (6 Bytes) — Burned into NIC hardware</text>
  <text x="50" y="118" fill="#334155" font-size="9">• Format: Hexadecimal <code>00:1A:2B:3C:4D:5E</code></text>
  <rect x="50" y="128" width="165" height="22" rx="3" fill="#ecfdf5" stroke="#10b981"/>
  <text x="132" y="143" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle">OUI (24 bits) Vendor ID</text>
  <rect x="220" y="128" width="165" height="22" rx="3" fill="#d1fae5" stroke="#059669"/>
  <text x="302" y="143" fill="#047857" font-size="8" font-weight="bold" text-anchor="middle">NIC Specific ID (24 bits)</text>
  <text x="50" y="172" fill="#0f172a" font-size="9.5" font-weight="bold">• Scope: Hop-to-Hop (Node-to-Node) Delivery</text>
  <text x="50" y="188" fill="#475569" font-size="8.5">• Changes at every router hop across the transmission path!</text>
  <text x="50" y="202" fill="#64748b" font-size="8">• Resolved by ARP (Address Resolution Protocol)</text>

  <!-- Level 2: Logical / IP Address -->
  <rect x="440" y="55" width="375" height="165" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="55" width="375" height="26" rx="6" fill="url(#ipGrad)"/>
  <text x="627" y="73" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">2. Logical Address (IP / Network Layer)</text>
  <text x="455" y="100" fill="#1e3a8a" font-size="10" font-weight="bold">• Length: IPv4 = 32 bits (4 Bytes) | IPv6 = 128 bits (16 Bytes)</text>
  <text x="455" y="118" fill="#334155" font-size="9">• IPv4 Format: Dotted Decimal <code>192.168.1.100</code></text>
  <rect x="455" y="128" width="165" height="22" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="537" y="143" fill="#1e40af" font-size="8" font-weight="bold" text-anchor="middle">Network ID (NetID)</text>
  <rect x="625" y="128" width="165" height="22" rx="3" fill="#dbeafe" stroke="#2563eb"/>
  <text x="707" y="143" fill="#1e3a8a" font-size="8" font-weight="bold" text-anchor="middle">Host ID (HostID)</text>
  <text x="455" y="172" fill="#0f172a" font-size="9.5" font-weight="bold">• Scope: Source-to-Destination (Host-to-Host) Delivery</text>
  <text x="455" y="188" fill="#475569" font-size="8.5">• REMAINS CONSTANT throughout entire end-to-end journey!</text>
  <text x="455" y="202" fill="#64748b" font-size="8">• Assigned statically or dynamically via DHCP</text>

  <!-- Level 3: Port Address -->
  <rect x="35" y="235" width="375" height="170" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="235" width="375" height="26" rx="6" fill="url(#portGrad)"/>
  <text x="222" y="253" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">3. Port Address (Transport Layer)</text>
  <text x="50" y="280" fill="#9a3412" font-size="10" font-weight="bold">• Length: 16 bits (0 to 65,535)</text>
  <text x="50" y="298" fill="#334155" font-size="9">• 3 Port Categories:</text>
  <text x="65" y="314" fill="#475569" font-size="8.5">1. Well-known Ports (0 - 1023): HTTP=80, HTTPS=443, SSH=22</text>
  <text x="65" y="328" fill="#475569" font-size="8.5">2. Registered Ports (1024 - 49151): MySQL=3306, Tomcat=8080</text>
  <text x="65" y="342" fill="#475569" font-size="8.5">3. Dynamic / Private / Ephemeral (49152 - 65535): Client sockets</text>
  <text x="50" y="365" fill="#0f172a" font-size="9.5" font-weight="bold">• Scope: End-to-End (Process-to-Process) Delivery</text>
  <text x="50" y="380" fill="#475569" font-size="8.5">• Socket Address = <code>IP Address : Port Number</code></text>
  <text x="50" y="395" fill="#64748b" font-size="8">Identifies specific application process in OS</text>

  <!-- Level 4: Specific / Application Address -->
  <rect x="440" y="235" width="375" height="170" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="235" width="375" height="26" rx="6" fill="url(#urlGrad)"/>
  <text x="627" y="253" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">4. Specific / Application Address</text>
  <text x="455" y="280" fill="#581c87" font-size="10" font-weight="bold">• Human-Friendly User-Level Addresses</text>
  <text x="455" y="298" fill="#334155" font-size="9">• Web URLs: <code>https://www.aktu.ac.in/index.html</code></text>
  <text x="455" y="314" fill="#334155" font-size="9">• Email Address: <code>student@aktu.edu.in</code></text>
  <text x="455" y="330" fill="#334155" font-size="9">• Fully Qualified Domain Names (FQDN)</text>
  <rect x="455" y="342" width="345" height="28" rx="4" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="627" y="360" fill="#6b21a8" font-size="8.5" font-weight="bold" text-anchor="middle">DNS translates Domain Name → 32-bit IP Address</text>
  <text x="455" y="388" fill="#0f172a" font-size="9.5" font-weight="bold">• Scope: User / Application Interface Layer</text>
  <text x="455" y="402" fill="#64748b" font-size="8">Allows humans to navigate networks without memorizing numbers</text>
</svg>