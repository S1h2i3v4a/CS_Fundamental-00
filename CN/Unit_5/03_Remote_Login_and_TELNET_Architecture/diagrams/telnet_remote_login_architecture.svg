<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="telnetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clientPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="nvtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#telnetBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">TELNET PROTOCOL &amp; REMOTE LOGIN ARCHITECTURE</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Local vs Remote Login, Network Virtual Terminal (NVT), Option Negotiation &amp; SSH Comparison</text>

  <!-- Left: Local Host (Client) -->
  <rect x="35" y="80" width="220" height="190" fill="url(#clientPurple)" rx="8" stroke="#a5b4fc" stroke-width="2"/>
  <text x="145" y="108" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Local Terminal / Host</text>
  <rect x="50" y="125" width="190" height="30" fill="#312e81" rx="4"/>
  <text x="145" y="145" fill="#e0e7ff" font-family="Consolas, monospace" font-size="10" text-anchor="middle">Terminal Driver (OS)</text>
  <rect x="50" y="165" width="190" height="40" fill="#1e1b4b" rx="4"/>
  <text x="145" y="183" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TELNET Client Process</text>
  <text x="145" y="197" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Translates Local -> NVT Format</text>
  <rect x="50" y="215" width="190" height="35" fill="#312e81" rx="4"/>
  <text x="145" y="235" fill="#e0e7ff" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">TCP Client Socket (Port Ephemeral)</text>

  <!-- Center: NVT Cloud / Bridge -->
  <rect x="300" y="110" width="350" height="130" fill="url(#nvtGrad)" rx="8" stroke="#fde68a" stroke-width="2"/>
  <text x="475" y="138" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Network Virtual Terminal (NVT)</text>
  <text x="475" y="158" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle">Universal Intermediate Character &amp; Control Language</text>
  <rect x="320" y="170" width="310" height="50" fill="#78350f" rx="5"/>
  <text x="475" y="190" fill="#facc15" font-family="Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">7-Bit ASCII Characters (0 - 127)</text>
  <text x="475" y="208" fill="#fde68a" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">8th Bit = 1 -> Control Commands (IAC = 255)</text>

  <!-- Right: Remote Host (Server) -->
  <rect x="695" y="80" width="220" height="190" fill="#047857" rx="8" stroke="#6ee7b7" stroke-width="2"/>
  <text x="805" y="108" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Remote Computer / Server</text>
  <rect x="710" y="125" width="190" height="35" fill="#064e3b" rx="4"/>
  <text x="805" y="145" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">TCP Server (Well-Known Port 23)</text>
  <rect x="710" y="168" width="190" height="40" fill="#022c22" rx="4"/>
  <text x="805" y="186" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TELNET Server Process</text>
  <text x="805" y="200" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Translates NVT -> Host Format</text>
  <rect x="710" y="218" width="190" height="35" fill="#064e3b" rx="4"/>
  <text x="805" y="238" fill="#d1fae5" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">Pseudoterminal Driver (PTY)</text>

  <!-- Connecting Stream Arrows -->
  <line x1="255" y1="175" x2="300" y2="175" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="650" y1="175" x2="695" y2="175" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Bottom Panel: 3 Conceptual Blocks -->
  <rect x="35" y="295" width="880" height="165" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>

  <!-- Col 1: Local vs Remote Login -->
  <rect x="50" y="310" width="270" height="135" fill="#1e293b" rx="5"/>
  <text x="185" y="330" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Local vs Remote Login</text>
  <text x="60" y="350" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Local Login:</b> Keystrokes handled by</text>
  <text x="68" y="366" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  terminal driver directly to local OS shell.</text>
  <text x="60" y="384" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Remote Login:</b> Local terminal behaves</text>
  <text x="68" y="400" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  as terminal for remote time-sharing host.</text>
  <text x="60" y="418" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Transparent keystroke transmission over TCP.</text>

  <!-- Col 2: NVT Characters & Modes -->
  <rect x="340" y="310" width="270" height="135" fill="#1e293b" rx="5"/>
  <text x="475" y="330" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. NVT &amp; Operating Modes</text>
  <text x="350" y="350" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Default Mode:</b> Half-duplex character-at-</text>
  <text x="358" y="366" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  a-time transmission with remote echoing.</text>
  <text x="350" y="384" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Character Mode:</b> 1 char sent per packet.</text>
  <text x="350" y="402" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Line Mode:</b> Lines edited locally and</text>
  <text x="358" y="418" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  transmitted in bulk on pressing ENTER.</text>

  <!-- Col 3: Telnet vs SSH Vulnerability -->
  <rect x="630" y="310" width="270" height="135" fill="#1e293b" rx="5"/>
  <text x="765" y="330" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. TELNET vs SSH Security</text>
  <text x="640" y="350" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>TELNET (Port 23):</b></text>
  <text x="648" y="366" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="8.5">  Cleartext transmission! Passwords &amp; root</text>
  <text x="648" y="380" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="8.5">  commands visible to packet sniffers.</text>
  <text x="640" y="398" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>SSH - Secure Shell (Port 22):</b></text>
  <text x="648" y="414" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="8.5">  Encrypted session tunnel using public keys</text>
  <text x="648" y="428" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="8.5">  and AES. Replaced TELNET globally.</text>
</svg>