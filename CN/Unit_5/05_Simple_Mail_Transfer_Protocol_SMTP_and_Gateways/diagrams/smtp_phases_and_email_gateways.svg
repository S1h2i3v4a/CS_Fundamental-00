<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="smtpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mtaSender" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="mtaRecv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#smtpBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">SIMPLE MAIL TRANSFER PROTOCOL (SMTP) &amp; GATEWAYS</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Connection Establishment, Mail Transaction, Teardown &amp; Enterprise Security Gateways</text>

  <!-- Left: Client MTA -->
  <rect x="40" y="80" width="180" height="200" fill="url(#mtaSender)" rx="8" stroke="#34d399" stroke-width="2"/>
  <text x="130" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Sender Mail Server</text>
  <text x="130" y="128" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle">MTA Client Engine</text>
  <rect x="55" y="145" width="150" height="50" fill="#064e3b" rx="4"/>
  <text x="130" y="165" fill="#facc15" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">Outbox Spool</text>
  <text x="130" y="182" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Queued Outgoing Mail</text>
  <text x="130" y="220" fill="#ecfdf5" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Pushes Messages</text>
  <text x="130" y="238" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Port 25 / 587 (Submission)</text>

  <!-- Center: 3 Phases Command-Response Flow -->
  <rect x="255" y="80" width="440" height="200" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="100" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SMTP TRANSACTION 3-PHASE INTERACTION (TCP PORT 25)</text>

  <!-- Phase 1: Handshake -->
  <text x="270" y="122" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9.5">&lt;-- 220 server.com Simple Mail Transfer Ready</text>
  <text x="270" y="138" fill="#facc15" font-family="Consolas, monospace" font-size="9.5">--&gt; HELO client.domain.com (or EHLO)</text>
  <text x="270" y="154" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9.5">&lt;-- 250 Hello client.domain.com, pleased to meet you</text>

  <!-- Phase 2: Mail Transfer -->
  <text x="270" y="174" fill="#facc15" font-family="Consolas, monospace" font-size="9.5">--&gt; MAIL FROM: &lt;alice@aktu.ac.in&gt;</text>
  <text x="270" y="190" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9.5">&lt;-- 250 2.1.0 Sender OK</text>
  <text x="270" y="206" fill="#facc15" font-family="Consolas, monospace" font-size="9.5">--&gt; RCPT TO: &lt;bob@aktu.ac.in&gt;  |  &lt;-- 250 Recipient OK</text>
  <text x="270" y="222" fill="#facc15" font-family="Consolas, monospace" font-size="9.5">--&gt; DATA  |  &lt;-- 354 Start mail input; end with &lt;CRLF&gt;.&lt;CRLF&gt;</text>
  <text x="270" y="238" fill="#e2e8f0" font-family="Consolas, monospace" font-size="9.5">[Body text / MIME payload...]  |  --&gt; .  |  &lt;-- 250 OK: queued</text>

  <!-- Phase 3: Quit -->
  <text x="270" y="258" fill="#f87171" font-family="Consolas, monospace" font-size="9.5">--&gt; QUIT  |  &lt;-- 221 2.0.0 server.com Service closing transmission</text>

  <!-- Right: Receiver MTA -->
  <rect x="730" y="80" width="180" height="200" fill="url(#mtaRecv)" rx="8" stroke="#60a5fa" stroke-width="2"/>
  <text x="820" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Receiver Mail Server</text>
  <text x="820" y="128" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle">MTA Server Daemon</text>
  <rect x="745" y="145" width="150" height="50" fill="#172554" rx="4"/>
  <text x="820" y="165" fill="#facc15" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">User Mailbox</text>
  <text x="820" y="182" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Stores Delivered Mail</text>
  <text x="820" y="220" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Listening on Port 25</text>
  <text x="820" y="238" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Enforces Spam Checks</text>

  <!-- Bottom Panel: Email Security Gateways -->
  <rect x="40" y="300" width="870" height="160" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>

  <!-- Col 1: SMTP Commands -->
  <rect x="55" y="315" width="265" height="130" fill="#1e293b" rx="5"/>
  <text x="187" y="335" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Key SMTP Commands</text>
  <text x="65" y="355" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>HELO / EHLO:</b> Client identifies identity</text>
  <text x="65" y="373" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>MAIL FROM:</b> Specifies envelope sender</text>
  <text x="65" y="391" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>RCPT TO:</b> Specifies destination mailbox</text>
  <text x="65" y="409" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>DATA:</b> Initiates message payload transfer</text>
  <text x="65" y="427" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>QUIT:</b> Gracefully tears down TCP link</text>

  <!-- Col 2: Mail Relays & MX -->
  <rect x="342" y="315" width="265" height="130" fill="#1e293b" rx="5"/>
  <text x="474" y="335" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Mail Relays &amp; DNS MX</text>
  <text x="352" y="355" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Mail Relays:</b> Intermediate MTAs forwarding</text>
  <text x="360" y="371" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  emails across autonomous corporate networks.</text>
  <text x="352" y="389" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>DNS MX Lookup:</b> Resolves destination</text>
  <text x="360" y="405" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  domain to highest priority mail host IP.</text>
  <text x="352" y="423" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Multiple MX records provide auto-failover.</text>

  <!-- Col 3: Email Gateways (AKTU PYQ) -->
  <rect x="630" y="315" width="265" height="130" fill="#1e293b" rx="5"/>
  <text x="762" y="335" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. Email Gateways (AKTU PYQ)</text>
  <text x="640" y="355" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Purpose:</b> Filtering, virus scan &amp; routing.</text>
  <text x="640" y="373" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>On-Premises / Appliance Gateways:</b></text>
  <text x="648" y="389" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="8.5">  Cisco IronPort, Barracuda Spam Gateway,</text>
  <text x="648" y="403" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="8.5">  Fortinet FortiMail, Symantec Mail Security.</text>
  <text x="640" y="421" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Cloud Gateways:</b> Proofpoint, Mimecast.</text>
</svg>