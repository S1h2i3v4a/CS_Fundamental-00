<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="dnsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#dnsBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">DOMAIN NAME SYSTEM (DNS) RESOLUTION ARCHITECTURE</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Hierarchical Tree, Recursive vs Iterative Resolution, Resource Records &amp; Caching</text>

  <!-- Left: Client Resolver Box -->
  <rect x="30" y="80" width="160" height="150" fill="url(#clientGrad)" rx="8" stroke="#60a5fa" stroke-width="2"/>
  <text x="110" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Client Host / Browser</text>
  <text x="110" y="132" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">DNS Resolver Stub</text>
  <rect x="45" y="145" width="130" height="30" fill="#1e3a8a" rx="4"/>
  <text x="110" y="165" fill="#facc15" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">GET www.aktu.ac.in</text>
  <text x="110" y="200" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Local Cache Checked First</text>
  <text x="110" y="216" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">UDP Port 53 Request</text>

  <!-- Center: Local DNS Server (Recursive) -->
  <rect x="260" y="80" width="180" height="180" fill="url(#serverGrad)" rx="8" stroke="#34d399" stroke-width="2"/>
  <text x="350" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Local DNS Server</text>
  <text x="350" y="130" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">(ISP / Campus DNS)</text>
  <rect x="275" y="142" width="150" height="50" fill="#064e3b" rx="4"/>
  <text x="350" y="160" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Recursive Engine</text>
  <text x="350" y="178" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Maintains Local Cache</text>
  <text x="350" y="215" fill="#ecfdf5" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Handles Full Lookup Cycle</text>
  <text x="350" y="235" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">TTL Expiry Management</text>

  <!-- Right: DNS Hierarchy Servers -->
  <!-- 1. Root DNS Server -->
  <rect x="520" y="70" width="190" height="55" fill="url(#rootGrad)" rx="6" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="615" y="93" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Root DNS Server (.)</text>
  <text x="615" y="112" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">13 Named IP clusters (a-m)</text>

  <!-- 2. TLD DNS Server -->
  <rect x="520" y="145" width="190" height="55" fill="#4338ca" rx="6" stroke="#818cf8" stroke-width="1.5"/>
  <text x="615" y="168" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TLD DNS Server (.in)</text>
  <text x="615" y="187" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Top-Level Domain Authority</text>

  <!-- 3. Authoritative DNS Server -->
  <rect x="520" y="220" width="190" height="60" fill="#b91c1c" rx="6" stroke="#f87171" stroke-width="1.5"/>
  <text x="615" y="243" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Authoritative DNS (aktu.ac.in)</text>
  <text x="615" y="262" fill="#fee2e2" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Holds Final A Record</text>
  <text x="615" y="274" fill="#fecaca" font-family="Consolas, monospace" font-size="9" text-anchor="middle">www -> 14.139.233.10</text>

  <!-- Arrows and Numbered Steps -->
  <!-- Step 1: Client to Local DNS -->
  <line x1="190" y1="120" x2="260" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="112" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">1. Query</text>

  <!-- Step 8: Local DNS to Client -->
  <line x1="260" y1="140" x2="190" y2="140" stroke="#4ade80" stroke-width="2"/>
  <text x="225" y="153" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9" font-weight="700" text-anchor="middle">8. IP Reply</text>

  <!-- Step 2 & 3: Local to Root & Root to Local -->
  <line x1="440" y1="90" x2="520" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="480" y="84" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">2. Root?</text>
  <line x1="520" y1="105" x2="440" y2="105" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="480" y="117" fill="#fef3c7" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">3. Ask .in</text>

  <!-- Step 4 & 5: Local to TLD & TLD to Local -->
  <line x1="440" y1="160" x2="520" y2="160" stroke="#818cf8" stroke-width="1.5"/>
  <text x="480" y="154" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">4. .in TLD?</text>
  <line x1="520" y1="175" x2="440" y2="175" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="480" y="188" fill="#e0e7ff" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">5. Ask aktu.ac</text>

  <!-- Step 6 & 7: Local to Auth & Auth to Local -->
  <line x1="440" y1="235" x2="520" y2="235" stroke="#f87171" stroke-width="1.5"/>
  <text x="480" y="230" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">6. Auth?</text>
  <line x1="520" y1="255" x2="440" y2="255" stroke="#4ade80" stroke-width="2"/>
  <text x="480" y="268" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">7. IP Record</text>

  <!-- Bottom Panel: DNS Architecture Summary Table -->
  <rect x="30" y="300" width="890" height="160" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="322" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DNS PROTOCOL SPECIFICATIONS &amp; RESOURCE RECORD (RR) ARCHITECTURE</text>

  <!-- 3 Sub columns -->
  <rect x="45" y="335" width="265" height="110" fill="#1e293b" rx="5"/>
  <text x="177" y="355" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Domain Tree Hierarchy</text>
  <text x="55" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Root Domain: Denoted by dot (.)</text>
  <text x="55" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• TLD: Generic (.com, .edu, .org, .gov)</text>
  <text x="55" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• ccTLD: Country Code (.in, .us, .uk, .jp)</text>
  <text x="55" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Second-Level / Subdomains: aktu.ac.in</text>

  <rect x="340" y="335" width="265" height="110" fill="#1e293b" rx="5"/>
  <text x="472" y="355" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Resolution Types</text>
  <text x="350" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Recursive Query: Server does full lookup</text>
  <text x="350" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">  and returns final answer to client.</text>
  <text x="350" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Iterative Query: Server returns referral</text>
  <text x="350" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">  IP pointer to next lower server.</text>

  <rect x="635" y="335" width="270" height="110" fill="#1e293b" rx="5"/>
  <text x="770" y="355" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. Key Resource Records (RR)</text>
  <text x="645" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• A: Hostname -> IPv4 (32-bit)</text>
  <text x="645" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• AAAA: Hostname -> IPv6 (128-bit)</text>
  <text x="645" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• CNAME: Alias canonical domain name</text>
  <text x="645" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• MX: Mail exchange server | NS: Nameserver</text>
</svg>