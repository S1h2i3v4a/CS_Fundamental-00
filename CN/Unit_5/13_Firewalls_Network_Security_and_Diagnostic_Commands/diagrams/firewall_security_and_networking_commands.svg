<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="fwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#fwBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">FIREWALLS, NETWORK SECURITY &amp; DIAGNOSTIC COMMANDS</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Packet Filtering, Stateful Inspection, Application Gateways &amp; Essential Utilities (ping, tracert, netstat)</text>

  <!-- Left: Untrusted Internet -->
  <rect x="35" y="80" width="180" height="185" fill="#1e293b" rx="8" stroke="#ef4444" stroke-width="2"/>
  <text x="125" y="108" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Untrusted Internet</text>
  <text x="125" y="126" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">External Attack Vectors</text>
  <rect x="50" y="145" width="150" height="40" fill="#450a0a" rx="4"/>
  <text x="125" y="165" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">SYN Flood &amp; Scans</text>
  <text x="125" y="178" fill="#fecaca" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">Port 80, 443, 22, 3389</text>
  <rect x="50" y="195" width="150" height="55" fill="#172554" rx="4"/>
  <text x="125" y="215" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Legitimate Clients</text>
  <text x="125" y="230" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">HTTP GET Requests</text>

  <!-- Center: Firewall Barrier -->
  <rect x="255" y="75" width="430" height="195" fill="url(#fwGrad)" rx="8" stroke="#f87171" stroke-width="2"/>
  <text x="470" y="102" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="800" text-anchor="middle">ENTERPRISE FIREWALL DEFENSE LAYER</text>

  <!-- 3 Filtering Tiers inside Firewall -->
  <rect x="270" y="115" width="400" height="42" fill="#7f1d1d" rx="4"/>
  <text x="470" y="132" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1. Packet-Filtering Firewall (L3 / L4 Stateless)</text>
  <text x="470" y="147" fill="#fee2e2" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">Evaluates Header Rules: Src/Dst IP, Src/Dst Port, Protocol (TCP/UDP)</text>

  <rect x="270" y="163" width="400" height="42" fill="#5c1515" rx="4"/>
  <text x="470" y="180" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2. Stateful Inspection Firewall (Dynamic State Tables)</text>
  <text x="470" y="195" fill="#e0f2fe" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">Tracks active TCP 3-way handshakes; blocks unsolicited inbound SYN packets</text>

  <rect x="270" y="211" width="400" height="45" fill="#450a0a" rx="4"/>
  <text x="470" y="228" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3. Application Gateway / Proxy (L7 Deep Inspection)</text>
  <text x="470" y="244" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">Inspects actual payload content; blocks SQL injections, malicious HTTP scripts</text>

  <!-- Right: Protected Corporate Network -->
  <rect x="725" y="80" width="190" height="185" fill="#064e3b" rx="8" stroke="#34d399" stroke-width="2"/>
  <text x="820" y="108" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Protected Intranet</text>
  <text x="820" y="126" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Corporate LAN &amp; DB</text>
  <rect x="740" y="145" width="160" height="45" fill="#022c22" rx="4"/>
  <text x="820" y="165" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Web &amp; Mail Servers</text>
  <text x="820" y="180" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">DMZ Perimeter Zone</text>
  <rect x="740" y="200" width="160" height="50" fill="#064e3b" rx="4"/>
  <text x="820" y="220" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Internal Core Database</text>
  <text x="820" y="235" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="8.5" text-anchor="middle">Isolated Private Subnets</text>

  <!-- Connectors -->
  <line x1="215" y1="175" x2="255" y2="175" stroke="#ef4444" stroke-width="2"/>
  <line x1="685" y1="175" x2="725" y2="175" stroke="#4ade80" stroke-width="2"/>

  <!-- Bottom Panel: 5 Networking Diagnostic Commands (Slides 89 - 93) -->
  <rect x="35" y="285" width="880" height="180" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="305" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ESSENTIAL NETWORKING DIAGNOSTIC COMMANDS (SLIDES 89 - 93)</text>

  <!-- 5 Columns for 5 Commands -->
  <rect x="45" y="320" width="165" height="130" fill="#1e293b" rx="5"/>
  <text x="127" y="338" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">1. ipconfig</text>
  <text x="55" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Displays host IP,</text>
  <text x="55" y="372" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">  subnet mask &amp; gateway.</text>
  <text x="55" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• <code>/all</code> shows MAC &amp; DNS.</text>
  <text x="55" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• <code>/flushdns</code> clears cache.</text>
  <text x="55" y="420" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8">Linux: <code>ifconfig / ip a</code></text>

  <rect x="220" y="320" width="165" height="130" fill="#1e293b" rx="5"/>
  <text x="302" y="338" fill="#34d399" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">2. nslookup</text>
  <text x="230" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• "Name System Lookup".</text>
  <text x="230" y="372" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Queries DNS servers</text>
  <text x="230" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">  for domain mappings.</text>
  <text x="230" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Checks MX &amp; A records.</text>
  <text x="230" y="420" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8">e.g., <code>nslookup aktu.ac.in</code></text>

  <rect x="395" y="320" width="165" height="130" fill="#1e293b" rx="5"/>
  <text x="477" y="338" fill="#facc15" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">3. tracert</text>
  <text x="405" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• "Trace Route" utility.</text>
  <text x="405" y="372" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Increments IP TTL (1,2,3)</text>
  <text x="405" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">  to list intermediate hops.</text>
  <text x="405" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Identifies network delays.</text>
  <text x="405" y="420" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8">Linux: <code>traceroute</code></text>

  <rect x="570" y="320" width="165" height="130" fill="#1e293b" rx="5"/>
  <text x="652" y="338" fill="#f87171" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">4. ping</text>
  <text x="580" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Tests end-to-end link.</text>
  <text x="580" y="372" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Sends ICMP Echo Request</text>
  <text x="580" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">  (Type 8) &amp; waits Reply (0).</text>
  <text x="580" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Measures packet loss &amp; RTT.</text>
  <text x="580" y="420" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8">e.g., <code>ping 8.8.8.8</code></text>

  <rect x="745" y="320" width="160" height="130" fill="#1e293b" rx="5"/>
  <text x="825" y="338" fill="#c084fc" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">5. netstat</text>
  <text x="755" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• "Network Statistics".</text>
  <text x="755" y="372" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• Displays active TCP links</text>
  <text x="755" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">  and listening ports.</text>
  <text x="755" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">• <code>-ano</code> shows PIDs &amp; IPs.</text>
  <text x="755" y="420" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8">Essential for port audits.</text>
</svg>