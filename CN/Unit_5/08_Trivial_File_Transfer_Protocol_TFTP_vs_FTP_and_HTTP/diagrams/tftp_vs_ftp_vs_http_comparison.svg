<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="tftpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tftpCol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#tftpBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">TRIVIAL FTP (TFTP) vs FTP vs HTTP ARCHITECTURAL MATRIX</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">UDP Bootstrapping Mechanics, 512-Byte Blocks, Stop-and-Wait ACK &amp; Protocol Comparison</text>

  <!-- Left: TFTP Architecture Box -->
  <rect x="40" y="80" width="415" height="195" fill="#1e293b" rx="8" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="80" width="415" height="35" fill="url(#tftpCol)" rx="8"/>
  <text x="247" y="103" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">TFTP Architecture (RFC 1350 — UDP Port 69)</text>

  <text x="55" y="133" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Transport Protocol:</b> UDP Port 69 (Minimalist, connectionless).</text>
  <text x="55" y="151" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>No Authentication:</b> Zero username / password security check.</text>
  <text x="55" y="169" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Fixed 512-Byte Data Blocks:</b> Data split into fixed 512-byte payload.</text>
  <text x="55" y="187" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Stop-and-Wait Error Control:</b> Sender sends Block N, waits for ACK N.</text>
  <text x="55" y="205" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Termination Signal:</b> Block size &lt; 512 bytes signals EOF (End of File).</text>
  <text x="55" y="223" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Primary Use-Case:</b> PXE Network Booting, loading Cisco IOS firmware.</text>
  <rect x="55" y="235" width="385" height="30" fill="#78350f" rx="4"/>
  <text x="247" y="254" fill="#fde68a" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">5 Packet Types: RRQ (1), WRQ (2), DATA (3), ACK (4), ERROR (5)</text>

  <!-- Right: Stop-and-Wait Handshake Visualizer -->
  <rect x="495" y="80" width="415" height="195" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="2"/>
  <text x="702" y="105" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TFTP STOP-AND-WAIT INTERACTION</text>

  <rect x="520" y="125" width="80" height="25" fill="#2563eb" rx="4"/>
  <text x="560" y="141" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Client (TID)</text>

  <rect x="800" y="125" width="80" height="25" fill="#059669" rx="4"/>
  <text x="840" y="141" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Server (69)</text>

  <line x1="560" y1="155" x2="560" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="840" y1="155" x2="840" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- RRQ -->
  <line x1="560" y1="165" x2="840" y2="175" stroke="#facc15" stroke-width="1.5"/>
  <text x="700" y="167" fill="#facc15" font-family="Consolas, monospace" font-size="8.5" text-anchor="middle">RRQ (Read Request "firmware.bin")</text>

  <!-- DATA 1 -->
  <line x1="840" y1="190" x2="560" y2="200" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="700" y="192" fill="#38bdf8" font-family="Consolas, monospace" font-size="8.5" text-anchor="middle">DATA Block 1 (512 Bytes)</text>

  <!-- ACK 1 -->
  <line x1="560" y1="215" x2="840" y2="225" stroke="#4ade80" stroke-width="1.5"/>
  <text x="700" y="217" fill="#4ade80" font-family="Consolas, monospace" font-size="8.5" text-anchor="middle">ACK Block 1</text>

  <!-- DATA 2 (Final) -->
  <line x1="840" y1="235" x2="560" y2="245" stroke="#f87171" stroke-width="1.5"/>
  <text x="700" y="238" fill="#f87171" font-family="Consolas, monospace" font-size="8.5" text-anchor="middle">DATA Block 2 (214 Bytes &lt; 512 = EOF)</text>

  <!-- Bottom Panel: Master 3-Way Comparison Table -->
  <rect x="40" y="290" width="870" height="175" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="312" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3-WAY MASTER ARCHITECTURAL COMPARISON: FTP vs TFTP vs HTTP</text>

  <!-- 3 Comparative Columns -->
  <rect x="55" y="325" width="265" height="125" fill="#1e293b" rx="5"/>
  <text x="187" y="345" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FTP (RFC 959)</text>
  <text x="65" y="365" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Transport:</b> TCP Ports 20 &amp; 21</text>
  <text x="65" y="381" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Connections:</b> Dual (Control &amp; Data)</text>
  <text x="65" y="397" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Security:</b> User/Pass auth support</text>
  <text x="65" y="413" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Directories:</b> Full browsing, rename, delete</text>
  <text x="65" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Memory Footprint:</b> Heavy implementation</text>

  <rect x="342" y="325" width="265" height="125" fill="#1e293b" rx="5"/>
  <text x="474" y="345" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">TFTP (RFC 1350)</text>
  <text x="352" y="365" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Transport:</b> UDP Port 69</text>
  <text x="352" y="381" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Connections:</b> Connectionless datagrams</text>
  <text x="352" y="397" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Security:</b> None (No auth / cleartext)</text>
  <text x="352" y="413" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Directories:</b> Cannot list or change dirs</text>
  <text x="352" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Footprint:</b> Ultra-light (Fits in ROM/BIOS)</text>

  <rect x="630" y="325" width="265" height="125" fill="#1e293b" rx="5"/>
  <text x="762" y="345" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">HTTP (RFC 2616)</text>
  <text x="640" y="365" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Transport:</b> TCP Port 80 / 443</text>
  <text x="640" y="381" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Connections:</b> Single TCP stream per session</text>
  <text x="640" y="397" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Security:</b> HTTPS SSL/TLS encryption</text>
  <text x="640" y="413" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Primary Use:</b> Hypertext Web &amp; REST APIs</text>
  <text x="640" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Footprint:</b> Rich feature stack &amp; caching</text>
</svg>