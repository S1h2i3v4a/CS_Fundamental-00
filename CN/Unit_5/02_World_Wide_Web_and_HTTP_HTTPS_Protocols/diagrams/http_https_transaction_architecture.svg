<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="httpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="clientBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="serverTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#httpBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">WORLD WIDE WEB: HTTP &amp; HTTPS TRANSACTION ARCHITECTURE</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Request-Response Cycle, Methods, Status Codes, Persistent vs Non-Persistent &amp; SSL/TLS</text>

  <!-- Left: Web Browser (Client) -->
  <rect x="40" y="80" width="180" height="180" fill="url(#clientBlue)" rx="8" stroke="#60a5fa" stroke-width="2"/>
  <text x="130" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Web Browser (Client)</text>
  <text x="130" y="130" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">User Agent Process</text>
  <rect x="55" y="145" width="150" height="45" fill="#1e3a8a" rx="4"/>
  <text x="130" y="163" fill="#facc15" font-family="Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">URL Parsing &amp; Render</text>
  <text x="130" y="180" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">HTML, CSS, JS, Media</text>
  <text x="130" y="215" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Manages Cookies &amp; Cache</text>
  <text x="130" y="235" fill="#93c5fd" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Ephemeral Ports (>1023)</text>

  <!-- Center Transaction Area -->
  <!-- Top: HTTP Request Message -->
  <rect x="270" y="90" width="410" height="65" fill="#1e293b" rx="6" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="475" y="110" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">HTTP REQUEST: GET /index.html HTTP/1.1</text>
  <text x="475" y="128" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Headers: Host: aktu.ac.in | User-Agent: Chrome | Connection: keep-alive</text>
  <text x="475" y="145" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">[Optional Entity Body for POST / PUT methods]</text>

  <!-- Bottom: HTTP Response Message -->
  <rect x="270" y="185" width="410" height="65" fill="#1e293b" rx="6" stroke="#4ade80" stroke-width="1.5"/>
  <text x="475" y="205" fill="#4ade80" font-family="Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">HTTP RESPONSE: HTTP/1.1 200 OK</text>
  <text x="475" y="223" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Headers: Content-Type: text/html | Content-Length: 4096 | Set-Cookie: id=xyz</text>
  <text x="475" y="240" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">[HTML Data Stream Delivered to Client Socket]</text>

  <!-- Arrows -->
  <line x1="220" y1="122" x2="270" y2="122" stroke="#38bdf8" stroke-width="2"/>
  <line x1="680" y1="122" x2="730" y2="122" stroke="#38bdf8" stroke-width="2"/>
  <line x1="730" y1="217" x2="680" y2="217" stroke="#4ade80" stroke-width="2"/>
  <line x1="270" y1="217" x2="220" y2="217" stroke="#4ade80" stroke-width="2"/>

  <!-- Right: Web Server -->
  <rect x="730" y="80" width="180" height="180" fill="url(#serverTeal)" rx="8" stroke="#2dd4bf" stroke-width="2"/>
  <text x="820" y="110" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Web Server (Daemon)</text>
  <text x="820" y="130" fill="#ccfbf1" font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">Apache / Nginx / IIS</text>
  <rect x="745" y="145" width="150" height="45" fill="#134e4a" rx="4"/>
  <text x="820" y="163" fill="#facc15" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">Port 80 (HTTP)</text>
  <text x="820" y="180" fill="#a7f3d0" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">Port 443 (HTTPS)</text>
  <text x="820" y="215" fill="#f0fdfa" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle">Stateless Protocol Engine</text>
  <text x="820" y="235" fill="#5eead4" font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle">Backend DB &amp; PHP / Node</text>

  <!-- Bottom Panel: 3 Comparative Grids -->
  <rect x="40" y="285" width="870" height="175" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>

  <!-- Col 1: HTTP Methods & Codes -->
  <rect x="55" y="300" width="265" height="145" fill="#1e293b" rx="5"/>
  <text x="187" y="320" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Methods &amp; Status Codes</text>
  <text x="65" y="340" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>GET:</b> Fetch resource (idempotent)</text>
  <text x="65" y="358" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>POST:</b> Submit data / upload payload</text>
  <text x="65" y="376" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>PUT:</b> Replace resource | <b>DELETE:</b> Remove</text>
  <text x="65" y="394" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>200 OK</b> | <b>301 Moved</b> | <b>304 Not Modified</b></text>
  <text x="65" y="412" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>400 Bad Request</b> | <b>404 Not Found</b></text>
  <text x="65" y="430" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>500 Server Error</b> | <b>503 Unavailable</b></text>

  <!-- Col 2: Persistent vs Non-Persistent -->
  <rect x="342" y="300" width="265" height="145" fill="#1e293b" rx="5"/>
  <text x="474" y="320" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Persistent vs Non-Persistent</text>
  <text x="352" y="340" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>HTTP/1.0 (Non-Persistent):</b></text>
  <text x="360" y="356" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  1 TCP connection per object (2 RTT delay)</text>
  <text x="352" y="374" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>HTTP/1.1 (Persistent):</b></text>
  <text x="360" y="390" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  Single TCP connection for all webpage objects</text>
  <text x="352" y="408" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Pipelining:</b> Send next request without</text>
  <text x="360" y="424" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  waiting for previous object's ACK</text>

  <!-- Col 3: HTTP vs HTTPS -->
  <rect x="630" y="300" width="265" height="145" fill="#1e293b" rx="5"/>
  <text x="762" y="320" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. HTTP vs HTTPS Security</text>
  <text x="640" y="340" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>HTTP (Port 80):</b> Plaintext data transfer.</text>
  <text x="648" y="356" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="8.5">  Vulnerable to sniffing and MITM attacks.</text>
  <text x="640" y="374" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>HTTPS (Port 443):</b> HTTP over TLS/SSL.</text>
  <text x="648" y="390" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="8.5">  Asymmetric handshake + Symmetric encryption.</text>
  <text x="640" y="408" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Digital Certificate:</b> Authenticates server</text>
  <text x="648" y="424" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  issued by trusted Certificate Authority (CA).</text>
</svg>