<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pyqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pyqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#pyqBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">UNIT 5: AKTU SEMESTER EXAM PYQS &amp; NUMERICAL BANK</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Gateway Classes Past 8 Years Solved Trends (2016-17 to 2023-24) | High-Yield Answer Blueprints</text>

  <!-- Left: High-Frequency Theory Questions -->
  <rect x="40" y="75" width="415" height="205" fill="#1e293b" rx="8" stroke="#38bdf8" stroke-width="2"/>
  <rect x="40" y="75" width="415" height="32" fill="#0284c7" rx="8"/>
  <text x="247" y="97" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Top High-Frequency AKTU Theory Questions</text>

  <text x="55" y="125" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">1. TELNET Working &amp; Procedure (4 Times Repeated!)</text>
  <text x="55" y="140" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">   AKTU 2016-17, 2017-18, 2018-19, 2023-24: Port 23, NVT character set, IAC.</text>

  <text x="55" y="160" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">2. DNS Divisions &amp; Resolution (AKTU 2018-19, 2021-22)</text>
  <text x="55" y="175" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">   Generic, Country, Inverse domains + Recursive vs Iterative resolution.</text>

  <text x="55" y="195" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">3. HTTP vs HTTPS &amp; Methods (AKTU 2021-22, 2022-23)</text>
  <text x="55" y="210" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">   Port 80 vs 443, SSL/TLS security layer, GET vs POST vs HEAD.</text>

  <text x="55" y="230" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">4. FTP vs TFTP vs HTTP Comparison (AKTU 2023-24)</text>
  <text x="55" y="245" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">   TCP Ports 20/21 vs UDP Port 69 vs TCP Port 80, active vs passive mode.</text>

  <text x="55" y="263" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">5. SNMP Framework (AKTU 2018-19, 2022-23, 2023-24)</text>
  <text x="55" y="275" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="8.5">   SMI, MIB, SNMP roles, UDP 161/162, 3 management functions.</text>

  <!-- Right: Solved Numerical & Encryption Models -->
  <rect x="495" y="75" width="415" height="205" fill="#1e293b" rx="8" stroke="#f59e0b" stroke-width="2"/>
  <rect x="495" y="75" width="415" height="32" fill="url(#pyqGold)" rx="8"/>
  <text x="702" y="97" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Solved Numerical &amp; Protocol Tracing Models</text>

  <text x="510" y="125" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">1. RSA Character "F" Transmission (AKTU 2022-23)</text>
  <text x="510" y="140" fill="#e2e8f0" font-family="Consolas, monospace" font-size="8.5">   p=3, q=11, n=33, φ(n)=20, e=3, d=7, P=5</text>
  <text x="510" y="153" fill="#a7f3d0" font-family="Consolas, monospace" font-size="8.5">   Encrypt: C = 5^3 mod 33 = 26 | Decrypt: P = 26^7 mod 33 = 5 ("F")</text>

  <text x="510" y="173" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">2. Caesar Cipher "HELLO" Shift (Slide 75)</text>
  <text x="510" y="188" fill="#e2e8f0" font-family="Consolas, monospace" font-size="8.5">   C = (P + 3) mod 26 -> H->K, E->H, L->O, L->O, O->R -> "KHOOR"</text>

  <text x="510" y="208" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">3. Run-Length Encoding Compression Ratio</text>
  <text x="510" y="223" fill="#e2e8f0" font-family="Consolas, monospace" font-size="8.5">   Raw: 12 Bytes -> Compressed: 10 Bytes (CR = 1.2 : 1)</text>

  <text x="510" y="243" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5" font-weight="700">4. Passive FTP Port Math</text>
  <text x="510" y="258" fill="#e2e8f0" font-family="Consolas, monospace" font-size="8.5">   227 Entering Passive Mode (192,168,1,10, 8, 4) -> Port = 8*256+4 = 2052</text>

  <!-- Bottom: 10 Mark Scoring Blueprint Table -->
  <rect x="40" y="295" width="870" height="165" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="315" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">AKTU 10-MARK ANSWER WRITING BLUEPRINT: APPLICATION LAYER</text>

  <!-- 3 Strategy Boxes -->
  <rect x="55" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="187" y="348" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1. Protocol Diagram Mandate</text>
  <text x="65" y="368" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Always draw client-server interaction diagrams.</text>
  <text x="65" y="386" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Clearly mark Port numbers: DNS (53),</text>
  <text x="73" y="402" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="8.5">  HTTP (80), TELNET (23), SMTP (25), POP3 (110).</text>
  <text x="65" y="420" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• State whether protocol is PUSH or PULL.</text>

  <rect x="342" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="474" y="348" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2. Mathematical Derivations</text>
  <text x="352" y="368" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• In RSA, explicitly state Euler totient formula</text>
  <text x="360" y="384" fill="#a7f3d0" font-family="Consolas, monospace" font-size="8.5">  φ(n) = (p - 1)(q - 1) before computing d.</text>
  <text x="352" y="402" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Write Extended Euclidean tabular steps.</text>
  <text x="352" y="420" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Verify decryption step explicitly: C^d mod n.</text>

  <rect x="630" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="762" y="348" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3. Comparative Questions</text>
  <text x="640" y="368" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Use tabular formats for comparison questions:</text>
  <text x="648" y="384" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  • HTTP vs HTTPS | • POP3 vs IMAP4</text>
  <text x="648" y="398" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  • FTP vs TFTP | • Symmetric vs Asymmetric</text>
  <text x="640" y="418" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Mention exact RFC standard numbers.</text>
</svg>