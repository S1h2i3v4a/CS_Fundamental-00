<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="maaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pop3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="imap4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#maaBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">MESSAGE ACCESS PROTOCOLS: POP3 vs IMAP4 ARCHITECTURE</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Mail Retrieval Mechanics, Delete vs Keep Mode, Server-Side Folder Synchronization &amp; Bandwidth</text>

  <!-- Left: POP3 Architecture Box -->
  <rect x="40" y="80" width="415" height="205" fill="#1e293b" rx="8" stroke="#ea580c" stroke-width="2"/>
  <rect x="40" y="80" width="415" height="35" fill="url(#pop3Grad)" rx="8"/>
  <text x="247" y="103" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">POP3 (Post Office Protocol v3 — RFC 1939)</text>

  <text x="55" y="135" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Port:</b> TCP Port 110 (Cleartext) | Port 995 (POP3S over SSL)</text>
  <text x="55" y="153" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Core Philosophy:</b> Simple offline download-and-read model.</text>
  <text x="55" y="171" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Delete Mode:</b> Mailbox mail deleted from server upon download.</text>
  <text x="55" y="189" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Keep Mode:</b> Copies kept on server, but states not synchronized.</text>
  <text x="55" y="207" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Single Device Bound:</b> Multi-device usage causes state divergence.</text>
  <text x="55" y="225" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>No Folder Hierarchy:</b> Cannot create or organize server-side folders.</text>
  <text x="55" y="243" fill="#f87171" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Full Download Only:</b> Must download full message including attachments.</text>
  <rect x="55" y="255" width="385" height="22" fill="#7c2d12" rx="3"/>
  <text x="247" y="270" fill="#fed7aa" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">Commands: USER, PASS, STAT, LIST, RETR, DELE, QUIT</text>

  <!-- Right: IMAP4 Architecture Box -->
  <rect x="495" y="80" width="415" height="205" fill="#1e293b" rx="8" stroke="#2563eb" stroke-width="2"/>
  <rect x="495" y="80" width="415" height="35" fill="url(#imap4Grad)" rx="8"/>
  <text x="702" y="103" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">IMAP4 (Internet Message Access Protocol v4 — RFC 3501)</text>

  <text x="510" y="135" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Port:</b> TCP Port 143 (Cleartext) | Port 993 (IMAPS over SSL)</text>
  <text x="510" y="153" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Core Philosophy:</b> Dynamic client-server synchronized database.</text>
  <text x="510" y="171" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Multi-Device Sync:</b> Phone, laptop &amp; webmail see identical mailbox state.</text>
  <text x="510" y="189" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Message Flags:</b> \Seen, \Answered, \Flagged, \Deleted tracked centrally.</text>
  <text x="510" y="207" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Server Folders:</b> Create, rename, delete hierarchical folders on server.</text>
  <text x="510" y="225" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Partial Fetch:</b> Download headers or preview without 20MB attachments.</text>
  <text x="510" y="243" fill="#4ade80" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Server-Side Search:</b> Search keywords without downloading all emails.</text>
  <rect x="510" y="255" width="385" height="22" fill="#1e3a8a" rx="3"/>
  <text x="702" y="270" fill="#93c5fd" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">Commands: LOGIN, SELECT, FETCH, STORE, COPY, SEARCH, LOGOUT</text>

  <!-- Bottom: 10-Point Master Comparison Matrix -->
  <rect x="40" y="300" width="870" height="165" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="322" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">MASTER COMPARATIVE MATRIX: POP3 vs IMAP4</text>

  <!-- 3 Cols Summary -->
  <rect x="55" y="335" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="187" y="355" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1. Protocol Role &amp; Ports</text>
  <text x="65" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Type:</b> Both are Message Access (PULL)</text>
  <text x="65" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>POP3:</b> Port 110 (Clear) / 995 (SSL)</text>
  <text x="65" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>IMAP4:</b> Port 143 (Clear) / 993 (SSL)</text>
  <text x="65" y="429" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>SMTP Role:</b> Pushes mail; cannot pull.</text>

  <rect x="342" y="335" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="474" y="355" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2. Storage &amp; Sync Mechanics</text>
  <text x="352" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>POP3:</b> Local client machine storage.</text>
  <text x="352" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>IMAP4:</b> Central mail server storage.</text>
  <text x="352" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Read Status:</b> POP3 cannot sync read tags;</text>
  <text x="360" y="427" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  IMAP4 syncs across all logged-in devices.</text>

  <rect x="630" y="335" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="762" y="355" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3. Bandwidth &amp; Resource Efficiency</text>
  <text x="640" y="375" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>POP3:</b> Requires full file download.</text>
  <text x="640" y="393" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>IMAP4:</b> Headers-only preview saves data.</text>
  <text x="640" y="411" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Server Load:</b> POP3 has very low RAM churn;</text>
  <text x="648" y="427" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  IMAP4 requires robust high-RAM servers.</text>
</svg>