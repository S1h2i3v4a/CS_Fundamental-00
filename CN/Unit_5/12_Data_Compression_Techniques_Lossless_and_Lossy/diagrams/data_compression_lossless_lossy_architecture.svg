<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="losslessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="lossyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="950" height="480" fill="url(#compBg)" rx="10"/>

  <text x="475" y="32" fill="#38bdf8" font-family="-apple-system, Segoe UI, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">DATA COMPRESSION: LOSSLESS vs LOSSY ARCHITECTURE</text>
  <text x="475" y="52" fill="#94a3b8" font-family="-apple-system, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Run-Length Encoding, Huffman, Lempel-Ziv (LZ), Audio Psychoacoustics &amp; Temporal Masking</text>

  <!-- Left: Lossless Compression -->
  <rect x="40" y="80" width="415" height="195" fill="#1e293b" rx="8" stroke="#059669" stroke-width="2"/>
  <rect x="40" y="80" width="415" height="35" fill="url(#losslessGrad)" rx="8"/>
  <text x="247" y="103" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">LOSSLESS COMPRESSION (Zero Data Loss)</text>

  <text x="55" y="133" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Principle:</b> Exact bit-for-bit mathematical restoration.</text>
  <text x="55" y="151" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Mandatory For:</b> Text code (.c, .java), Databases, Executable binaries.</text>
  <text x="55" y="169" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>1. Run-Length Encoding (RLE):</b> Replaces repeated streaks.</text>
  <text x="65" y="185" fill="#a7f3d0" font-family="Consolas, monospace" font-size="9">  "AAAAABBBCCDA" -> "A5B3C2D1A1" (12 bytes -> 10 bytes)</text>
  <text x="55" y="203" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>2. Huffman Coding:</b> Variable length prefix codes based on freq.</text>
  <text x="55" y="221" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>3. Lempel-Ziv (LZ77 / LZW):</b> Dictionary table index replaces words.</text>
  <rect x="55" y="235" width="385" height="25" fill="#064e3b" rx="3"/>
  <text x="247" y="252" fill="#d1fae5" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">Formats: ZIP, GZIP, PNG, 7z, FLAC, TIFF</text>

  <!-- Right: Lossy Compression -->
  <rect x="495" y="80" width="415" height="195" fill="#1e293b" rx="8" stroke="#d97706" stroke-width="2"/>
  <rect x="495" y="80" width="415" height="35" fill="url(#lossyGrad)" rx="8"/>
  <text x="702" y="103" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" text-anchor="middle">LOSSY COMPRESSION (Perceptual Pruning)</text>

  <text x="510" y="133" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Principle:</b> Discards imperceptible details for massive size cuts.</text>
  <text x="510" y="151" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Mandatory For:</b> Streaming Video (YouTube), Music, Photos.</text>
  <text x="510" y="169" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Audio Psychoacoustics &amp; Masking (Slide 87 - 88):</b></text>
  <text x="520" y="185" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="9">  • <b>Frequency Masking:</b> Loud tone drowns weaker tone at nearby Hz.</text>
  <text x="520" y="201" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="9">  • <b>Temporal Masking:</b> Loud strike (hammer) desensitizes ear briefly.</text>
  <text x="510" y="221" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9.5">• <b>Image Compression (JPEG):</b> Discrete Cosine Transform (DCT).</text>
  <rect x="510" y="235" width="385" height="25" fill="#78350f" rx="3"/>
  <text x="702" y="252" fill="#fef3c7" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">Formats: MP3, AAC, JPEG, MPEG, H.264, MP4</text>

  <!-- Bottom Panel: Master Comparison & Formulas -->
  <rect x="40" y="295" width="870" height="165" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="315" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DATA COMPRESSION COMPARATIVE MATRIX &amp; METRICS (SLIDE 84 - 88)</text>

  <!-- Col 1: Metrics -->
  <rect x="55" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="187" y="350" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1. Metrics &amp; Equations</text>
  <text x="65" y="370" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Compression Ratio:</b></text>
  <text x="73" y="386" fill="#facc15" font-family="Consolas, monospace" font-size="8.5">  CR = Uncompressed Size / Compressed Size</text>
  <text x="65" y="404" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Space Savings:</b></text>
  <text x="73" y="420" fill="#facc15" font-family="Consolas, monospace" font-size="8.5">  Savings = 1 - (Compressed / Original)</text>

  <!-- Col 2: Lossless vs Lossy -->
  <rect x="342" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="474" y="350" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2. Fidelity vs Compression Ratio</text>
  <text x="352" y="370" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Lossless Ratio:</b> Modest (usually 2:1 to 4:1).</text>
  <text x="352" y="388" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Lossy Ratio:</b> Extreme (10:1 to 50:1+).</text>
  <text x="352" y="406" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Decompressing lossy video does not match</text>
  <text x="360" y="422" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="8.5">  original raw RGB sensor matrix bit-for-bit.</text>

  <!-- Col 3: Audio Masking Analogy -->
  <rect x="630" y="330" width="265" height="115" fill="#1e293b" rx="5"/>
  <text x="762" y="350" fill="#facc15" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3. Psychoacoustic Masking</text>
  <text x="640" y="370" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• <b>Slide 88 Hammer Analogy:</b></text>
  <text x="648" y="386" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="8.5">  When a loud hammer strikes, ear cannot</text>
  <text x="648" y="400" fill="#fde68a" font-family="Segoe UI, sans-serif" font-size="8.5">  detect a pin dropping immediately after.</text>
  <text x="640" y="418" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="9">• Discarding masked sounds saves 90% space!</text>
</svg>