<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="hamGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7c2d12"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Error Correction: Hamming (7, 4) Code Architecture, Parity Positions &amp; Syndrome Decoding</text>

  <!-- Left: Bit Position Grid & Parity Coverage -->
  <rect x="35" y="55" width="410" height="235" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="410" height="28" rx="6" fill="url(#hamGrad)"/>
  <text x="240" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Bit Positions &amp; Parity Check Sets (7-Bit Codeword)</text>

  <!-- Grid of 7 bits -->
  <g transform="translate(50, 95)">
    <!-- Column headers -->
    <text x="25" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 1</text>
    <text x="75" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 2</text>
    <text x="125" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 3</text>
    <text x="175" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 4</text>
    <text x="225" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 5</text>
    <text x="275" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 6</text>
    <text x="325" y="12" font-size="8.5" fill="#64748b" text-anchor="middle">Pos 7</text>

    <!-- Cells -->
    <rect x="5" y="18" width="40" height="28" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="25" y="36" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">p1</text>

    <rect x="55" y="18" width="40" height="28" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="75" y="36" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">p2</text>

    <rect x="105" y="18" width="40" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="125" y="36" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">d1</text>

    <rect x="155" y="18" width="40" height="28" rx="3" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="175" y="36" font-size="11" font-weight="bold" fill="#c2410c" text-anchor="middle">p4</text>

    <rect x="205" y="18" width="40" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="225" y="36" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">d2</text>

    <rect x="255" y="18" width="40" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="275" y="36" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">d3</text>

    <rect x="305" y="18" width="40" height="28" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="325" y="36" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">d4</text>

    <!-- Binary labels -->
    <text x="25" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">001</text>
    <text x="75" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">010</text>
    <text x="125" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">011</text>
    <text x="175" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">100</text>
    <text x="225" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">101</text>
    <text x="275" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">110</text>
    <text x="325" y="60" font-size="8" font-family="monospace" fill="#64748b" text-anchor="middle">111</text>
  </g>

  <!-- Parity Coverage Equations -->
  <rect x="50" y="170" width="380" height="110" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="60" y="186" fill="#9a3412" font-size="9" font-weight="bold">• Parity Bit Mathematical Coverage (Even Parity):</text>
  <text x="60" y="202" fill="#334155" font-size="8.5" font-family="monospace">p1 (Bit 0 in pos is 1) → Checks: 1, 3, 5, 7 → p1 = d1 ⊕ d2 ⊕ d4</text>
  <text x="60" y="220" fill="#334155" font-size="8.5" font-family="monospace">p2 (Bit 1 in pos is 1) → Checks: 2, 3, 6, 7 → p2 = d1 ⊕ d3 ⊕ d4</text>
  <text x="60" y="238" fill="#334155" font-size="8.5" font-family="monospace">p4 (Bit 2 in pos is 1) → Checks: 4, 5, 6, 7 → p4 = d2 ⊕ d3 ⊕ d4</text>
  <text x="60" y="258" fill="#c2410c" font-size="8" font-weight="bold">Parity bits placed strictly at powers of 2 (1, 2, 4, 8, 16...)</text>

  <!-- Right: Syndrome Decoding Matrix -->
  <rect x="460" y="55" width="355" height="235" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="55" width="355" height="28" rx="6" fill="#0f172a"/>
  <text x="637" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. Syndrome Decoding Word (S4 S2 S1)</text>

  <rect x="475" y="92" width="325" height="60" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="485" y="108" fill="#1e40af" font-size="9" font-weight="bold">Syndrome Bit Equations at Receiver:</text>
  <text x="485" y="122" fill="#1e3a8a" font-size="8.5" font-family="monospace">s1 = b1 ⊕ b3 ⊕ b5 ⊕ b7</text>
  <text x="485" y="136" fill="#1e3a8a" font-size="8.5" font-family="monospace">s2 = b2 ⊕ b3 ⊕ b6 ⊕ b7   |   s4 = b4 ⊕ b5 ⊕ b6 ⊕ b7</text>

  <rect x="475" y="160" width="325" height="120" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="485" y="176" fill="#166534" font-size="9" font-weight="bold">Syndrome Interpretation &amp; Correction:</text>
  <text x="485" y="192" fill="#334155" font-size="8.5">If Syndrome = 000 → No error! Data accepted.</text>
  <text x="485" y="208" fill="#dc2626" font-size="8.5" font-weight="bold">If Syndrome ≠ 000 → Binary value equals the ERROR BIT position!</text>
  <text x="485" y="224" fill="#334155" font-size="8">E.g., Syndrome = 110 (binary 6) → Bit 6 is corrupted!</text>
  <text x="485" y="240" fill="#15803d" font-size="8.5" font-weight="bold">Correction Action: Simply invert bit 6 (0 → 1 or 1 → 0)!</text>
  <text x="485" y="258" fill="#0f172a" font-size="8">No retransmission required! Forward Error Correction (FEC).</text>

  <!-- Bottom: Hamming Distance & Redundancy Formula Box -->
  <rect x="35" y="300" width="780" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="300" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="316" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Hamming Distance Theorem &amp; Redundancy Inequality (AKTU Core Formulas)</text>

  <text x="50" y="340" fill="#0f172a" font-size="9.5" font-weight="bold">Redundancy Bits Formula:</text>
  <text x="210" y="340" fill="#1e3a8a" font-size="10" font-weight="bold" font-family="monospace">2^r ≥ m + r + 1</text>
  <text x="350" y="340" fill="#334155" font-size="8.5">where m = data bits, r = check/parity bits. For m = 4 bits: 2^3 = 8 ≥ 4+3+1 = 8 (r = 3).</text>

  <text x="50" y="365" fill="#0f172a" font-size="9.5" font-weight="bold">Hamming Distance d_min:</text>
  <text x="210" y="365" fill="#334155" font-size="8.5">Number of bit positions in which two codewords differ (XOR weight).</text>

  <text x="50" y="388" fill="#0f172a" font-size="9.5" font-weight="bold">Error Detection Condition:</text>
  <text x="210" y="388" fill="#c2410c" font-size="9" font-weight="bold">d_min ≥ d + 1   (To detect up to 'd' bit errors)</text>

  <text x="50" y="412" fill="#0f172a" font-size="9.5" font-weight="bold">Error Correction Condition:</text>
  <text x="210" y="412" fill="#15803d" font-size="9" font-weight="bold">d_min ≥ 2t + 1   (To correct up to 't' bit errors)</text>
</svg>