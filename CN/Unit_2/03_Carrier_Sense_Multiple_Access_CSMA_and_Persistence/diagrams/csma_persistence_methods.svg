<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="pNonGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <linearGradient id="pP咲Grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#9a3412"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="420" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CSMA Philosophy ("Listen Before Talk") &amp; 3 Persistence Strategies</text>

  <!-- Method 1: 1-Persistent CSMA -->
  <rect x="35" y="55" width="245" height="240" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="245" height="28" rx="6" fill="url(#p1Grad)"/>
  <text x="157" y="74" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">1. 1-Persistent CSMA</text>

  <rect x="45" y="92" width="225" height="42" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="157" y="110" fill="#1e3a8a" font-size="9.5" font-weight="bold" text-anchor="middle">Greedy Transmission</text>
  <text x="157" y="124" fill="#475569" font-size="8" text-anchor="middle">Sense channel continuously</text>

  <text x="45" y="152" fill="#0f172a" font-size="8.5" font-weight="bold">• If Idle: Transmit immediately (P = 1).</text>
  <text x="45" y="168" fill="#0f172a" font-size="8.5" font-weight="bold">• If Busy: Keep sensing continuously.</text>
  <text x="45" y="184" fill="#334155" font-size="8">The very instant line becomes idle, transmit!</text>

  <rect x="45" y="196" width="225" height="48" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="157" y="214" fill="#991b1b" font-size="8.5" font-weight="bold" text-anchor="middle">High Collision Danger!</text>
  <text x="157" y="230" fill="#7f1d1d" font-size="7.5" text-anchor="middle">If 2+ nodes wait during busy period, both fire together when idle!</text>

  <text x="45" y="260" fill="#2563eb" font-size="8" font-weight="bold">• Zero idle delay when line free</text>
  <text x="45" y="274" fill="#334155" font-size="8">• Used in Classic IEEE 802.3 Ethernet</text>

  <!-- Method 2: Non-Persistent CSMA -->
  <rect x="302" y="55" width="245" height="240" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="302" y="55" width="245" height="28" rx="6" fill="url(#pNonGrad)"/>
  <text x="424" y="74" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">2. Non-Persistent CSMA</text>

  <rect x="312" y="92" width="225" height="42" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="424" y="110" fill="#065f46" font-size="9.5" font-weight="bold" text-anchor="middle">Polite Random Wait</text>
  <text x="424" y="124" fill="#475569" font-size="8" text-anchor="middle">Relinquishes immediate sensing</text>

  <text x="312" y="152" fill="#0f172a" font-size="8.5" font-weight="bold">• If Idle: Transmit immediately.</text>
  <text x="312" y="168" fill="#0f172a" font-size="8.5" font-weight="bold">• If Busy: Back off random time!</text>
  <text x="312" y="184" fill="#334155" font-size="8">Do NOT continuously monitor line.</text>

  <rect x="312" y="196" width="225" height="48" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="424" y="214" fill="#166534" font-size="8.5" font-weight="bold" text-anchor="middle">Drastically Reduces Collisions!</text>
  <text x="424" y="230" fill="#14532d" font-size="7.5" text-anchor="middle">Different random waits prevent simultaneous firing</text>

  <text x="312" y="260" fill="#dc2626" font-size="8" font-weight="bold">• Channel remains idle unnecessarily</text>
  <text x="312" y="274" fill="#334155" font-size="8">• Lower channel efficiency at low load</text>

  <!-- Method 3: p-Persistent CSMA -->
  <rect x="570" y="55" width="245" height="240" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="570" y="55" width="245" height="28" rx="6" fill="url(#pP咲Grad)"/>
  <text x="692" y="74" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">3. p-Persistent CSMA</text>

  <rect x="580" y="92" width="225" height="42" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="692" y="110" fill="#9a3412" font-size="9.5" font-weight="bold" text-anchor="middle">Probabilistic Slotted Compromise</text>
  <text x="692" y="124" fill="#475569" font-size="8" text-anchor="middle">Balances collision &amp; idle wait</text>

  <text x="580" y="152" fill="#0f172a" font-size="8.5" font-weight="bold">• If Idle: Transmit with probability p.</text>
  <text x="580" y="168" fill="#0f172a" font-size="8.5" font-weight="bold">• With prob (1 - p): Wait for next slot.</text>
  <text x="580" y="184" fill="#334155" font-size="8">In next slot: Repeat test if still idle.</text>

  <rect x="580" y="196" width="225" height="48" rx="4" fill="#fefce8" stroke="#fde047"/>
  <text x="692" y="214" fill="#854d0e" font-size="8.5" font-weight="bold" text-anchor="middle">Mathematical Optimum</text>
  <text x="692" y="230" fill="#713f12" font-size="7.5" text-anchor="middle">If N nodes ready, setting p = 1/N avoids collisions</text>

  <text x="580" y="260" fill="#065f46" font-size="8" font-weight="bold">• Optimal trade-off under heavy load</text>
  <text x="580" y="274" fill="#334155" font-size="8">• Used in IEEE 802.11 (CSMA/CA)</text>

  <!-- Bottom: Propagation Delay Vulnerability & Flow Diagram -->
  <rect x="35" y="305" width="780" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="305" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="321" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Why Collisions Still Occur in CSMA: The Propagation Delay (Tp) Window</text>

  <text x="50" y="345" fill="#0f172a" font-size="9.5" font-weight="bold">Root Cause of CSMA Collisions:</text>
  <text x="240" y="345" fill="#334155" font-size="9">Signals take finite propagation time ($T_p = d/v$) to travel down the wire.</text>

  <text x="50" y="367" fill="#0f172a" font-size="9.5" font-weight="bold">Collision Scenario:</text>
  <text x="180" y="367" fill="#dc2626" font-size="9">Host A senses channel (idle) and transmits at $t=0$. Before A's signal reaches distant Host B, B senses channel at $t = T_p - \epsilon$. B also sees channel as "idle" and transmits! Collision occurs mid-wire!</text>

  <text x="50" y="390" fill="#0f172a" font-size="9.5" font-weight="bold">Vulnerable Window:</text>
  <text x="180" y="390" fill="#1e3a8a" font-size="9" font-weight="bold">CSMA Vulnerable Time = Exactly Propagation Delay (Tp). (ALOHA was 2Tfr or Tfr!)</text>
</svg>