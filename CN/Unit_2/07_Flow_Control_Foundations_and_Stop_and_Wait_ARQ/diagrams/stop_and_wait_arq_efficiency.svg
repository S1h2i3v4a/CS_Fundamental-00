<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="swGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Stop-and-Wait ARQ: Protocol Timing, Failure Recovery &amp; Efficiency Derivation</text>

  <!-- Left: Protocol Timeline (Normal vs Lost Frame vs Lost ACK) -->
  <rect x="35" y="55" width="410" height="235" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="410" height="28" rx="6" fill="url(#swGrad)"/>
  <text x="240" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Protocol Operation &amp; Failure Scenarios</text>

  <!-- Time Axis S & R -->
  <line x1="75" y1="95" x2="75" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="95" x2="175" y2="280" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="92" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">Sender</text>
  <text x="175" y="92" fill="#0f172a" font-size="9" font-weight="bold" text-anchor="middle">Receiver</text>

  <!-- Scenario 1: Normal -->
  <line x1="75" y1="105" x2="175" y2="125" stroke="#0284c7" stroke-width="1.8"/>
  <text x="125" y="112" fill="#0284c7" font-size="7.5" text-anchor="middle">Frame 0</text>
  <line x1="175" y1="130" x2="75" y2="150" stroke="#16a34a" stroke-width="1.8"/>
  <text x="125" y="138" fill="#16a34a" font-size="7.5" text-anchor="middle">ACK 1</text>

  <!-- Scenario 2: Lost Frame & Timeout -->
  <line x1="75" y1="160" x2="135" y2="172" stroke="#ef4444" stroke-width="1.8"/>
  <text x="142" y="176" fill="#ef4444" font-size="10" font-weight="bold">×</text>
  <text x="105" y="166" fill="#ef4444" font-size="7.5" text-anchor="middle">Frame 1 (LOST)</text>
  <!-- Timer bracket -->
  <line x1="65" y1="160" x2="65" y2="210" stroke="#d97706" stroke-width="1.5" stroke-dasharray="2"/>
  <text x="50" y="185" fill="#d97706" font-size="7" font-weight="bold" text-anchor="middle">Timeout</text>
  <!-- Retransmission -->
  <line x1="75" y1="210" x2="175" y2="230" stroke="#0284c7" stroke-width="1.8"/>
  <text x="125" y="218" fill="#0284c7" font-size="7.5" text-anchor="middle">Frame 1 (Retx)</text>
  <line x1="175" y1="235" x2="75" y2="255" stroke="#16a34a" stroke-width="1.8"/>
  <text x="125" y="243" fill="#16a34a" font-size="7.5" text-anchor="middle">ACK 0</text>

  <!-- Right text notes in box -->
  <rect x="210" y="95" width="225" height="185" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="220" y="112" fill="#0f172a" font-size="8.5" font-weight="bold">• Key Protocol Rules:</text>
  <text x="220" y="128" fill="#334155" font-size="8">1. Sender sends 1 frame, starts Timer.</text>
  <text x="220" y="143" fill="#334155" font-size="8">2. Receiver accepts, sends ACK for next</text>
  <text x="230" y="156" fill="#334155" font-size="8">expected frame (ACK 1 expects Frame 1).</text>
  <text x="220" y="172" fill="#991b1b" font-size="8">3. If timer expires: Retransmit frame.</text>
  <text x="220" y="190" fill="#0284c7" font-size="8.5" font-weight="bold">• Why 1-bit Sequence Numbers?</text>
  <text x="220" y="206" fill="#334155" font-size="8">Handles Duplicate Frames when ACK is lost!</text>
  <text x="220" y="220" fill="#334155" font-size="8">Sequence numbers toggle: 0 and 1.</text>
  <text x="220" y="235" fill="#334155" font-size="8">Window Size Sender = 1, Receiver = 1.</text>

  <!-- Right: Efficiency Derivation & Formula Box -->
  <rect x="460" y="55" width="355" height="235" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="460" y="55" width="355" height="28" rx="6" fill="#0f172a"/>
  <text x="637" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. Efficiency &amp; Utilization Derivation</text>

  <rect x="475" y="92" width="325" height="52" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="637" y="112" fill="#1e40af" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">Total Cycle Time = Tt + 2 · Tp</text>
  <text x="637" y="130" fill="#1e3a8a" font-size="8.5" text-anchor="middle">(Assuming ACK transmission time &amp; processing delay are negligible)</text>

  <rect x="475" y="152" width="325" height="60" rx="4" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="637" y="172" fill="#c2410c" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">η = Tt / (Tt + 2Tp) = 1 / (1 + 2a)</text>
  <text x="637" y="192" fill="#9a3412" font-size="9.5" font-weight="bold" font-family="monospace" text-anchor="middle">where a = Tp / Tt</text>

  <rect x="475" y="220" width="325" height="62" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="485" y="236" fill="#166534" font-size="8.5" font-weight="bold">Throughput / Useful Bandwidth:</text>
  <text x="485" y="252" fill="#15803d" font-size="10" font-weight="bold" font-family="monospace">Throughput = η · Bandwidth = L / (Tt + 2Tp)</text>
  <text x="485" y="268" fill="#334155" font-size="8">For large Tp (Satellite links, a &gt;&gt; 1): η drops below 1%!</text>

  <!-- Bottom: Solved AKTU Numerical Analysis -->
  <rect x="35" y="300" width="780" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="300" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="316" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">AKTU Core Numerical: Stop-and-Wait ARQ on Satellite Links (Impact of Parameter 'a')</text>

  <text x="50" y="340" fill="#0f172a" font-size="9.5" font-weight="bold">Problem Data:</text>
  <text x="140" y="340" fill="#334155" font-size="8.5">Bandwidth B = 1 Mbps (10^6 bps), Frame Length L = 1000 bits, Propagation Delay Tp = 250 ms (0.25 s).</text>

  <text x="50" y="362" fill="#0f172a" font-size="9.5" font-weight="bold">Step 1 (Tt):</text>
  <text x="140" y="362" fill="#1e3a8a" font-size="9" font-family="monospace">Tt = L / B = 1000 / 10^6 = 1 ms (0.001 s)</text>

  <text x="50" y="384" fill="#0f172a" font-size="9.5" font-weight="bold">Step 2 (Ratio a):</text>
  <text x="140" y="384" fill="#1e3a8a" font-size="9" font-family="monospace">a = Tp / Tt = 250 ms / 1 ms = 250</text>

  <text x="50" y="408" fill="#0f172a" font-size="9.5" font-weight="bold">Step 3 (Efficiency):</text>
  <text x="160" y="408" fill="#b91c1c" font-size="9.5" font-weight="bold" font-family="monospace">η = 1 / (1 + 2 · 250) = 1 / 501 ≈ 0.00199 (0.199%)   |   Throughput = 0.00199 × 1 Mbps = 1.99 kbps</text>
  <text x="50" y="420" fill="#475569" font-size="7.5">Sender spends 99.8% of time sitting idle waiting for ACK! This motivates Sliding Window Pipelining.</text>
</svg>