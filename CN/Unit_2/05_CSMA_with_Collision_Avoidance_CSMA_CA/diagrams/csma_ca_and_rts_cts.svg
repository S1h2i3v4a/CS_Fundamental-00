<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="caGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="rtsGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">CSMA/CA Architecture: Collision Avoidance, IFS &amp; RTS/CTS Handshake (IEEE 802.11)</text>

  <!-- Left: Hidden Station Problem -->
  <rect x="35" y="55" width="375" height="240" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="375" height="28" rx="6" fill="url(#caGrad)"/>
  <text x="222" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Why CSMA/CD Fails in Wireless (Hidden Stations)</text>

  <!-- Radio Ranges -->
  <circle cx="100" cy="140" r="45" fill="#e0f2fe" fill-opacity="0.5" stroke="#0284c7" stroke-dasharray="3"/>
  <circle cx="220" cy="140" r="50" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-dasharray="3"/>
  <circle cx="340" cy="140" r="45" fill="#fee2e2" fill-opacity="0.5" stroke="#dc2626" stroke-dasharray="3"/>

  <!-- Station Nodes -->
  <circle cx="100" cy="140" r="16" fill="#0284c7"/><text x="100" y="145" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="220" cy="140" r="16" fill="#d97706"/><text x="220" y="145" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">B (AP)</text>
  <circle cx="340" cy="140" r="16" fill="#dc2626"/><text x="340" y="145" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle">C</text>

  <text x="222" y="185" fill="#991b1b" font-size="8.5" font-weight="bold" text-anchor="middle">A &amp; C cannot hear each other (Out of Range)!</text>
  <text x="222" y="198" fill="#334155" font-size="8" text-anchor="middle">Both sense channel idle and transmit to B → Destructive Collision at B!</text>

  <rect x="45" y="210" width="355" height="75" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="55" y="226" fill="#0f172a" font-size="8.5" font-weight="bold">• Hardware Limitation in RF Transceivers:</text>
  <text x="55" y="240" fill="#334155" font-size="8">Station's own transmission power drowns out received signals (Dynamic Range).</text>
  <text x="55" y="254" fill="#334155" font-size="8">Collision detection during transmission is impossible in standard Wi-Fi.</text>
  <text x="55" y="268" fill="#0284c7" font-size="8.5" font-weight="bold">Solution: Avoid collisions beforehand using IFS &amp; Virtual Sensing!</text>

  <!-- Right: 4-Way RTS/CTS Handshake with NAV -->
  <rect x="440" y="55" width="375" height="240" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="55" width="375" height="28" rx="6" fill="url(#rtsGrad)"/>
  <text x="627" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. RTS / CTS Virtual Sensing with NAV</text>

  <!-- Timeline diagram -->
  <text x="460" y="102" fill="#0f172a" font-size="9" font-weight="bold">Station A (Sender):</text>
  <rect x="545" y="92" width="45" height="15" rx="2" fill="#d97706"/><text x="567" y="103" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">RTS</text>
  <rect x="645" y="92" width="70" height="15" rx="2" fill="#0284c7"/><text x="680" y="103" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">DATA FRAME</text>

  <text x="460" y="128" fill="#0f172a" font-size="9" font-weight="bold">Station B (AP/Rx):</text>
  <rect x="595" y="118" width="45" height="15" rx="2" fill="#16a34a"/><text x="617" y="129" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">CTS</text>
  <rect x="720" y="118" width="45" height="15" rx="2" fill="#16a34a"/><text x="742" y="129" fill="#fff" font-size="8" font-weight="bold" text-anchor="middle">ACK</text>

  <text x="460" y="154" fill="#dc2626" font-size="9" font-weight="bold">Station C (Other):</text>
  <rect x="595" y="145" width="170" height="14" rx="2" fill="#fee2e2" stroke="#dc2626"/>
  <text x="680" y="156" fill="#991b1b" font-size="8" font-weight="bold" text-anchor="middle">NAV Bar (Network Allocation Vector - SILENT)</text>

  <rect x="450" y="170" width="355" height="115" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="460" y="186" fill="#92400e" font-size="8.5" font-weight="bold">• The 4-Way Handshake Steps:</text>
  <text x="460" y="200" fill="#334155" font-size="8">1. A sends RTS (contains duration of entire upcoming transaction).</text>
  <text x="460" y="214" fill="#334155" font-size="8">2. B responds with CTS (echoes remaining duration to all neighbors including C).</text>
  <text x="460" y="228" fill="#334155" font-size="8">3. C hears CTS → Sets NAV timer → Suppresses transmission until ACK completes.</text>
  <text x="460" y="242" fill="#334155" font-size="8">4. A transmits Data safely without any risk of collision from Station C!</text>
  <text x="460" y="258" fill="#166534" font-size="8" font-weight="bold">• SIFS &lt; PIFS &lt; DIFS ensures highest priority for control packets (ACK, CTS).</text>
  <text x="460" y="272" fill="#0f172a" font-size="8">SIFS (Shortest) = CTS / ACK | DIFS (Distributed) = New Data Contention</text>

  <!-- Bottom: Summary & Interframe Space Hierarchy -->
  <rect x="35" y="305" width="780" height="120" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="305" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="321" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">CSMA/CA Protocol Mechanics &amp; Interframe Space (IFS) Hierarchy</text>

  <text x="50" y="345" fill="#0f172a" font-size="9.5" font-weight="bold">IFS Hierarchy:</text>
  <text x="160" y="345" fill="#0284c7" font-size="9" font-family="monospace">SIFS (Shortest) &lt; PIFS (PCF Mode) &lt; DIFS (DCF Mode) &lt; EIFS (Extended / Error)</text>

  <text x="50" y="370" fill="#0f172a" font-size="9.5" font-weight="bold">Contention Window:</text>
  <text x="180" y="370" fill="#334155" font-size="8.5">Station senses idle channel → Waits DIFS → Chooses random Backoff from [0, CW]. CW doubles on collision: CW_min = 15, CW_max = 1023.</text>

  <text x="50" y="395" fill="#0f172a" font-size="9.5" font-weight="bold">Exposed Station:</text>
  <text x="180" y="395" fill="#334155" font-size="8.5">Station B transmits to A. Station C wants to transmit to D (away from B). Senses B and unnecessarily halts. RTS/CTS solves this cleanly.</text>

  <text x="50" y="415" fill="#0f172a" font-size="9.5" font-weight="bold">NAV Mechanism:</text>
  <text x="180" y="415" fill="#991b1b" font-size="8.5">Virtual Carrier Sensing: Stations do not waste battery continuously sniffing RF; hardware timer counts down NAV to zero before sensing.</text>
</svg>