<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="pureGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#991b1b"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="420" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Random Access MAC Protocols: Pure ALOHA vs Slotted ALOHA</text>

  <!-- Left: Pure ALOHA -->
  <rect x="35" y="55" width="375" height="235" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="375" height="28" rx="6" fill="url(#pureGrad)"/>
  <text x="222" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Pure ALOHA (Unsynchronized / Continuous)</text>

  <!-- Vulnerable Time Diagram -->
  <text x="50" y="102" fill="#991b1b" font-size="10" font-weight="bold">Vulnerable Time = 2 · Tfr</text>
  <!-- Time axis -->
  <line x1="50" y1="135" x2="390" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Target Frame -->
  <rect x="180" y="115" width="80" height="20" rx="3" fill="#2563eb"/><text x="220" y="129" fill="#fff" font-size="8.5" font-weight="bold" text-anchor="middle">Frame i</text>
  <!-- Colliding earlier frame -->
  <rect x="130" y="145" width="80" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/><text x="170" y="158" fill="#991b1b" font-size="8" text-anchor="middle">Collision Start</text>
  <!-- Colliding later frame -->
  <rect x="230" y="145" width="80" height="18" rx="3" fill="#fee2e2" stroke="#ef4444"/><text x="270" y="158" fill="#991b1b" font-size="8" text-anchor="middle">Collision End</text>
  <line x1="100" y1="172" x2="260" y2="172" stroke="#ef4444" stroke-width="2"/>
  <text x="180" y="184" fill="#ef4444" font-size="8" font-weight="bold" text-anchor="middle">Vulnerable Window: [t - Tfr, t + Tfr]</text>

  <rect x="50" y="195" width="345" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="222" y="213" fill="#991b1b" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">S = G · e^(-2G)</text>
  <text x="222" y="228" fill="#7f1d1d" font-size="8.5" text-anchor="middle">Max Throughput S_max = 1 / (2e) ≈ 0.184 (18.4%) at G = 0.5</text>

  <text x="50" y="256" fill="#334155" font-size="8.5">• Station transmits immediately whenever data is ready.</text>
  <text x="50" y="270" fill="#334155" font-size="8.5">• Highest collision probability; completely uncoordinated.</text>
  <text x="50" y="284" fill="#dc2626" font-size="8" font-weight="bold">Even a 1-bit overlap destroys both transmitting frames!</text>

  <!-- Right: Slotted ALOHA -->
  <rect x="440" y="55" width="375" height="235" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="55" width="375" height="28" rx="6" fill="url(#slotGrad)"/>
  <text x="627" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. Slotted ALOHA (Discrete Clock Synchronized)</text>

  <!-- Vulnerable Time Diagram -->
  <text x="455" y="102" fill="#065f46" font-size="10" font-weight="bold">Vulnerable Time = 1 · Tfr</text>
  <!-- Discrete Slots -->
  <line x1="455" y1="135" x2="795" y2="135" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="510" y1="110" x2="510" y2="160" stroke="#cbd5e1" stroke-dasharray="2"/>
  <line x1="590" y1="110" x2="590" y2="160" stroke="#cbd5e1" stroke-dasharray="2"/>
  <line x1="670" y1="110" x2="670" y2="160" stroke="#cbd5e1" stroke-dasharray="2"/>
  <line x1="750" y1="110" x2="750" y2="160" stroke="#cbd5e1" stroke-dasharray="2"/>
  <text x="550" y="125" fill="#64748b" font-size="8" text-anchor="middle">Slot k-1</text>
  <rect x="590" y="115" width="80" height="20" rx="3" fill="#10b981"/><text x="630" y="129" fill="#fff" font-size="8.5" font-weight="bold" text-anchor="middle">Slot k (Safe)</text>
  <text x="710" y="125" fill="#64748b" font-size="8" text-anchor="middle">Slot k+1</text>
  <line x1="590" y1="172" x2="670" y2="172" stroke="#10b981" stroke-width="2"/>
  <text x="630" y="184" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle">Vulnerable Window: Exactly 1 Slot (Tfr)</text>

  <rect x="455" y="195" width="345" height="42" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="627" y="213" fill="#065f46" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">S = G · e^(-G)</text>
  <text x="627" y="228" fill="#047857" font-size="8.5" text-anchor="middle">Max Throughput S_max = 1 / e ≈ 0.368 (36.8%) at G = 1.0</text>

  <text x="455" y="256" fill="#334155" font-size="8.5">• Time divided into discrete slots equal to frame duration Tfr.</text>
  <text x="455" y="270" fill="#334155" font-size="8.5">• Station MUST wait for beginning of next slot to transmit.</text>
  <text x="455" y="284" fill="#059669" font-size="8" font-weight="bold">Doubles throughput capacity compared to Pure ALOHA!</text>

  <!-- Bottom: Master Comparison & Solved Formulas -->
  <rect x="35" y="300" width="780" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="300" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="316" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">ALOHA Mathematical Evaluation &amp; Poisson Distribution Metrics</text>

  <text x="50" y="340" fill="#0f172a" font-size="9.5" font-weight="bold">Traffic Load (G):</text>
  <text x="160" y="340" fill="#334155" font-size="9">Average number of frames generated by the whole system per frame transmission time ($T_{fr}$).</text>

  <text x="50" y="362" fill="#0f172a" font-size="9.5" font-weight="bold">Probability of k Frames:</text>
  <text x="160" y="362" fill="#1e3a8a" font-size="9" font-family="monospace">P(k) = (G^k · e^(-G)) / k!</text>
  <text x="360" y="362" fill="#475569" font-size="8.5">Probability of zero frame collisions P(0) = e^(-G) for 1 slot; e^(-2G) for 2 slots.</text>

  <text x="50" y="386" fill="#0f172a" font-size="9.5" font-weight="bold">AKTU Numerical Formula:</text>
  <text x="200" y="386" fill="#065f46" font-size="9">Idle Slots Probability = e^(-G). If 10% slots idle: e^(-G) = 0.10 → G = ln(10) ≈ 2.3. Throughput S = G · e^(-G) = 2.3 × 0.1 = 0.23.</text>
</svg>