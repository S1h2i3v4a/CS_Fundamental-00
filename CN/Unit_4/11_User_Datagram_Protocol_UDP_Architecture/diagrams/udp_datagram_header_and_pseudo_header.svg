<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="udpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="sh11" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#udpHdr)" rx="8" filter="url(#sh11)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">User Datagram Protocol (UDP): 8-Byte Header &amp; Pseudo-Header Architecture</text>

  <!-- Left: 8-Byte Fixed UDP Header Format -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="415" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Standard 8-Byte Fixed UDP Header Format</text>

    <!-- 32-Bit Grid -->
    <g transform="translate(20, 45)">
      <text x="0" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 0</text>
      <text x="180" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 16</text>
      <text x="355" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 31</text>

      <!-- Row 1: Source & Dest Port -->
      <rect x="0" y="20" width="185" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
      <text x="92" y="42" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Source Port (16b)</text>
      <text x="92" y="56" fill="#2563eb" font-family="sans-serif" font-size="9" text-anchor="middle">Sending process port</text>

      <rect x="190" y="20" width="185" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
      <text x="282" y="42" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Destination Port (16b)</text>
      <text x="282" y="56" fill="#2563eb" font-family="sans-serif" font-size="9" text-anchor="middle">Receiving process port</text>

      <!-- Row 2: Length & Checksum -->
      <rect x="0" y="70" width="185" height="44" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="3"/>
      <text x="92" y="92" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Length (16b)</text>
      <text x="92" y="106" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">Min = 8 Bytes (Header+Data)</text>

      <rect x="190" y="70" width="185" height="44" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
      <text x="282" y="92" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Checksum (16b)</text>
      <text x="282" y="106" fill="#b45309" font-family="sans-serif" font-size="9" text-anchor="middle">Optional in IPv4, Mandatory in IPv6</text>
    </g>

    <!-- Key Characteristics List -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="375" height="185" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
      <text x="15" y="22" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Core Architectural Features of UDP:</text>
      <text x="15" y="44" fill="#475569" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Connectionless:</tspan> Zero handshake latency. Instant dispatch!</text>
      <text x="15" y="64" fill="#475569" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Message-Oriented:</tspan> Preserves application datagram boundaries.</text>
      <text x="15" y="78" fill="#64748b" font-family="sans-serif" font-size="9.5">  (No byte splitting; 1 socket write = exactly 1 UDP packet).</text>
      <text x="15" y="98" fill="#475569" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Unreliable:</tspan> No acknowledgment, no retransmission, no flow control.</text>
      <text x="15" y="118" fill="#475569" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">No Head-of-Line Blocking:</tspan> A lost packet does not stall others!</text>
      <text x="15" y="138" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="bold">• Multicast &amp; Broadcast Supported (Unlike TCP unicast).</text>
      <text x="15" y="158" fill="#0f172a" font-family="monospace" font-size="10">Used by: DNS, DHCP, SNMP, TFTP, VoIP, Real-Time Gaming.</text>
    </g>
  </g>

  <!-- Right: 12-Byte Pseudo-Header Checksum Model -->
  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="425" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">The 12-Byte Pseudo-Header for Checksum Calculation</text>

    <!-- Pseudo Header Grid -->
    <g transform="translate(20, 42)">
      <rect x="0" y="0" width="385" height="36" fill="#eff6ff" stroke="#3b82f6" rx="3"/>
      <text x="192" y="22" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">32-Bit Source IP Address (4 Bytes)</text>

      <rect x="0" y="42" width="385" height="36" fill="#eff6ff" stroke="#3b82f6" rx="3"/>
      <text x="192" y="64" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">32-Bit Destination IP Address (4 Bytes)</text>

      <!-- Row 3: All 0s, Protocol 17, UDP Length -->
      <rect x="0" y="84" width="90" height="36" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <text x="45" y="106" fill="#475569" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">All 0s (8b)</text>

      <rect x="95" y="84" width="95" height="36" fill="#fef3c7" stroke="#d97706" rx="3"/>
      <text x="142" y="102" fill="#92400e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Protocol (8b)</text>
      <text x="142" y="114" fill="#b45309" font-family="monospace" font-size="9" text-anchor="middle">17 = UDP</text>

      <rect x="195" y="84" width="190" height="36" fill="#dcfce7" stroke="#16a34a" rx="3"/>
      <text x="290" y="102" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">UDP Length (16b)</text>
      <text x="290" y="114" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">Duplicated from header</text>
    </g>

    <!-- Why Pseudo Header Explanation -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="385" height="195" fill="#fffbeb" stroke="#fcd34d" rx="4"/>
      <text x="15" y="24" fill="#92400e" font-family="sans-serif" font-size="11.5" font-weight="bold">Why Does UDP Use an IP Pseudo-Header?</text>
      <text x="15" y="46" fill="#78350f" font-family="sans-serif" font-size="10.5">1. <tspan font-weight="bold">Detects Misrouted Packets:</tspan> If an IP datagram's destination IP is</text>
      <text x="15" y="62" fill="#78350f" font-family="sans-serif" font-size="10.5">   corrupted in transit and delivered to the wrong host, the recipient</text>
      <text x="15" y="78" fill="#78350f" font-family="sans-serif" font-size="10.5">   calculates a checksum mismatch and discards it!</text>
      <text x="15" y="98" fill="#78350f" font-family="sans-serif" font-size="10.5">2. <tspan font-weight="bold">Protocol Verification:</tspan> Confirms protocol number is strictly 17.</text>
      <text x="15" y="118" fill="#78350f" font-family="sans-serif" font-size="10.5">3. <tspan font-weight="bold">Virtual Existence:</tspan> Pseudo-header is NEVER transmitted over</text>
      <text x="15" y="134" fill="#78350f" font-family="sans-serif" font-size="10.5">   the wire! It is constructed temporarily in memory solely for</text>
      <text x="15" y="150" fill="#78350f" font-family="sans-serif" font-size="10.5">   1's complement addition at sender and receiver.</text>
      <text x="15" y="174" fill="#b91c1c" font-family="sans-serif" font-size="10.5" font-weight="bold">If Checksum is NOT used in IPv4: Field is filled with all 0s.</text>
    </g>
  </g>
</svg>