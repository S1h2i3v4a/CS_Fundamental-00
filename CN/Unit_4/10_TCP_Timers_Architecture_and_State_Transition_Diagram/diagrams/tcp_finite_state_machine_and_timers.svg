<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="fsmHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="sh10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#fsmHdr)" rx="8" filter="url(#sh10)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">TCP Architecture: The 4 Core Timers &amp; 11-State Finite State Machine (FSM)</text>

  <!-- Top: 4 Timers Grid -->
  <g transform="translate(45, 95)">
    <!-- Timer 1 -->
    <rect x="0" y="0" width="205" height="110" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="5"/>
    <text x="102" y="22" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. Retransmission Timer (RTO)</text>
    <text x="10" y="42" fill="#1e40af" font-family="sans-serif" font-size="9.5">• Tracks sent, unacknowledged data.</text>
    <text x="10" y="58" fill="#1e40af" font-family="sans-serif" font-size="9.5">• Dynamically calculated via RTT.</text>
    <text x="10" y="74" fill="#1e40af" font-family="sans-serif" font-size="9.5">• Jacobson Formula: RTT + 4*DevRTT.</text>
    <text x="10" y="94" fill="#b91c1c" font-family="sans-serif" font-size="9.5" font-weight="bold">On timeout: Resends &amp; drops cwnd.</text>

    <!-- Timer 2 -->
    <rect x="218" y="0" width="205" height="110" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="5"/>
    <text x="320" y="22" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. Persistence Timer</text>
    <text x="228" y="42" fill="#166534" font-family="sans-serif" font-size="9.5">• Prevents Zero-Window Deadlock.</text>
    <text x="228" y="58" fill="#166534" font-family="sans-serif" font-size="9.5">• Starts when receiver advertises rwnd=0.</text>
    <text x="228" y="74" fill="#166534" font-family="sans-serif" font-size="9.5">• On expiry: Sends 1-byte Probe.</text>
    <text x="228" y="94" fill="#15803d" font-family="sans-serif" font-size="9.5" font-weight="bold">Forces receiver to re-advertise rwnd.</text>

    <!-- Timer 3 -->
    <rect x="436" y="0" width="205" height="110" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" rx="5"/>
    <text x="538" y="22" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. Keepalive Timer</text>
    <text x="446" y="42" fill="#78350f" font-family="sans-serif" font-size="9.5">• Detects dead/crashed client.</text>
    <text x="446" y="58" fill="#78350f" font-family="sans-serif" font-size="9.5">• Standard duration: 2 Hours.</text>
    <text x="446" y="74" fill="#78350f" font-family="sans-serif" font-size="9.5">• Sends 10 probes (75s apart).</text>
    <text x="446" y="94" fill="#b91c1c" font-family="sans-serif" font-size="9.5" font-weight="bold">If no reply: Aborts connection (RST).</text>

    <!-- Timer 4 -->
    <rect x="654" y="0" width="205" height="110" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5" rx="5"/>
    <text x="756" y="22" fill="#9d174d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4. TIME-WAIT (2MSL) Timer</text>
    <text x="664" y="42" fill="#be185d" font-family="sans-serif" font-size="9.5">• Active after client sends final ACK.</text>
    <text x="664" y="58" fill="#be185d" font-family="sans-serif" font-size="9.5">• Duration = 2 * MSL (approx 120s).</text>
    <text x="664" y="74" fill="#be185d" font-family="sans-serif" font-size="9.5">• Allows ACK retransmit if lost.</text>
    <text x="664" y="94" fill="#9d174d" font-family="sans-serif" font-size="9.5" font-weight="bold">Flushes old duplicate packets.</text>
  </g>

  <!-- Bottom: 11-State Finite State Machine (FSM) Diagram -->
  <g transform="translate(45, 220)">
    <rect x="0" y="0" width="860" height="285" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="22" fill="#0f172a" font-family="sans-serif" font-size="12.5" font-weight="bold">The 11 States of TCP Lifecycle (Client Active vs Server Passive Path)</text>

    <!-- State Boxes Flow -->
    <!-- CLOSED -->
    <rect x="30" y="40" width="110" height="34" fill="#334155" rx="4"/>
    <text x="85" y="62" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CLOSED</text>

    <!-- LISTEN -->
    <rect x="200" y="40" width="110" height="34" fill="#e0e7ff" stroke="#4f46e5" rx="4"/>
    <text x="255" y="62" fill="#3730a3" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">LISTEN</text>

    <!-- SYN-SENT -->
    <rect x="30" y="110" width="110" height="34" fill="#dbeafe" stroke="#2563eb" rx="4"/>
    <text x="85" y="132" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SYN-SENT</text>

    <!-- SYN-RCVD -->
    <rect x="200" y="110" width="110" height="34" fill="#fef3c7" stroke="#d97706" rx="4"/>
    <text x="255" y="132" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SYN-RCVD</text>

    <!-- ESTABLISHED -->
    <rect x="360" y="75" width="130" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="425" y="101" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ESTABLISHED</text>

    <!-- Termination States (Client Active Close) -->
    <!-- FIN-WAIT-1 -->
    <rect x="530" y="40" width="120" height="34" fill="#fee2e2" stroke="#dc2626" rx="4"/>
    <text x="590" y="62" fill="#991b1b" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">FIN-WAIT-1</text>

    <!-- FIN-WAIT-2 -->
    <rect x="690" y="40" width="120" height="34" fill="#fee2e2" stroke="#dc2626" rx="4"/>
    <text x="750" y="62" fill="#991b1b" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">FIN-WAIT-2</text>

    <!-- TIME-WAIT -->
    <rect x="690" y="110" width="120" height="34" fill="#fdf2f8" stroke="#db2777" stroke-width="2" rx="4"/>
    <text x="750" y="132" fill="#9d174d" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">TIME-WAIT (2MSL)</text>

    <!-- Server Termination States -->
    <!-- CLOSE-WAIT -->
    <rect x="530" y="180" width="120" height="34" fill="#fff7ed" stroke="#ea580c" rx="4"/>
    <text x="590" y="202" fill="#c2410c" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">CLOSE-WAIT</text>

    <!-- LAST-ACK -->
    <rect x="690" y="180" width="120" height="34" fill="#fff7ed" stroke="#ea580c" rx="4"/>
    <text x="750" y="202" fill="#c2410c" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">LAST-ACK</text>

    <!-- CLOSING -->
    <rect x="610" y="110" width="70" height="34" fill="#f1f5f9" stroke="#94a3b8" rx="4"/>
    <text x="645" y="132" fill="#475569" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">CLOSING</text>

    <!-- Explanatory note -->
    <text x="30" y="255" fill="#475569" font-family="sans-serif" font-size="11">Total 11 States: CLOSED, LISTEN, SYN-SENT, SYN-RCVD, ESTABLISHED, FIN-WAIT-1, FIN-WAIT-2, CLOSE-WAIT, CLOSING, LAST-ACK, TIME-WAIT.</text>
  </g>
</svg>