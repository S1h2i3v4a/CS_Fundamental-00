<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="tcpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#tcpHdr)" rx="8" filter="url(#sh2)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">TCP Segment Header Architecture (20 to 60 Bytes)</text>

  <!-- 32-Bit Grid Diagram -->
  <g transform="translate(45, 95)">
    <!-- Ruler -->
    <text x="0" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 0</text>
    <text x="215" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 8</text>
    <text x="430" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 16</text>
    <text x="645" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 24</text>
    <text x="835" y="12" fill="#64748b" font-family="monospace" font-size="9">Bit 31</text>

    <!-- Row 1: Source & Dest Port -->
    <rect x="0" y="20" width="430" height="38" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="215" y="44" fill="#1e3a8a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Source Port Address (16 Bits)</text>

    <rect x="430" y="20" width="430" height="38" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="3"/>
    <text x="645" y="44" fill="#1e3a8a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Destination Port Address (16 Bits)</text>

    <!-- Row 2: Sequence Number -->
    <rect x="0" y="58" width="860" height="38" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" rx="3"/>
    <text x="430" y="82" fill="#3730a3" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Sequence Number (32 Bits) — Byte Number of 1st Data Byte in Segment</text>

    <!-- Row 3: Acknowledgment Number -->
    <rect x="0" y="96" width="860" height="38" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="3"/>
    <text x="430" y="120" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Acknowledgment Number (32 Bits) — Next Expected Byte Number (Cumulative)</text>

    <!-- Row 4: HLEN, Reserved, Flags, Window Size -->
    <rect x="0" y="134" width="110" height="42" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" rx="3"/>
    <text x="55" y="152" fill="#5b21b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HLEN (4b)</text>
    <text x="55" y="167" fill="#6d28d9" font-family="sans-serif" font-size="9" text-anchor="middle">4B words (5-15)</text>

    <rect x="110" y="134" width="100" height="42" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
    <text x="160" y="152" fill="#475569" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Reserved</text>
    <text x="160" y="167" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">6 bits (All 0s)</text>

    <!-- 6 Control Flags -->
    <rect x="210" y="134" width="220" height="42" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" rx="3"/>
    <text x="320" y="152" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">6 Control Flags (6 bits)</text>
    <text x="320" y="167" fill="#b91c1c" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">URG | ACK | PSH | RST | SYN | FIN</text>

    <rect x="430" y="134" width="430" height="42" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="3"/>
    <text x="645" y="152" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Window Size / rwnd (16 Bits)</text>
    <text x="645" y="167" fill="#b45309" font-family="sans-serif" font-size="9" text-anchor="middle">Receiver buffer advertisement in bytes</text>

    <!-- Row 5: Checksum & Urgent Pointer -->
    <rect x="0" y="176" width="430" height="38" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" rx="3"/>
    <text x="215" y="200" fill="#9d174d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Checksum (16 Bits) — Mandatory (Header + Data + Pseudo)</text>

    <rect x="430" y="176" width="430" height="38" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5" rx="3"/>
    <text x="645" y="200" fill="#0f766e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Urgent Pointer (16 Bits) — Valid only when URG flag = 1</text>

    <!-- Row 6: Options & Padding -->
    <rect x="0" y="214" width="860" height="34" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4,4" rx="3"/>
    <text x="430" y="236" fill="#475569" font-family="sans-serif" font-size="11" font-style="italic" text-anchor="middle">Options &amp; Padding (0 to 40 Bytes) — MSS, Window Scale, Timestamps, SACK</text>
  </g>

  <!-- Bottom: Flags Meaning Breakdown -->
  <g transform="translate(45, 360)">
    <rect x="0" y="0" width="860" height="145" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">The 6 Core Control Flags of TCP</text>

    <g transform="translate(20, 36)">
      <!-- URG & ACK -->
      <rect x="0" y="0" width="135" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold">URG</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Urgent pointer valid</text>

      <rect x="145" y="0" width="135" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#15803d" font-family="monospace" font-size="11" font-weight="bold">ACK</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Ack number field valid</text>

      <rect x="290" y="0" width="135" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#d97706" font-family="monospace" font-size="11" font-weight="bold">PSH</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Push data to app immediately</text>

      <rect x="435" y="0" width="135" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold">RST</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Reset/abort connection</text>

      <rect x="580" y="0" width="135" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#2563eb" font-family="monospace" font-size="11" font-weight="bold">SYN</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Synchronize seq numbers</text>

      <rect x="725" y="0" width="115" height="42" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
      <text x="10" y="18" fill="#64748b" font-family="monospace" font-size="11" font-weight="bold">FIN</text>
      <text x="10" y="32" fill="#475569" font-family="sans-serif" font-size="9">Finish/terminate session</text>
    </g>

    <text x="20" y="105" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold">AKTU Numerical Rule:</text>
    <text x="20" y="122" fill="#334155" font-family="sans-serif" font-size="10.5">HLEN is given in 4-byte words. Example: HLEN = <code>5</code> $\implies 5 	imes 4 = 20	ext{ Bytes}$. Maximum HLEN = <code>15</code> $\implies 15 	imes 4 = 60	ext{ Bytes}$.</text>
    <text x="20" y="136" fill="#334155" font-family="sans-serif" font-size="10.5">Sequence numbers consume 1 sequence count per SYN and FIN flag even if carrying 0 data bytes!</text>
  </g>
</svg>