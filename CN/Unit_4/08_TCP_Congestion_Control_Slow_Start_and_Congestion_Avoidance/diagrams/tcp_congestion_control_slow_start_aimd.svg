<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="cngHdr8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sh8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#cngHdr8)" rx="8" filter="url(#sh8)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">TCP Congestion Control: Slow Start, Congestion Avoidance &amp; AIMD Dynamics</text>

  <!-- Main Graph Area -->
  <g transform="translate(60, 105)">
    <!-- Axes -->
    <line x1="50" y1="240" x2="800" y2="240" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="240" x2="50" y2="20" stroke="#0f172a" stroke-width="2"/>

    <!-- Labels -->
    <text x="425" y="270" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Transmission Rounds (RTT)</text>
    <text x="15" y="130" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold" transform="rotate(-90 15,130)" text-anchor="middle">cwnd (MSS)</text>

    <!-- Threshold Line (ssthresh = 16) -->
    <line x1="50" y1="120" x2="800" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,5"/>
    <text x="730" y="112" fill="#d97706" font-family="monospace" font-size="11" font-weight="bold">ssthresh = 16 MSS</text>

    <!-- Phase 1: Slow Start Curve (Exponential) -->
    <!-- (1, 235), (2, 230), (3, 220), (4, 200), (5, 160), (6, 120) -->
    <path d="M 50 235 Q 150 230 200 200 T 260 120" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="140" y="195" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="bold">Slow Start</text>
    <text x="140" y="210" fill="#3b82f6" font-family="sans-serif" font-size="9.5">(Exponential: 2^n)</text>

    <!-- Phase 2: Congestion Avoidance (Linear) -->
    <!-- From (260, 120) to (500, 40) -->
    <line x1="260" y1="120" x2="500" y2="40" stroke="#16a34a" stroke-width="3"/>
    <text x="350" y="65" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold">Congestion Avoidance</text>
    <text x="350" y="80" fill="#166534" font-family="sans-serif" font-size="9.5">(Additive Increase: +1 MSS/RTT)</text>

    <!-- Loss Event at (500, 40) -->
    <circle cx="500" cy="40" r="5" fill="#dc2626"/>
    <text x="500" y="25" fill="#b91c1c" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Loss Event! (cwnd = 24)</text>

    <!-- Multiplicative Decrease Drop to 1 (Tahoe) vs Reno -->
    <!-- Tahoe Drop: (500, 40) down to (520, 235) -->
    <line x1="500" y1="40" x2="520" y2="235" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="535" y="210" fill="#b91c1c" font-family="sans-serif" font-size="9.5">Tahoe: cwnd=1</text>

    <!-- Reno Drop: (500, 40) down to (520, 150) -->
    <line x1="500" y1="40" x2="520" y2="150" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="535" y="145" fill="#6d28d9" font-family="sans-serif" font-size="10" font-weight="bold">Reno: cwnd = ssthresh = 12</text>
    
    <!-- Reno Additive recovery -->
    <line x1="520" y1="150" x2="720" y2="80" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="640" y="100" fill="#6d28d9" font-family="sans-serif" font-size="9.5">Fast Recovery &amp; Additive</text>
  </g>

  <!-- Bottom: 3 Core Formulas Box -->
  <g transform="translate(45, 395)">
    <rect x="0" y="0" width="860" height="115" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="12.5" font-weight="bold">Mathematical Formulation of TCP Congestion Window (cwnd)</text>

    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="260" height="65" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
      <text x="15" y="20" fill="#1e40af" font-family="sans-serif" font-size="10.5" font-weight="bold">1. Slow Start Phase:</text>
      <text x="15" y="38" fill="#1e3a8a" font-family="monospace" font-size="10">cwnd = cwnd + 1 MSS (per ACK)</text>
      <text x="15" y="54" fill="#64748b" font-family="sans-serif" font-size="9.5">cwnd doubles every round trip time (RTT)!</text>

      <rect x="280" y="0" width="260" height="65" fill="#f0fdf4" stroke="#bbf7d0" rx="4"/>
      <text x="15" y="20" fill="#166534" font-family="sans-serif" font-size="10.5" font-weight="bold">2. Congestion Avoidance:</text>
      <text x="15" y="38" fill="#14532d" font-family="monospace" font-size="10">cwnd = cwnd + (1 / cwnd) MSS</text>
      <text x="15" y="54" fill="#64748b" font-family="sans-serif" font-size="9.5">Increases strictly by +1 MSS per RTT.</text>

      <rect x="560" y="0" width="260" height="65" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="15" y="20" fill="#991b1b" font-family="sans-serif" font-size="10.5" font-weight="bold">3. Multiplicative Decrease:</text>
      <text x="15" y="38" fill="#7f1d1d" font-family="monospace" font-size="10">ssthresh = cwnd / 2</text>
      <text x="15" y="54" fill="#64748b" font-family="sans-serif" font-size="9.5">Tahoe: cwnd = 1 | Reno: cwnd = ssthresh</text>
    </g>
  </g>
</svg>