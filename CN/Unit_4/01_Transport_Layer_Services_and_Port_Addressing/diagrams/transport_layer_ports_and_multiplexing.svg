<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="tpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="sh1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#tpHdr)" rx="8" filter="url(#sh1)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Transport Layer: Process-to-Process Delivery, Sockets &amp; Multiplexing</text>

  <!-- Left: Host A Processes -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="230" height="230" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="7"/>
    <text x="115" y="24" fill="#1e40af" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Client Host A (IP: 192.168.1.10)</text>

    <!-- Process 1 -->
    <rect x="15" y="42" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="60" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Web Browser (Process 1)</text>
    <text x="25" y="76" fill="#2563eb" font-family="monospace" font-size="10">Ephemeral Port: 52140</text>

    <!-- Process 2 -->
    <rect x="15" y="100" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="118" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Email Client (Process 2)</text>
    <text x="25" y="134" fill="#2563eb" font-family="monospace" font-size="10">Ephemeral Port: 52141</text>

    <!-- Process 3 -->
    <rect x="15" y="158" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="176" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">DNS Resolver (Process 3)</text>
    <text x="25" y="192" fill="#2563eb" font-family="monospace" font-size="10">Ephemeral Port: 52142</text>
  </g>

  <!-- Center: Multiplexing / Demultiplexing -->
  <g transform="translate(305, 105)">
    <rect x="0" y="0" width="340" height="230" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="170" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Transport Layer Multiplexer</text>

    <rect x="20" y="45" width="300" height="50" fill="#f0fdf4" stroke="#86efac" rx="4"/>
    <text x="30" y="65" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">Multiplexing (Sender Side):</text>
    <text x="30" y="82" fill="#14532d" font-family="sans-serif" font-size="10">Collects data from multiple sockets &amp; adds L4 port header</text>

    <line x1="170" y1="105" x2="170" y2="135" stroke="#64748b" stroke-width="2"/>
    <polygon points="165,130 170,140 175,130" fill="#64748b"/>

    <rect x="20" y="145" width="300" height="50" fill="#fef08a" stroke="#ca8a04" rx="4"/>
    <text x="30" y="165" fill="#854d0e" font-family="sans-serif" font-size="11" font-weight="bold">Demultiplexing (Receiver Side):</text>
    <text x="30" y="182" fill="#713f12" font-family="sans-serif" font-size="10">Delivers segment payload to correct process by Port Number</text>

    <text x="170" y="218" fill="#475569" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Socket = IP Address + Port Number</text>
  </g>

  <!-- Right: Server Host B -->
  <g transform="translate(675, 105)">
    <rect x="0" y="0" width="230" height="230" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="7"/>
    <text x="115" y="24" fill="#1e40af" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Server Host B (IP: 93.184.216.34)</text>

    <!-- Server Daemon 1 -->
    <rect x="15" y="42" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="60" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">HTTP / Web Daemon</text>
    <text x="25" y="76" fill="#16a34a" font-family="monospace" font-size="10">Well-Known Port: 80</text>

    <!-- Server Daemon 2 -->
    <rect x="15" y="100" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="118" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">HTTPS Secure Daemon</text>
    <text x="25" y="134" fill="#16a34a" font-family="monospace" font-size="10">Well-Known Port: 443</text>

    <!-- Server Daemon 3 -->
    <rect x="15" y="158" width="200" height="46" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
    <text x="25" y="176" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">DNS Nameserver Daemon</text>
    <text x="25" y="192" fill="#16a34a" font-family="monospace" font-size="10">Well-Known Port: 53</text>
  </g>

  <!-- Bottom: Port Ranges Architecture Table -->
  <g transform="translate(45, 355)">
    <rect x="0" y="0" width="860" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">IANA 16-Bit Port Number Taxonomy (Range: 0 to 65,535)</text>

    <g transform="translate(20, 36)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="260" height="95" fill="#dbeafe" stroke="#3b82f6" rx="4"/>
      <text x="130" y="22" fill="#1e3a8a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Well-Known Ports</text>
      <text x="130" y="40" fill="#2563eb" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">0 to 1,023 (1024 Ports)</text>
      <text x="15" y="60" fill="#1e40af" font-family="sans-serif" font-size="10">• Assigned strictly by IANA</text>
      <text x="15" y="75" fill="#1e40af" font-family="sans-serif" font-size="10">• Used by universal standard server daemons</text>
      <text x="15" y="88" fill="#1e40af" font-family="sans-serif" font-size="10">  (HTTP 80, SSH 22, FTP 21, DNS 53)</text>

      <!-- Box 2 -->
      <rect x="280" y="0" width="260" height="95" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
      <text x="410" y="22" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Registered Ports</text>
      <text x="410" y="40" fill="#d97706" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1,024 to 49,151</text>
      <text x="295" y="60" fill="#78350f" font-family="sans-serif" font-size="10">• Not strictly enforced by IANA</text>
      <text x="295" y="75" fill="#78350f" font-family="sans-serif" font-size="10">• Can be registered by companies/vendors</text>
      <text x="295" y="88" fill="#78350f" font-family="sans-serif" font-size="10">  (MySQL 3306, PostgreSQL 5432, RDP 3389)</text>

      <!-- Box 3 -->
      <rect x="560" y="0" width="260" height="95" fill="#dcfce7" stroke="#10b981" rx="4"/>
      <text x="690" y="22" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Dynamic / Ephemeral Ports</text>
      <text x="690" y="40" fill="#059669" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">49,152 to 65,535</text>
      <text x="575" y="60" fill="#064e3b" font-family="sans-serif" font-size="10">• Private, temporary, and unassigned</text>
      <text x="575" y="75" fill="#064e3b" font-family="sans-serif" font-size="10">• Chosen randomly by client OS transport layer</text>
      <text x="575" y="88" fill="#064e3b" font-family="sans-serif" font-size="10">  for outgoing client sessions</text>
    </g>
  </g>
</svg>