<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="errHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="sh7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#errHdr)" rx="8" filter="url(#sh7)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">TCP Error Control: RTO Calculation, Karn's Rule &amp; Fast Retransmit</text>

  <!-- Left: RTO Timeout & Retransmission -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="415" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">1. Lost Segment &amp; RTO Timer Expiration</text>

    <!-- Communication trace -->
    <g transform="translate(20, 40)">
      <!-- Seg 1 OK -->
      <line x1="20" y1="10" x2="350" y2="30" stroke="#16a34a" stroke-width="2"/>
      <text x="180" y="16" fill="#15803d" font-family="monospace" font-size="9.5">Seg 1: Seq 1000-1499</text>
      <line x1="350" y1="35" x2="20" y2="55" stroke="#16a34a" stroke-width="2"/>
      <text x="180" y="42" fill="#15803d" font-family="monospace" font-size="9.5">ACK 1500</text>

      <!-- Seg 2 Lost -->
      <line x1="20" y1="75" x2="200" y2="90" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="210" y="93" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="bold">X LOST</text>
      <text x="80" y="80" fill="#b91c1c" font-family="monospace" font-size="9.5">Seg 2: Seq 1500-1999</text>

      <!-- RTO Timer bracket -->
      <line x1="10" y1="75" x2="10" y2="150" stroke="#ea580c" stroke-width="2.5"/>
      <text x="15" y="115" fill="#ea580c" font-family="sans-serif" font-size="9.5" font-weight="bold">RTO Timer Expires!</text>

      <!-- Retransmission -->
      <line x1="20" y1="150" x2="350" y2="170" stroke="#ea580c" stroke-width="2"/>
      <text x="180" y="156" fill="#c2410c" font-family="monospace" font-size="9.5">Retransmit Seg 2: Seq 1500-1999</text>
      <line x1="350" y1="175" x2="20" y2="195" stroke="#16a34a" stroke-width="2"/>
      <text x="180" y="182" fill="#15803d" font-family="monospace" font-size="9.5">ACK 2000</text>
    </g>

    <!-- Jacobson RTO Equations -->
    <g transform="translate(15, 255)">
      <rect x="0" y="0" width="385" height="130" fill="#fff7ed" stroke="#fed7aa" rx="4"/>
      <text x="15" y="20" fill="#9a3412" font-family="sans-serif" font-size="11" font-weight="bold">Jacobson's RTO Mathematical Formulas:</text>
      <text x="15" y="42" fill="#c2410c" font-family="monospace" font-size="10">EstimatedRTT = (1 - a)*EstimatedRTT + a*SampleRTT  (a = 1/8)</text>
      <text x="15" y="62" fill="#c2410c" font-family="monospace" font-size="10">DevRTT = (1 - b)*DevRTT + b*|SampleRTT - EstimatedRTT|  (b = 1/4)</text>
      <text x="15" y="85" fill="#9a3412" font-family="monospace" font-size="11" font-weight="bold">RTO = EstimatedRTT + 4 * DevRTT</text>
      <text x="15" y="110" fill="#7c2d12" font-family="sans-serif" font-size="10">Karn's Rule: Do NOT measure SampleRTT for retransmitted segments!</text>
    </g>
  </g>

  <!-- Right: 3 Duplicate ACKs & Fast Retransmit -->
  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="425" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">2. Three Duplicate ACKs &amp; Fast Retransmit</text>

    <!-- Communication Trace -->
    <g transform="translate(20, 40)">
      <!-- Seg 1 OK -->
      <line x1="20" y1="10" x2="360" y2="28" stroke="#16a34a" stroke-width="1.5"/>
      <text x="160" y="15" fill="#15803d" font-family="monospace" font-size="9">Seg 1 (Seq 1000) -> ACK 2000</text>

      <!-- Seg 2 Lost -->
      <line x1="20" y1="35" x2="200" y2="48" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="210" y="52" fill="#dc2626" font-family="sans-serif" font-size="10" font-weight="bold">X Seg 2 Lost (Seq 2000)</text>

      <!-- Seg 3 arrives -> Dup ACK 1 -->
      <line x1="20" y1="60" x2="360" y2="78" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="360" y1="80" x2="20" y2="98" stroke="#d97706" stroke-width="1.5"/>
      <text x="160" y="94" fill="#d97706" font-family="monospace" font-size="9">Dup ACK 1: expecting 2000</text>

      <!-- Seg 4 arrives -> Dup ACK 2 -->
      <line x1="20" y1="105" x2="360" y2="123" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="360" y1="125" x2="20" y2="143" stroke="#d97706" stroke-width="1.5"/>
      <text x="160" y="139" fill="#d97706" font-family="monospace" font-size="9">Dup ACK 2: expecting 2000</text>

      <!-- Seg 5 arrives -> Dup ACK 3 -->
      <line x1="20" y1="150" x2="360" y2="168" stroke="#3b82f6" stroke-width="1.5"/>
      <line x1="360" y1="170" x2="20" y2="188" stroke="#b91c1c" stroke-width="2"/>
      <text x="160" y="184" fill="#b91c1c" font-family="monospace" font-size="9.5" font-weight="bold">Dup ACK 3 (Threshold Reached!)</text>

      <!-- Instant Fast Retransmit -->
      <line x1="20" y1="200" x2="360" y2="218" stroke="#b91c1c" stroke-width="2.5"/>
      <text x="160" y="214" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="bold">FAST RETRANSMIT: Resend Seg 2!</text>
    </g>

    <!-- Fast Retransmit Summary Box -->
    <g transform="translate(15, 275)">
      <rect x="0" y="0" width="395" height="110" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="15" y="22" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">Why 3 Duplicate ACKs (Fast Retransmit)?</text>
      <text x="15" y="42" fill="#14532d" font-family="sans-serif" font-size="10.5">• Out-of-order delivery can generate 1 or 2 duplicate ACKs.</text>
      <text x="15" y="60" fill="#14532d" font-family="sans-serif" font-size="10.5">• Receiving <tspan font-weight="bold">3 Duplicate ACKs</tspan> guarantees segment loss!</text>
      <text x="15" y="78" fill="#14532d" font-family="sans-serif" font-size="10.5">• Sender resends missing packet <tspan font-weight="bold">before RTO timer expires</tspan>.</text>
      <text x="15" y="96" fill="#15803d" font-family="sans-serif" font-size="10.5" font-weight="bold">Saves entire seconds of idle waiting time!</text>
    </g>
  </g>
</svg>