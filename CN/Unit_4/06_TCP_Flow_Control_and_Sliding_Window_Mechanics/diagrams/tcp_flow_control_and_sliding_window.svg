<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="flwHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="sh6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#flwHdr)" rx="8" filter="url(#sh6)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">TCP Flow Control: Sliding Window Dynamics, Silly Window &amp; Persistence</text>

  <!-- Top: Sliding Window Mechanics -->
  <g transform="translate(45, 100)">
    <rect x="0" y="0" width="860" height="165" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Byte-Oriented Credit-Based Sliding Window Model</text>

    <!-- Buffer tape -->
    <g transform="translate(20, 42)">
      <!-- Zone 1: Sent & Acked -->
      <rect x="0" y="0" width="200" height="48" fill="#e2e8f0" stroke="#94a3b8" rx="3"/>
      <text x="100" y="22" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Sent &amp; Acknowledged</text>
      <text x="100" y="38" fill="#94a3b8" font-family="monospace" font-size="9.5" text-anchor="middle">Bytes 1 to 200</text>

      <!-- Zone 2: Sent but not Acked (Inside Window) -->
      <rect x="205" y="0" width="220" height="48" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
      <text x="315" y="22" fill="#92400e" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Sent, Not Acknowledged</text>
      <text x="315" y="38" fill="#b45309" font-family="monospace" font-size="9.5" text-anchor="middle">Bytes 201 to 205 (Flight Size)</text>

      <!-- Zone 3: Usable (Can send immediately) -->
      <rect x="430" y="0" width="220" height="48" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
      <text x="540" y="22" fill="#065f46" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Can Be Sent Immediately</text>
      <text x="540" y="38" fill="#059669" font-family="monospace" font-size="9.5" text-anchor="middle">Bytes 206 to 214 (Usable Window)</text>

      <!-- Zone 4: Cannot send -->
      <rect x="655" y="0" width="165" height="48" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="737" y="22" fill="#991b1b" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Cannot Be Sent</text>
      <text x="737" y="38" fill="#b91c1c" font-family="monospace" font-size="9.5" text-anchor="middle">Bytes 215+ (Outside Window)</text>

      <!-- Window Brackets -->
      <line x1="205" y1="58" x2="650" y2="58" stroke="#059669" stroke-width="2"/>
      <line x1="205" y1="54" x2="205" y2="62" stroke="#059669" stroke-width="2"/>
      <line x1="650" y1="54" x2="650" y2="62" stroke="#059669" stroke-width="2"/>
      <text x="427" y="74" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Effective Window = min(rwnd, cwnd)</text>
    </g>

    <!-- 3 Wall Movements -->
    <g transform="translate(20, 130)">
      <text x="0" y="16" fill="#1e3a8a" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Closing (Left wall moves right):</tspan> Triggered when new ACKs arrive.</text>
      <text x="280" y="16" fill="#15803d" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Opening (Right wall moves right):</tspan> Receiver frees up buffer space.</text>
      <text x="590" y="16" fill="#b91c1c" font-family="sans-serif" font-size="10.5">• <tspan font-weight="bold">Shrinking (Right wall moves left):</tspan> Strongly discouraged!</text>
    </g>
  </g>

  <!-- Bottom Left: Persistence Timer & Deadlock -->
  <g transform="translate(45, 280)">
    <rect x="0" y="0" width="415" height="225" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Zero-Window Deadlock &amp; Persistence Timer</text>

    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="385" height="70" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
      <text x="15" y="20" fill="#991b1b" font-family="sans-serif" font-size="11" font-weight="bold">The Deadlock Hazard:</text>
      <text x="15" y="38" fill="#7f1d1d" font-family="sans-serif" font-size="10">1. Receiver buffer fills up $\implies$ sends ACK with <tspan font-weight="bold">rwnd = 0</tspan>.</text>
      <text x="15" y="52" fill="#7f1d1d" font-family="sans-serif" font-size="10">2. Later, buffer frees $\implies$ sends ACK with <tspan font-weight="bold">rwnd = 4000</tspan>.</text>
      <text x="15" y="66" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="bold">3. BUT if this update ACK is LOST, both sides wait forever (Deadlock)!</text>

      <rect x="0" y="80" width="385" height="95" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="15" y="100" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">Solution: Persistence Timer &amp; Probe Segments</text>
      <text x="15" y="120" fill="#14532d" font-family="sans-serif" font-size="10">• Sender starts Persistence Timer upon receiving rwnd = 0.</text>
      <text x="15" y="136" fill="#14532d" font-family="sans-serif" font-size="10">• On timeout, sender transmits a <tspan font-weight="bold">1-byte Window Probe Segment</tspan>.</text>
      <text x="15" y="152" fill="#14532d" font-family="sans-serif" font-size="10">• Forces receiver to send an immediate ACK with current rwnd!</text>
      <text x="15" y="168" fill="#166534" font-family="sans-serif" font-size="10" font-weight="bold">Breaks the deadlock cleanly and reliably.</text>
    </g>
  </g>

  <!-- Bottom Right: Silly Window Syndrome -->
  <g transform="translate(480, 280)">
    <rect x="0" y="0" width="425" height="225" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Silly Window Syndrome (SWS) &amp; Solutions</text>

    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="395" height="60" fill="#fffbeb" stroke="#fcd34d" rx="4"/>
      <text x="15" y="20" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold">The Problem (Extreme Overhead):</text>
      <text x="15" y="38" fill="#78350f" font-family="sans-serif" font-size="10">Sending 1 byte of data wrapped in 40 bytes of headers (20B IP + 20B TCP)</text>
      <text x="15" y="52" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold">Overhead is 97.5%! Network clogs with tiny micro-packets.</text>

      <rect x="0" y="70" width="395" height="48" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
      <text x="15" y="88" fill="#1e40af" font-family="sans-serif" font-size="10.5" font-weight="bold">1. Sender Solution: Nagle's Algorithm</text>
      <text x="15" y="104" fill="#1e3a8a" font-family="sans-serif" font-size="10">Send 1st chunk, then buffer remaining data until ACK arrives or MSS full.</text>

      <rect x="0" y="125" width="395" height="48" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
      <text x="15" y="143" fill="#1e40af" font-family="sans-serif" font-size="10.5" font-weight="bold">2. Receiver Solution: Clark's Solution</text>
      <text x="15" y="159" fill="#1e3a8a" font-family="sans-serif" font-size="10">Do not advertise window until space is at least MSS or half buffer size!</text>
    </g>
  </g>
</svg>