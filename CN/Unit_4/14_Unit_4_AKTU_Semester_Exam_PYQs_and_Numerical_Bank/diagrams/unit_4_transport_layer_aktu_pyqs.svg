<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="pyqHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="sh14" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#pyqHdr)" rx="8" filter="url(#sh14)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Unit 4 Transport Layer: AKTU Semester Exam PYQ Blueprint &amp; Formula Bank</text>

  <!-- Left: High-Frequency Questions -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="415" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">High-Frequency 10-Marks Derivations</text>

    <g transform="translate(15, 36)">
      <!-- Q1 -->
      <rect x="0" y="0" width="385" height="65" fill="#eff6ff" stroke="#93c5fd" rx="4"/>
      <text x="15" y="20" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="bold">1. TCP Three-Way Handshake &amp; SYN Flooding</text>
      <text x="15" y="38" fill="#1e3a8a" font-family="sans-serif" font-size="10">Draw SYN, SYN+ACK, ACK timeline. Explain ISN consumption.</text>
      <text x="15" y="52" fill="#1e3a8a" font-family="sans-serif" font-size="10">Detail SYN Flooding half-open connections &amp; SYN Cookies defense.</text>

      <!-- Q2 -->
      <rect x="0" y="75" width="385" height="65" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="15" y="20" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">2. TCP Segment Header Anatomy &amp; Dump Analysis</text>
      <text x="15" y="38" fill="#14532d" font-family="sans-serif" font-size="10">Draw 32-bit grid format (20-60B). Explain 14 fields.</text>
      <text x="15" y="52" fill="#14532d" font-family="sans-serif" font-size="10">Solve hexadecimal dump questions (Ports, Seq, Ack, HLEN, Flags).</text>

      <!-- Q3 -->
      <rect x="0" y="150" width="385" height="65" fill="#fef3c7" stroke="#fcd34d" rx="4"/>
      <text x="15" y="20" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold">3. Flow Control &amp; Silly Window Syndrome</text>
      <text x="15" y="38" fill="#78350f" font-family="sans-serif" font-size="10">Sliding window wall movements. Zero-Window deadlock.</text>
      <text x="15" y="52" fill="#78350f" font-family="sans-serif" font-size="10">Explain Nagle's algorithm (Sender) &amp; Clark's solution (Receiver).</text>

      <!-- Q4 -->
      <rect x="0" y="225" width="385" height="65" fill="#fdf2f8" stroke="#fbcfe8" rx="4"/>
      <text x="15" y="20" fill="#9d174d" font-family="sans-serif" font-size="11" font-weight="bold">4. TCP Congestion Control (Slow Start &amp; AIMD)</text>
      <text x="15" y="38" fill="#831843" font-family="sans-serif" font-size="10">Exponential Slow Start, ssthresh threshold, Additive increase.</text>
      <text x="15" y="52" fill="#831843" font-family="sans-serif" font-size="10">Multiplicative decrease drop: Tahoe (cwnd=1) vs Reno (Fast recovery).</text>

      <!-- Q5 -->
      <rect x="0" y="300" width="385" height="55" fill="#f8fafc" stroke="#94a3b8" rx="4"/>
      <text x="15" y="20" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">5. Master TCP vs UDP Comparison</text>
      <text x="15" y="38" fill="#475569" font-family="sans-serif" font-size="10">Exhaustive 10-point comparison table covering headers, services &amp; QoS.</text>
    </g>
  </g>

  <!-- Right: Formula Cheat Sheet -->
  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="425" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Mathematical Formula Bank for Semester Exam</text>

    <g transform="translate(15, 36)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="395" height="65" fill="#fff7ed" stroke="#fed7aa" rx="4"/>
      <text x="15" y="20" fill="#9a3412" font-family="sans-serif" font-size="11" font-weight="bold">1. TCP Header Length &amp; Data Size:</text>
      <text x="15" y="38" fill="#c2410c" font-family="monospace" font-size="10.5">Header Bytes = HLEN (4 bits) * 4</text>
      <text x="15" y="54" fill="#7c2d12" font-family="monospace" font-size="10.5">Payload Data = Total Length - Header Bytes</text>

      <!-- Box 2 -->
      <rect x="0" y="75" width="395" height="75" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
      <text x="15" y="20" fill="#1e40af" font-family="sans-serif" font-size="11" font-weight="bold">2. Jacobson's Dynamic RTO Formulas:</text>
      <text x="15" y="38" fill="#1e3a8a" font-family="monospace" font-size="10">EstimatedRTT = 0.875*EstimatedRTT + 0.125*SampleRTT</text>
      <text x="15" y="54" fill="#1e3a8a" font-family="monospace" font-size="10">DevRTT = 0.75*DevRTT + 0.25*|SampleRTT - EstimatedRTT|</text>
      <text x="15" y="70" fill="#1e40af" font-family="monospace" font-size="10" font-weight="bold">RTO = EstimatedRTT + 4 * DevRTT</text>

      <!-- Box 3 -->
      <rect x="0" y="160" width="395" height="65" fill="#f0fdf4" stroke="#86efac" rx="4"/>
      <text x="15" y="20" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">3. Effective Transmission Window:</text>
      <text x="15" y="38" fill="#14532d" font-family="monospace" font-size="10.5">Effective Window = min(rwnd, cwnd)</text>
      <text x="15" y="54" fill="#15803d" font-family="sans-serif" font-size="10">rwnd protects receiver buffer | cwnd protects network pipe</text>

      <!-- Box 4 -->
      <rect x="0" y="235" width="395" height="75" fill="#fdf2f8" stroke="#fbcfe8" rx="4"/>
      <text x="15" y="20" fill="#9d174d" font-family="sans-serif" font-size="11" font-weight="bold">4. Token Bucket Burst Duration Formula:</text>
      <text x="15" y="38" fill="#831843" font-family="monospace" font-size="11" font-weight="bold">T = C / (M - R)</text>
      <text x="15" y="54" fill="#9d174d" font-family="sans-serif" font-size="10">C = Capacity, M = Peak Burst Rate, R = Token Generation Rate</text>
      <text x="15" y="68" fill="#9d174d" font-family="sans-serif" font-size="10">Example: C=1MB, M=50MB/s, R=10MB/s -> T = 1/40 = 25 ms</text>

      <!-- Box 5 -->
      <rect x="0" y="320" width="395" height="35" fill="#f8fafc" stroke="#cbd5e1" rx="4"/>
      <text x="15" y="22" fill="#0f172a" font-family="monospace" font-size="10.5" font-weight="bold">Urgent Byte End = Seq Number + Urgent Pointer - 1</text>
    </g>
  </g>
</svg>