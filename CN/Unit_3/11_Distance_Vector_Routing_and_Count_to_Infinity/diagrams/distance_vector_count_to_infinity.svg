<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="dvrHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="sh11" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#dvrHdr)" rx="8" filter="url(#sh11)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Distance Vector Routing (Bellman-Ford) &amp; Count-to-Infinity Problem</text>

  <!-- Bellman-Ford Equation Banner -->
  <g transform="translate(45, 100)">
    <rect x="0" y="0" width="860" height="42" fill="#eff6ff" stroke="#93c5fd" rx="6"/>
    <text x="430" y="26" fill="#1e40af" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Bellman-Ford Equation:  D_x(y) = min_v { c(x,v) + D_v(y) }</text>
  </g>

  <!-- Left: Linear Topology & Normal State -->
  <g transform="translate(45, 155)">
    <rect x="0" y="0" width="415" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Linear 3-Node Topology (RIP Protocol)</text>

    <!-- Node A -->
    <circle cx="60" cy="70" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="76" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">A</text>

    <!-- Link A-B -->
    <line x1="82" y1="70" x2="188" y2="70" stroke="#334155" stroke-width="2.5"/>
    <text x="135" y="62" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">cost=1</text>

    <!-- Node B -->
    <circle cx="210" cy="70" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="76" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">B</text>

    <!-- Link B-C -->
    <line x1="232" y1="70" x2="338" y2="70" stroke="#334155" stroke-width="2.5"/>
    <text x="285" y="62" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">cost=1</text>

    <!-- Node C -->
    <circle cx="360" cy="70" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="360" y="76" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">C</text>

    <!-- Stable Routing Tables -->
    <text x="20" y="125" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Stable Routing Vectors (to Destination A):</text>

    <rect x="20" y="140" width="375" height="60" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
    <text x="30" y="162" fill="#1e293b" font-family="monospace" font-size="11">• At Node B: Distance to A = 1 (Direct via link B-A)</text>
    <text x="30" y="185" fill="#1e293b" font-family="monospace" font-size="11">• At Node C: Distance to A = 2 (Next Hop = B)</text>

    <text x="20" y="225" fill="#b91c1c" font-family="sans-serif" font-size="12" font-weight="bold">Sudden Link Failure: Link A-B Goes DOWN!</text>
    <rect x="20" y="240" width="375" height="95" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
    <text x="30" y="260" fill="#991b1b" font-family="sans-serif" font-size="11">1. B detects link A-B is dead.</text>
    <text x="30" y="280" fill="#991b1b" font-family="sans-serif" font-size="11">2. But before B can advertise this, C tells B: "I have route to A (cost=2)!"</text>
    <text x="30" y="300" fill="#991b1b" font-family="sans-serif" font-size="11">3. B mistakenly thinks: "Great! I can reach A via C with cost = 2+1 = 3!"</text>
    <text x="30" y="320" fill="#991b1b" font-family="sans-serif" font-size="11">4. Routing Loop created: B points to C, C points to B!</text>
  </g>

  <!-- Right: Count to Infinity Progression & Solutions -->
  <g transform="translate(480, 155)">
    <rect x="0" y="0" width="425" height="350" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Count-to-Infinity Ping-Pong Cycle</text>

    <!-- Table of loop increments -->
    <rect x="20" y="40" width="385" height="22" fill="#e2e8f0" rx="3"/>
    <text x="30" y="55" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="bold">Exchange Step</text>
    <text x="160" y="55" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="bold">B's Cost to A</text>
    <text x="280" y="55" fill="#475569" font-family="sans-serif" font-size="10.5" font-weight="bold">C's Cost to A</text>

    <text x="30" y="80" fill="#1e293b" font-family="monospace" font-size="10.5">Iteration 1</text>
    <text x="160" y="80" fill="#b91c1c" font-family="monospace" font-size="10.5">3 (via C)</text>
    <text x="280" y="80" fill="#1e293b" font-family="monospace" font-size="10.5">2 (via B)</text>

    <text x="30" y="102" fill="#1e293b" font-family="monospace" font-size="10.5">Iteration 2</text>
    <text x="160" y="102" fill="#1e293b" font-family="monospace" font-size="10.5">3 (via C)</text>
    <text x="280" y="102" fill="#b91c1c" font-family="monospace" font-size="10.5">4 (via B)</text>

    <text x="30" y="124" fill="#1e293b" font-family="monospace" font-size="10.5">Iteration 3</text>
    <text x="160" y="124" fill="#b91c1c" font-family="monospace" font-size="10.5">5 (via C)</text>
    <text x="280" y="124" fill="#1e293b" font-family="monospace" font-size="10.5">4 (via B)</text>

    <text x="30" y="146" fill="#1e293b" font-family="monospace" font-size="10.5">...</text>
    <text x="160" y="146" fill="#b91c1c" font-family="monospace" font-size="10.5">Continues until metric reaches 16 (Infinity)</text>

    <!-- Solutions -->
    <text x="20" y="185" fill="#15803d" font-family="sans-serif" font-size="12" font-weight="bold">Standard Engineering Solutions:</text>

    <rect x="20" y="198" width="385" height="135" fill="#f0fdf4" stroke="#86efac" rx="5"/>
    <text x="30" y="218" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">1. Defining Infinity (RIP = 16):</text>
    <text x="30" y="234" fill="#14532d" font-family="sans-serif" font-size="10.5">Caps maximum loop counting at 16 hops.</text>

    <text x="30" y="258" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">2. Split Horizon:</text>
    <text x="30" y="274" fill="#14532d" font-family="sans-serif" font-size="10.5">Never advertise a route back to the neighbor from whom it was learned!</text>

    <text x="30" y="298" fill="#166534" font-family="sans-serif" font-size="11" font-weight="bold">3. Split Horizon with Poison Reverse:</text>
    <text x="30" y="314" fill="#14532d" font-family="sans-serif" font-size="10.5">Explicitly advertise the reverse route with cost = infinity (16).</text>
  </g>
</svg>