<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="dhcpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="sh9" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#dhcpHdr)" rx="8" filter="url(#sh9)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Dynamic Host Configuration Protocol (DHCP): DORA Handshake Mechanics</text>

  <!-- Left: DHCP Client -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="180" height="85" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="6"/>
    <text x="90" y="28" fill="#3730a3" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DHCP Client</text>
    <text x="90" y="48" fill="#4338ca" font-family="monospace" font-size="11" text-anchor="middle">IP: 0.0.0.0 (Unset)</text>
    <text x="90" y="68" fill="#4338ca" font-family="monospace" font-size="11" text-anchor="middle">UDP Port: 68</text>
  </g>

  <!-- Right: DHCP Server -->
  <g transform="translate(725, 105)">
    <rect x="0" y="0" width="180" height="85" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="6"/>
    <text x="90" y="28" fill="#15803d" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">DHCP Server</text>
    <text x="90" y="48" fill="#166534" font-family="monospace" font-size="11" text-anchor="middle">IP: 192.168.1.1</text>
    <text x="90" y="68" fill="#166534" font-family="monospace" font-size="11" text-anchor="middle">UDP Port: 67</text>
  </g>

  <!-- Center DORA Flow Lines -->
  <!-- 1. Discover -->
  <g transform="translate(45, 205)">
    <line x1="180" y1="15" x2="680" y2="15" stroke="#4f46e5" stroke-width="2.5"/>
    <polygon points="675,10 685,15 675,20" fill="#4f46e5"/>
    <rect x="235" y="0" width="390" height="30" fill="#ffffff" stroke="#c7d2fe" rx="4"/>
    <text x="430" y="20" fill="#3730a3" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">1. DHCP DISCOVER (Broadcast: 255.255.255.255:67)</text>
  </g>

  <!-- 2. Offer -->
  <g transform="translate(45, 255)">
    <line x1="680" y1="15" x2="180" y2="15" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="185,10 175,15 185,20" fill="#16a34a"/>
    <rect x="235" y="0" width="390" height="30" fill="#ffffff" stroke="#bbf7d0" rx="4"/>
    <text x="430" y="20" fill="#15803d" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">2. DHCP OFFER (Offered IP: 192.168.1.50, Mask: /24, Lease: 86400s)</text>
  </g>

  <!-- 3. Request -->
  <g transform="translate(45, 305)">
    <line x1="180" y1="15" x2="680" y2="15" stroke="#d97706" stroke-width="2.5"/>
    <polygon points="675,10 685,15 675,20" fill="#d97706"/>
    <rect x="235" y="0" width="390" height="30" fill="#ffffff" stroke="#fde68a" rx="4"/>
    <text x="430" y="20" fill="#92400e" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">3. DHCP REQUEST (Broadcast: Client confirms acceptance of offered IP)</text>
  </g>

  <!-- 4. ACK -->
  <g transform="translate(45, 355)">
    <line x1="680" y1="15" x2="180" y2="15" stroke="#059669" stroke-width="2.5"/>
    <polygon points="185,10 175,15 185,20" fill="#059669"/>
    <rect x="235" y="0" width="390" height="30" fill="#ffffff" stroke="#a7f3d0" rx="4"/>
    <text x="430" y="20" fill="#065f46" font-family="sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">4. DHCP ACK (Acknowledgment: Gateway 192.168.1.1, DNS 8.8.8.8)</text>
  </g>

  <!-- Bottom Info Cards -->
  <g transform="translate(45, 415)">
    <rect x="0" y="0" width="415" height="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
    <text x="15" y="22" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Why Broadcast in Discover &amp; Request?</text>
    <text x="15" y="44" fill="#475569" font-family="sans-serif" font-size="11">• <tspan font-weight="bold">Discover:</tspan> Client doesn't know any server's IP address yet.</text>
    <text x="15" y="64" fill="#475569" font-family="sans-serif" font-size="11">• <tspan font-weight="bold">Request:</tspan> Informs other DHCP servers to release their offers!</text>
    <text x="15" y="84" fill="#475569" font-family="sans-serif" font-size="11">• <tspan font-weight="bold">Ports:</tspan> Client uses UDP 68, Server listens on UDP 67.</text>
  </g>

  <g transform="translate(490, 415)">
    <rect x="0" y="0" width="415" height="95" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
    <text x="15" y="22" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">DHCP Relay Agent Role (Across Subnets)</text>
    <text x="15" y="44" fill="#475569" font-family="sans-serif" font-size="11">• Routers strictly drop Layer 2/3 broadcasts by default.</text>
    <text x="15" y="64" fill="#475569" font-family="sans-serif" font-size="11">• Relay Agent captures Client broadcast &amp; forwards it via Unicast</text>
    <text x="15" y="84" fill="#475569" font-family="sans-serif" font-size="11">  to remote DHCP server located across WAN or enterprise link.</text>
  </g>
</svg>