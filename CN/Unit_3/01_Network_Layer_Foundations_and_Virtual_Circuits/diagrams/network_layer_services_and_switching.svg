<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="nlGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e3a8a"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="vcGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#10b981"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Network Layer Architecture: Datagram (Connectionless) vs Virtual Circuit (Connection-Oriented)</text>

  <!-- Left: Datagram Network (Internet Model) -->
  <rect x="35" y="55" width="375" height="235" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="375" height="28" rx="6" fill="url(#nlGrad)"/>
  <text x="222" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1. Datagram Network (Connectionless / IP)</text>

  <!-- Router mesh diagram -->
  <circle cx="70" cy="120" r="14" fill="#0284c7"/><text x="70" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">Host A</text>
  <circle cx="150" cy="105" r="14" fill="#1e293b"/><text x="150" y="109" fill="#fff" font-size="8.5" text-anchor="middle">R1</text>
  <circle cx="150" cy="155" r="14" fill="#1e293b"/><text x="150" y="159" fill="#fff" font-size="8.5" text-anchor="middle">R2</text>
  <circle cx="260" cy="105" r="14" fill="#1e293b"/><text x="260" y="109" fill="#fff" font-size="8.5" text-anchor="middle">R3</text>
  <circle cx="260" cy="155" r="14" fill="#1e293b"/><text x="260" y="159" fill="#fff" font-size="8.5" text-anchor="middle">R4</text>
  <circle cx="340" cy="135" r="14" fill="#0284c7"/><text x="340" y="139" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">Host B</text>

  <!-- Independent packet paths -->
  <path d="M 84 120 L 136 105 L 246 105 L 326 135" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="98" fill="#2563eb" font-size="8" font-weight="bold" text-anchor="middle">Pkt 1 (via R1-R3)</text>

  <path d="M 84 120 L 136 155 L 246 155 L 326 135" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3"/>
  <text x="200" y="172" fill="#dc2626" font-size="8" font-weight="bold" text-anchor="middle">Pkt 2 (via R2-R4)</text>

  <rect x="45" y="195" width="355" height="85" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="55" y="210" fill="#1e40af" font-size="8.5" font-weight="bold">• Datagram Characteristics:</text>
  <text x="55" y="224" fill="#334155" font-size="8">1. No call setup phase; packets injected immediately.</text>
  <text x="55" y="238" fill="#334155" font-size="8">2. Each packet treated independently (carry full Dest IP).</text>
  <text x="55" y="252" fill="#334155" font-size="8">3. Packets may follow different paths and arrive OUT-OF-ORDER.</text>
  <text x="55" y="266" fill="#166534" font-size="8" font-weight="bold">Highly robust to router crashes; alternate paths chosen dynamically!</text>

  <!-- Right: Virtual Circuit Network (ATM / Frame Relay) -->
  <rect x="440" y="55" width="375" height="235" rx="6" fill="#ffffff" stroke="#065f46" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="440" y="55" width="375" height="28" rx="6" fill="url(#vcGrad)"/>
  <text x="627" y="74" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2. Virtual Circuit Network (Connection-Oriented)</text>

  <!-- VC mesh diagram -->
  <circle cx="475" cy="120" r="14" fill="#047857"/><text x="475" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">Host A</text>
  <circle cx="555" cy="115" r="14" fill="#1e293b"/><text x="555" y="119" fill="#fff" font-size="8.5" text-anchor="middle">S1</text>
  <circle cx="655" cy="115" r="14" fill="#1e293b"/><text x="655" y="119" fill="#fff" font-size="8.5" text-anchor="middle">S2</text>
  <circle cx="745" cy="120" r="14" fill="#047857"/><text x="745" y="124" fill="#fff" font-size="9" font-weight="bold" text-anchor="middle">Host B</text>

  <!-- Pinned VC pipe -->
  <line x1="489" y1="120" x2="541" y2="116" stroke="#059669" stroke-width="4"/>
  <line x1="569" y1="115" x2="641" y2="115" stroke="#059669" stroke-width="4"/>
  <line x1="669" y1="116" x2="731" y2="120" stroke="#059669" stroke-width="4"/>
  <text x="605" y="105" fill="#065f46" font-size="8" font-weight="bold" text-anchor="middle">Pre-established VC Path (VCI Tag = 14)</text>

  <rect x="450" y="150" width="355" height="130" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="460" y="166" fill="#065f46" font-size="8.5" font-weight="bold">• Virtual Circuit (VC) Characteristics:</text>
  <text x="460" y="180" fill="#334155" font-size="8">1. Requires 3 Phases: Setup (Call Request) → Data Transfer → Teardown.</text>
  <text x="460" y="194" fill="#334155" font-size="8">2. Pinned route fixed for entire duration; guaranteed IN-ORDER delivery.</text>
  <text x="460" y="208" fill="#334155" font-size="8">3. Packets carry short VCI tag instead of full 32-bit/128-bit IP address.</text>
  <text x="460" y="222" fill="#334155" font-size="8">4. Routers maintain per-VC state tables; bandwidth/buffers can be reserved.</text>
  <text x="460" y="238" fill="#991b1b" font-size="8" font-weight="bold">• Vulnerability: If intermediate switch S1 crashes, the VC terminates!</text>
  <text x="460" y="252" fill="#334155" font-size="8">All active calls traversing S1 must be aborted and re-established.</text>

  <!-- Bottom: Master Comparison Table -->
  <rect x="35" y="300" width="780" height="125" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="300" width="780" height="24" rx="6" fill="#0f172a"/>
  <text x="425" y="316" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Core Differences: Datagram vs Virtual Circuit &amp; Routing vs Forwarding</text>

  <text x="50" y="340" fill="#0f172a" font-size="9.5" font-weight="bold">Circuit Setup:</text>
  <text x="145" y="340" fill="#334155" font-size="8.5">Datagram: Not required (Instant transmission) | Virtual Circuit: Mandatory 3-phase handshaking.</text>

  <text x="50" y="362" fill="#0f172a" font-size="9.5" font-weight="bold">Addressing:</text>
  <text x="145" y="362" fill="#334155" font-size="8.5">Datagram: Full Source &amp; Destination IP in every packet | Virtual Circuit: Short Virtual Circuit Identifier (VCI).</text>

  <text x="50" y="384" fill="#0f172a" font-size="9.5" font-weight="bold">Router State:</text>
  <text x="145" y="384" fill="#334155" font-size="8.5">Datagram: Stateless (No connection state stored) | Virtual Circuit: Stateful (Each VC requires entry in VC table).</text>

  <text x="50" y="408" fill="#0f172a" font-size="9.5" font-weight="bold">Routing vs Forwarding:</text>
  <text x="195" y="408" fill="#1e3a8a" font-size="8.5"><tspan font-weight="bold">Routing (Control Plane):</tspan> Network-wide algorithms (Dijkstra, Bellman-Ford) determining end-to-end paths.</text>
  <text x="195" y="420" fill="#15803d" font-size="8.5"><tspan font-weight="bold">Forwarding (Data Plane):</tspan> Local router hardware action transferring packet from input port to output port.</text>
</svg>