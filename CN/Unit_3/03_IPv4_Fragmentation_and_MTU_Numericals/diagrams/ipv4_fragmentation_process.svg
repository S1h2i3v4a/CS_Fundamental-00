<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <linearGradient id="frGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <filter id="sh" x="-2%" y="-5%" width="104%" height="110%"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="850" height="440" fill="#f8fafc" rx="8"/>

  <rect x="25" y="10" width="800" height="34" rx="5" fill="#0f172a"/>
  <text x="425" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">IPv4 Datagram Fragmentation: MTU Constraints &amp; Fragment Offset Mathematics</text>

  <!-- Top: Original Large Datagram -->
  <rect x="35" y="55" width="780" height="85" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="55" width="780" height="24" rx="6" fill="url(#frGrad)"/>
  <text x="425" y="71" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">Original Unfragmented Datagram: Total Length = 4000 Bytes (Header = 20B, Data = 3980B)</text>

  <g transform="translate(50, 88)">
    <rect x="0" y="0" width="100" height="35" rx="3" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="50" y="17" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">Header (20B)</text>
    <text x="50" y="29" font-size="7.5" fill="#0284c7" text-anchor="middle">HLEN = 5</text>

    <rect x="100" y="0" width="650" height="35" rx="3" fill="#fee2e2" stroke="#dc2626"/>
    <text x="425" y="17" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">Payload Data: 3980 Bytes [Byte 0 to Byte 3979]</text>
    <text x="425" y="29" font-size="8" fill="#7f1d1d" text-anchor="middle">Identification = 14285 | Flags: DF = 0, MF = 0 | Fragment Offset = 0</text>
  </g>

  <!-- Middle: Router traversing MTU = 1500 link -->
  <line x1="425" y1="145" x2="425" y2="165" stroke="#475569" stroke-width="2"/>
  <rect x="250" y="152" width="350" height="24" rx="4" fill="#0f172a"/>
  <text x="425" y="168" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Outgoing Link MTU = 1500 Bytes (Max Data per Fragment = 1480B, multiple of 8!)</text>

  <!-- Bottom: 3 Generated Fragments -->
  <rect x="35" y="185" width="780" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="35" y="185" width="780" height="22" rx="6" fill="#0f172a"/>
  <text x="425" y="200" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">Resulting Fragments Transmitted on Link (Identification = 14285 on all)</text>

  <!-- Fragment 1 -->
  <g transform="translate(50, 215)">
    <rect x="0" y="0" width="235" height="95" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="18" rx="4" fill="#0284c7"/>
    <text x="117" y="13" font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">Fragment 1 (Bytes 0 to 1479)</text>
    <text x="10" y="32" font-size="8" fill="#0f172a">Total Length: <tspan font-weight="bold">1500 B</tspan> (20B Hdr + 1480B Data)</text>
    <text x="10" y="47" font-size="8" fill="#0f172a">Data Bytes: <tspan font-weight="bold">0 to 1479</tspan> (1480 Bytes)</text>
    <text x="10" y="62" font-size="8" fill="#b91c1c" font-weight="bold">More Fragments (MF) = 1 (More coming!)</text>
    <text x="10" y="77" font-size="8" fill="#1e40af" font-family="monospace">Offset = 0 / 8 = 0</text>
  </g>

  <!-- Fragment 2 -->
  <g transform="translate(305, 215)">
    <rect x="0" y="0" width="235" height="95" rx="4" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="18" rx="4" fill="#0284c7"/>
    <text x="117" y="13" font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">Fragment 2 (Bytes 1480 to 2959)</text>
    <text x="10" y="32" font-size="8" fill="#0f172a">Total Length: <tspan font-weight="bold">1500 B</tspan> (20B Hdr + 1480B Data)</text>
    <text x="10" y="47" font-size="8" fill="#0f172a">Data Bytes: <tspan font-weight="bold">1480 to 2959</tspan> (1480 Bytes)</text>
    <text x="10" y="62" font-size="8" fill="#b91c1c" font-weight="bold">More Fragments (MF) = 1 (More coming!)</text>
    <text x="10" y="77" font-size="8" fill="#1e40af" font-family="monospace">Offset = 1480 / 8 = 185</text>
  </g>

  <!-- Fragment 3 -->
  <g transform="translate(560, 215)">
    <rect x="0" y="0" width="235" height="95" rx="4" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="235" height="18" rx="4" fill="#16a34a"/>
    <text x="117" y="13" font-size="8.5" font-weight="bold" fill="#fff" text-anchor="middle">Fragment 3 (Bytes 2960 to 3979)</text>
    <text x="10" y="32" font-size="8" fill="#0f172a">Total Length: <tspan font-weight="bold">1040 B</tspan> (20B Hdr + 1020B Data)</text>
    <text x="10" y="47" font-size="8" fill="#0f172a">Data Bytes: <tspan font-weight="bold">2960 to 3979</tspan> (1020 Bytes)</text>
    <text x="10" y="62" font-size="8" fill="#15803d" font-weight="bold">More Fragments (MF) = 0 (LAST Fragment!)</text>
    <text x="10" y="77" font-size="8" fill="#1e40af" font-family="monospace">Offset = 2960 / 8 = 370</text>
  </g>

  <!-- Bottom: Master Rules Box -->
  <rect x="35" y="330" width="780" height="95" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="50" y="350" fill="#9a3412" font-size="9.5" font-weight="bold">Core Rules of IPv4 Fragmentation &amp; Reassembly (AKTU Exam Commandments):</text>
  <text x="50" y="368" fill="#334155" font-size="8.5">1. <tspan font-weight="bold">Multiple of 8 Rule:</tspan> The payload data in all fragments (except the last fragment) MUST be a multiple of 8 bytes!</text>
  <text x="50" y="384" fill="#334155" font-size="8.5">2. <tspan font-weight="bold">Reassembly Location:</tspan> In IPv4, fragments are reassembled ONLY at the FINAL DESTINATION HOST, never by intermediate routers!</text>
  <text x="50" y="400" fill="#334155" font-size="8.5">3. <tspan font-weight="bold">Packet Loss Penalty:</tspan> If even 1 fragment is lost or dropped due to checksum error, the ENTIRE original datagram is discarded by the receiver!</text>
</svg>