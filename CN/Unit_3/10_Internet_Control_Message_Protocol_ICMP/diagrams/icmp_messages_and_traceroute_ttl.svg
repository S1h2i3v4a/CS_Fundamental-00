<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="icmpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="sh10" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#icmpHdr)" rx="8" filter="url(#sh10)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Internet Control Message Protocol (ICMP): Error Reporting &amp; Traceroute</text>

  <!-- Left: ICMP Header & Message Types -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="415" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">ICMP 8-Byte Base Header (Protocol = 1)</text>

    <!-- Header Grid -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="95" height="34" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="47" y="16" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Type (8b)</text>
      <text x="47" y="28" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">Message category</text>

      <rect x="100" y="0" width="95" height="34" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="147" y="16" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Code (8b)</text>
      <text x="147" y="28" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">Specific subtype</text>

      <rect x="200" y="0" width="175" height="34" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="287" y="16" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Checksum (16 bits)</text>
      <text x="287" y="28" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">Entire ICMP packet</text>

      <rect x="0" y="38" width="375" height="30" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <text x="187" y="58" fill="#475569" font-family="sans-serif" font-size="10" text-anchor="middle">Rest of Header / Error Details (32 bits)</text>
    </g>

    <!-- Key Types List -->
    <text x="20" y="130" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Key ICMP Message Types:</text>
    
    <rect x="15" y="142" width="385" height="36" fill="#ffffff" stroke="#e2e8f0" rx="3"/>
    <text x="25" y="158" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold">Type 3: Destination Unreachable</text>
    <text x="25" y="172" fill="#64748b" font-family="sans-serif" font-size="10">Code 0=Net, 1=Host, 3=Port, 4=Fragmentation Needed</text>

    <rect x="15" y="186" width="385" height="36" fill="#ffffff" stroke="#e2e8f0" rx="3"/>
    <text x="25" y="202" fill="#b91c1c" font-family="monospace" font-size="11" font-weight="bold">Type 11: Time Exceeded</text>
    <text x="25" y="216" fill="#64748b" font-family="sans-serif" font-size="10">Code 0=TTL Expired in Transit, Code 1=Reassembly Timeout</text>

    <rect x="15" y="230" width="385" height="36" fill="#ffffff" stroke="#e2e8f0" rx="3"/>
    <text x="25" y="246" fill="#15803d" font-family="monospace" font-size="11" font-weight="bold">Type 8 &amp; Type 0: Echo Request / Reply</text>
    <text x="25" y="260" fill="#64748b" font-family="sans-serif" font-size="10">Used by 'ping' utility to measure round-trip latency &amp; packet loss</text>

    <rect x="15" y="274" width="385" height="36" fill="#ffffff" stroke="#e2e8f0" rx="3"/>
    <text x="25" y="290" fill="#0284c7" font-family="monospace" font-size="11" font-weight="bold">Type 5: Redirection</text>
    <text x="25" y="304" fill="#64748b" font-family="sans-serif" font-size="10">Informs host to route packets via a shorter/better gateway</text>

    <rect x="15" y="325" width="385" height="60" fill="#eff6ff" stroke="#bfdbfe" rx="4"/>
    <text x="25" y="345" fill="#1e40af" font-family="sans-serif" font-size="10.5" font-weight="bold">Golden Rule of ICMP Errors:</text>
    <text x="25" y="362" fill="#1e3a8a" font-family="sans-serif" font-size="10">No ICMP error is ever generated for: (1) An ICMP error message,</text>
    <text x="25" y="376" fill="#1e3a8a" font-family="sans-serif" font-size="10">(2) Broadcast/Multicast, (3) Any fragment other than 1st.</text>
  </g>

  <!-- Right: Traceroute Operation -->
  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="425" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Traceroute Tool: Hop-by-Hop Discovery via TTL</text>

    <!-- Source Host -->
    <rect x="25" y="45" width="90" height="40" fill="#e0e7ff" stroke="#6366f1" rx="4"/>
    <text x="70" y="65" fill="#3730a3" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Source Host</text>
    <text x="70" y="78" fill="#4338ca" font-family="monospace" font-size="9" text-anchor="middle">Sender</text>

    <!-- Router 1 -->
    <circle cx="190" cy="65" r="20" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="190" y="70" fill="#854d0e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R1</text>

    <!-- Router 2 -->
    <circle cx="280" cy="65" r="20" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
    <text x="280" y="70" fill="#854d0e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R2</text>

    <!-- Dest Host -->
    <rect x="330" y="45" width="80" height="40" fill="#dcfce7" stroke="#22c55e" rx="4"/>
    <text x="370" y="65" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Dest Host</text>
    <text x="370" y="78" fill="#166534" font-family="monospace" font-size="9" text-anchor="middle">Target</text>

    <!-- Hop 1 -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="385" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="15" y="20" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Step 1: Datagram sent with TTL = 1</text>
      <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="10">• Router R1 decrements TTL to 0: Drops packet!</text>
      <text x="15" y="54" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="bold">• R1 sends ICMP Type 11 (Time Exceeded) back to sender.</text>
      <text x="15" y="68" fill="#475569" font-family="monospace" font-size="9.5">Sender records IP of Hop 1 (R1) &amp; computes RTT1</text>
    </g>

    <!-- Hop 2 -->
    <g transform="translate(20, 200)">
      <rect x="0" y="0" width="385" height="75" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="15" y="20" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Step 2: Datagram sent with TTL = 2</text>
      <text x="15" y="38" fill="#64748b" font-family="sans-serif" font-size="10">• R1 decrements TTL to 1, forwards to R2.</text>
      <text x="15" y="54" fill="#b91c1c" font-family="sans-serif" font-size="10" font-weight="bold">• R2 decrements TTL to 0: Drops packet &amp; sends ICMP Type 11!</text>
      <text x="15" y="68" fill="#475569" font-family="monospace" font-size="9.5">Sender records IP of Hop 2 (R2) &amp; computes RTT2</text>
    </g>

    <!-- Hop 3 Target -->
    <g transform="translate(20, 290)">
      <rect x="0" y="0" width="385" height="85" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
      <text x="15" y="20" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Step 3: Datagram reaches Destination (TTL = 3)</text>
      <text x="15" y="38" fill="#15803d" font-family="sans-serif" font-size="10">• Packet arrives at destination with unused UDP port (e.g. 33434).</text>
      <text x="15" y="54" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold">• Dest returns ICMP Type 3, Code 3 (Port Unreachable)!</text>
      <text x="15" y="72" fill="#065f46" font-family="sans-serif" font-size="10">Traceroute knows path is complete and halts gracefully.</text>
    </g>
  </g>
</svg>