<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="natHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#natHdr)" rx="8" filter="url(#shadow7)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Network Address Translation (NAT / PAT) &amp; IPv6 Base Architecture</text>

  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="220" height="230" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" rx="7"/>
    <text x="110" y="24" fill="#1e40af" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Private Network (RFC 1918)</text>

    <rect x="20" y="45" width="180" height="42" fill="#ffffff" stroke="#cbd5e1" rx="5"/>
    <text x="30" y="62" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Host A: 192.168.1.5</text>
    <text x="30" y="78" fill="#64748b" font-family="monospace" font-size="10">Source Port: 5001</text>

    <rect x="20" y="100" width="180" height="42" fill="#ffffff" stroke="#cbd5e1" rx="5"/>
    <text x="30" y="117" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Host B: 192.168.1.6</text>
    <text x="30" y="133" fill="#64748b" font-family="monospace" font-size="10">Source Port: 5001</text>

    <rect x="20" y="155" width="180" height="42" fill="#ffffff" stroke="#cbd5e1" rx="5"/>
    <text x="30" y="172" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Host C: 192.168.1.7</text>
    <text x="30" y="188" fill="#64748b" font-family="monospace" font-size="10">Source Port: 6022</text>
  </g>

  <g transform="translate(290, 105)">
    <rect x="0" y="0" width="370" height="230" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" rx="7"/>
    <text x="185" y="24" fill="#92400e" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">NAT / PAT Router (Public IP: 203.0.113.1)</text>

    <rect x="15" y="42" width="340" height="22" fill="#fef08a" rx="3"/>
    <text x="25" y="57" fill="#854d0e" font-family="sans-serif" font-size="10" font-weight="bold">Private IP : Port</text>
    <text x="175" y="57" fill="#854d0e" font-family="sans-serif" font-size="10" font-weight="bold">Public IP : NAT Port</text>

    <rect x="15" y="70" width="340" height="24" fill="#ffffff" stroke="#fde047" rx="3"/>
    <text x="25" y="86" fill="#1e293b" font-family="monospace" font-size="10">192.168.1.5 : 5001</text>
    <text x="150" y="86" fill="#ca8a04" font-weight="bold">→</text>
    <text x="175" y="86" fill="#0f766e" font-family="monospace" font-size="10">203.0.113.1 : 40001</text>

    <rect x="15" y="100" width="340" height="24" fill="#ffffff" stroke="#fde047" rx="3"/>
    <text x="25" y="116" fill="#1e293b" font-family="monospace" font-size="10">192.168.1.6 : 5001</text>
    <text x="150" y="116" fill="#ca8a04" font-weight="bold">→</text>
    <text x="175" y="116" fill="#0f766e" font-family="monospace" font-size="10">203.0.113.1 : 40002</text>

    <rect x="15" y="130" width="340" height="24" fill="#ffffff" stroke="#fde047" rx="3"/>
    <text x="25" y="146" fill="#1e293b" font-family="monospace" font-size="10">192.168.1.7 : 6022</text>
    <text x="150" y="146" fill="#ca8a04" font-weight="bold">→</text>
    <text x="175" y="146" fill="#0f766e" font-family="monospace" font-size="10">203.0.113.1 : 40003</text>

    <rect x="15" y="165" width="340" height="52" fill="#fef3c7" stroke="#fbbf24" rx="4"/>
    <text x="25" y="185" fill="#92400e" font-family="sans-serif" font-size="10.5" font-weight="bold">PAT Overload Principle:</text>
    <text x="25" y="202" fill="#78350f" font-family="sans-serif" font-size="10">Multiple private IPs share ONE public IP via unique Port Numbers!</text>
  </g>

  <g transform="translate(685, 105)">
    <rect x="0" y="0" width="220" height="230" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" rx="7"/>
    <text x="110" y="24" fill="#166534" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Public Internet / WAN</text>

    <rect x="20" y="65" width="180" height="60" fill="#ffffff" stroke="#cbd5e1" rx="5"/>
    <text x="110" y="90" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Web Server (Google)</text>
    <text x="110" y="108" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">142.250.190.46:443</text>

    <text x="110" y="165" fill="#15803d" font-family="sans-serif" font-size="11" text-anchor="middle">Public routers only see</text>
    <text x="110" y="185" fill="#166534" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">203.0.113.1:PORT</text>
  </g>

  <g transform="translate(45, 355)">
    <rect x="0" y="0" width="860" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">IPv6 Fixed Base Header (Strictly 40 Bytes Fixed Length - No Options in Base)</text>

    <g transform="translate(20, 36)">
      <rect x="0" y="0" width="100" height="40" fill="#dbeafe" stroke="#3b82f6" rx="3"/>
      <text x="50" y="18" fill="#1e3a8a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Version</text>
      <text x="50" y="32" fill="#1e40af" font-family="sans-serif" font-size="9" text-anchor="middle">4 bits</text>

      <rect x="105" y="0" width="150" height="40" fill="#e0e7ff" stroke="#6366f1" rx="3"/>
      <text x="180" y="18" fill="#3730a3" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Traffic Class</text>
      <text x="180" y="32" fill="#4338ca" font-family="sans-serif" font-size="9" text-anchor="middle">8 bits (QoS)</text>

      <rect x="260" y="0" width="220" height="40" fill="#ede9fe" stroke="#8b5cf6" rx="3"/>
      <text x="370" y="18" fill="#5b21b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Flow Label</text>
      <text x="370" y="32" fill="#6d28d9" font-family="sans-serif" font-size="9" text-anchor="middle">20 bits (Real-time stream)</text>

      <rect x="485" y="0" width="160" height="40" fill="#fce7f3" stroke="#ec4899" rx="3"/>
      <text x="565" y="18" fill="#9d174d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Payload Length</text>
      <text x="565" y="32" fill="#be185d" font-family="sans-serif" font-size="9" text-anchor="middle">16 bits</text>

      <rect x="650" y="0" width="90" height="40" fill="#ccfbf1" stroke="#14b8a6" rx="3"/>
      <text x="695" y="18" fill="#0f766e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Next Hdr</text>
      <text x="695" y="32" fill="#0d9488" font-family="sans-serif" font-size="9" text-anchor="middle">8 bits</text>

      <rect x="745" y="0" width="75" height="40" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="782" y="18" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hop Limit</text>
      <text x="782" y="32" fill="#b91c1c" font-family="sans-serif" font-size="9" text-anchor="middle">8b (TTL)</text>

      <rect x="0" y="46" width="405" height="44" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <text x="202" y="66" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Source IP Address (128 Bits / 16 Bytes)</text>
      <text x="202" y="82" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">2001:0db8:85a3:0000:0000:8a2e:0370:7334</text>

      <rect x="415" y="46" width="405" height="44" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <text x="617" y="66" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Destination IP Address (128 Bits / 16 Bytes)</text>
      <text x="617" y="82" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">fe80::1ff:fe23:4567:890a (Zero compressed)</text>
    </g>
  </g>
</svg>