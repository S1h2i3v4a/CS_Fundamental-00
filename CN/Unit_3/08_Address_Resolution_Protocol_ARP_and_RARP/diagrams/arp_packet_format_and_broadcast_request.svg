<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="arpHdr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#arpHdr)" rx="8" filter="url(#shadow8)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Address Resolution Protocol (ARP): Packet Format &amp; Working Mechanism</text>

  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="410" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">ARP Request (Broadcast) &amp; Reply (Unicast)</text>

    <rect x="25" y="45" width="160" height="70" fill="#e0f2fe" stroke="#38bdf8" rx="5"/>
    <text x="105" y="65" fill="#0369a1" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Sender Host A</text>
    <text x="105" y="82" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">IP: 192.168.1.10</text>
    <text x="105" y="98" fill="#0284c7" font-family="monospace" font-size="10" text-anchor="middle">MAC: AA:AA:AA:AA:AA:AA</text>

    <rect x="125" y="150" width="160" height="35" fill="#334155" rx="4"/>
    <text x="205" y="172" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Local Switch / Link</text>

    <rect x="225" y="220" width="160" height="70" fill="#dcfce7" stroke="#4ade80" rx="5"/>
    <text x="305" y="240" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Target Host B</text>
    <text x="305" y="257" fill="#166534" font-family="monospace" font-size="10" text-anchor="middle">IP: 192.168.1.20</text>
    <text x="305" y="273" fill="#166534" font-family="monospace" font-size="10" text-anchor="middle">MAC: BB:BB:BB:BB:BB:BB</text>

    <text x="20" y="325" fill="#b91c1c" font-family="sans-serif" font-size="11" font-weight="bold">Step 1: ARP Request (Broadcast FF:FF:FF:FF:FF:FF)</text>
    <text x="20" y="342" fill="#475569" font-family="sans-serif" font-size="10.5">"Who has IP 192.168.1.20? Tell 192.168.1.10"</text>

    <text x="20" y="368" fill="#15803d" font-family="sans-serif" font-size="11" font-weight="bold">Step 2: ARP Reply (Unicast to Host A MAC)</text>
    <text x="20" y="385" fill="#475569" font-family="sans-serif" font-size="10.5">"I have 192.168.1.20! My MAC is BB:BB:BB:BB:BB:BB"</text>
  </g>

  <g transform="translate(480, 105)">
    <rect x="0" y="0" width="425" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="20" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">ARP Packet Format (28 Bytes Payload)</text>

    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="190" height="34" fill="#dbeafe" stroke="#3b82f6" rx="3"/>
      <text x="95" y="16" fill="#1e3a8a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Hardware Type (16 bits)</text>
      <text x="95" y="28" fill="#1e40af" font-family="monospace" font-size="9" text-anchor="middle">1 = Ethernet</text>

      <rect x="195" y="0" width="190" height="34" fill="#e0e7ff" stroke="#6366f1" rx="3"/>
      <text x="290" y="16" fill="#3730a3" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Protocol Type (16 bits)</text>
      <text x="290" y="28" fill="#4338ca" font-family="monospace" font-size="9" text-anchor="middle">0x0800 = IPv4</text>

      <rect x="0" y="40" width="90" height="34" fill="#ede9fe" stroke="#8b5cf6" rx="3"/>
      <text x="45" y="56" fill="#5b21b6" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">HW Len (8b)</text>
      <text x="45" y="68" fill="#6d28d9" font-family="monospace" font-size="9" text-anchor="middle">6 (MAC)</text>

      <rect x="95" y="40" width="95" height="34" fill="#fce7f3" stroke="#ec4899" rx="3"/>
      <text x="142" y="56" fill="#9d174d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Prot Len (8b)</text>
      <text x="142" y="68" fill="#be185d" font-family="monospace" font-size="9" text-anchor="middle">4 (IPv4)</text>

      <rect x="195" y="40" width="190" height="34" fill="#fef08a" stroke="#eab308" rx="3"/>
      <text x="290" y="56" fill="#854d0e" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Opcode (16 bits)</text>
      <text x="290" y="68" fill="#a16207" font-family="monospace" font-size="9" text-anchor="middle">1=Req, 2=Reply, 3=RARP</text>

      <rect x="0" y="80" width="385" height="34" fill="#dcfce7" stroke="#22c55e" rx="3"/>
      <text x="192" y="96" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sender Hardware Address (6 Bytes / 48 bits)</text>
      <text x="192" y="108" fill="#166534" font-family="monospace" font-size="9" text-anchor="middle">AA:AA:AA:AA:AA:AA</text>

      <rect x="0" y="120" width="385" height="34" fill="#dcfce7" stroke="#22c55e" rx="3"/>
      <text x="192" y="136" fill="#15803d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Sender IP Address (4 Bytes / 32 bits)</text>
      <text x="192" y="148" fill="#166534" font-family="monospace" font-size="9" text-anchor="middle">192.168.1.10</text>

      <rect x="0" y="160" width="385" height="34" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="192" y="176" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Target Hardware Address (6 Bytes / 48 bits)</text>
      <text x="192" y="188" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">00:00:00:00:00:00 in Request (Unknown)</text>

      <rect x="0" y="200" width="385" height="34" fill="#fee2e2" stroke="#ef4444" rx="3"/>
      <text x="192" y="216" fill="#991b1b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Target IP Address (4 Bytes / 32 bits)</text>
      <text x="192" y="228" fill="#b91c1c" font-family="monospace" font-size="9" text-anchor="middle">192.168.1.20</text>
    </g>

    <rect x="20" y="290" width="385" height="95" fill="#f1f5f9" stroke="#94a3b8" rx="4"/>
    <text x="30" y="310" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">ARP Cache Table (TTL / Age-out Mechanism)</text>
    <text x="30" y="332" fill="#475569" font-family="monospace" font-size="10.5">IP Address       MAC Address         Type     TTL</text>
    <text x="30" y="352" fill="#1e293b" font-family="monospace" font-size="10.5">192.168.1.20     BB:BB:BB:BB:BB:BB   Dynamic  120s</text>
    <text x="30" y="372" fill="#1e293b" font-family="monospace" font-size="10.5">192.168.1.1      00:1A:2B:3C:4D:5E   Dynamic  300s</text>
  </g>
</svg>