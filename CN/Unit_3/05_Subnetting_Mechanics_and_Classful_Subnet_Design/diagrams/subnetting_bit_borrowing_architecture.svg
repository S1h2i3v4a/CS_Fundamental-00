<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 540" width="100%" height="100%">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="950" height="540" fill="#f8fafc" rx="12"/>
  <rect x="15" y="15" width="920" height="510" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="10"/>

  <rect x="35" y="30" width="880" height="52" fill="url(#hdrGrad)" rx="8" filter="url(#shadow)"/>
  <text x="475" y="62" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Subnetting Architecture: Bit Borrowing &amp; Subnet ID Formation</text>

  <text x="45" y="115" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">1. Original Class C IP Structure (/24 Mask: 255.255.255.0)</text>
  <g transform="translate(45, 125)">
    <rect x="0" y="0" width="600" height="42" fill="url(#netGrad)" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="300" y="26" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Network ID (24 Bits) - Fixed by ISP / IANA</text>
    <rect x="610" y="0" width="250" height="42" fill="url(#hostGrad)" stroke="#10b981" stroke-width="2" rx="5"/>
    <text x="735" y="26" fill="#065f46" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Host ID (8 Bits) = 256 IPs</text>
  </g>

  <path d="M 670 175 L 670 215" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="685" y="200" fill="#b91c1c" font-family="sans-serif" font-size="12" font-weight="bold">Borrow s = 2 Bits from Host ID</text>

  <text x="45" y="240" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">2. Subnetted Structure (/26 Mask: 255.255.255.192)</text>
  <g transform="translate(45, 250)">
    <rect x="0" y="0" width="600" height="44" fill="url(#netGrad)" stroke="#3b82f6" stroke-width="2" rx="5"/>
    <text x="300" y="27" fill="#1e3a8a" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Network ID (24 Bits)</text>
    <rect x="610" y="0" width="80" height="44" fill="url(#subGrad)" stroke="#d97706" stroke-width="2.5" rx="5"/>
    <text x="650" y="22" fill="#92400e" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Subnet</text>
    <text x="650" y="38" fill="#b45309" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">(2 Bits)</text>
    <rect x="700" y="0" width="160" height="44" fill="url(#hostGrad)" stroke="#10b981" stroke-width="2" rx="5"/>
    <text x="780" y="22" fill="#065f46" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Host ID (6 Bits)</text>
    <text x="780" y="38" fill="#047857" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2^6 - 2 = 62 Hosts</text>
  </g>

  <g transform="translate(45, 320)">
    <rect x="0" y="0" width="415" height="185" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="7"/>
    <text x="15" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Bitwise AND: Router Subnet Extraction</text>
    
    <text x="15" y="55" fill="#334155" font-family="monospace" font-size="12">IP:   192.168.1.75    11000000.10101000.00000001.<tspan fill="#d97706" font-weight="bold">01</tspan>001011</text>
    <text x="15" y="80" fill="#334155" font-family="monospace" font-size="12">Mask: 255.255.255.192 11111111.11111111.11111111.<tspan fill="#d97706" font-weight="bold">11</tspan>000000</text>
    <line x1="15" y1="95" x2="400" y2="95" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="15" y="118" fill="#1e3a8a" font-family="monospace" font-size="12" font-weight="bold">AND:  192.168.1.64    11000000.10101000.00000001.<tspan fill="#b45309">01</tspan>000000</text>
    
    <rect x="15" y="132" width="385" height="40" fill="#eff6ff" stroke="#bfdbfe" rx="5"/>
    <text x="25" y="156" fill="#1e40af" font-family="sans-serif" font-size="11.5">Result: Packet belongs to Subnet 1 (Range: .64 to .127)</text>
  </g>

  <g transform="translate(480, 320)">
    <rect x="0" y="0" width="425" height="185" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="7"/>
    <text x="15" y="24" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">4 Subnets Generated (Jump Size = 64)</text>

    <rect x="10" y="38" width="405" height="24" fill="#f1f5f9" rx="3"/>
    <text x="20" y="54" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">Subnet ID</text>
    <text x="110" y="54" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">First Usable IP</text>
    <text x="210" y="54" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">Last Usable IP</text>
    <text x="315" y="54" fill="#475569" font-family="sans-serif" font-size="11" font-weight="bold">Broadcast ID</text>

    <text x="20" y="80" fill="#1e293b" font-family="monospace" font-size="11">.0 (Sub 0)</text>
    <text x="110" y="80" fill="#15803d" font-family="monospace" font-size="11">192.168.1.1</text>
    <text x="210" y="80" fill="#15803d" font-family="monospace" font-size="11">192.168.1.62</text>
    <text x="315" y="80" fill="#b91c1c" font-family="monospace" font-size="11">192.168.1.63</text>

    <text x="20" y="106" fill="#1e293b" font-family="monospace" font-size="11">.64 (Sub 1)</text>
    <text x="110" y="106" fill="#15803d" font-family="monospace" font-size="11">192.168.1.65</text>
    <text x="210" y="106" fill="#15803d" font-family="monospace" font-size="11">192.168.1.126</text>
    <text x="315" y="106" fill="#b91c1c" font-family="monospace" font-size="11">192.168.1.127</text>

    <text x="20" y="132" fill="#1e293b" font-family="monospace" font-size="11">.128 (Sub 2)</text>
    <text x="110" y="132" fill="#15803d" font-family="monospace" font-size="11">192.168.1.129</text>
    <text x="210" y="132" fill="#15803d" font-family="monospace" font-size="11">192.168.1.190</text>
    <text x="315" y="132" fill="#b91c1c" font-family="monospace" font-size="11">192.168.1.191</text>

    <text x="20" y="158" fill="#1e293b" font-family="monospace" font-size="11">.192 (Sub 3)</text>
    <text x="110" y="158" fill="#15803d" font-family="monospace" font-size="11">192.168.1.193</text>
    <text x="210" y="158" fill="#15803d" font-family="monospace" font-size="11">192.168.1.254</text>
    <text x="315" y="158" fill="#b91c1c" font-family="monospace" font-size="11">192.168.1.255</text>
  </g>
</svg>